        if (hidBadge && !PREFS.tooltipCharacter) {
          const b = hidBadge.getBoundingClientRect();
          const over = PREFS.tooltipHidden && e.clientX >= b.left && e.clientX < b.right
            && e.clientY >= b.top && e.clientY < b.bottom;
          if (!over) cellTip.hide();
          else if ($('#celltip').hidden) cellTip.show('Hidden: ' + HIDDEN_MEANING[hidLv], e);
        }
        cellTip.move(e);
      };
      d.onmouseleave = () => { d.classList.remove('hot'); cellTip.hide(); };
      // DOUBLE-CLICK A SLOT to bring its section up, or switch it to that slot
      // if it is already open. Only a slot responds: there is nothing to show
      // for a cell that holds one character.
      d.ondblclick = () => {
        const inf = cellAt(i);
        if (inf && inf.kind === 'char' && (inf.slot || inf.variants > 1)) showSlotMembers(i);
      };
      d.oncontextmenu = (e) => {
        e.preventDefault();
        cellTip.hide();
        sel = i; drawGrid(); drawInspector();
        Menu.open(e.clientX, e.clientY, buildCellMenu(i));
      };
      slot.appendChild(d);
      // OFF THE SCREEN: the cell's middle, projected exactly as its strip is,
      // lies outside the motif's screen. A cell that only straddles the edge
      // is partly visible in game and is left as it is. Counted whether or
      // not they are shown, for the footer's note (drawGeom).
      const mid = pr(L0 + (c + 0.5) * span(r) / cols, T0 + g.h / 2);
      const isOff = mid[0] < 0 || mid[0] > L[0] || mid[1] < 0 || mid[1] > L[1];
      if (isOff) offCount++;
      const offscreen = showOff && isOff;
      if (offscreen) {
        slot.classList.add('offscreen');
        const om = document.createElement('div');
        om.className = 'offmark';
        slot.appendChild(om);
      }
      // THE HIDDEN BADGE IS SQUARE ON THE SCREEN, not drawn inside the strip:
      // a perspective row squashes everything it holds, and on IKEMEN1's far
      // rows a badge inside the cell came out a few pixels tall. It sits on
      // the cell's projected top-right corner instead, sized to the cell as
      // the screen shows it (VSelect: square in screen pixels, at most its
      // icon's size, never taller than the cell less 4) and here never wider
      // than half the cell, so the portrait still shows. Too small to read,
      // it is left out, as VSelect leaves it out of a cell under 16.
      if (hidLv) {
        const u = span(r) / cols;
        const tl = pr(L0 + c * u, T0), tr = pr(L0 + (c + 1) * u, T0);
        const bl = pr(L0 + c * u, B0), br = pr(L0 + (c + 1) * u, B0);
        const cw = (tr[0] - tl[0]) * K, ch = Math.min(bl[1] - tl[1], br[1] - tr[1]) * K;
        const bs = Math.floor(Math.min(14, cw / 2, ch - 4));
        if (bs >= 7) {
          const hb = document.createElement('div');
          hb.className = 'hidbadge' + (offscreen ? ' dim' : '');
          hb.dataset.h = String(hidLv);
          hb.dataset.i = String(i);
          hb.style.width = hb.style.height = bs + 'px';
          hb.style.left = (tr[0] * K - 2 - bs) + 'px';
          hb.style.top = (tr[1] * K + 2) + 'px';
          hb.innerHTML = EYE_SLASH;
          marks.appendChild(hb);
          hidBadge = hb;
          d.classList.add('hid');
        }
      }
      // THE LOCK BADGE, the hidden badge's twin on the top-LEFT corner and
      // sized the same way, so the two share a cell without meeting. Drawn
      // always or only for a drag, as Show lock icon asks: "while dragging"
      // is when the question "will this one move?" comes up.
      if (lockedAt.has(i)) {
        const u = span(r) / cols;
        const tl = pr(L0 + c * u, T0), tr = pr(L0 + (c + 1) * u, T0);
        const bl = pr(L0 + c * u, B0), br = pr(L0 + (c + 1) * u, B0);
        const cw = (tr[0] - tl[0]) * K, ch = Math.min(bl[1] - tl[1], br[1] - tr[1]) * K;
        const bs = Math.floor(Math.min(14, cw / 2, ch - 4));
        if (bs >= 7) {
          const lb = document.createElement('div');
          lb.className = 'lockbadge' + (PREFS.showLocks === '1' ? ' ondrag' : '')
            + (offscreen ? ' dim' : '');
          lb.dataset.i = String(i);
          lb.style.width = lb.style.height = bs + 'px';
          lb.style.left = (tl[0] * K + 2) + 'px';
          lb.style.top = (tl[1] * K + 2) + 'px';
          lb.innerHTML = PADLOCK;
          marks.appendChild(lb);
        }
      }
      strip.appendChild(slot);
      cellEls[i] = d;
    }
    wrap.appendChild(strip);
  }
  OFFSCREEN_COUNT = offCount;
  // Cursors go INSIDE their cells so they are projected with them.
  drawCursors(cellEls);
  wrap.appendChild(marks);
  // layerno 1 draws IN FRONT of the cells, so it is appended last.
  wrap.appendChild(over);
  // SHOW OFFSCREEN CELLS makes room for them as a transparent BORDER, not by
  // moving anything. Children are placed from the padding box, so the
  // screen's origin - and every coordinate above - stays where it was, while
  // the border sits inside the box the stage centers and scrolls. Cells off
  // the LEFT or TOP are therefore reachable too, which an overflow alone would
  // leave before the scroll origin (see the auto-margin note on .stage).
  if (showOff) {
    const W = L[0] * K, H = L[1] * K;
    let x0 = 0, y0 = 0, x1 = W, y1 = H;
    for (const q of quads) for (const p of q) {
      if (!Number.isFinite(p[0]) || !Number.isFinite(p[1])) continue;
      x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]);
      x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]);
    }
    // A little air past the last cell's dashed edge; never more than a few
    // screens, whatever a broken projection reports.
    const room = (n, cap) => (n > 0.5 ? Math.min(cap, Math.ceil(n) + 3) : 0);
    const bl = room(-x0, 4 * W), br = room(x1 - W, 4 * W);
    const bt = room(-y0, 4 * H), bb = room(y1 - H, 4 * H);
    wrap.style.borderWidth = bt + 'px ' + br + 'px ' + bb + 'px ' + bl + 'px';
    wrap.style.width = (W + bl + br) + 'px';
    wrap.style.height = (H + bt + bb) + 'px';
    const edge = document.createElement('div');
    edge.className = 'screenedge';
    wrap.appendChild(edge);
  }
  drawFaces(faces, over);
}

// ---- Locks ---------------------------------------------------------------------
//
// PREFERENCES > DRAG & DROP > LOCK CELLS. VSelect locks a cell by writing a
// label comment on its select.def line (`; LOCKED`). Here select.def is
// written FROM the roster, so a lock is a field on the roster entry -
// `locked: '1'` on a character, on a slot's first member, or on a skipslot,
// random or unused placeholder - and the select.def writer puts the label at
// the end of the line (motif-core LOCK_LABEL; the label is the viewer's own,
// sent by Save). Locking and unlocking are staged cell edits like any other:
// they count, undo and save with the rest.
//
// WHILE LOCK CELLS IS ON, a locked cell stays where it is and holds what it
// holds. It cannot be dragged, dropped onto, replaced, removed, turned into
// another kind or into a slot, split, filled over, deleted with its row or
// column, or pushed along by a move drop or a row/column edit: every shift
// passes over it. Each refusal says why in the log. While Lock cells is off
// the locks are ignored, but kept - they ride on their entries through every
// edit and every save.
//
// A slot's lock sits on its first member (the line the grid shows), but ANY
// member carrying one locks the cell, so a lock read in on a later member can
// still be seen and taken off.
function isLockOn(v) {
  // The server's own reading (motif-core isLockOn): '1', 1 or true.
  return v === true || v === 1 || /^\s*1/.test(String(v == null ? '' : v));
}
function locksOn() { return !!PREFS.checkLocks; }
// Whether cell i carries a lock at all. Read from order[], never from CELLS,
// which is a step behind in the middle of an edit.
function cellHasLock(i) {
  const s = orderIndexOfCell(i);
  if (!s) return false;
  for (let k = s.start; k < s.end; k++) if (isLockOn(order[k].locked)) return true;
  return false;
}
// The question every edit asks: is it locked, and are locks being kept?
function cellLocked(i) { return locksOn() && cellHasLock(i); }
// `who` names the character the edit is for, when that is not the cell's
// first member: a slot's second member dragged onto a stage.
function lockedWhy(i, what, who) {
  const info = cellAt(i);
  const nm = who || (info && info.kind === 'char' ? info.displayName : '');
  const name = nm ? ' (' + nm + ')' : '';
  return 'Cell ' + i + name + ' is locked, so it cannot be ' + what
    + '. Right-click it and choose Unlock cell, or turn off Preferences › Lock cells.';
}
// Refuse an edit to a locked cell: logs why, and answers the reason, which a
// picker can show. A reason is never empty, so `if (lockRefuses(...))` still
// reads as a yes or no.
function lockRefuses(i, what, who) {
  if (!cellLocked(i)) return false;
  return refused(lockedWhy(i, what, who));
}
// Log a refusal and answer it.
function refused(why) {
  log(why);
  return why;
}

// THE ORDER AS SAVED: every entry says whether it is locked. For a character,
// leaving `locked` out keeps the lock the roster has, so an unlock has to be
// sent as ''; a placeholder has no identity for the server to look its lock
// up by, so leaving it out would unlock it (modlib setBuildOrder).
function savedOrder() {
  return order.concat(offGrid).map((e) =>
    Object.assign({}, e, { locked: isLockOn(e.locked) ? '1' : '' }));
}

// CHARACTERS THE STUDIO ADDED WHILE THIS PAGE HELD AN EDIT. With unsaved work
// the page ignores roster-changed (gridBus, below), so order[] never hears of
// them, and setBuildOrder drops whatever the list leaves out: a Save used to
// take them out of the build without a word. So every write of the order reads
// the roster on disk first and keeps each character there that the last load
// never read (LOADED) and the list does not hold. They go after the last used
// cell, where a drop past the grid goes, each with the lock the roster gives
// him. One this page loaded and the person removed is in LOADED: still gone.
// The list (savedOrder()) and where the grid ends in it are taken together,
// before the read, so an edit made while it runs cannot move the split. When
// the roster cannot be read, the save goes on as it did before this check,
// and the log says what that costs. Answers { list, kept } (kept: the roster
// entries).
async function withStudioAdds() {
  const list = savedOrder(), at = order.length;
  let disk = null;
  try { disk = await esApi('/api/roster'); } catch (e) {
    log('WARNING Could not read the roster on disk (' + ((e && e.message) || e) + '), so this save cannot keep'
      + ' a character the Studio added since this page loaded');
    return { list, kept: [] };
  }
  const sent = new Set(list.filter((e) => !e.kind && e.char).map((e) => lc(e.char)));
  const kept = [];
  for (const c of (disk && Array.isArray(disk.chars)) ? disk.chars : []) {
    if (!c || c.kind || !c.mountAs) continue;
    const id = lc(c.mountAs);
    if (sent.has(id) || LOADED.has(id)) continue;
    sent.add(id);
    kept.push(c);
  }
  if (!kept.length) return { list, kept };
  const add = kept.map((c) => ({ char: c.mountAs, slot: c.slot || '', locked: isLockOn(c.locked) ? '1' : '' }));
  return { list: list.slice(0, at).concat(add, list.slice(at)), kept };
}
function logStudioAdds(kept) {
  if (kept.length) log('Kept ' + plural(kept.length, 'character') + ' added in the Studio since this page loaded: '
    + kept.map((c) => c.mountAs).join(', '));
}

// Lock cell / Unlock cell, from the cell's right-click menu. A cell past the
// end of the list has no entry to carry a lock, so locking one writes unused
// cells up to it first - what a drop there does too - and locks the last.
function cellToggleLock(i) {
  const was = cellHasLock(i);
  const info = cellAt(i);
  const span = orderIndexOfCell(i);
  if (was) {
    for (let k = span.start; k < span.end; k++) delete order[k].locked;
    // An unlocked unused cell at the END is no entry at all again: it may
    // only have been written to carry the lock.
    if (span.end === order.length) trimTrailingHoles();
  } else if (span) {
    order[span.start].locked = '1';
  } else {
    padTo(i);
    order.push({ kind: 'dummy', locked: '1' });
  }
  const name = info && info.kind === 'char' ? ' (' + info.displayName + ')' : '';
  log((was ? 'Unlocked cell ' : 'Locked cell ') + i + name, true);
  Session.record((was ? 'unlocked cell ' : 'locked cell ') + i, true);
  render();
}

// order[] AS CELLS: each cell is the array of the entries in it - a slot block
// is several, anything else one. The shifts below move whole cells, so a slot
// travels as one piece, and flattening the cells again is the new order[].
function orderCells() {
  const out = [];
  for (let k = 0; k < order.length;) {
    const start = k, e = order[k];
    if (e.slot && !e.kind) { while (k < order.length && order[k].slot === e.slot && !order[k].kind) k++; }
    else k++;
    out.push(order.slice(start, k));
  }
  return out;
}
function setOrderCells(cells) { order = [].concat(...cells); }

// A SHIFT PASSES OVER A LOCKED CELL. The edits that renumber cells - a row or
// column added or deleted, a cell taken out of the list, a slot split apart,
// a drop that closes the gap it was lifted from - are made as if nothing were
// locked, and then every locked cell is put back where it was: lifted out of
// wherever the edit left it and set down at its old place, so the cells in
// between flow past it in their own order. That is the whole of "passes over"
// for any edit, without each one having to know about locks.
//
// pinLocks() notes where the locked cells are (null while Lock cells is off);
// unpinLocks(pins, where) puts them back. `where(i)` maps an old cell to where
// it belongs now - a column edit keeps a cell on its row and column rather
// than its number - and answers null for a cell with no place of its own left,
// which then stays wherever the edit put it.
function pinLocks() {
  if (!locksOn()) return null;
  const pins = [];
  orderCells().forEach((c, i) => {
    if (c.some((e) => isLockOn(e.locked))) pins.push({ entries: c, at: i });
  });
  return pins.length ? pins : null;
}
function unpinLocks(pins, where) {
  if (!pins) return;
  const cells = orderCells();
  const back = [];
  for (const p of pins) {
    const to = where ? where(p.at) : p.at;
    if (to === null || to === undefined) continue;
    const k = cells.findIndex((c) => c.some((e) => p.entries.includes(e)));
    if (k < 0) continue;              // the edit took it out altogether
    back.push({ cell: cells[k], to });
    cells.splice(k, 1);
  }
  // Lowest first, so each lands on its own number once the rest are in.
  back.sort((a, b) => a.to - b.to);
  for (const b of back) {
    while (cells.length < b.to) cells.push([{ kind: 'dummy' }]);
    cells.splice(b.to, 0, b.cell);
  }
  setOrderCells(cells);
}

// PREFERENCES > WHEN DROPPING ON OCCUPIED CELLS: MOVE EXISTING CHARACTERS.
//
// `moving` takes the cell holding `destEntry`; that cell and the characters
// after it step on one cell each, up to the first empty cell - an unused cell
// (dummyslot), or the end of the list - which takes the last of them. Skipslots,
// RandomSelect cells and locked cells keep their places and the shift passes
// over them: each is a deliberate decision about THAT cell, where a character
// is only somewhere in the line.
//
// When that first empty cell is past the grid (the grid is full), Preferences >
// Replace RandomSelect cells lets the first unlocked RandomSelect cell on the
// way, on the grid, take the shift instead. Without it the last one pushed goes
// past the grid: still in the build, with no cell, which the footer names.
//
// Answers {cell, sink, tookRandom, shifted: [cells pushed on], beyond}.
function shiftInsert(moving, destEntry) {
  const total = MI.select.rows * MI.select.columns;
  const cells = orderCells();
  const t = cells.findIndex((c) => c.includes(destEntry));
  if (t < 0) {
    order.push(moving);
    return { cell: gridCellCount() - 1, sink: -1, tookRandom: false, shifted: [], beyond: false };
  }
  const locked = (c) => locksOn() && c.some((e) => isLockOn(e.locked));
  const stays = (c) => c[0].kind === 'skip' || c[0].kind === 'random' || locked(c);
  const sinkFrom = (orRandom) => {
    for (let k = t + 1; k < cells.length; k++) {
      if (locked(cells[k])) continue;
      if (cells[k][0].kind === 'dummy') return k;
      if (orRandom && cells[k][0].kind === 'random' && k < total) return k;
    }
    return cells.length;
  };
  let sink = sinkFrom(false), tookRandom = false;
  if (sink >= total && PREFS.dropReplaceRandom) {
    const r = sinkFrom(true);
    if (r < total) { sink = r; tookRandom = true; }
  }
  const shifted = [];
  let carry = [moving];
  for (let k = t; k < sink; k++) {
    if (k > t && stays(cells[k])) continue;
    shifted.push(cells[k]);
    const next = cells[k];
    cells[k] = carry;
    carry = next;
  }
  // The unused (or RandomSelect) cell is replaced; at the end, one is added.
  cells[sink] = carry;
  setOrderCells(cells);
  return { cell: t, sink, tookRandom, shifted, beyond: sink >= total };
}

// SHOW LOCK ICON > WHILE DRAGGING. A drag from a cell or from a library row
// marks the grid, and the drop - or the drag ending anywhere - clears it.
// Cleared from the document in the CAPTURE phase, because a drop re-renders the
// grid and the dragged cell's own dragend then never reaches the document.
function dragState(on) {
  const w = $('#wrap');
  if (w) w.classList.toggle('dragging', !!on);
}
document.addEventListener('drop', () => dragState(false), true);
document.addEventListener('dragend', () => dragState(false), true);
// ...AND ON THE SOURCE ITSELF. A re-render during the drag (a tab the drag
// opened, a load the Studio started) can take the dragged row out of the
// page, and the browser still ends the drag at that row: its dragend then
// never reaches the document, and the padlocks stayed drawn after the drag.
// A listener on the node hears it, in the page or not.
document.addEventListener('dragstart', (e) => {
  if (e.target && e.target.addEventListener) {
    e.target.addEventListener('dragend', () => { dragState(false); clearTimeout(TAB_SPRING); }, { once: true });
  }
}, true);

// A padlock in currentColor. A constant: nothing from a file goes through
// this innerHTML.
const PADLOCK = '<svg viewBox="0 0 16 16" aria-hidden="true">'
  + '<path d="M5 7.5V5.2a3 3 0 0 1 6 0v2.3" fill="none" stroke="currentColor" stroke-width="1.8"/>'
  + '<rect x="3" y="7.2" width="10" height="7.3" fill="currentColor"/>'
  + '<rect x="7.2" y="9.4" width="1.6" height="3" fill="#000" fill-opacity=".55"/></svg>';

// order[] is dense (cell = array index), so "move to cell N" is a splice.
// PLACE-WITH-HOLE and DRAG-TO-CREATE-BLOCKS.
//   drop on an EMPTY cell        -> land exactly there, padding with unused cells
//   drop on an OCCUPIED cell     -> swap (Preferences: "Swap with dragged
//                                   characters", the default), or move in
//                                   and push the rest on one cell ("Move
//                                   existing characters")
//   SHIFT + drop on OCCUPIED     -> join that cell as an extra variant
// Set when a drop creates or extends a slot, so the window can open once the
// grid has been redrawn and the new member exists in CELLS.
let VARIANT_MADE = null;

// THE FIRST CELL FROM `i` ONWARD THAT THE SCREENPACK DOES NOT RESERVE.
//
// The pack's reserved ground is drawn but carries no roster entry past the last
// character, so nothing stopped a character being dropped under a portrait
// panel - where the panel draws over him and he is invisible in game. Returns
// `i` unchanged when there is no layout, and when the search runs off the end:
// refusing to place someone at all would be worse than placing him awkwardly.
function firstUsableCell(i) {
  const L = THEMELAYOUT && THEMELAYOUT.cells;
  if (!L) return i;
  const total = MI.select.rows * MI.select.columns;
  let n = i;
  while (n < total && L[n] === 'hole' && stillReserved(n)) n++;
  return n < total ? n : i;
}

// A CELL THE PACK'S OWN LAYOUT LEAVES EMPTY IS RESERVED ONLY WHILE THE BUILD
// LEAVES IT EMPTY THE SAME WAY: a skipslot, or no entry at all past the end of
// the roster. The slide above exists for LEGACY, whose reserved cells sit under
// its portrait panels. A pack's gap can also be open ground the author simply
// left empty (CVS REV 2's row 0, cells 24-28), and once the owner turns one
// into an unused cell or a RandomSelect it is a cell he has claimed: a drop
// there lands there. It used to read the pack's layout alone, so dropping
// Rasetsumaru on the unused cell right of the RandomSelect slid him five cells
// on, to the first cell the pack itself fills.
function stillReserved(n) {
  const c = cellAt(n);
  return !c || c.kind === 'skip';
}

// `opts` comes from the cell menu's Insert… and Replace…; a drag passes none.
//   mode       'swap' or 'move', in place of Preferences > When dropping on
//              occupied cells
//   lift       a `lib:` character already in the build is taken out of where
//              he is (liftFromBuild) rather than refused
//   swapLog, swapStep   the log line and the Undo label of a swap
// A refusal answers its reason, logged as well, so the picker can show it.
// Anything else answers nothing.
function onDrop(payload, target, addVariant, opts) {
  const o = opts || {};
  const mode = o.mode || PREFS.dropOnOccupied;
  // Only a cell or a Characters row can land on the grid. A Stages-tree row
  // (`stg:`) or an Order row (`ord:`) dropped here does nothing, and used to
  // be told first that the cell was reserved or locked.
  if (!/^(cell|lib):/.test(payload || '')) return;
  // Reserved ground is not somewhere to put a character. Slide past it rather
  // than refuse, and say so - a silent move is worse than no move.
  const wanted = target;
  target = firstUsableCell(target);
  // INSERT… NEVER PUTS HIM WHERE HE ALREADY IS. The cell may hold him already,
  // or the slide past reserved ground may land on his own cell (or a slot he
  // is in). Lifting him out first left the destination with no entry to find,
  // and he went onto the END of the list with his cell left unused, and no
  // log line or Undo step. A drag of his cell there does nothing at all, so
  // this does nothing too, and says why.
  if (o.lift && payload.startsWith('lib:')) {
    const id = payload.slice(4);
    const at = orderIndexOfCell(target);
    if (at && order.slice(at.start, at.end).some((e) => e.char && lc(e.char) === lc(id))) {
      return refused(target === wanted ? charName(id) + ' is already in cell ' + target
        : 'Cell ' + wanted + ' is reserved by ' + (MI.name || 'the screenpack') + ', and the next cell, '
          + target + ', already holds ' + charName(id));
    }
  }
  if (target !== wanted) {
    log('Cell ' + wanted + ' is reserved by ' + (MI.name || 'the screenpack')
      + ' — placed at ' + target + ' instead');
  }
  // A LOCKED CELL TAKES NOTHING: no character, no variant, no swap.
  const locked = lockRefuses(target, 'dropped onto');
  if (locked) return locked;
  const destCell = cellAt(target);
  // THE DESTINATION IS RESOLVED BEFORE ANYTHING MOVES, and held as the ENTRY
  // OBJECT rather than a cell number.
  //
  // A cell index is only meaningful against the current order[]: taking the
  // dragged entry out shifts every later cell down one, so re-reading the
  // target afterwards landed on the NEXT character. Dropping Aoko onto Faust
  // gave her to Terry, who is the cell after him. Identity cannot drift that
  // way, so the character under the cursor is always the one that receives.
  const destSpan0 = orderIndexOfCell(target);
  const destEntry = destSpan0 ? order[destSpan0.start] : null;
  let landing = target;   // where an EMPTY target ends up after the removal
  let moving = null;      // the entry being moved, detached from order
  let vacated = -1;       // order index the mover was lifted OUT of, if any
  let liftedFrom = '';    // the log's words on where a lifted one came from
  let liftHole = null;    // the unused cell a lifted one left (liftFromBuild)
  // Where the locked cells are before anything moves, so a shift below can be
  // taken back for them (pinLocks).
  const pins = pinLocks();

  if (payload.startsWith('cell:')) {
    const from = +payload.slice(5);
    if (from === target) return;
    const held = lockRefuses(from, 'moved');
    if (held) return held;
    const span = orderIndexOfCell(from);
    if (!span) return;
    const src = cellAt(from);
    if (!src || src.kind !== 'char') return;
    // Moving a whole block moves member 0 only; the rest stay grouped.
    moving = order[span.start];
    order.splice(span.start, 1);
    // Only a SINGLE-member source leaves a cell behind. Lifting member 0 out
    // of a block does not free its cell - the rest of the block still holds
    // it - so there is nowhere to put a hole back.
    if (span.end - span.start === 1) vacated = span.start;
    // The source cell only disappears if it held ONE member; a block with more
    // still occupies its cell, so nothing after it moves.
    //
    // AND ONLY A CELL THAT IS IN THE LIST MOVES. Lifting the mover out shifts
    // every ENTRY after him down one, so a target that had an entry (a
    // character, a hole) is now one cell nearer. A target PAST THE END of the
    // list is not an entry and does not move: it is a place on the grid, and
    // padTo() fills up to it. Compensating there sent the last character
    // "one cell right" straight back into his own cell - the log said placed
    // at N, the grid showed nothing happened.
    if (from < target && span.end - span.start === 1 && destSpan0) landing = target - 1;
  } else if (payload.startsWith('lib:')) {
    const id = payload.slice(4);
    if (o.lift) {
      // INSERT… WITH A CHARACTER ALREADY IN THE BUILD moves him here, as a
      // drag of his cell would - except that the cell he leaves becomes an
      // unused cell, so nothing after it shifts, wherever this cell is.
      const p = whereInBuild(id);
      if (p && !p.off) {
        const heldHim = lockRefuses(p.cell, 'moved', charName(id));
        if (heldHim) return heldHim;
      }
      const l = liftFromBuild(id);
      moving = l.entry;
      liftedFrom = l.from;
      liftHole = l.hole;
    } else {
      if (inOrder(id)) return refused(id + ' is already in the build');
      moving = takeFromLibrary(id);
    }
  } else return;

  if (destCell && destCell.kind === 'char') {
    // Find the destination again by identity, and walk its slot run.
    const start = destEntry ? order.indexOf(destEntry) : -1;
    const span = start < 0 ? null : (() => {
      let end = start + 1;
      const sid0 = order[start].slot;
      if (sid0) while (end < order.length && order[end].slot === sid0 && !order[end].kind) end++;
      return { start, end };
    })();
    if (!span) {
      // Not reached: a drag never takes the destination out of the list, and
      // Insert… refuses his own cell above. Should the grid and the list ever
      // disagree, the mover still goes somewhere the log names, as one step -
      // never silently onto the end, which is what this used to do. A cell
      // he left gets its hole back first, so nothing after it shifts.
      moving.slot = '';
      if (vacated >= 0) order.splice(vacated, 0, { kind: 'dummy' });
      const pk = parkEntry(moving);
      log('Placed ' + moving.char + ' → cell ' + pk.cell + liftedFrom, true);
      Session.record('placed ' + moving.char + ' in cell ' + pk.cell, true);
    } else if (addVariant) {
      // Give the destination a slot id if it has none, then insert the mover
      // at the end of that run so the members stay CONSECUTIVE - the block
      // syntax has no way to attach a non-adjacent line.
      let sid = order[span.start].slot;
      if (!sid) { sid = 'g' + Date.now().toString(36); for (let k = span.start; k < span.end; k++) order[k].slot = sid; }
      moving.slot = sid;
      order.splice(span.end, 0, moving);
      log('Added ' + moving.char + ' as a variant of cell ' + target, true);
      Session.record(moving.char + ' as a variant of cell ' + target, true);
      // Making a slot is the moment its commands become worth setting, so the
      // window opens itself - the same two moments VSelect opens it.
      VARIANT_MADE = sid;
    } else if (mode === 'move') {
      // MOVE: the mover takes this cell and the rest step on (shiftInsert).
      // The cell he came from becomes an empty one, as a drag onto empty
      // ground leaves it - and putting that hole in FIRST keeps every cell
      // before the target on its number, so the cell he was dropped on is
      // still the one he gets.
      moving.slot = '';
      if (vacated >= 0) order.splice(vacated, 0, { kind: 'dummy' });
      const m = shiftInsert(moving, destEntry);
      const names = m.shifted.map((c) => c[0].char || c[0].kind);
      log('Moved ' + moving.char + ' → cell ' + m.cell
        + (names.length ? ' (' + names.join(', ') + ' moved on one cell)' : '')
        + (m.tookRandom ? ', replacing the RandomSelect cell ' + m.sink : ''), true);
      if (m.beyond && names.length) {
        log(names[names.length - 1] + ' was pushed past the last cell of the grid: still in the'
          + ' build, but with no cell. Free a cell or add rows or columns, then Move into the grid.');
      }
      Session.record('moved ' + moving.char + ' to cell ' + m.cell, true);
    } else {
      moving.slot = '';
      const victim = order[span.start];
      order.splice(span.start, 1, moving);
      victim.slot = '';
      // A SWAP HAS TO PUT THE OTHER ONE WHERE THIS ONE CAME FROM.
      //
      // It used to push the displaced entry onto the END of the list, which is
      // not a swap and is not local: the mover had already been lifted out, so
      // every character between his old cell and the end moved up one, and the
      // displaced one traveled to the last cell. Dragging cell 0 onto cell 5
      // measured as - DongHwan landing on cell 4 rather than 5, Gardevoir
      // teleported to the end, and sakura, Leona, Guile and everyone after them
      // renumbered. One drag, twenty-odd cells changed, and the log said
      // "Swapped DongHwan and Gardevoir".
      //
      // `vacated` is the index the mover was lifted out of, and replacing the
      // destination above is length-neutral, so it still points at the cell he
      // left. Putting the victim there makes the exchange exact and local.
      // A LIBRARY drop vacates nothing, so there the displaced entry really
      // does go to the end and the grid grows by one - which is the only
      // honest thing it can do, while the end is still on the grid. Once it is
      // not, the end would strand him, so parkEntry gives him the first free
      // cell instead (or a RandomSelect cell, when Preferences say so).
      //
      // INSERT… WITH ONE ALREADY IN THE BUILD lifts him out through
      // liftFromBuild, which leaves an unused cell where he was (`liftHole`)
      // rather than closing the gap, so `vacated` stays -1. The victim takes
      // that cell, which is the trade a drag of his cell makes. He used to go
      // to the end of the list, while the log said Swapped.
      let parked = null;
      if (vacated >= 0) order.splice(vacated, 0, victim);
      else if (liftHole && order.includes(liftHole)) order.splice(order.indexOf(liftHole), 1, victim);
      else parked = parkEntry(victim);
      Session.record(o.swapStep || 'swapped ' + moving.char + ' with ' + victim.char, true);
      log((o.swapLog || 'Swapped ' + moving.char + ' ↔ ' + victim.char) + parkedNote(victim, parked), true);
    }
  } else {
    // Empty (or hole) target. TWO CASES, and only one of them is padding.
    //
    // A cell PAST THE END of the list does not exist yet, so the gap has to be
    // invented: padTo appends skipslots and the entry goes on the end.
    //
    // A cell that is ALREADY a skipslot or a randomselect is a different
    // matter - it is in the list, and padTo only ever APPENDS, so it added
    // nothing and the push put the character on the END of the grid instead
    // of on the cell under the cursor. Dragging someone back onto the hole he
    // had just made lifted him out and pushed him straight back where he was:
    // a drop that looked like it did nothing at all, because it did nothing at
    // all. Every later drop onto one of those holes did the same, which is how
    // a few of them turn into a row of cells that refuse to accept anyone.
    //
    // So an existing hole is FILLED IN PLACE, and the hole trades places with
    // the mover rather than being deleted - every other cell keeps its
    // position and the move is exactly reversible, which is the whole point of
    // dragging something back.
    moving.slot = '';
    const destSpan = orderIndexOfCell(landing);
    if (destSpan) {
      const hole = order[destSpan.start];
      order.splice(destSpan.start, destSpan.end - destSpan.start, moving);
      // Replacing is length-neutral, so the mover's old index still points at
      // the cell he left.
      if (vacated >= 0) order.splice(vacated, 0, hole);
      // THE CELL HE LANDS IN IS THE ONE HE WAS DROPPED ON. `landing` is only
      // where that cell sat while he was lifted out; the hole going back
      // into his old place moves it up again. Reporting `landing` said
      // "cell 3" for a drop that put him in cell 4 - in the log, and in the
      // Undo and Revert tooltips, which read this label.
      log('Placed ' + moving.char + ' → cell ' + target + liftedFrom, true);
      Session.record('placed ' + moving.char + ' in cell ' + target, true);
    } else {
      const holes = padTo(landing);
      order.push(moving);
      log('Placed ' + moving.char + ' → cell ' + landing
        + (holes ? ' (+' + holes + ' empty)' : '') + liftedFrom, true);
      Session.record('placed ' + moving.char + ' in cell ' + landing, true);
    }
  }
  unpinLocks(pins);
  trimTrailingHoles();
  sel = null;
  markDirty(true);
  render();
  if (VARIANT_MADE) {
    const sid = VARIANT_MADE;
    VARIANT_MADE = null;
    const cell = CELLS.find((c) => c.slot === sid);
    if (cell) showSlotMembers(cell.index);
  }
}

// Field-qualified search, as VSelect has it: a bare word matches any of the
// three fields, `author:x` / `path:y` / `name:z` narrow to one. Two builds of
// the same character share a display name and differ only by author and
// folder, so searching by name alone cannot separate them.
function matchesQuery(c, q) {
  if (!q) return true;
  const fields = {
    name: (c.displayName || '').toLowerCase(),
    author: (c.author || '').toLowerCase(),
    // THE DISK PATH, which is `folder`, never `id` - an in-build row's id is a
    // mountAs and names no directory.
    path: ((c.folder || c.id) + '/' + (c.def || '')).toLowerCase(),
  };
  // Every term must match; an unqualified term may match any field.
  return q.split(/\s+/).filter(Boolean).every((term) => {
    const m = /^(name|author|path):(.*)$/.exec(term);
    if (m) return m[2] === '' || fields[m[1]].includes(m[2]);
    return Object.keys(fields).some((k) => fields[k].includes(term));
  });
}

// WHO MADE IT, not what it is called twice. The status line read
// `Makoto [makoto]` because it printed the display name and then the mount id,
// which for most characters are the same word. VSelect prints the AUTHOR there,
// and the author is worth the space: this roster holds three Makotos.
//
// The author is not on a CELL - the roster stores only what select.def needs,
// and cleanChar drops everything else - so it comes from the library, which
// parses each character's .def for exactly this.
// WHAT IS ACTUALLY ON DISK.
//
// A roster entry can outlive its character. Both maps come from the same
// library and go stale together, so both are dropped whenever load() refetches
// it - otherwise deleting a character elsewhere would leave this view still
// insisting it was present.
let ONDISK_IDS = null;
function missingFromDisk(id) {
  if (!id || !LIB || !LIB.chars) return false;   // no library yet: accuse nobody
  if (!ONDISK_IDS) {
    ONDISK_IDS = new Set();
    for (const c of LIB.chars) if (c && c.id) ONDISK_IDS.add(String(c.id).toLowerCase());
  }
  return !ONDISK_IDS.has(String(id).toLowerCase());
}

let AUTHOR_BY_ID = null;
function authorOf(id) {
  if (!AUTHOR_BY_ID) {
    AUTHOR_BY_ID = new Map();
    // LIB is { chars, inBuild, onDisk } - not the array itself.
    for (const c of ((LIB && LIB.chars) || [])) {
      if (c && c.id) AUTHOR_BY_ID.set(String(c.id).toLowerCase(), c.author || '');
    }
  }
  return AUTHOR_BY_ID.get(String(id || '').toLowerCase()) || '';
}

// The label a cell shows: "Makoto [by NHK]", falling back to the mount id when
// a character ships no author, since a bare name is ambiguous on this roster.
function cellLabel(info, i) {
  // While Lock cells is on, a locked cell says so wherever its label shows:
  // the tooltip, the footer and the header of its menu.
  const lk = i !== undefined && i !== null && cellLocked(i) ? '  (locked)' : '';
  // Four different empties now, and telling them apart is most of the point.
  if (!info) {
    // Free ground the SCREENPACK reserves. No roster entry sits here - the
    // imported layout stops at the last character - but the pack's artwork
    // does, so it is not somewhere to put anyone.
    if (THEMELAYOUT && THEMELAYOUT.cells && THEMELAYOUT.cells[i] === 'hole') {
      return '(reserved by ' + (MI.name || 'the screenpack') + ')';
    }
    return '(unused cell)';
  }
  if (info.kind === 'skip') return '(skipslot \u2014 draws nothing, cursor skips it)' + lk;
  if (info.kind === 'dummy') return '(unused cell \u2014 empty, cursor can rest on it)' + lk;
  if (info.kind === 'random') return '(random select)' + lk;
  const who = authorOf(info.char);
  const ex = info.props && String(info.props.exclude || '') !== '' ? '  (excluded)' : '';
  // Named first, because it explains the blank cell and the missing author at
  // once: with no folder there is no .def to read an author out of, so the
  // label falls back to the id and reads "Name [Name]".
  const gone = missingFromDisk(info.char)
    ? '\n\u26a0 NOT ON DISK - this character is in the build but its files are gone.'
      + '\nRemove it from the build, or re-import the character.'
    : '';
  return info.displayName
    + (who ? ' [by ' + who + ']' : (info.char ? ' [' + info.char + ']' : ''))
    + (info.variants > 1 ? '  (' + info.variants + ' variants)' : '') + ex + lk + gone;
}

// VSelect labels the cell under the cursor, at the cursor. Kept clamped inside
// the window so a cell near the right edge does not push it off screen.
const cellTip = {
  // `extra` is an optional second line, {text, level}: the hidden state.
  show(text, e, extra) {
    const t = $('#celltip');
    t.textContent = text;
    if (extra && extra.text) {
      const x = document.createElement('div');
      x.className = 'tipline';
      if (extra.level) x.dataset.h = String(extra.level);
      x.textContent = extra.text;
      t.appendChild(x);
    }
    t.hidden = false;
    this.move(e);
  },
  move(e) {
    const t = $('#celltip');
    if (t.hidden) return;
    const w = t.offsetWidth, h = t.offsetHeight;
    let x = e.clientX + 14, y = e.clientY + 16;
    if (x + w > window.innerWidth - 4) x = e.clientX - w - 10;
    if (y + h > window.innerHeight - 4) y = e.clientY - h - 10;
    t.style.left = Math.max(4, x) + 'px';
    t.style.top = Math.max(4, y) + 'px';
  },
  hide() { $('#celltip').hidden = true; },
};

// PROPERTIES TOGGLES THE PANEL, and re-opening always restores its width.
// Someone who drags the panel down to a sliver and cannot find it again has, as
// far as they can tell, broken the editor; coming back at the default size is
// the cheap way out of that.
//
// An EMPTY cell opens the same panel: drawInspector shows which kind of empty
// it is, turns it into the other two, and holds the pack's empty-cell flags.
// It used to open a raw select.def line editor instead, and nothing saved that
// line - see the note in drawInspector for why there is none.
function openProperties(i) {
  sel = i;
  const insp = $('#inspector');
  const main = document.querySelector('main');
  // Asking for the properties of the cell already shown closes them; asking
  // for any other cell's opens them there. Either way the column is restored
  // to a usable width, because someone who dragged it to a sliver and lost it
  // has, as far as they can tell, broken the editor.
  if (!insp.hidden && PROPS_CELL === i) {
    insp.hidden = true;
    PROPS_CELL = null;
    syncRightColumn();
    drawGrid();
    return;
  }
  insp.hidden = false;
  PROPS_CELL = i;
  // Opening from a sliver restores a usable width, not the sliver.
  if (parseFloat(RIGHT_WIDTH) < 60) RIGHT_WIDTH = '290px';
  syncRightColumn();
  const cur = parseFloat(getComputedStyle(main).getPropertyValue('--right')) || 0;
  if (cur < 60) main.style.setProperty('--right', '290px');
  drawGrid(); drawInspector();
}
let PROPS_CELL = null;

// IS THIS CHARACTER'S CELL PORTRAIT ACTUALLY A PORTRAIT?
//
// Entirely derived - there is nothing to configure and nothing stored. The
// engine draws portrait.spr at portraitscale * motif.localcoord.x /
// char.localcoord (start.lua:2555-2582), so the size a sprite ENDS UP is a
// function of the sprite and the character's own coordinate space. Compare that
// against the cell it has to sit in and the answer falls out.
//
// The same verdict drives the badge on the grid and the note in the properties
// panel, so the two can never disagree about what is wrong.
function portraitVerdict(id, row) {
  const cp = CELLPORT && CELLPORT[id];
  if (!cp || !cp.w || !cp.h || !MI) return null;
  const S = MI.select;
  const RG = rowGeometry(S);
  const g = RG[Math.max(0, Math.min(RG.length - 1, row || 0))];
  if (!g) return null;
  const L = MI.localcoord || [320, 240];
  const resFix = (cp.portraitscale || 1) * L[0] / (cp.localcoord || 320);
  // The PORTRAIT's scale, not the cell box's - see rowGeometry.
  const drawnW = cp.w * g.psc[0] * resFix, drawnH = cp.h * g.psc[1] * resFix;
  const narrow = drawnW < g.w * 0.6, tall = drawnH > g.h * 1.15;
  if (!narrow && !tall) return null;
  // What a sprite WOULD have to measure to fill this cell.
  const wantW = Math.round(g.w / (g.psc[0] * resFix));
  const wantH = Math.round(g.h / (g.psc[1] * resFix));
  return {
    w: cp.w, h: cp.h, drawnW: Math.round(drawnW), drawnH: Math.round(drawnH),
    cellW: Math.round(g.w), cellH: Math.round(g.h),
    wantW, wantH, resFix: Math.round(resFix * 100) / 100,
    psc: Math.round(g.psc[0] * 1000) / 1000,
    localcoord: cp.localcoord || 320, portraitscale: cp.portraitscale || 1,
    spr: S.portraitSpr.join(','),
    narrow, tall,
  };
}

// WHICH STILL SPRITE THIS SCREENPACK USES FOR THE BIG PORTRAIT, if any.
// p1 first, since p2 is normally the same element mirrored.
function faceSprite() {
  const f = MI && MI.select && MI.select.faces;
  if (!f) return null;
  for (const side of ['p1', 'p2']) {
    for (const e of f[side] || []) if (e.anim == null && e.spr) return e.spr;
  }
  return null;
}

// IS THE BIG PORTRAIT TOO BIG FOR THE SCREEN IT IS DRAWN ON?
//
// The same arithmetic as the cell portrait, against the face element's own
// scale instead of the cell's: drawn = sprite x face.scale x resFix, where
// resFix is portraitscale x motif.localcoord.x / char.localcoord.
//
// The test is deliberately the blunt one - DOES IT FIT ON THE SCREEN. A big
// portrait is meant to be big, and packs disagree wildly about how big, so
// anything subtler would fire on artwork that is doing its job. Overflowing
// the screen cannot be intended: LEGACY is 1280x720 and cvsjill's 424x455 at
// 9000,1 lands at 848x910 - taller than the screen - where an ordinary
// character's 120x140 lands at 240x280.
//
// A `window` IS NOT A BOUND. It is a crop, and packs oversize into one on
// purpose: Big MUGEN1 declares window 0,46,476,561 - 476x515 - and draws an
// ordinary 120x140 portrait at 480x560 through it, overhanging by a few pixels
// by design. Measuring against the window flagged 24 of 25 characters on that
// pack and 23 on ikemen1, which is the every-character noise this warning
// exists to avoid. The screen is the only honest bound.
//
// A PROJECTED element is skipped outright. ikemen1's face2 is rotated 70
// degrees about its vertical axis to lie along the wall of its perspective
// room, so its flat width is not what appears on screen and there is nothing
// meaningful to compare.
function bigPortraitVerdict(id) {
  const cp = CELLPORT && CELLPORT[id];
  const spr = faceSprite();
  if (!cp || !cp.face || !cp.face.w || !cp.face.h || !spr || !MI) return null;
  const f = (MI.select.faces.p1 || []).find((e) => e.anim == null && e.spr)
    || (MI.select.faces.p2 || []).find((e) => e.anim == null && e.spr);
  if (!f) return null;
  if (f.yangle || f.xangle) return null;      // projected: see above
  const L = MI.localcoord || [320, 240];
  const resFix = (cp.portraitscale || 1) * L[0] / (cp.localcoord || 320);
  const sc = f.scale || [1, 1];
  const drawnW = cp.face.w * sc[0] * resFix, drawnH = cp.face.h * sc[1] * resFix;
  const fitW = L[0], fitH = L[1];

  // TOO SMALL IS THE SAME FAULT POINTING THE OTHER WAY, and it has a different
  // reference. Oversize is judged against the screen because a window is a crop
  // (see above); undersize is judged against the WINDOW when one exists,
  // because that window is the frame the pack reserved and a portrait rattling
  // around inside it is the thing you can see is wrong. With no window there is
  // only the screen, and a big portrait under a seventh of its height is not a
  // big portrait.
  //
  // Aoko is the case: her sprites are ordinary - 9000,1 is 120x140, the same as
  // everyone's - but her .def declares localcoord 1280, so resFix is
  // 1280/1280 = 1 where a 320-space character gets 4. She draws at 60x70 on
  // LEGACY where the rest of the roster draws at 240x280.
  const win = f.window && f.window.length === 4
    ? [Math.abs(f.window[2] - f.window[0]), Math.abs(f.window[3] - f.window[1])]
    : null;
  const over = drawnW > fitW || drawnH > fitH;
  const under = win
    ? (drawnH < win[1] * 0.4 && drawnW < win[0] * 0.4)
    : (drawnH < fitH * 0.15 && drawnW < fitW * 0.15);
  if (!over && !under) return null;
  // What a sprite would have to measure to sit properly in that reference.
  const refW = under && win ? win[0] : fitW;
  const refH = under && win ? win[1] : fitH;
  return {
    kind: over ? 'over' : 'under',
    spr: spr.join(','), w: cp.face.w, h: cp.face.h,
    drawnW: Math.round(drawnW), drawnH: Math.round(drawnH),
    fitW: Math.round(refW), fitH: Math.round(refH),
    against: (under && win) ? 'the frame the screenpack reserves for it' : 'the screen',
    wantW: Math.round(refW / (sc[0] * resFix)),
    wantH: Math.round(refH / (sc[1] * resFix)),
    scale: sc[0], resFix: Math.round(resFix * 100) / 100,
    localcoord: cp.localcoord || 320,
    // What the SAME sprite would have drawn at in a 320-space character, which
    // is what the rest of the roster gets and the number worth comparing to.
    asIf320W: Math.round(cp.face.w * sc[0] * (resFix * (cp.localcoord || 320) / 320)),
    asIf320H: Math.round(cp.face.h * sc[1] * (resFix * (cp.localcoord || 320) / 320)),
  };
}

function bigPortraitAdvice(v) {
  const LF = String.fromCharCode(10);
  const why = v.kind === 'over'
    ? 'This character stores that at ' + v.w + 'x' + v.h + ' pixels, which is'
      + ' several times what a character cut for this screenpack stores.'
    : 'This character stores that at ' + v.w + 'x' + v.h + ' pixels and declares'
      + ' localcoord ' + v.localcoord + '. The bigger a character\u2019s own'
      + ' coordinate space, the LESS the engine scales its artwork up - at '
      + v.localcoord + ' against this motif it is multiplied by only '
      + v.resFix + ', where a 320-space character would get '
      + Math.round((v.resFix * v.localcoord / 320) * 100) / 100 + '.';
  return 'THIS IS ABOUT THE CHARACTER, not about anything you changed.' + LF + LF
    + 'The screenpack draws its big portrait from sprite ' + v.spr + '. ' + why
    + LF + LF
    + 'The engine scales it by the screenpack\u2019s face scale, ' + v.scale
    + ', times motif.localcoord / char.localcoord = ' + v.resFix
    + ', which lands it at ' + v.drawnW + 'x' + v.drawnH + ' against '
    + v.fitW + 'x' + v.fitH + ' of ' + v.against + '.' + LF + LF
    + (v.kind === 'over'
      ? 'It will overhang in game exactly as it does here, and the screenpack'
        + ' may mirror it for player 2, which makes it more obvious still.'
      : 'It will be just as small in game. Nothing is broken - the engine is'
        + ' doing what the character\u2019s own .def asks for.') + LF + LF
    + 'TO FIX IT, give the character a sprite at ' + v.spr + ' of roughly '
    + v.wantW + 'x' + v.wantH + ' pixels. Nothing in your roster is affected.';
}

// The long form, shown on hover in the panel and on the grid badge.
function portraitAdvice(v) {
  const LF = String.fromCharCode(10);
  return 'THIS IS ABOUT THE CHARACTER, not about anything you changed.' + LF + LF
    + 'The motif asks every character for sprite ' + v.spr + ' as its cell portrait.'
    + ' This one is ' + v.w + 'x' + v.h + ' pixels.' + LF + LF
    + 'The engine scales it by this screenpack\u2019s portrait scale, ' + v.psc
    + ', times portraitscale x motif.localcoord / char.localcoord'
    + ' = ' + v.portraitscale + ' x ' + (MI.localcoord || [320])[0] + ' / ' + v.localcoord
    + ' = ' + v.resFix + ', which lands it at '
    + v.drawnW + 'x' + v.drawnH + ' in a ' + v.cellW + 'x' + v.cellH + ' cell.' + LF + LF
    + 'TO FIX IT, give the character a sprite at ' + v.spr + ' of roughly '
    + v.wantW + 'x' + v.wantH + ' pixels - that is what fills this cell at its'
    + ' scaling. Most characters ship 25x25 there for a 320-wide game.'
    + ' Changing localcoord or portraitscale in the .def moves the same number'
    + ' the other way.' + LF + LF
    + 'Nothing in your roster is affected. The cell looks like this in game too.';
}

// A MUSIC PREFIX IS A LIST OF TRACKS, not one path.
//
// The engine holds a list per prefix and picks among them (music.go:14), which
// is the same random-track idea the stages already have. Each entry is
// `path volume loopstart loopend`, space separated after the file extension,
// and the engine expands the extras into bgmvolume / bgmloopstart / bgmloopend
// (select_params.go expandMusicKV). So one prefix needs a row per track and
// three numbers per row, which is what the collapsed panel holds.
function parseTrack(v) {
  const str = String(v || '').trim();
  if (!str) return { path: '', vol: '', start: '', end: '' };
  // Split after the LAST known audio extension, exactly as the engine does -
  // a path may itself contain spaces.
  const m = /^(.*?\.(?:ogg|mp3|wav|flac|xm|mod|it|s3m))\s*(.*)$/i.exec(str);
  if (!m) return { path: str, vol: '', start: '', end: '' };
  const extras = m[2].trim() ? m[2].trim().split(/\s+/) : [];
  return { path: m[1].trim(), vol: extras[0] || '', start: extras[1] || '', end: extras[2] || '' };
}

function joinTrack(t) {
  const path = String(t.path || '').trim();
  if (!path) return '';
  const vol = String(t.vol || '').trim();
  const start = String(t.start || '').trim();
  const end = String(t.end || '').trim();
  // The extras are POSITIONAL: volume, then loop start, then loop end. Setting
  // a loop point without a volume would shift it into the volume slot, so a
  // default volume is written when a later field is used on its own.
  if (!vol && !start && !end) return path;
  const v = vol || '100';
  if (!start && !end) return path + ' ' + v;
  const st = start || '0';
  if (!end) return path + ' ' + v + ' ' + st;
  return path + ' ' + v + ' ' + st + ' ' + end;
}

// THE SAME CONTROL THE COMMON BLOCK USES. This was a datalist, which was wrong
// twice: it looked nothing like the Music dropdown three rows above it, and a
// datalist FILTERS ITS OWN OPTIONS by what is already typed - so once a track
// was chosen the list collapsed to that one entry and there was no way to pick
// another. A select always offers everything.
//
// A build may name a track this roster has never seen, so the current value is
// added as an option of its own rather than being silently dropped.
function musicOptions(cur) {
  const all = (MI.music || []).slice();
  if (cur && !all.includes(cur)) all.unshift(cur);
  const esc = (x) => String(x == null ? '' : x).replace(/"/g, '&quot;');
  return '<option value=""' + (cur ? '' : ' selected') + '>(none)</option>'
    + all.map((m) => '<option value="' + esc(m) + '"'
      + (m === cur ? ' selected' : '') + '>' + esc(m) + '</option>').join('');
}

function musicNums(key, t) {
  const esc = (x) => String(x == null ? '' : x).replace(/"/g, '&quot;');
  return '<div class="nums">'
    + '<span>vol</span><input data-mus="' + key + '" data-f="vol" value="' + esc(t.vol) + '">'
    + '<span>loop start</span><input data-mus="' + key + '" data-f="start" value="' + esc(t.start) + '">'
    + '<span>loop end</span><input data-mus="' + key + '" data-f="end" value="' + esc(t.end) + '">'
    + '</div>';
}

// One ALTERNATE track: its own dropdown, its own remove, its own numbers.
function musicTrackRow(key, t) {
  return '<div class="trk">'
    + '<div class="path"><select data-mus="' + key + '" data-f="path">'
    + musicOptions(t.path) + '</select>'
    + '<button class="mbtn rm" title="Remove this track">\u00d7</button></div>'
    + musicNums(key, t)
    + '</div>';
}

function musicField(label, key, px) {
  const raw = px[key];
  const list = Array.isArray(raw) ? raw.slice() : (raw ? [raw] : []);
  const tracks = list.map(parseTrack);
  if (!tracks.length) tracks.push({ path: '', vol: '', start: '', end: '' });
  // Track 0 lives in the header row; the rest are rows beneath it. Nothing is
  // mirrored between them, which is what previously let the two disagree.
  return '<div class="mus" data-key="' + key + '">'
    + '<div class="head"><label>' + label + '</label>'
    + '<select data-mus="' + key + '" data-f="path" data-first="1">'
    + musicOptions(tracks[0].path) + '</select>'
    + '<button class="mbtn add" title="Add an alternate track (the engine picks one at random)">+</button>'
    + '<button class="mbtn tog" title="Volume / loop options">\u25be</button>'
    + '</div>'
    + '<div class="headnums">' + musicNums(key, tracks[0]) + '</div>'
    + '<div class="tracks">'
    + tracks.slice(1).map((t) => musicTrackRow(key, t)).join('')
    + '</div></div>';
}

// ADDING AND REMOVING A SINGLE ROW OR COLUMN.
//
// This is two edits at once and both have to happen or neither makes sense: the
// SCREENPACK's row/column count, and the ROSTER's flat list of entries. The
// grid is addressed as `row * columns + col`, so a column added anywhere - or a
// row removed above the end - renumbers every cell after it. Changing only the
// count would slide every character one place along.
//
// Cells are edited from the HIGHEST index down, so the indices still to be
// visited keep their meaning while earlier ones move.

// Where cell `i` begins in order[], padding the list if it does not reach that
// far yet. Returns the insertion point, never null.
function orderPosOfCell(i) {
  const span = orderIndexOfCell(i);
  if (span) return span.start;
  padTo(i);
  return order.length;
}

// Take a whole cell out of the flat list - all of a slot's members with it.
function removeCellEntries(i) {
  const span = orderIndexOfCell(i);
  if (span) order.splice(span.start, span.end - span.start);
}

// The screenpack half of a row or column edit. The edit is recorded by
// saveOrderThenReload, once the roster half is written as well: its undo step
// is taken from what the reload after BOTH writes leaves (see Undo / Redo).
async function setGridShape(rows, columns) {
  const r = await (await fetch('/api/motif-grid', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ rows, columns }),
  })).json();
  if (r.error) { log('ERROR ' + r.error); return false; }
  return true;
}

// A new row of empty cells. Skipslots rather than nothing, so the row exists in
// select.def and the cursor treats it as a deliberate gap - see trimTrailingHoles.
// LOCKED CELLS STAY PUT (Preferences > Lock cells): the shift a row or column
// edit makes passes over them - pinLocks and unpinLocks. A row edit keeps each
// locked cell on its number, which is also its row and column; a column edit
// keeps it on its row and column.
//
// So a row or column cannot be deleted while that would take a locked cell
// with it, or leave one with nowhere to stay: a row delete keeps the numbers
// and the grid loses its last row, so a lock in the LAST row has no row left;
// a column delete keeps rows and columns and the grid loses its last column,
// so a lock in the LAST column has none. Answers {cell, what} for the first
// lock in the way, or null.
function rowDeleteBlock(at) {
  if (!locksOn()) return null;
  const S = MI.select, cols = S.columns;
  for (let c = 0; c < cols; c++) {
    if (cellHasLock(at * cols + c)) return { cell: at * cols + c, what: 'deleted with its row' };
  }
  for (let i = (S.rows - 1) * cols; i < S.rows * cols; i++) {
    if (cellHasLock(i)) return { cell: i, what: 'moved off the end of the grid' };
  }
  return null;
}
function colDeleteBlock(at) {
  if (!locksOn()) return null;
  const S = MI.select, cols = S.columns;
  for (let r = 0; r < S.rows; r++) {
    if (cellHasLock(r * cols + at)) return { cell: r * cols + at, what: 'deleted with its column' };
  }
  for (let r = 0; r < S.rows; r++) {
    if (cellHasLock(r * cols + cols - 1)) return { cell: r * cols + cols - 1, what: 'moved out of the last column' };
  }
  return null;
}
async function insertRow(at) {
  const S = MI.select, cols = S.columns;
  const pins = pinLocks();
  const pos = orderPosOfCell(Math.min(at, S.rows) * cols);
  // A new row is empty ground, not a wall - same reasoning as padTo.
  const blanks = Array.from({ length: cols }, () => ({ kind: 'dummy' }));
  order.splice(pos, 0, ...blanks);
  unpinLocks(pins);
  markDirty(true);
  log('Inserted a row at ' + (at + 1), true);
  if (await setGridShape(S.rows + 1, cols)) await saveOrderThenReload('inserted row ' + (at + 1));
}

async function deleteRow(at) {
  const S = MI.select, cols = S.columns;
  if (S.rows <= 1) { log('A grid needs at least one row'); return; }
  const blocked = rowDeleteBlock(at);
  if (blocked) { log(lockedWhy(blocked.cell, blocked.what)); return; }
  const pins = pinLocks();
  const lost = [];
  for (let c = cols - 1; c >= 0; c--) {
    const info = cellAt(at * cols + c);
    if (info && info.kind === 'char') lost.push(info.displayName);
    removeCellEntries(at * cols + c);
  }
  unpinLocks(pins);
  markDirty(true);
  log('Deleted row ' + (at + 1)
    + (lost.length ? ' (' + lost.reverse().join(', ') + ' back in the library)' : ''), true);
  if (await setGridShape(S.rows - 1, cols)) await saveOrderThenReload('deleted row ' + (at + 1));
}

async function insertColumn(at) {
  const S = MI.select, cols = S.columns;
  const pins = pinLocks();
  for (let r = S.rows - 1; r >= 0; r--) {
    order.splice(orderPosOfCell(r * cols + Math.min(at, cols)), 0, { kind: 'dummy' });
  }
  unpinLocks(pins, (i) => Math.floor(i / cols) * (cols + 1) + (i % cols));
  markDirty(true);
  log('Inserted a column at ' + (at + 1), true);
  if (await setGridShape(S.rows, cols + 1)) await saveOrderThenReload('inserted column ' + (at + 1));
}

async function deleteColumn(at) {
  const S = MI.select, cols = S.columns;
  if (cols <= 1) { log('A grid needs at least one column'); return; }
  const blocked = colDeleteBlock(at);
  if (blocked) { log(lockedWhy(blocked.cell, blocked.what)); return; }
  const pins = pinLocks();
  const lost = [];
  for (let r = S.rows - 1; r >= 0; r--) {
    const info = cellAt(r * cols + at);
    if (info && info.kind === 'char') lost.push(info.displayName);
    removeCellEntries(r * cols + at);
  }
  // Only a cell past the grid can still be in the last column (colDeleteBlock
  // stops the rest); it moves in one column, as it would have anyway.
  unpinLocks(pins, (i) => (i % cols < cols - 1 ? Math.floor(i / cols) * (cols - 1) + (i % cols) : null));
  markDirty(true);
  log('Deleted column ' + (at + 1)
    + (lost.length ? ' (' + lost.reverse().join(', ') + ' back in the library)' : ''), true);
  if (await setGridShape(S.rows, cols - 1)) await saveOrderThenReload('deleted column ' + (at + 1));
}

// The roster half is staged and the screenpack half is already written, so the
// two would disagree until the next Save - and the reload that follows the
// screenpack write would discard the staged half entirely. Committing the order
// first keeps them in step. Revert still undoes both: the baseline holds the
// roster AND the motif file.
//
// The screenpack half is on disk whether or not the roster half lands, so the
// edit is recorded either way - Revert and Undo must be able to take it back.
// It is recorded right where the reload starts, in the same task, which is
// how the undo history knows the reload belongs to it.
//
// It writes the roster just as Save does, so it sends what Save sends: every
// entry's lock, the lock label, and the backup Preferences ask for.
async function saveOrderThenReload(label) {
  const { list, kept } = await withStudioAdds();
  const body = { order: list, lockLabel: PREFS.lockLabel };
  if (PREFS.saveBackup) body.backup = true;
  const r = await (await fetch('/api/build-order', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })).json();
  if (label) Session.record(label);
  if (r.error) { log('ERROR ' + r.error); return; }
  logStudioAdds(kept);
  if (r.backup) log('Backed up the previous roster to ' + r.backup);
  await load(true);
}

// THE GRID'S SHAPE, which lives in the SCREENPACK rather than the roster.
//
// Rows and columns decide how many cells exist at all, so this is the only edit
// in the editor that can change what the roster is allowed to hold - shrinking
// the grid below the number of characters leaves the ones past the end
// unreachable, which the footer now says out loud.
//
// It writes into [Select Info] in place, keeping the file's comments and
// layout, and Revert restores the whole file because the session baseline holds
// its bytes.
function editGrid() {
  const S = MI.select;
  const back = document.createElement('div');
  back.className = 'backdrop';
  const box = document.createElement('div');
  box.className = 'picker modal';
  box.style.width = '380px';
  const shut = () => { back.remove(); box.remove(); };
  back.onmousedown = shut;
  const h = document.createElement('div');
  h.className = 'phead';
  h.textContent = 'Grid \u00b7 ' + MI.name;
  const form = document.createElement('div');
  form.className = 'gridform';
  const field = (label, val) => {
    const l = document.createElement('label'); l.textContent = label;
    const i = document.createElement('input');
    i.type = 'number'; i.value = String(val);
    form.appendChild(l); form.appendChild(i);
    return i;
  };
  const rows = field('rows', S.rows);
  const cols = field('columns', S.columns);
  const cw = field('cell width', S.cellSize[0]);
  const ch = field('cell height', S.cellSize[1]);
  const sx = field('spacing x', S.cellSpacing[0]);
  const sy = field('spacing y', S.cellSpacing[1]);
  const note = document.createElement('div');
  note.className = 'hint wide';
  // CELLS, NOT ENTRIES, as the footer counts them (drawGeom): a slot block is
  // several entries in one cell, and counting entries said one too few spare
  // per extra member - on a full grid, that some would not fit.
  const say = () => {
    const total = (parseInt(rows.value, 10) || 0) * (parseInt(cols.value, 10) || 0);
    const used = gridCellCount();
    note.innerHTML = total + ' cells, ' + plural(used, 'cell') + ' in use \u2014 '
      + (total < used
        ? '<b style="color:var(--warn)">' + (used - total)
          + ' would not fit and the engine could not reach them</b>'
        : (total - used) + ' spare');
  };
  for (const i of [rows, cols]) i.oninput = say;
  say();
  form.appendChild(note);
  const row = document.createElement('div');
  row.className = 'prow';
  const cancel = document.createElement('button');
  cancel.textContent = 'Cancel'; cancel.onclick = shut;
  const ok = document.createElement('button');
  ok.textContent = 'Apply'; ok.className = 'primary';
  ok.onclick = async () => {
    const body = {
      rows: parseInt(rows.value, 10), columns: parseInt(cols.value, 10),
      cellSize: [parseInt(cw.value, 10), parseInt(ch.value, 10)],
      cellSpacing: [parseInt(sx.value, 10), parseInt(sy.value, 10)],
    };
    const r = await (await fetch('/api/motif-grid', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })).json();
    if (r.error) { log('ERROR ' + r.error); return; }
    shut();
    // THE VALUES WRITTEN, not the ones typed: the server keeps rows and
    // columns to 1-64, a cell to 1-512 and spacing to 0-512 (r.set is what
    // went into the file), and typing 100 rows used to log "100" for a 64.
    const set = r.set || {};
    const two = (s, asked) => (typeof s === 'string' ? s.split(',').map(Number) : asked);
    const got = {
      rows: set.rows !== undefined ? Number(set.rows) : body.rows,
      columns: set.columns !== undefined ? Number(set.columns) : body.columns,
      cellSize: two(set['cell.size'], body.cellSize),
      cellSpacing: two(set['cell.spacing'], body.cellSpacing),
    };
    const moved = [];
    const bound = (what, asked, wrote) => {
      if (asked !== wrote) moved.push(what + ' ' + (wrote < asked ? 'capped at ' : 'raised to ') + wrote);
    };
    bound('rows', body.rows, got.rows);
    bound('columns', body.columns, got.columns);
    bound('cell width', body.cellSize[0], got.cellSize[0]);
    bound('cell height', body.cellSize[1], got.cellSize[1]);
    bound('spacing x', body.cellSpacing[0], got.cellSpacing[0]);
    bound('spacing y', body.cellSpacing[1], got.cellSpacing[1]);
    log('Grid is now ' + got.rows + '×' + got.columns
      + ', cells ' + got.cellSize.join('×') + ', spacing ' + got.cellSpacing.join(',')
      + (moved.length ? ' (' + moved.join(', ') + ')' : ''), true);
    Session.record('grid ' + got.rows + '×' + got.columns + ' on ' + MI.name);
    await load(true);
  };
  row.appendChild(cancel); row.appendChild(ok);
  box.appendChild(h); box.appendChild(form); box.appendChild(row);
  document.body.appendChild(back); document.body.appendChild(box);
  rows.focus(); rows.select();
}

// A LARGER WINDOW FOR ONE LONG VALUE. Format rewrites the condition one clause
// per top-level and/or, which is the only thing that makes a long unlock
// readable - and is safe because it only touches whitespace.
function bigEdit(title, value, onSave) {
  const back = document.createElement('div');
  back.className = 'backdrop';
  const box = document.createElement('div');
  box.className = 'picker modal';
  box.style.width = '560px';
  const shut = () => { back.remove(); box.remove(); };
  back.onmousedown = shut;
  const h = document.createElement('div');
  h.className = 'phead'; h.textContent = title;
  const ta = document.createElement('textarea');
  ta.value = value || '';
  ta.style.cssText = 'margin:8px;min-height:220px;background:#0d0d12;color:var(--ink);'
    + 'border:1px solid var(--line);border-radius:4px;font:inherit;padding:8px;resize:vertical';
  const row = document.createElement('div');
  row.className = 'prow';
  const fmt = document.createElement('button');
  fmt.textContent = 'Format';
  fmt.className = 'left';
  fmt.title = 'Re-format: one clause per top-level and/or';
  fmt.onclick = () => {
    // Only split on and/or OUTSIDE brackets and quotes; a condition like
    // f(a and b) must stay on one line.
    const src = ta.value.replace(/\s+/g, ' ').trim();
    let depth = 0, quote = '', out = '';
    for (let i = 0; i < src.length; i++) {
      const ch = src[i];
      if (quote) { out += ch; if (ch === quote && src[i - 1] !== '\\') quote = ''; continue; }
      if (ch === '"' || ch === "'") { quote = ch; out += ch; continue; }
      if (ch === '(' || ch === '[' || ch === '{') depth++;
      if (ch === ')' || ch === ']' || ch === '}') depth--;
      if (!depth) {
        const rest = src.slice(i);
        const m = /^(and|or)\b/i.exec(rest);
        if (m && /\s$/.test(out)) { out = out.replace(/\s+$/, '') + '\n' + m[1] + ' '; i += m[1].length; continue; }
      }
      out += ch;
    }
    ta.value = out;
  };
  const cancel = document.createElement('button');
  cancel.textContent = 'Cancel'; cancel.onclick = shut;
  const ok = document.createElement('button');
  ok.textContent = 'OK'; ok.className = 'primary';
  // The value goes back on ONE line: select.def is line-based, and the engine
  // reads unlock to end-of-line.
  ok.onclick = () => { shut(); onSave(ta.value.replace(/\s+/g, ' ').trim()); };
  row.appendChild(fmt); row.appendChild(cancel); row.appendChild(ok);
  box.appendChild(h); box.appendChild(ta); box.appendChild(row);
  document.body.appendChild(back); document.body.appendChild(box);
  ta.focus();
}

// THE PANEL'S LISTENERS ARE BOUND ONCE, not per render.
//
// #ins is never replaced - only its innerHTML is - so a listener added inside
// drawInspector survived every redraw and a new one was added on top. After
// looking at eleven characters there were eleven change listeners, each closed
// over the character it was created for, and a single edit marked all eleven as
// having unapplied changes. One binding, pointed at whatever the current panel
// wants, cannot accumulate.
let CURRENT_TOUCH = null;
{
  const ins = $('#ins');
  const fire = () => { if (CURRENT_TOUCH) CURRENT_TOUCH(); };
  ins.addEventListener('input', fire);
  ins.addEventListener('change', fire);
  // Adding or removing a music track or a custom row is an edit too, and those
  // fire neither input nor change on the container.
  ins.addEventListener('click', (e) => {
    if (e.target.closest('.mbtn, .kvrow button, #addParam')) setTimeout(fire, 0);
  });
}

// UNAPPLIED EDITS SURVIVE A REDRAW, keyed by character.
//
// The inspector is rebuilt on every selection change, every grid redraw and
// every reload, and it was rebuilt from the SAVED values - so typing into a
// field and then clicking anything threw the edit away AND cleared the flag
// that said there was one. Revert went gray with the work still undone, which
// is the opposite of recording everything.
//
// A character's in-progress payload is held here until it is applied or
// reverted, and the form is rebuilt from it rather than from disk.
const PENDING = new Map();
// ...AND ONLY WHAT WAS EDITED IN IT. A payload is the whole form, and Apply
// (or Save and exit) sends all of it. After an immediate edit to the same
// character - a drop in the Stages tree, Use for, Clear stage, an Order drop,
// an Undo - the payload still held the value from before it: the form showed
// that, and Apply quietly wrote it back. So each payload remembers the saved
// values it was drawn against, and every load (rebasePending) moves the
// fields the form left alone to what the disk says now.
const PENDING_BASE = new WeakMap();   // payload -> the saved props it was drawn against

// The fields the form actually renders. gather() returns exactly these plus
// `params`, so a saved payload and a gathered one can be compared directly.
const FORM_KEYS = ['stage', 'music', 'order', 'ordersurvival', 'ai', 'hidden', 'includestage'];

// A stable serialization of a props payload. Sorted keys, empty params dropped,
// so key order and no-op values cannot make an untouched form look edited.
function printOf(src) {
  const o = src || {};
  const ps = {};
  const sp = (o.params && typeof o.params === 'object') ? o.params : {};
  for (const k of Object.keys(sp).sort()) {
    const v = sp[k];
    if (v === '' || v === undefined || v === null) continue;
    ps[k] = v;
  }
  return JSON.stringify(FORM_KEYS.map((k) => [k, String(o[k] == null ? '' : o[k])]))
    + '|' + JSON.stringify(ps);
}

// A field the form left alone (payload = base) takes the disk's value when
// the disk moved; a field typed into keeps the typing. A payload left equal
// to the disk is no edit at all.
function rebasePending() {
  if (!PENDING.size || !MI || MI.error) return;
  const disk = new Map();
  for (const c of (MI.cells || []).concat(MI.offGrid || [])) {
    if (c && c.char && !disk.has(lc(c.char))) disk.set(lc(c.char), c.props || {});
  }
  const norm = (v) => (v == null ? '' : Array.isArray(v) ? JSON.stringify(v.map(String)) : String(v));
  let dropped = false;
  for (const [id, pend] of Array.from(PENDING)) {
    const base = PENDING_BASE.get(pend), now = disk.get(lc(id));
    if (!base || !now) continue;
    for (const k of FORM_KEYS) {
      if (norm(pend[k]) === norm(base[k]) && norm(now[k]) !== norm(base[k])) pend[k] = norm(now[k]);
    }
    const pp = pend.params || (pend.params = {});
    const bp = base.params || {}, np = now.params || {};
    for (const k of new Set(Object.keys(bp).concat(Object.keys(np)))) {
      if (norm(pp[k]) !== norm(bp[k]) || norm(np[k]) === norm(bp[k])) continue;
      if (np[k] == null || np[k] === '') delete pp[k];
      else pp[k] = Array.isArray(np[k]) ? np[k].slice() : np[k];
    }
    const saved = Object.assign({}, now, { params: now.params || {} });
    if (printOf(pend) === printOf(saved)) { PENDING.delete(id); dropped = true; }
    else PENDING_BASE.set(pend, saved);
  }
  if (dropped) Session.formTouched = PENDING.size ? PENDING.size + ' character(s) with property edits' : null;
}

// Which property blocks are folded. Session-scoped, so it survives a redraw.
// Shut by default: both are tall, and most of the time you are placing
// characters rather than inspecting one's colors.
const BLK_SHUT = new Set(['blkAdv', 'blkCustom']);

// One-field dialog. `onShut` runs whenever it closes, saved or not.
function modal(title, hint, value, onSave, onShut) {
  const back = document.createElement('div');
  back.className = 'backdrop';
  const box = document.createElement('div');
  box.className = 'picker modal';
  const shut = () => { back.remove(); box.remove(); if (onShut) onShut(); };
  back.onmousedown = shut;
  const h = document.createElement('div');
  h.className = 'phead'; h.textContent = title;
  const p2 = document.createElement('div');
  p2.className = 'hint'; p2.style.margin = '8px 10px 0'; p2.textContent = hint;
  const inp = document.createElement('input');
  inp.value = value || '';
  const row = document.createElement('div');
  row.className = 'prow';
  const cancel = document.createElement('button');
  cancel.textContent = 'Cancel'; cancel.onclick = shut;
  const ok = document.createElement('button');
  ok.textContent = 'Save'; ok.className = 'primary';
  ok.onclick = () => { shut(); onSave(inp.value); };
  inp.onkeydown = (e) => { if (e.key === 'Enter') ok.onclick(); if (e.key === 'Escape') shut(); };
  row.appendChild(cancel); row.appendChild(ok);
  box.appendChild(h); box.appendChild(p2); box.appendChild(inp); box.appendChild(row);
  document.body.appendChild(back); document.body.appendChild(box);
  inp.focus(); inp.select();
}

// THE SLOT SECTION, stacked above properties in the right column.
//
// Not a window: it must not cover the grid, and it is independent of the
// properties below it - the slot being inspected is often not the character
// whose properties are open. These three keys only mean anything inside a
// block, being how a player picks WHICH member they get, so this is the only
// place they belong. They are ENGINE BUTTONS rather than keyboard keys, and
// which key each is depends on the build, so the hint names none.
function slotPanel(i, members) {
  const pane = $('#slotPane');
  const list = $('#slotBody');
  $('#slothead').textContent = 'Slot @ cell ' + i + ' \u00b7 ' + members.length + ' variant'
    + (members.length === 1 ? '' : 's');
  pane.hidden = false;
  $('#splitSlot').hidden = false;
  syncRightColumn();
  list.innerHTML = '';
  SLOT_OPEN = i;
  drawGrid();          // the marked cell follows which slot is open
  const fields = [];
  for (const m of members) {
    const card = document.createElement('div');
    card.className = 'slotmem';
    const top = document.createElement('div');
    top.className = 'top';
    const im = new Image();
    im.src = portraitSrc(m.char, palOf(m.char));
    im.onerror = () => { im.style.visibility = 'hidden'; };
    const nm = document.createElement('div');
    nm.className = 'nm'; nm.textContent = m.displayName;
    top.appendChild(im); top.appendChild(nm);
    card.appendChild(top);
    const pr = m.props || {};
    for (const [label, key] of [['select', 'select_'], ['next', 'next'], ['previous', 'previous']]) {
      const row = document.createElement('div');
      row.className = 'fld';
      const l = document.createElement('label');
      l.textContent = label;
      const inp = document.createElement('input');
      inp.value = pr[key] || '';
      inp.placeholder = '\u2013';
      fields.push({ char: m.char, key, inp, was: pr[key] || '' });
      row.appendChild(l); row.appendChild(inp);
      card.appendChild(row);
    }
    list.appendChild(card);
  }
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = 'Engine buttons, not keyboard keys - which key each is depends on the '
    + 'build. No comma in a value, and every member needs the same key or none.';
  list.appendChild(hint);
  const save = document.createElement('button');
  save.textContent = 'Save slot commands';
  save.className = 'primary';
  save.style.cssText = 'width:100%;margin-top:6px';
  save.onclick = async () => {
    const changed = fields.filter((f) => f.inp.value.trim() !== f.was);
    if (!changed.length) { closeSlotPane(); return; }
    // One post per member whose commands actually moved.
    const byChar = new Map();
    for (const f of changed) {
      if (!byChar.has(f.char)) byChar.set(f.char, {});
      byChar.get(f.char)[f.key] = f.inp.value.trim();
    }
    for (const [char, patch] of byChar) {
      const m = members.find((v) => v.char === char) || {};
      const props = Object.assign({}, m.props || {}, patch);
      const r = await (await fetch('/api/char-props', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mountAs: char, props }),
      })).json();
      if (r.error) { log('ERROR ' + r.error); return; }
    }
    log('Slot commands saved for ' + [...byChar.keys()].join(', '), true);
    Session.record('slot commands @ cell ' + i);
    await load(true);
    // The cell survives the reload, so the section stays on the same slot.
    if (CELLS.some((c) => c.index === i && c.slot)) showSlotMembers(i);
  };
  list.appendChild(save);
}

// Which cell the slot section is showing, or null when it is closed.
let SLOT_OPEN = null;
function closeSlotPane() {
  const was = SLOT_OPEN;
  SLOT_OPEN = null;
  const pane = $('#slotPane');
  if (pane) pane.hidden = true;
  const sp = $('#splitSlot');
  if (sp) sp.hidden = true;
  syncRightColumn();
  if (was !== null) drawGrid();   // take the marching border back off
}
