// AN EMPTY COLUMN TAKES NO WIDTH. With both sections closed the right side was
// a few hundred pixels of nothing next to a preview that could have used them,
// and its drag handle still sat there resizing emptiness. The width the user
// last chose is remembered, so reopening a section gives back the column they
// had rather than a default.
let RIGHT_WIDTH = '290px';
function syncRightColumn() {
  const main = document.querySelector('main');
  const slotOpen = !$('#slotPane').hidden;
  const propsOpen = !$('#inspector').hidden;
  const any = slotOpen || propsOpen;
  const cur = getComputedStyle(main).getPropertyValue('--right').trim();
  if (!any) {
    if (cur && parseFloat(cur) > 8) RIGHT_WIDTH = cur;
    main.style.setProperty('--right', '0px');
  } else if (parseFloat(cur) < 8) {
    main.style.setProperty('--right', RIGHT_WIDTH);
  }
  $('#splitR').hidden = !any;
  refit();
}

// Select the cell holding a character and flash it, so the eye lands on it in a
// grid too large to scan.
function findOnGrid(id) {
  const cell = CELLS.find((x) => x.kind === 'char' && lc(x.char) === lc(id));
  if (!cell) { log(id + ' is not on the grid'); return; }
  sel = cell.index;
  drawGrid(); drawInspector();
  if (!flashCell(cell.index)) return;
  log('Found ' + cell.displayName + ' at row ' + (cell.row + 1) + ', col ' + (cell.col + 1));
}
// Scroll cell i into the middle of the stage and flash it. False when the
// grid draws no such cell (one past its end).
function flashCell(i) {
  const el = [...document.querySelectorAll('.cell')].find((e) => +e.dataset.i === i);
  if (!el) return false;
  const st = $('.stage'), sr = st.getBoundingClientRect(), r = el.getBoundingClientRect();
  st.scrollTop += (r.y - sr.y) - (sr.height / 2 - r.height / 2);
  st.scrollLeft += (r.x - sr.x) - (sr.width / 2 - r.width / 2);
  el.classList.add('found');
  setTimeout(() => el.classList.remove('found'), 1600);
  return true;
}

async function openFolderById(id) {
  const r = await (await fetch('/api/open-folder', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ char: id }),
  })).json();
  if (r.error) { log('ERROR ' + r.error); return; }
  log('Opened ' + r.dir);
}

// Put `entry` in cell i, padding with skipslots if the cell is past the end of
// the roster. The one place that knows how a cell address becomes a position in
// the flat order[] list.
function setCellEntry(i, entry) {
  const span = orderIndexOfCell(i);
  if (span) order.splice(span.start, span.end - span.start, entry);
  else { padTo(i); order.push(entry); }
}

// WHERE EACH CHARACTER OF THE BUILD IS, keyed by lowercased id, read from
// order[] so it is right in the middle of an edit. Each id has EVERY place he
// is, in list order: a character can be in the build twice (a cell of his own
// and a slot's member, or two cells), and keeping only the first let Replace…
// on the second copy's cell go by the first. A place is
//   {cell, at, shared, past}  on the list: his cell, his index in order[],
//                             whether a slot shares the cell with others,
//                             and whether the cell lies past the grid's last
//   {off: true}               in the build but off the grid (exclude = 1)
function buildPlaces() {
  const total = MI.select.rows * MI.select.columns;
  const out = new Map();
  const add = (id, p) => { if (!out.has(lc(id))) out.set(lc(id), []); out.get(lc(id)).push(p); };
  let cell = 0;
  for (let k = 0; k < order.length;) {
    const start = k, e = order[k];
    if (e.slot && !e.kind) { while (k < order.length && order[k].slot === e.slot && !order[k].kind) k++; }
    else k++;
    for (let m = start; m < k; m++) {
      const id = order[m].char;
      if (id) add(id, { cell, at: m, shared: k - start > 1, past: cell >= total });
    }
    cell++;
  }
  for (const e of offGrid) if (e.char) add(e.char, { off: true });
  return out;
}
// His first place, which is the one Insert… and Replace… take him from.
function whereInBuild(id) { const l = buildPlaces().get(lc(id)); return l ? l[0] : null; }
// The picker's words for his places: every cell he is in, and "off the grid"
// for any off it. A cell past the grid's last is off the grid as well, which
// is what the footer calls it.
function placeWords(list) {
  const cells = [...new Set(list.filter((p) => !p.off && !p.past).map((p) => p.cell))];
  const words = [];
  if (cells.length) words.push((cells.length > 1 ? 'cells ' : 'cell ') + cells.join(', '));
  if (list.some((p) => p.off || p.past)) words.push('off the grid');
  return 'already in the build, ' + words.join(' and ');
}
// A character's display name: the grid's, else the library's, else the id.
function charName(id) {
  const c = CELLS.find((x) => x.char && lc(x.char) === lc(id))
    || ((LIB && LIB.chars) || []).find((x) => lc(x.id) === lc(id));
  return (c && c.displayName) || id;
}

// TAKE A CHARACTER OF THE BUILD OUT OF WHERE HE IS, and leave every other cell
// on its number: a cell he had to himself becomes an unused cell, a slot he
// shares keeps its other members, and one off the grid leaves that list
// (takeFromLibrary, which serves a character only in the library as well).
// `where` is the place to take him from (buildPlaces), his first by default.
// Answers the entry, ready to be put in a cell, the log's words on where he
// came from, and the unused cell he left when it is on the grid (`hole`),
// which is where the one a swap displaces goes.
function liftFromBuild(id, where) {
  const p = where || whereInBuild(id);
  if (!p || p.off) return { entry: takeFromLibrary(id), from: p ? ' from off the grid' : '', hole: null };
  const entry = order[p.at];
  let hole = null;
  if (p.shared) order.splice(p.at, 1);
  else { hole = { kind: 'dummy' }; order.splice(p.at, 1, hole); }
  entry.slot = '';
  return { entry, hole: p.past ? null : hole, from: p.past ? ' from past the last cell of the grid'
    : p.shared ? ' out of the slot in cell ' + p.cell
    : ' from cell ' + p.cell + ', now an unused cell' };
}

// --- the actions the cell menu offers ------------------------------------
// Insert… is a drop from the library (onDrop); one already in the build is
// moved here (its `lift`). A refusal goes back to the picker.
function cellInsert(i) {
  if (lockRefuses(i, 'filled')) return;
  pickCharacter('Insert into row ' + (Math.floor(i / MI.select.columns) + 1)
    + ', col ' + ((i % MI.select.columns) + 1),
  (c) => onDrop('lib:' + c.id, i, false, { lift: true }), 'Insert');
}

function cellReplace(i) {
  const info = cellAt(i);
  if (!info || info.kind !== 'char') return;
  if (lockRefuses(i, 'replaced')) return;
  pickCharacter('Replace ' + info.displayName, (c) => replaceWith(i, c), 'Replace');
}

// REPLACE X (cell i) WITH Y. One only in the library comes in as Replace
// always did, and X goes back to the library. One ALREADY IN THE BUILD used to
// be refused, in a log line the picker's backdrop covers, so the pick did
// nothing anyone could see. He now does what a drag of him would:
//   - his own cell on the grid, and X's cell no slot: the two SWAP, exactly as
//     a drag of his cell onto X's does in swap mode, whatever the preference;
//   - a slot he shares, off the grid (exclude = 1, or past the grid's last
//     cell), or X's cell a slot: he moves into X's cell and X goes back to the
//     library. A cell he had to himself is left as an unused cell, so nothing
//     after it shifts (liftFromBuild).
// With Preferences > Lock cells on, a locked cell on either side refuses it.
// Answers the reason for a refusal, which the picker shows. Either way it is
// one step.
function replaceWith(i, c) {
  const info = cellAt(i);
  const span = orderIndexOfCell(i);
  if (!info || info.kind !== 'char' || !span) return refused('Cell ' + i + ' holds no character to replace');
  const held = lockRefuses(i, 'replaced');
  if (held) return held;
  const X = info.displayName, Y = c.displayName;
  const slotCell = span.end - span.start > 1;
  // THIS CELL IS ASKED FIRST. He may be in it while whereInBuild names
  // another place: in the build twice, his first place is somewhere else. Going
  // by that one, Replace… on the second copy's cell pulled the first copy out
  // of its slot and dropped this cell's own without a word, or swapped the two
  // copies - nothing to see, and a step to undo. Alone in this cell he is
  // refused; one of its slot, that member is the one who stays.
  const mine = order.slice(span.start, span.end).find((e) => e.char && lc(e.char) === lc(c.id));
  if (mine && !slotCell) return refused(Y + ' is already in cell ' + i);
  const p = mine
    ? { cell: i, at: order.indexOf(mine), shared: true, past: i >= MI.select.rows * MI.select.columns }
    : whereInBuild(c.id);
  if (p && !p.off) {
    const heldHim = lockRefuses(p.cell, 'moved', Y);
    if (heldHim) return heldHim;
    if (!p.shared && !p.past && !slotCell) {
      return onDrop('cell:' + p.cell, i, false, {
        mode: 'swap',
        swapLog: 'Swapped ' + X + ' (cell ' + i + ') and ' + Y + ' (cell ' + p.cell + ')',
        swapStep: 'swapped ' + X + ' and ' + Y,
      });
    }
  }
  // Everyone the cell held but Y goes back: X, and a slot's other members.
  const back = order.slice(span.start, span.end)
    .filter((e) => e.char && lc(e.char) !== lc(c.id)).map((e) => charName(e.char));
  const l = liftFromBuild(c.id, p);
  setCellEntry(i, l.entry);
  trimTrailingHoles();
  log('Replaced ' + X + ' with ' + Y + l.from + (back.length ? ' (' + back.join(', ') + ' back in the library)' : ''), true);
  Session.record('replaced ' + X + ' with ' + Y, true);
  render(); drawInspector();
}

function cellSetKind(i, kind) {
  const info = cellAt(i);
  const gone = info && info.kind === 'char' ? info.displayName : null;
  if (lockRefuses(i, gone && kind === 'dummy' ? 'removed' : 'turned into another kind')) return;
  setCellEntry(i, { kind });
  trimTrailingHoles();
  const what = kind === 'random' ? 'random-select'
    : kind === 'dummy' ? 'an unused cell (the cursor can rest on it)'
    : 'a skipslot (the cursor jumps over it)';
  log('Cell ' + i + ' is now ' + what + (gone ? ' (' + gone + ' back in the library)' : ''), true);
  Session.record('cell ' + i + ' -> ' + what, true);
  if (kind === 'skip' || kind === 'dummy') sel = null;
  render(); drawInspector();
}

// A cell only becomes a "slot" once it has an id: members of one block must
// share it, and shift-drag then adds to the block rather than swapping.
function cellConvertToSlot(i) {
  const span = orderIndexOfCell(i);
  if (!span) return;
  if (lockRefuses(i, 'turned into a slot')) return;
  if (order[span.start].slot) { log('That cell is already a slot'); return; }
  const sid = 'g' + Date.now().toString(36);
  for (let k = span.start; k < span.end; k++) order[k].slot = sid;
  log('Cell ' + i + ' is a slot now - shift-drag characters onto it to add variants', true);
  Session.record('cell ' + i + ' converted to a slot', true);
  render(); drawInspector();
  showSlotMembers(i);
}

// exclude=1 keeps the character in the build - its files ship, for any other
// character that reads them - but takes it off the grid, and the engine gives
// its cell to the next character. So it leaves the grid for the library list,
// tagged "off grid"; dragging it back onto a cell includes it again. Different
// from Remove, which takes it out of the build.
async function cellToggleExclude(i) {
  const info = cellAt(i);
  if (!info || info.kind !== 'char') return;
  if (lockRefuses(i, 'taken off the grid')) return;
  const on = String((info.props || {}).exclude || '') !== '';
  const props = Object.assign({}, info.props || {}, { exclude: on ? '' : '1' });
  // LOCKED CELLS AFTER IT KEEP THEIR PLACES. Excluding gives this cell to the
  // next character and moves every later cell back by one - a locked one too,
  // since the server makes the edit and the page only reloads it. With Lock
  // cells on and a lock somewhere after this cell, the server is asked to
  // leave an unused cell where the character was instead (keepCell).
  const keepCell = !on && locksOn() && CELLS.some((c) => c.variant === 0 && c.index > i && cellHasLock(c.index));
  const r = await (await fetch('/api/char-props', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ mountAs: info.char, props }, keepCell ? { keepCell: true } : {})),
  })).json();
  if (r.error) { log('ERROR ' + r.error); return; }
  log(info.displayName + (on ? ' is back on the grid' : ' excluded from the grid')
    + (r.keptCell !== undefined ? '; cell ' + r.keptCell + ' is left as an unused cell, so the locked cells after it keep their places' : ''), true);
  Session.record((on ? 'included ' : 'excluded ') + info.displayName);
  await load(true);
}

async function cellOpenFolder(i) {
  const info = cellAt(i);
  if (!info || info.kind !== 'char') return;
  const r = await (await fetch('/api/open-folder', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ char: info.char }),
  })).json();
  if (r.error) { log('ERROR ' + r.error); return; }
  log('Opened ' + r.dir);
}

// How many cells the list currently spells out. Same walk as padTo: a slot
// block is one cell however many members it has.
// ---- STRANDED CHARACTERS -----------------------------------------------
//
// A character can end up in the roster at a cell the screenpack does not have.
// It is then in the build - so the library grays it out as "already in the
// build" and refuses it as a duplicate - while no cell is ever drawn for it, so
// there is nothing on the grid to drag either. Grayed because it is placed,
// invisible because it is not, and neither half reachable to fix the other.
//
// The add path can no longer create that state (modlib's placeInRoster fills an
// empty cell instead of appending), but SHRINKING THE GRID under a full roster
// still can, and an install that predates the fix can already be in it. So it is
// detected here, named, and offered a way out.
//
// `index` on a CELLS entry is the CELL index, which is what has to be compared -
// not the entry's position in order[], which runs ahead of it by one for every
// extra member of a multi-member slot.
function strandedCells() {
  if (!MI || !MI.select) return [];
  const total = MI.select.rows * MI.select.columns;
  return CELLS.filter((c) => c && c.variant === 0 && c.kind === 'char'
    && c.index >= total);
}

// THE FIRST FREE CELL ON THE GRID, for the paths that need somewhere to put a
// character and are not told where: Put back on the grid, Move into the grid,
// and a drop that has to make room. Free is an unused cell - a dummy, which
// means no character and no skip, so it is already a box the cursor walks over
// - or a cell past the end of the list, on the grid and not locked: the same
// cells modlib's placeInRoster fills when a character is added. A skipslot or
// a random-select cell is a deliberate choice by whoever laid the grid out and
// is not ours to overwrite...
//
// ...unless Preferences > Replace RandomSelect cells when no free cells
// available is on. Then, with no free cell at all, the first RandomSelect cell
// on the grid that is not locked takes the character instead.
//
// Read from order[] rather than CELLS, so it is right in the middle of an
// edit. Answers {cell, how: 'dummy' | 'end' | 'random'}, or null.
function firstFreeCell() {
  if (!MI || !MI.select) return null;
  const total = MI.select.rows * MI.select.columns;
  const cells = orderCells();
  const locked = (c) => locksOn() && c.some((e) => isLockOn(e.locked));
  const upTo = Math.min(total, cells.length);
  for (let k = 0; k < upTo; k++) {
    if (cells[k][0].kind === 'dummy' && !locked(cells[k])) return { cell: k, how: 'dummy' };
  }
  if (cells.length < total) return { cell: firstUsableCell(cells.length), how: 'end' };
  if (PREFS.dropReplaceRandom) {
    for (let k = 0; k < upTo; k++) {
      if (cells[k][0].kind === 'random' && !locked(cells[k])) return { cell: k, how: 'random' };
    }
  }
  return null;
}

// Where a character pushed out by a drop goes when the drop vacated nothing for
// him (he was displaced by one from the library, or by the first member lifted
// out of a slot): the end of the list, as always, while the end is still on the
// grid. Past that the end would strand him, so the first free cell takes him
// instead - and only with none at all does he go past the end, where the
// footer names him. Answers where he went, as firstFreeCell does, with
// 'beyond' for past the grid.
function parkEntry(entry) {
  const total = MI.select.rows * MI.select.columns;
  const n = gridCellCount();
  if (n < total) { order.push(entry); return { cell: n, how: 'end' }; }
  const room = firstFreeCell();
  if (room) { setCellEntry(room.cell, entry); return room; }
  order.push(entry);
  return { cell: n, how: 'beyond' };
}
// The log's word on where parkEntry put him, when it was not the plain end.
function parkedNote(entry, p) {
  if (!p || p.how === 'end') return '';
  if (p.how === 'beyond') return ' (' + entry.char + ' went past the last cell of the grid: every cell is taken)';
  return ' (' + entry.char + ' took ' + (p.how === 'random' ? 'the RandomSelect cell ' : 'the free cell ') + p.cell + ')';
}

function strandedNote(list) {
  if (!list.length) return '';
  // A display name comes out of someone else's .def and goes into innerHTML, so
  // it is escaped here rather than trusted. There is no page-wide esc(): the
  // three that exist are local to other functions and only handle quotes.
  const safe = (x) => String(x == null ? '' : x)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const names = list.map((c) => c.displayName || c.char);
  const shown = names.slice(0, 4).join(', ')
    + (names.length > 4 ? ' +' + (names.length - 4) + ' more' : '');
  return '  ·  <span class="over">off the grid: ' + safe(shown)
    + '</span> <button class="rescue" type="button">Move into the grid</button>';
}

// Reuses the drag path rather than touching order[] directly: onDrop() already
// knows about reserved ground, slot runs and the index shifting that happens
// when an entry is lifted out, and it re-renders synchronously - so CELLS is
// rebuilt before the next pass reads it.
//
// A RandomSelect cell (Preferences > Replace RandomSelect cells) is the one
// exception: a drop onto one TRADES places, which here would park the
// randomselect past the grid, so taking one replaces it outright. A locked
// character stays where he is (Preferences > Lock cells), off the grid or not.
function rescueStranded() {
  const moved = [];
  for (let guard = 0; guard < 500; guard++) {
    const s = strandedCells().filter((c) => !cellLocked(c.index));
    if (!s.length) break;
    const room = firstFreeCell();
    if (!room) break;
    const who = s[0];
    moved.push((who.displayName || who.char)
      + (room.how === 'random' ? ' (in the RandomSelect cell ' + room.cell + ')' : ''));
    if (room.how === 'random') {
      const span = orderIndexOfCell(who.index);
      const m = order.splice(span.start, 1)[0];
      m.slot = '';
      setCellEntry(room.cell, m);
      trimTrailingHoles();
      Session.record('put ' + m.char + ' in the RandomSelect cell ' + room.cell, true);
      render();
    } else {
      onDrop('cell:' + who.index, room.cell);
    }
  }
  const all = strandedCells();
  const held = all.filter((c) => cellLocked(c.index));
  const left = all.filter((c) => !cellLocked(c.index));
  if (moved.length) log('Moved onto the grid: ' + moved.join(', '), true);
  if (left.length) {
    const total = MI.select.rows * MI.select.columns;
    const randoms = !PREFS.dropReplaceRandom
      && CELLS.some((c) => c.variant === 0 && c.kind === 'random' && c.index < total);
    log(left.length + ' still off the grid ('
      + left.map((c) => c.displayName || c.char).join(', ')
      + ') — every cell is taken. Give the grid more rows or columns, or free a cell.'
      + (randoms ? ' Preferences › Replace RandomSelect cells when no free cells available'
        + ' would let them take the RandomSelect cells.' : ''));
  }
  if (held.length) {
    log(held.map((c) => c.displayName || c.char).join(', ')
      + (held.length === 1 ? ' is' : ' are') + ' locked, so left off the grid.');
  }
  if (!moved.length && !left.length && !held.length) log('Nothing is off the grid.');
}

function gridCellCount() {
  let n = 0;
  for (let k = 0; k < order.length;) {
    const e = order[k];
    if (e.slot && !e.kind) { const sid = e.slot; while (k < order.length && order[k].slot === sid && !order[k].kind) k++; }
    else k++;
    n++;
  }
  return n;
}


// Fill runs low-to-high so padTo only ever extends the list.
//
// FOUR SCOPES, because 'the rest of this row' and 'everything' were the only
// two and neither is what you want when a screenpack reserves a column.
// A column fill has a cost the other three do not: the list is flat, so
// reaching cell 40 means cells 1-39 have to exist. Those get written as
// skipslots on the way and the log says how many, rather than the grid
// quietly growing.
function cellFill(from, kind, scope) {
  const cols = MI.select.columns, rows = MI.select.rows, total = rows * cols;
  const targets = [];
  if (scope === 'row') { const end = (Math.floor(from / cols) + 1) * cols; for (let i = from; i < end; i++) targets.push(i); }
  else if (scope === 'col') { for (let i = from; i < total; i += cols) targets.push(i); }
  else if (scope === 'empty') { for (let i = 0; i < total; i++) targets.push(i); }
  else { for (let i = from; i < total; i++) targets.push(i); }

  const before = gridCellCount();
  let n = 0, beyond = 0, kept = 0;
  for (const i of targets) {
    const info = cellAt(i);
    if (info && info.kind === 'char') continue;   // never overwrite a character
    if (info && info.kind === kind) continue;
    // Nor a locked cell, while Lock cells is on: it stays what it is.
    if (cellLocked(i)) { kept++; continue; }
    if (i >= before) beyond++;
    setCellEntry(i, { kind });
    n++;
  }
  const padded = Math.max(0, (gridCellCount() - before) - beyond);
  const what = kind === 'random' ? 'random-select'
    : kind === 'dummy' ? 'unused cell' : 'skipslot';
  log('Filled ' + n + ' cell(s) with ' + what
    + (padded ? ' (+' + padded + ' unused cell(s) written to reach them)' : '')
    + (kept ? '; ' + kept + ' locked cell(s) left as they are' : ''), true);
  if (n) Session.record('filled ' + n + ' cell(s) with ' + what, true);
  render(); drawInspector();
}

// Every member of a slot, with the per-member commands that pick it.
function showSlotMembers(i) {
  const members = variantsAt(i);
  if (!members.length) return;
  slotPanel(i, members);
}

// The two menus, which differ by what the cell holds. A SLOT is a third shape
// again: its members are the thing you act on, so it offers "View chars in
// slot" in place of Replace/Remove, which would be ambiguous across members.
// HOW MANY ROWS THE SCREENPACK ACTUALLY DESCRIBES.
//
// A pack can give each row its own size and spacing through `cell.*-N` blocks,
// and only rows below that count follow the perspective; the rest fall back to
// the flat `cell.bg.scale`. Returns 0 for a pack that describes none, which is
// most of them - there the concept does not apply and the menu leaves it out.
function describedRows() {
  const ov = (MI.select && MI.select.rows_) || {};
  const keys = Object.keys(ov).map(Number).filter((n) => Number.isFinite(n));
  return keys.length ? Math.max.apply(null, keys) + 1 : 0;
}

// WHAT SHAPE THE SCREENPACK ITSELF ASKS FOR, if it ships one.
//
// Loaded once per motif and cached, because the menu has to know whether to
// offer the import before it is opened. null means "asked and there is none".
let THEMELAYOUT, themeLayoutFor;
function ensureThemeLayout() {
  const folder = (MI && MI.motif || '').split('/')[0];
  if (!folder || themeLayoutFor === folder) return;
  themeLayoutFor = folder;
  THEMELAYOUT = null;
  // fromSystemDef: a pack with no select.def can still mark the cells its art
  // covers in its system.def (0.99 `cell.C.R.skip`, Infinite Legacy X), and the
  // answer says which source it read (`source`).
  fetch('/api/theme-layout?folder=' + encodeURIComponent(folder) + '&fromSystemDef=1')
    .then((r) => (r.ok ? r.json() : null))
    .then((j) => { if (themeLayoutFor === folder) THEMELAYOUT = j; })
    .catch(() => { /* a pack with no layout is the normal case */ });
}

// TAKE THE SCREENPACK'S OWN SLOT LAYOUT.
//
// A screenpack decides which cells are usable, and some reserve whole blocks -
// LEGACY keeps the area behind each big portrait panel clear. Nothing in the
// roster knows that, so characters land underneath the artwork. This reads the
// pack's own select.def and rearranges the build to match: same characters,
// same order, same settings, different cells.
//
// IT IS AN OVERRIDE, LOCKS INCLUDED: every cell is rearranged, and the pack's
// own reserved and random cells replace the build's placeholders. So with
// Preferences > Lock cells on and cells locked, it says how many will move
// and asks first.
async function useThemeLayout() {
  const folder = (MI.motif || '').split('/')[0];
  const locked = locksOn() ? CELLS.filter((c) => c.variant === 0 && cellHasLock(c.index)).length : 0;
  if (locked) {
    const go = await choose('Use this screenpack’s slot layout', [
      'Rearranging the build into ' + (MI.name || 'the screenpack') + '’s own layout moves every cell, including your '
        + plural(locked, 'locked cell') + ': the layout does not keep locks in place.',
      'Locked characters keep their locks in their new cells; locked empty and random cells are replaced by the pack’s own.',
    ], [{ label: 'Rearrange', value: true, primary: true }, { label: 'Cancel', value: false }], false);
    if (!go) return;
  }
  const r = await (await fetch('/api/theme-layout', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ folder, fromSystemDef: !!(THEMELAYOUT && THEMELAYOUT.source === 'system.def') }),
  })).json();
  if (r.error) { log('ERROR ' + r.error); return; }
  log('Took ' + MI.name + '\u2019s own layout \u2014 ' + r.holesPlaced + ' reserved cell'
    + (r.holesPlaced === 1 ? '' : 's') + ', ' + r.placedGroups + ' character'
    + (r.placedGroups === 1 ? '' : 's') + ' placed'
    + (r.leftOver ? ', ' + r.leftOver + ' left after the end' : '')
    + (r.randoms ? ', ' + r.randoms + ' random slot' + (r.randoms === 1 ? '' : 's') : '')
    + (r.flooded ? ' (its ' + r.randomCount + ' randomselect cells were the author'
      + '\u2019s way of bounding the grid, so they are free cells rather than '
      + r.randomCount + ' random slots)' : ''), true);
  Session.record('took ' + MI.name + '\u2019s slot layout');
  await load(true);
}

// THE SCREENPACK'S ITEMS, shared by the stage menu and the cell menu.
//
// On both, because the stage menu alone is not reachable on every pack:
// LEGACY's grid is 13x24 and covers nearly the whole stage, so there is almost
// no bare background left to right-click - which is exactly how this came to be
// invisible in the first place.
function screenpackItems() {
  const out = [{ label: 'Grid\u2026', run: () => editGrid() }];
  const L = THEMELAYOUT;
  // Worth offering only when the pack reserves something AND leaves somewhere
  // to put a character.
  if (L && L.holes > 0 && L.usable > 0) {
    out.push({ sep: true });
    out.push({
      label: 'Use this screenpack\u2019s slot layout \u2014 ' + L.usable
        + ' slots, ' + L.holes + ' reserved'
        + (L.randoms ? ', ' + L.randoms + ' random' : ''),
      run: () => useThemeLayout(),
    });
  }
  return out;
}

// THE SCREENPACK'S OWN MENU - right-click the stage, off any cell.
//
// Everything here edits the .def rather than the roster. Revert covers it: the
// session baseline holds the motif file's bytes as well as the build order.
function buildStageMenu() {
  const S = MI.select, described = describedRows();
  const items = [{ header: MI.name || 'Screenpack' }];
  for (const it of screenpackItems()) items.push(it);
  if (described) {
    items.push({ sep: true });
    const missing = S.rows - described;
    items.push(missing > 0
      ? {
        label: 'Describe row' + (missing > 1 ? 's ' : ' ')
          + (missing > 1 ? (described + 1) + '–' + S.rows : String(S.rows))
          + ' in perspective',
        run: () => describeRows(),
      }
      : { label: 'All ' + S.rows + ' rows are described', off: true });
  }
  return items;
}

// Continue the pack's ramp over the rows it never described.
//
// This is deliberately NOT done when the grid grows. A row past the last block
// draws flat because that is what the engine draws - the same band VSelect
// shows - and rewriting the author's screenpack to hide it would make the
// preview a worse guide to the build, not a better one. So it is asked for.
async function describeRows() {
  const r = await (await fetch('/api/motif-describe-rows', { method: 'POST' })).json();
  if (r.error) { log('ERROR ' + r.error); return; }
  if (!r.rowsAdded) { log('Every row is already described'); return; }
  log('Described ' + r.rowsAdded + ' row' + (r.rowsAdded > 1 ? 's' : '')
    + " in the screenpack, continuing this grid's perspective", true);
  Session.record('described ' + r.rowsAdded + ' row'
    + (r.rowsAdded > 1 ? 's' : '') + ' on ' + MI.name);
  await load(true);
}

function buildCellMenu(i) {
  const info = cellAt(i);
  const occupied = !!(info && info.kind === 'char');
  const isSlot = occupied && info.variants > 1;
  // PREFERENCES > LOCK CELLS. While it is on, every cell's menu can lock or
  // unlock it, and a locked cell offers nothing that would change or move it:
  // those items are grayed, and hovering one says why. While it is off the
  // item is not there at all, as VSelect hides it rather than graying it.
  const lockUi = locksOn();
  const lk = lockUi && cellHasLock(i);
  const why = lk ? 'This cell is locked. Choose Unlock cell first.' : undefined;
  const lockItem = { label: lk ? 'Unlock cell' : 'Lock cell', run: () => cellToggleLock(i) };
  const items = [{ header: cellLabel(info, i) }];
  items.push({ label: 'Insert\u2026', off: occupied || lk, title: why, run: () => cellInsert(i) });
  if (isSlot) {
    items.push({ label: 'View chars in slot\u2026', run: () => showSlotMembers(i) });
    items.push({ sep: true });
    items.push({ label: 'Open containing folder', run: () => cellOpenFolder(i) });
    items.push({ sep: true });
    if (lockUi) items.push(lockItem);
    items.push({ label: 'Properties\u2026', run: () => openProperties(i) });
    return items;
  }
  items.push({ label: 'Replace\u2026', off: !occupied || lk, title: why, run: () => cellReplace(i) });
  // Removing a character leaves the cell EMPTY, not walled off. It used to
  // leave a skipslot, so taking someone out of the middle of a roster put a
  // hole the cursor could not cross where a person used to be.
  items.push({ label: 'Remove', off: !occupied || lk, title: why, run: () => cellSetKind(i, 'dummy') });
  if (occupied) {
    items.push({ sep: true });
    items.push({ label: 'Open containing folder', run: () => cellOpenFolder(i) });
  } else {
    // THE THREE THINGS AN EMPTY CELL CAN BE, one click each. Until now the
    // only single-cell action here was RandomSelect: making one cell a
    // skipslot meant filling a whole row or the whole grid with them.
    items.push({ label: 'RandomSelect', off: !!(info && info.kind === 'random') || lk, title: why,
                 run: () => cellSetKind(i, 'random') });
    // UNUSED IS A KIND NOW, not a truncation. `dummyslot` is the engine's own
    // keyword for an empty cell that still accepts the cursor, so it can be set
    // on ANY cell rather than only on the tail - which is what made this grayed
    // out on a row with characters after it.
    items.push({ label: 'Unused cell \u2014 cursor can rest on it',
                 off: !!(info && info.kind === 'dummy') || lk, title: why,
                 run: () => cellSetKind(i, 'dummy') });
    items.push({ label: 'Skipslot \u2014 cursor jumps over it',
                 off: !!(info && info.kind === 'skip') || lk, title: why,
                 run: () => cellSetKind(i, 'skip') });
    // "Shorten the grid to here" WAS here and has been removed. It truncated
    // the list at this cell, which was the only way to get cells the cursor
    // could enter back when padding meant skipslots. It now changes nothing
    // anyone can observe: a trailing dummyslot and a cell with no entry look
    // the same, behave the same, and produce the SAME select.def, because
    // buildCharacterLines trims trailing placeholders of both kinds. Verified
    // byte-identical. All it did was mark the file dirty and invite a save for
    // no reason.
    const scopes = (kind) => [
      { label: 'Rest of this row', run: () => cellFill(i, kind, 'row') },
      { label: 'Rest of this column', run: () => cellFill(i, kind, 'col') },
      { sep: true },
      { label: 'All cells from here', run: () => cellFill(i, kind, 'grid') },
      { label: 'Every empty cell in the grid', run: () => cellFill(i, kind, 'empty') },
    ];
    items.push({ label: 'Fill with unused cells', sub: scopes('dummy') });
    items.push({ label: 'Fill with skipslot', sub: scopes('skip') });
    items.push({ label: 'Fill with RandomSelect', sub: scopes('random') });
  }
  // Row and column edits act on the cell you opened the menu on.
  const S2 = MI.select;
  const rowOf = Math.floor(i / S2.columns), colOf = i % S2.columns;
  // A row or column is not deleted while a lock is in the way (rowDeleteBlock).
  const rowLk = lockUi ? rowDeleteBlock(rowOf) : null;
  const colLk = lockUi ? colDeleteBlock(colOf) : null;
  items.push({ sep: true });
  items.push({ label: 'Row ' + (rowOf + 1), sub: [
    { label: 'Insert a row above', run: () => insertRow(rowOf) },
    { label: 'Insert a row below', run: () => insertRow(rowOf + 1) },
    { sep: true },
    { label: 'Delete this row', off: S2.rows <= 1 || rowLk,
      title: rowLk ? lockedWhy(rowLk.cell, rowLk.what) : undefined,
      run: () => deleteRow(rowOf) },
  ] });
  items.push({ label: 'Column ' + (colOf + 1), sub: [
    { label: 'Insert a column left', run: () => insertColumn(colOf) },
    { label: 'Insert a column right', run: () => insertColumn(colOf + 1) },
    { sep: true },
    { label: 'Delete this column', off: S2.columns <= 1 || colLk,
      title: colLk ? lockedWhy(colLk.cell, colLk.what) : undefined,
      run: () => deleteColumn(colOf) },
  ] });
  items.push({ sep: true });
  // The screenpack's own actions, reachable without hunting for a patch of
  // bare stage - on a 13x24 grid there is barely any, which is how the layout
  // import came to be invisible.
  items.push({ label: MI.name || 'Screenpack', sub: screenpackItems() });
  items.push({ sep: true });
  if (lockUi) items.push(lockItem);
  items.push({ label: 'Properties\u2026', run: () => openProperties(i) });
  if (occupied) {
    items.push({ sep: true });
    items.push({ label: 'Convert to slot',
                 off: !!info.slot || lk, title: why,
                 run: () => cellConvertToSlot(i) });
    const ex = String((info.props || {}).exclude || '') !== '';
    items.push({ label: ex ? 'Include in grid' : 'Exclude from grid',
                 off: lk, title: why,
                 run: () => cellToggleExclude(i) });
  }
  return items;
}

// A MENU IS A LIST OF ITEMS, and a submenu is an item carrying its own list.
// Items: {header}, {sep}, or {label, run, off, sub} plus, all optional,
// {key: 'Ctrl+S'} (the shortcut, right-aligned), {check: true|false} (a box
// before the label; left out for plain items), {state: true} (a check that
// reports rather than acts: disabled and dimmed), and {title} (a tooltip).
//
// One renderer for the right-click menus AND the three menus in the title
// row. open(x, y) places a menu at the pointer; openAt(anchor) opens it under
// the element that asked, left-aligned to it, and remembers that element so a
// second click on it closes the menu instead of closing and reopening it.
//
// THE KEYBOARD WORKS WHILE ANY MENU IS OPEN: Up/Down move a highlight over
// the items that can be used, Enter or Space runs the highlighted one, Right
// opens a submenu and Left closes it, Escape closes the lot. In the title
// row, Left/Right with no submenu to enter or leave step to the neighboring
// menu (☰ ↔ Ikemen GO ↔ screenpack), which is the `cycle` option. The mouse
// still fires items on release, as it always has.
const Menu = {
  els: [],
  anchor: null,
  opts: null,
  act: 0,          // the panel the keyboard is in
  close() {
    for (const e of this.els) e.remove();
    this.els = [];
    if (this.anchor) this.anchor.setAttribute('aria-expanded', 'false');
    this.anchor = null;
    this.opts = null;
    this.act = 0;
    document.removeEventListener('mousedown', this._away, true);
    document.removeEventListener('keydown', this._key, true);
  },
  _away: null,
  _key: null,
  open(x, y, items, opts) {
    this.close();
    this.opts = opts || {};
    this.anchor = this.opts.anchor || null;
    this._away = (e) => {
      if (e.target.closest('.menu')) return;
      // The anchor's own click toggles its menu. Closing here as well would
      // have that click open it again straight away.
      if (this.anchor && this.anchor.contains(e.target)) return;
      this.close();
    };
    this._key = (e) => this.key(e);
    document.addEventListener('mousedown', this._away, true);
    document.addEventListener('keydown', this._key, true);
    this.panel(x, y, items, 0);
    if (this.anchor) this.anchor.setAttribute('aria-expanded', 'true');
    // Opened from the keyboard: start on the first item, as a native menu
    // does. Opened by the mouse: no highlight until one is asked for.
    if (this.opts.keyboard) this.step(0, 1);
  },
  openAt(anchor, items, opts) {
    const r = anchor.getBoundingClientRect();
    this.open(r.left, r.bottom + 2, items, Object.assign({}, opts, { anchor }));
  },
  panel(x, y, items, depth) {
    // A deeper panel replaces any panel at or below its own depth, so moving
    // between two parents does not leave the first one's submenu behind.
    while (this.els.length > depth) this.els.pop().remove();
    const m = document.createElement('div');
    const kind = this.opts && this.opts.kind;
    m.className = 'menu' + (kind ? ' hdr ' + kind : '');
    m.setAttribute('role', 'menu');
    m._rows = [];     // the items the keyboard can land on, in order
    m._hl = null;
    for (const it of items) {
      if (it.sep) { const d = document.createElement('div'); d.className = 'msep'; m.appendChild(d); continue; }
      if (it.header !== undefined) {
        const d = document.createElement('div');
        d.className = 'mhead'; d.textContent = it.header; m.appendChild(d); continue;
      }
      const d = document.createElement('div');
      d.className = 'mi' + (it.off ? ' off' : '') + (it.state ? ' state' : '');
      d.setAttribute('role', it.check !== undefined ? 'menuitemcheckbox' : 'menuitem');
      if (it.check !== undefined) d.setAttribute('aria-checked', String(!!it.check));
      if (it.off) d.setAttribute('aria-disabled', 'true');
      if (it.title) d.title = it.title;
      if (it.check !== undefined) {
        const c = document.createElement('span');
        c.className = 'mcheck'; c.textContent = it.check ? '☑' : '☐';
        d.appendChild(c);
      }
      const t = document.createElement('span');
      t.textContent = it.label;
      d.appendChild(t);
      if (it.key) {
        const k = document.createElement('span');
        k.className = 'mkey'; k.textContent = it.key;
        d.appendChild(k);
      }
      if (it.sub) {
        const a = document.createElement('span');
        a.className = 'arrow'; a.textContent = '▸';
        d.appendChild(a);
      }
      if (!it.off) {
        const idx = m._rows.length;
        m._rows.push({ el: d, it });
        d.onmouseenter = () => {
          this.mark(depth, idx);
          if (it.sub) {
            const r = d.getBoundingClientRect();
            this.panel(r.right - 2, r.top - 4, it.sub, depth + 1);
          } else {
            while (this.els.length > depth + 1) this.els.pop().remove();
          }
        };
        if (it.run) d.onmouseup = () => { this.close(); it.run(); };
      }
      m.appendChild(d);
    }
    document.body.appendChild(m);
    // Keep it on screen.
    const w = m.offsetWidth, h = m.offsetHeight;
    m.style.left = Math.max(4, Math.min(x, window.innerWidth - w - 4)) + 'px';
    m.style.top = Math.max(4, Math.min(y, window.innerHeight - h - 4)) + 'px';
    this.els.push(m);
  },
  // Highlight row `idx` of panel `depth` (null clears it). The keyboard and
  // the mouse share this one highlight, so whichever moved last is where
  // Enter acts.
  mark(depth, idx) {
    const m = this.els[depth];
    if (!m) return;
    for (const r of m._rows) r.el.classList.remove('hl');
    m._hl = idx;
    const row = idx === null ? null : m._rows[idx];
    if (row) row.el.classList.add('hl');
    this.act = depth;
  },
  step(depth, dir) {
    const m = this.els[depth];
    if (!m || !m._rows.length) return;
    const n = m._rows.length;
    const cur = m._hl === null ? (dir > 0 ? -1 : n) : m._hl;
    this.mark(depth, (cur + dir + n) % n);
  },
  enter(depth) {
    const m = this.els[depth];
    const row = m && m._hl !== null ? m._rows[m._hl] : null;
    if (!row || !row.it.sub) return false;
    const r = row.el.getBoundingClientRect();
    this.panel(r.right - 2, r.top - 4, row.it.sub, depth + 1);
    this.act = depth + 1;
    this.step(depth + 1, 1);
    return true;
  },
  key(e) {
    const k = e.key;
    const eat = () => { e.preventDefault(); e.stopPropagation(); };
    if (k === 'Escape') {
      eat();
      const a = this.anchor;
      this.close();
      if (a) a.focus();
      return;
    }
    const depth = Math.min(this.act, this.els.length - 1);
    const m = this.els[depth];
    if (!m) return;
    if (k === 'ArrowDown' || k === 'ArrowUp') { eat(); this.step(depth, k === 'ArrowDown' ? 1 : -1); return; }
    if (k === 'Enter' || k === ' ') {
      // Nothing highlighted: not ours. The anchor's own Enter then toggles
      // its menu shut, and a text field keeps its space.
      if (m._hl === null) return;
      eat();
      if (this.enter(depth)) return;
      const it = m._rows[m._hl].it;
      if (it.run) { this.close(); it.run(); }
      return;
    }
    if (k === 'ArrowRight') {
      if (this.enter(depth)) { eat(); return; }
      if (this.opts && this.opts.cycle) { eat(); this.opts.cycle(1); }
      return;
    }
    if (k === 'ArrowLeft') {
      if (depth > 0) { eat(); while (this.els.length > depth) this.els.pop().remove(); this.act = depth - 1; return; }
      if (this.opts && this.opts.cycle) { eat(); this.opts.cycle(-1); }
      return;
    }
    if (k === 'Tab') this.close();
  },
};

// Pick a character from the library, or bring one in from disk.
//
// A row is SELECTED rather than applied on click, and the action button
// commits - which is what makes Browse sensible: you can pull a .def off the
// machine, have it land in the library, and see it highlighted in the same list
// before committing. A browsed character stays in the library afterwards, so it
// is available to every later placement too.
//
// THE KEYBOARD. The first match is highlighted as you type, Up and Down move
// the highlight, Enter picks it (or the only match, when the search leaves
// exactly one) and Escape closes. Typing a name and pressing Enter used to do
// nothing at all.
//
// THE KEYS ARE READ AT THE DOCUMENT while the picker is open, wherever the
// focus is. They were the search box's alone, and the focus leaves it more
// easily than it looks: the Browse… dialog closing handed it to the page, and
// so did a click on the title. Escape then did not close the picker, and a
// name typed went nowhere. What is typed goes to the search box; the Browse…
// dialog on top keeps its own keys. A press anywhere in the picker but its
// buttons, the search box and the list's scroll bar leaves the focus there,
// and the Browse… dialog gives it back when it closes.
//
// A REFUSAL STAYS IN THE PICKER. `onPick` answers a reason when it refuses (a
// locked cell, say), and the picker then stays open and shows it above its
// buttons, as it does when Browse… cannot add what it was given. The log
// alone is under the backdrop, where a refused pick looked like a pick that
// did nothing.
function pickCharacter(title, onPick, actionLabel) {
  const back = document.createElement('div');
  back.className = 'backdrop';
  const box = document.createElement('div');
  box.className = 'picker chars';
  const head = document.createElement('div');
  head.className = 'phead'; head.textContent = title;
  const inp = document.createElement('input');
  inp.placeholder = 'Search\u2026 (name, author:, path:)';
  const list = document.createElement('div');
  list.className = 'plist';
  const why = document.createElement('div');
  why.className = 'pwhy';
  why.setAttribute('role', 'alert');
  why.hidden = true;
  const showWhy = (m) => { why.textContent = m || ''; why.hidden = !m; };
  const shut = () => { back.remove(); box.remove(); document.removeEventListener('keydown', onKey, true); };
  back.onmousedown = shut;
  // Set while the Browse… dialog is open over the picker.
  let browsing = false;
  const dialogsBelow = EDLG.length;
  let chosen = null;
  // The rows the search leaves, in order, for the arrow keys.
  let shown = [];
  const foot = document.createElement('div');
  foot.className = 'prow';
  const browse = document.createElement('button');
  browse.textContent = 'Browse\u2026';
  browse.className = 'left';
  const cancel = document.createElement('button');
  cancel.textContent = 'Cancel';
  cancel.onclick = shut;
  const go = document.createElement('button');
  go.textContent = actionLabel || 'Insert';
  go.className = 'primary';
  go.disabled = true;
  const commit = (c) => {
    if (!c) return;
    const r = onPick(c);
    if (typeof r === 'string' && r) { showWhy(r); return; }
    shut();
  };
  go.onclick = () => commit(chosen);
  foot.appendChild(browse); foot.appendChild(cancel); foot.appendChild(go);
  // Highlight one row (or none), scrolled into view when asked.
  const light = (c, scroll) => {
    chosen = c || null;
    go.disabled = !chosen;
    showWhy('');
    let lit = null;
    for (const s of shown) {
      const on = !!chosen && lc(s.c.id) === lc(chosen.id);
      s.row.classList.toggle('on', on);
      if (on) lit = s.row;
    }
    if (lit && scroll) lit.scrollIntoView({ block: 'nearest' });
  };

  // Browse takes a path on this machine rather than a file input: the browser
  // hands back a File with no path, and the server needs the folder to copy in.
  browse.onclick = () => {
    browsing = true;
    modal('Add a character from this machine',
      'Full path to the character\u2019s .def file or its folder. It is copied into '
      + 'the library and stays there.', '', async (val) => {
        const t = String(val).trim();
        if (!t) return;
        // Added to the build as a drop is (modlib placeInRoster), so it follows
        // Preferences > Replace RandomSelect cells the same way; the server
        // takes one only when the grid has no free cell.
        let r = null;
        try {
          r = await (await fetch('/api/add-local', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({ kind: 'char', path: t },
              PREFS.dropReplaceRandom ? { replaceRandom: 1 } : null)),
          })).json();
        } catch (err) {
          r = { error: 'the Studio did not answer (' + ((err && err.message) || err) + ')' };
        }
        // In the picker as well as the log, which its backdrop covers.
        if (r.error) { log('ERROR ' + r.error); showWhy('Could not add it: ' + r.error); return; }
        // THIS PAGE HAS SEEN HIM. The roster on disk holds him now, and
        // order[] only once he is placed here, so a Save that leaves him out
        // (never placed, or placed and removed again) takes him out of the
        // build, as it does a character the last load read: withStudioAdds
        // keeps only the ones this page never saw. modlib.addCharacter
        // answers his roster mountAs as `name`.
        if (r.result && r.result.name) LOADED.add(lc(r.result.name));
        log('Added ' + (r.result && r.result.mountAs ? r.result.mountAs : t) + ' to the library', true);
        LIB = await (await fetch('/api/library')).json();
        AUTHOR_BY_ID = null; ONDISK_IDS = null;
        const added = r.result && r.result.mountAs
          ? ((LIB.chars || []).find((c) => lc(c.id) === lc(r.result.mountAs)) || null) : null;
        if (added) { chosen = added; go.disabled = false; }
        inp.value = added ? added.displayName : '';
        draw();
      }, () => { browsing = false; inp.focus(); });
  };

  // `first` highlights the first match: the search changed under it.
  const draw = (first) => {
    list.innerHTML = '';
    shown = [];
    const q = inp.value.trim().toLowerCase();
    const places = buildPlaces();
    for (const c of ((LIB && LIB.chars) || [])) {
      if (!matchesQuery(c, q)) continue;
      const row = document.createElement('div');
      row.className = 'row';
      const im = listPortrait(c.id);
      const t = document.createElement('div');
      t.style.minWidth = '0';
      const nm = document.createElement('div');
      nm.className = 'nm'; nm.textContent = c.displayName;
      const sub = document.createElement('div');
      sub.className = 'sub';
      // WHERE, for one already in the build: Insert and Replace take him from
      // there, so the row says which cell that is (every cell, when he is in
      // the build more than once).
      const at = places.get(lc(c.id));
      sub.textContent = (c.author ? c.author + ' \u00b7 ' : '') + c.id
        + (at ? ' \u00b7 ' + placeWords(at) : '');
      // The line is cut to fit the dialog, and its tail - the cell - is the
      // part worth reading: the whole row is its hover title.
      row.title = nm.textContent + ' - ' + sub.textContent;
      t.appendChild(nm); t.appendChild(sub);
      if (im) row.appendChild(im); else row.classList.add('noport');
      row.appendChild(t);
      row.onclick = () => { light(c); inp.focus(); };
      row.ondblclick = () => commit(c);
      list.appendChild(row);
      shown.push({ c, row });
    }
    light(first ? (shown.length ? shown[0].c : null) : chosen, first);
  };
  inp.oninput = () => draw(true);
  box.addEventListener('mousedown', (e) => {
    if (e.target === list || e.target.closest('button, input')) return;
    e.preventDefault();
    inp.focus();
  });
  function onKey(e) {
    // A picker taken out of the page some other way stops listening.
    if (!box.isConnected) { document.removeEventListener('keydown', onKey, true); return; }
    if (e.isComposing || browsing || EDLG.length > dialogsBelow) return;
    if (e.key === 'Escape') { e.preventDefault(); shut(); return; }
    // A focused button of the picker keeps its own Enter and Space.
    if (e.target && e.target.tagName === 'BUTTON' && box.contains(e.target)) return;
    if (document.activeElement !== inp && !e.ctrlKey && !e.metaKey && !e.altKey
      && (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Delete')) inp.focus();
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!shown.length) return;
      const step = e.key === 'ArrowDown' ? 1 : -1;
      const k = chosen ? shown.findIndex((s) => lc(s.c.id) === lc(chosen.id)) : -1;
      const n = k < 0 ? (step > 0 ? 0 : shown.length - 1) : Math.max(0, Math.min(shown.length - 1, k + step));
      light(shown[n].c, true);
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      const lit = !!chosen && shown.some((s) => lc(s.c.id) === lc(chosen.id));
      commit(lit ? chosen : shown.length === 1 ? shown[0].c : null);
    }
  }
  document.addEventListener('keydown', onKey, true);
  draw(false);
  box.appendChild(head); box.appendChild(inp); box.appendChild(list); box.appendChild(why); box.appendChild(foot);
  document.body.appendChild(back); document.body.appendChild(box);
  inp.focus();
}

// A list row's portrait, or null when Preferences > Show portraits in lists
// is off. Then no image is made at all, so a long roster asks the server for
// none of them - that saving is the point of the switch.
function listPortrait(id) {
  if (!PREFS.listPortraits) return null;
  const im = new Image();
  im.src = portraitSrc(id, palOf(id));
  im.onerror = () => { im.style.visibility = 'hidden'; };
  return im;
}

let TAB = 'chars';
function drawList() {
  const q = $('#search').value.trim().toLowerCase();
  const list = $('#list');
  list.innerHTML = '';
  let shown = 0;
  for (const c of LIB.chars) {
    const onGrid = inOrder(c.id);
    const off = !onGrid && isOffGridId(c.id);
    const inBuild = onGrid || off;
    // NOT IN BUILD is the library's whole point: a character can sit on disk
    // indefinitely without shipping. This tab is that set, named.
    if (TAB === 'excluded' && inBuild) continue;
    if (!matchesQuery(c, q)) continue;
    shown++;
    const row = document.createElement('div');
    // Dimmed only when it is on the grid: an off-grid character is as free to
    // place as one only on disk.
    row.className = 'row' + (onGrid ? ' inbuild' : '');
    row.draggable = true;
    row.ondragstart = (e) => { e.dataTransfer.setData('text/plain', 'lib:' + c.id); dragState(true); };
    // Finding a character in a large grid by eye is hopeless, so the library
    // row can point at it.
    row.oncontextmenu = (e) => {
      e.preventDefault();
      const placed = CELLS.find((x) => x.kind === 'char' && lc(x.char) === lc(c.id));
      Menu.open(e.clientX, e.clientY, [
        { header: c.displayName },
        { label: 'Find on select screen', off: !placed, run: () => findOnGrid(c.id) },
        // Into the FIRST FREE CELL (firstFreeCell), which is where a
        // character added to the build lands as well; past the end of the
        // grid only when there is none.
        ...(off ? [{ label: 'Put back on the grid', run: () => {
          const room = firstFreeCell();
          const entry = takeFromLibrary(c.id);
          if (room) setCellEntry(room.cell, entry); else order.push(entry);
          trimTrailingHoles();
          log(c.displayName + ' is back on the grid, '
            + (!room ? 'past its last cell (every cell is taken)'
              : 'in cell ' + room.cell + (room.how === 'random' ? ', replacing its RandomSelect' : '')), true);
          Session.record('put ' + c.displayName + ' back on the grid', true);
          markDirty(true); render();
        } }] : []),
        { sep: true },
        { label: 'Open containing folder', run: () => openFolderById(c.folder || c.id) },
      ]);
    };
    const im = listPortrait(c.id);
    const t = document.createElement('div');
    t.style.minWidth = '0';
    const nm = document.createElement('div');
    nm.className = 'nm'; nm.textContent = c.displayName;
    const sub = document.createElement('div');
    sub.className = 'sub';
    // The FOLDER identifies where it lives; the .def identifies WHICH version,
    // which is the only thing separating two rows out of one folder.
    const folder = c.folder || c.id;
    sub.textContent = (c.author ? c.author + ' · ' : '') + folder
      + (c.def ? ' · ' + c.def : '')
      + (onGrid ? '' : off ? ' · off grid' : ' · library only');
    sub.title = (c.author ? c.author + String.fromCharCode(10) : '')
      + 'cache/' + folder + '/' + (c.def || '')
      + (off ? String.fromCharCode(10) + 'In the build but off the grid (exclude = 1): its files ship, for any character that reads them. Drag it onto a cell to put it back.'
        : onGrid ? '' : String.fromCharCode(10) + 'Library only: on disk, not in the build.');
    t.appendChild(nm); t.appendChild(sub);
    if (im) row.appendChild(im); else row.classList.add('noport');
    row.appendChild(t);
    list.appendChild(row);
  }
  if (!shown) {
    const e = document.createElement('div');
    e.className = 'hint';
    e.textContent = TAB === 'excluded'
      ? (q ? 'Nothing matches.' : 'Every character on disk is in the build.')
      : 'Nothing matches.';
    list.appendChild(e);
  }
  // Dropping a cell here removes it from the BUILD but leaves it on disk.
  list.ondragover = (e) => e.preventDefault();
  list.ondrop = (e) => {
    e.preventDefault();
    const p = e.dataTransfer.getData('text/plain');
    if (!p.startsWith('cell:')) return;
    // p carries a CELL index, and cell index is not order index once skipslot
    // or slot blocks exist. Resolve through the cell record.
    const i = +p.slice(5);
    const info = cellAt(i);
    const id = info && info.kind === 'char' ? info.char : null;
    if (!id) return;
    if (lockRefuses(i, 'removed')) return;
    const span = orderIndexOfCell(i);
    if (!span) return;
    // Removes the cell's FIRST member only; a block's other variants stay.
    // Every cell after it moves up one - except a locked one (pinLocks).
    const pins = pinLocks();
    order.splice(span.start, 1);
    unpinLocks(pins);
    trimTrailingHoles();
    log('Removed ' + id + ' from the build (still on disk)', true);
    Session.record('removed ' + id + ' from the build', true);
    sel = null; markDirty(true); render();
  };
}

// ORDER TAB. Two things the Studio has never exposed, side by side because
// they only make sense together:
//
//   the ORDER GROUPS - which characters sit in each arcade tier, from each
//   character's select.def `order` (default 1); and
//   MAX MATCHES - how many of each tier the ladder actually draws, the
//   [Options] *.maxmatches rows. These were HARDCODED in the exporter to a
//   two-match arcade, so a carefully ordered roster was being ignored.
//
// Ten slots per mode is the engine's shape, not a choice: slot N is tier N+1.
const MM_MODES = [['arcade', 'Arcade'], ['team', 'Team'], ['timeattack', 'TA'], ['survival', 'Surv']];
let MM = null;

// Ordering is PER MODE in the engine: `order` drives the arcade ladder and
// `ordersurvival` the survival one (select.def:133,139). A character with no
// ordersurvival falls back to its order, which is why the survival view is
// not simply empty for a roster that has never set one.
let ORDMODE = 'arcade';
// Which order groups are collapsed, and any order tier the user has ADDED
// that no character sits in yet. Both are per MODE, because arcade and
// survival are genuinely separate ladders - a character can be order 1 in one
// and order 4 in the other - so their groupings must not share state.
const ORD_SHUT = new Set();      // `${mode}:${tier}`
const ORD_EXTRA = { arcade: new Set(), survival: new Set() };

// Writing one character's order. `order` and `ordersurvival` are separate
// select.def keys, so which one is written follows the toggle.
async function setCharOrder(cell, tier) {
  const props = Object.assign({}, cell.props || {});
  // ORDER 1 IS WRITTEN AS ABSENCE. Both keys default to 1 when missing, so an
  // explicit "1" and no key at all are the same character to the engine - and
  // cleanChar drops an empty string, so this removes the key rather than
  // setting it. Writing the "1" instead left a residue: dragging a character
  // out of order 1 and back again returned it to the same group while adding a
  // key it never had, which reads as a change in the file and in any diff.
  const v = String(tier) === '1' ? '' : String(tier);
  if (ORDMODE === 'survival') props.ordersurvival = v;
  else props.order = v;
  const r = await (await fetch('/api/char-props', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mountAs: cell.char, props }),
  })).json();
  if (r.error) { log('ERROR ' + r.error); return; }
  log(cell.displayName + ' -> ' + ORDMODE + ' order ' + tier, true);
  Session.record(cell.displayName + ' -> ' + ORDMODE + ' order ' + tier);
  ORD_EXTRA[ORDMODE].delete(String(tier));
  await load(true);
  drawOrder();
}

// THE ORDER TAB'S OWN SCROLL. It shares #orderPanel with the Stages tree,
// which puts its offset back on every draw, and Order opened wherever the
// tree had been scrolled to - its Arcade/Survival toggle out of sight.
let ORDER_SCROLL = 0;
function drawOrder() {
  const panel = $('#orderPanel');
  panel.innerHTML = '';
  const seg = document.createElement('div');
  seg.className = 'seg';
  for (const [key, label] of [['arcade', 'Arcade'], ['survival', 'Survival']]) {
    const b = document.createElement('button');
    b.textContent = label;
    b.className = ORDMODE === key ? 'on' : '';
    b.onclick = () => { ORDMODE = key; drawOrder(); };
    seg.appendChild(b);
  }
  panel.appendChild(seg);
  // Group the BUILD (not the library) by tier - order only means anything
  // for characters that actually ship.
  const tiers = new Map();
  for (const c of CELLS) {
    if (c.kind !== 'char' || c.variant > 0) continue;
    const p = c.props || {};
    // A CHARACTER WITH NO ordersurvival IS SURVIVAL ORDER 1, not its arcade
    // order. main.lua:1411-1413 says so outright - "chars without ordersurvival
    // still belong to survival order 1" - and falling back to `order` here put
    // a character with `order = 3` and no ordersurvival into survival group 3,
    // where the game puts it in group 1.
    //
    // An absent `order` is 1 too, but for a different reason: main.lua:1387
    // sets order = 1 when the character token is read, and only a later
    // `order = N` param overrides it.
    const t = String((ORDMODE === 'survival' ? p.ordersurvival : p.order) || 1);
    if (!tiers.has(t)) tiers.set(t, []);
    tiers.get(t).push(c);
  }
  // An added-but-empty tier still gets a group, so there is somewhere to drop
  // the first character into it.
  for (const t of ORD_EXTRA[ORDMODE]) if (!tiers.has(t)) tiers.set(t, []);
  const keys = [...tiers.keys()].sort((a, b) => (+a) - (+b));
  if (!keys.length) {
    const none = document.createElement('div');
    none.className = 'hint';
    none.textContent = 'No characters in the build yet.';
    panel.appendChild(none);
  }

  // Add the next tier up. It exists only in the view until something lands in
  // it - an order with no members is not a thing select.def can record.
  const add = document.createElement('button');
  add.id = 'addOrder';
  add.textContent = '+ Add ' + (ORDMODE === 'survival' ? 'survival' : 'arcade') + ' order';
  add.onclick = () => {
    const next = String(Math.max(0, ...keys.map(Number)) + 1);
    ORD_EXTRA[ORDMODE].add(next);
    ORD_SHUT.delete(ORDMODE + ':' + next);
    log('Added ' + ORDMODE + ' order ' + next + ' - drag a character into it');
    drawOrder();
  };
  panel.appendChild(add);

  for (const t of keys) {
    const g = document.createElement('div');
    const shutKey = ORDMODE + ':' + t;
    g.className = 'ordgrp' + (ORD_SHUT.has(shutKey) ? ' shut' : '');
    const h = document.createElement('h4');
    const tw = document.createElement('span');
    tw.className = 'tw';
    tw.textContent = ORD_SHUT.has(shutKey) ? '\u25b6' : '\u25bc';
    const cap = document.createElement('span');
    cap.textContent = 'Order ' + t + ' (' + tiers.get(t).length + ')';
    h.appendChild(tw); h.appendChild(cap);
    h.onclick = () => {
      if (ORD_SHUT.has(shutKey)) ORD_SHUT.delete(shutKey); else ORD_SHUT.add(shutKey);
      drawOrder();
    };
    // Only an empty tier this session added can be taken away again; a tier
    // with members is defined by those members, not by the editor.
    if (!tiers.get(t).length && ORD_EXTRA[ORDMODE].has(t)) {
      const del = document.createElement('span');
      del.className = 'del';
      del.textContent = '\u00d7';
      del.title = 'Remove this empty order';
      del.onclick = (e) => {
        e.stopPropagation();
        ORD_EXTRA[ORDMODE].delete(t);
        log('Removed empty ' + ORDMODE + ' order ' + t);
        drawOrder();
      };
      h.appendChild(del);
    }
    g.appendChild(h);
    // Dropping a character here sets its order for THIS mode.
    // The payload is unreadable during dragover, so the group accepts the drag
    // and checks what it actually got on drop.
    g.ondragover = (e) => { e.preventDefault(); g.classList.add('drop'); };
    g.ondragleave = () => g.classList.remove('drop');
    g.ondrop = (e) => {
      e.preventDefault();
      g.classList.remove('drop');
      const d = e.dataTransfer.getData('text/plain') || '';
      // Both payloads carry a CELL index: `ord:` from a row in this panel,
      // `cell:` from the grid itself, which is the more natural gesture -
      // the Order tab and the grid are on screen at the same time.
      const m = /^(?:ord|cell):(\d+)$/.exec(d);
      if (!m) {
        // A library row is not in the build yet, so it has no cell to reorder.
        const lib = /^lib:(.+)$/.exec(d);
        if (lib) log('Place ' + lib[1] + ' on the grid first, then drag it into an order');
        return;
      }
      const cell = CELLS.find((x) => x.index === +m[1]);
      if (cell && cell.kind === 'char') setCharOrder(cell, t);
      else if (cell) log('Only a character can have an order');
    };
    if (!tiers.get(t).length) {
      const em = document.createElement('div');
      em.className = 'ordempty';
      em.textContent = 'empty - drag a character here';
      g.appendChild(em);
    }
    for (const c of tiers.get(t)) {
      const r = document.createElement('div');
      r.className = 'ordrow';
      const im = listPortrait(c.char);
      const nm = document.createElement('div');
      nm.className = 'nm'; nm.textContent = c.displayName;
      nm.title = 'cell ' + c.index + ' · ' + ORDMODE + ' order ' + t;
      if (im) r.appendChild(im);
      r.appendChild(nm);
      r.onclick = () => { sel = c.index; drawGrid(); drawInspector(); };
      r.draggable = true;
      r.ondragstart = (e) => e.dataTransfer.setData('text/plain', 'ord:' + c.index);
      g.appendChild(r);
    }
    panel.appendChild(g);
  }

  const head = document.createElement('h4');
  head.textContent = 'Max Matches';
  head.style.cssText = 'margin:12px 0 0;font-size:11px;color:var(--accent);'
    + 'border-bottom:1px solid var(--line);padding-bottom:3px';
  panel.appendChild(head);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = 'How many characters of each order the arcade ladder draws.'
    + ' Row N is order N. 0 = that tier never appears; -1 = no limit.';
  panel.appendChild(hint);

  const tbl = document.createElement('table');
  tbl.className = 'mm';
  const thead = document.createElement('tr');
  thead.innerHTML = '<th></th>' + MM_MODES.map((m) => '<th>' + m[1] + '</th>').join('');
  tbl.appendChild(thead);
  for (let i = 0; i < 10; i++) {
    const tr = document.createElement('tr');
    const n = document.createElement('td');
    n.className = 'n'; n.textContent = String(i + 1);
    tr.appendChild(n);
    for (const [key] of MM_MODES) {
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.type = 'number'; inp.min = '-1'; inp.max = '999';
      inp.dataset.mode = key; inp.dataset.slot = String(i);
      const row = MM && MM[key];
      inp.value = row ? String(row[i] == null ? 0 : row[i]) : '';
      inp.placeholder = MM_DEFAULT[key] ? String(MM_DEFAULT[key][i]) : '';
      td.appendChild(inp); tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
  panel.appendChild(tbl);

  const save = document.createElement('button');
  save.textContent = 'Apply max matches';
  save.style.cssText = 'width:100%;margin-top:8px';
  save.onclick = async () => {
    const body = {};
    for (const inp of tbl.querySelectorAll('input')) {
      const v = inp.value.trim();
      if (v === '') continue;                 // blank = leave this mode alone
      (body[inp.dataset.mode] = body[inp.dataset.mode] || Array(10).fill(0))[+inp.dataset.slot] = +v;
    }
    const r = await (await fetch('/api/max-matches', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })).json();
    if (r.error) { log('ERROR ' + r.error); return; }
    MM = r.maxMatches;
    log(Object.keys(body).length
      ? 'Max matches saved: ' + Object.keys(body).join(', ')
      : 'Max matches cleared - back to the exporter defaults', true);
    Session.record(Object.keys(body).length
      ? 'max matches (' + Object.keys(body).join(', ') + ')'
      : 'max matches cleared');
    drawOrder();
  };
  panel.appendChild(save);
  if (TAB === 'order') panel.scrollTop = ORDER_SCROLL;
  panel.onscroll = () => { if (TAB === 'order') ORDER_SCROLL = panel.scrollTop; };
}
// What the exporter emits when a mode is unset, shown as input placeholders
// so an empty box reads as 'the default' rather than as zero.
const MM_DEFAULT = { arcade: [2,0,0,0,0,0,0,0,0,0], team: [2,0,0,0,0,0,0,0,0,0] };

// STAGES TAB: THE STAGE TREE, after VSelect's. Every stage a character can
// fight on is a group - with Preferences › Show portraits in lists on, its
// picture is a banner behind its name - and under it the characters whose
// arcade stage it is. [ExtraStages] alone never answered "who fights where",
// and the per-character dropdown only ever shows one character at a time.
//
// (no stage) holds the characters with none: every match picks a random
// stage for them. Then two sections. INCLUDED is every [ExtraStages] stage,
// used or not, and a stage only characters name when its FIRST user in grid
// order - the one the engine registers it from (main.lua, "add 'stage' param
// stages if needed") - does not say includestage = 0; -1 keeps it in the
// stage list but out of the random picks, which its chip says. EXCLUDED is
// the rest. A slot's members count one by one, each under its own stage.
//
// THE STAGE PORTRAIT the select screen draws: the screenpack's own
// stage.portrait.spr when it sets one, else Preferences > Default stage
// portrait sprite, else none. A negative group or index is how a pack - and
// the engine's default motif, with -1,0 - switches it off, so it counts as
// unset and the preference stands in.
function stagePortraitSprite() {
  const sp = MI && MI.select && MI.select.stagePortrait;
  const s = sp && Array.isArray(sp.spr) ? sp.spr : null;
  if (s && s[0] >= 0 && s[1] >= 0) return { g: s[0], i: s[1], from: 'pack' };
  const m = /^\s*(-?\d+)\s*,\s*(-?\d+)\s*$/.exec(PREFS.stagePortraitSpr || '');
  if (m && +m[1] >= 0 && +m[2] >= 0) return { g: +m[1], i: +m[2], from: 'pref' };
  return null;
}

// ONE STAGE, HOWEVER IT IS SPELLED. A character's stage is a path the engine
// reads with either slash and in any case, and the exporter adds `stages/`
// when it is missing (motif-core buildCharacterLines), so `STAGES\Kfm.def`,
// `stages/kfm.def` and `kfm.def` are one stage: one key, one group.
const stageBare = (s) => String(s == null ? '' : s).trim().replace(/\\/g, '/').replace(/^stages\//i, '');
const stageKey = (s) => lc(stageBare(s));

// includestage as a number, or null when it is not set.
function includeStageOf(c) {
  const v = String((c && c.props && c.props.includestage) == null ? '' : c.props.includestage).trim();
  return v === '' || !Number.isFinite(Number(v)) ? null : Number(v);
}

// The tree as data: (no stage), and every stage group with its section, its
// chips and its characters in grid order. CELLS is the grid - characters off
// it (exclude = 1) are not in it, and RandomSelect, skipslot and empty cells
// are skipped below.
function stageTreeModel() {
  const listed = new Map();
  for (const st of (MI.stageList || [])) listed.set(stageKey(st.file), st);
  // The stage files the build has (motifSelectInfo): the bundle's stages
  // folder (stageFiles), and the engine's own stock stages, which every build
  // carries beside them (engineStageFiles) - a character naming stage0.def
  // loads it though the bundle has no copy. An older server sends neither,
  // and then nothing is accused of being missing.
  const onDisk = Array.isArray(MI.stageFiles)
    ? new Map(MI.stageFiles.map((f) => [stageKey(f), stageBare(f)])) : null;
  const stock = new Map((MI.engineStageFiles || []).map((f) => [stageKey(f), stageBare(f)]));
  // A STAGE THE BUILD DOES NOT LIST IS CALLED WHAT IT CALLS ITSELF: its
  // [Info] displayname, else its name (stageNames, read with the files),
  // else - no name, or no file at all - its file name without the folder and
  // the .def, as VSelect names it. Titled by its file, "lonely.def" sat among
  // the real names and sorted by its file name.
  const named = (MI.stageNames && typeof MI.stageNames === 'object') ? MI.stageNames : {};
  const nameOf = (key, file) => (typeof named[key] === 'string' && named[key])
    || String(file).split('/').pop().replace(/\.def$/i, '');
  const groups = new Map();
  const group = (key, spelled) => {
    let g = groups.get(key);
    if (!g) {
      const st = listed.get(key) || null;
      const file = st ? st.file : (onDisk && onDisk.get(key)) || stock.get(key) || spelled;
      g = { key, file, st, name: st ? (st.name || st.file) : nameOf(key, file), rows: [] };
      groups.set(key, g);
    }
    return g;
  };
  for (const st of (MI.stageList || [])) group(stageKey(st.file), st.file);
  const noStage = [];
  for (const c of CELLS) {
    if (c.kind !== 'char' || !c.char) continue;
    const raw = (c.props && c.props.stage) || '';
    const key = stageKey(raw);
    if (!key) { noStage.push(c); continue; }
    group(key, stageBare(raw)).rows.push(c);
  }
  const included = [], excluded = [];
  for (const g of groups.values()) {
    const inc = g.rows.length ? includeStageOf(g.rows[0]) : null;
    g.noRandom = !g.st && inc === -1;
    // Neither in [ExtraStages] nor a file the build has: the engine would
    // look for it and find nothing.
    g.missing = !g.st && !!onDisk && !onDisk.has(g.key) && !stock.has(g.key);
    // In the bundle's own folder: the only stages the thumbnail route reads.
    g.inFolder = !onDisk || onDisk.has(g.key);
    (g.st || inc !== 0 ? included : excluded).push(g);
  }
  // Two copies of one stage share its name: the file keeps their order.
  const byName = (a, b) => lc(a.name).localeCompare(lc(b.name)) || a.key.localeCompare(b.key);
  included.sort(byName);
  excluded.sort(byName);
  return { noStage, included, excluded, all: [...groups.values()] };
}

// What the build plays on a stage, as one line.
function stageMusicSummary(g) {
  if (!g.st) return 'not in [ExtraStages]';
  const m = g.st.music || [];
  return m.length
    ? (m.length > 1 ? m.length + ' songs, random each match' : m[0].replace(/^sound\//, ''))
    : 'no music of its own';
}

// WHICH GROUPS ARE SHUT, per viewer, across re-renders and reloads. Keys are
// `section:included`, `section:excluded`, `nostage` and `stage:<key>`; the
// default is everything open.
const STAGE_TREE_KEY = 'eselect:stageTree';
let STAGE_SHUT = null;
function stageShut() {
  if (!STAGE_SHUT) {
    STAGE_SHUT = new Set();
    try {
      const v = JSON.parse(localStorage.getItem(STAGE_TREE_KEY) || '[]');
      if (Array.isArray(v)) for (const k of v) if (typeof k === 'string') STAGE_SHUT.add(k);
    } catch (e) { /* nothing kept: everything open */ }
  }
  return STAGE_SHUT;
}
function saveStageShut() {
  try { localStorage.setItem(STAGE_TREE_KEY, JSON.stringify([...stageShut()])); }
  catch (e) { /* kept for this page only */ }
}
// WHILE A SEARCH IS ON, everything it shows starts open, and a caret or
// Collapse all shuts groups in a set of the search's own: it holds while the
// search does and goes when the search is cleared, which puts the kept state
// back as it was. Written to the kept state, a group shut during a search
// sprang open at the next keystroke, and Collapse all showed nothing until
// the search was cleared.
const STAGE_SEARCH_SHUT = new Set();
const stageSearching = () => !!$('#search').value.trim();
// Flipped in place rather than redrawn, so a double-click's second click
// still lands on the header its first one hit.
function toggleStageKey(key, el) {
  const searching = stageSearching();
  const shut = searching ? STAGE_SEARCH_SHUT : stageShut();
  const now = !el.classList.contains('shut');
  if (now) shut.add(key); else shut.delete(key);
  if (!searching) saveStageShut();
  el.classList.toggle('shut', now);
  const tw = el.querySelector(':scope > .sthead .sttw, :scope > .sthd .sttw');
  if (tw) tw.textContent = now || el.classList.contains('empty') ? '▶' : '▼';
}
// Collapse all / Expand all. Expanding opens the two sections too, so what
// was asked for is on screen.
function stageTreeAll(shutAll) {
  const searching = stageSearching();
  const shut = searching ? STAGE_SEARCH_SHUT : stageShut();
  if (shutAll) {
    shut.add('nostage');
    for (const g of stageTreeModel().all) shut.add('stage:' + g.key);
  } else shut.clear();
  if (!searching) saveStageShut();
  drawStages();
}

// THE BANNERS. A stage's picture is, in this order: its own portrait sprite
// (stagePortraitSprite: the pack's, or the preference's), which
// /api/stage-sprite answers only for a stage in [ExtraStages]; else the
// Studio's own generated thumbnail, the one its Stages tab shows; else none.
// Each is fetched once per stage and sprite and kept as a blob URL, so a
// re-render paints what is known at once and asks the server nothing -
// /api/stage-thumb answers no-store, and an image re-requested through CSS
// would go back to the server every time.
// THE KEY IS WHAT DECIDES THE PICTURE: the file, the sprite asked for (only
// a listed stage is asked, so listing one changes its key) and whether the
// thumbnail route can read it. Keyed on the file and sprite alone, a stage
// cached as "none" or "thumb" kept that after the Studio listed it or its
// file arrived, until the page itself was reloaded.
const STAGE_PIC = new Map();        // key -> Promise<{from, url} | null>
const STAGE_PIC_DONE = new Map();   // the same, once settled
const stagePicKey = (g, spr) => lc(g.file) + '|' + (spr && g.st ? spr.from + ':' + spr.g + ',' + spr.i : '-')
  + (g.inFolder ? '' : '|elsewhere');
function stagePicture(g, spr) {
  const k = stagePicKey(g, spr);
  if (STAGE_PIC.has(k)) return STAGE_PIC.get(k);
  const tries = [];
  if (spr && g.st) {
    tries.push([spr.from, '/api/stage-sprite?stage=' + encodeURIComponent(g.st.file) + '&g=' + spr.g + '&i=' + spr.i]);
  }
  // Stages sit flat in the bundle's stages folder, the only one the
  // thumbnail route reads: not an engine stock stage, not a missing one, and
  // not a name with a folder in it.
  if (g.inFolder && !g.missing && !/[\\/]/.test(g.file)) tries.push(['thumb', '/api/stage-thumb?file=' + encodeURIComponent(g.file)]);
  const p = (async () => {
    for (const [from, url] of tries) {
      try {
        const r = await fetch(url);
        if (!r.ok || !/^image\//i.test(r.headers.get('Content-Type') || '')) continue;
        return { from, url: URL.createObjectURL(await r.blob()) };
      } catch (e) { /* the next source */ }
    }
    return null;
  })();
  STAGE_PIC.set(k, p);
  p.then((v) => {
    if (STAGE_PIC.get(k) === p) STAGE_PIC_DONE.set(k, v);
    else if (v) URL.revokeObjectURL(v.url);   // forgotten while it loaded
  });
  return p;
}
// Reload reads the stages from disk again too: a sprite or thumbnail the
