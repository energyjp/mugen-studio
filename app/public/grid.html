<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="/themes.css">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/booklet.css">
<script src="/booklet.js"></script>
<title>E-Select — Ikemen GO Select Screen Editor</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon/app-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="icon/app-256.png">
<link rel="apple-touch-icon" href="icon/app-64.png">
<!--
  E-SELECT - the select-screen editor (ADVANCED > Roster & slots). The title
  row, its menus, Preferences and About are modeled on VSelect 2.0.3; see
  docs/design-mockups/vselect-2.0.3/ESELECT-1.0-SPEC.md.

  A separate PAGE rather than a panel inside studio.html, deliberately: this
  is a full-window three-column app (library / stage / inspector) with its own
  scroll behavior, and folding it into that page's vertical card list would
  fight both layouts. studio.html links here; it is one tab of the Advanced
  page that happens to own the whole window, exactly as VSelect does.

  It is VISUAL: the grid is drawn from the MOTIF's own [Select Info] -
  position, cell size, spacing, cell background sprite and portrait sprite -
  so switching screenpack re-lays this editor out the way it re-lays out the
  game. That is the one decision worth copying from VSelect (STUDIO-ADVANCED
  7 and 15): you edit a picture of the thing, not a table of numbers.

  LIBRARY vs BUILD. The left panel lists every character in cache/. Only the
  ones dragged onto a cell are written into roster.json and exported. A
  character can sit in the library indefinitely without shipping, which is the
  point: keep it, do not delete it, do not build it. That needs a real
  filesystem, so it is a MODKIT feature - the web Studio has no cache/.

  Portraits are decoded server-side (/api/sprite): the browser's
  public/lib/sff.js has no SFF v1 support and much community content is v1.
-->
<!--
  Layout and cell-menu conventions started from VSelect (tunglashor) and have
  moved on from it since. User guide: SELECT-EDITOR.md
-->
<style>
  /* Same palette as studio.html - one scheme across both windows. The editor
     grounds a step darker (--bg is the deepest value here, not the mid one),
     because the screenpack canvas has to read as a different material from the
     panels floating on it. */
  :root {
    --bg:#07060c; --panel:#14101f; --panel2:#1f1a2e;
    --line:#241f38; --line2:#3a3550; --ink:#d8d6e8;
    --dim:#8b84a8; --mute:#5b5478;
    --accent:#ff8800; --accent-ink:#120a00;
    --good:#00f9ff; --warn:#ffcc33; --bad:#ff3b57;
    --wb:#4a9eff; --ar:#ff5533; --sz:#aa66ff;
    --fd:"Bahnschrift","Eurostile","Franklin Gothic Medium","Segoe UI",system-ui,sans-serif;
    --fm:"Cascadia Mono",Consolas,ui-monospace,monospace;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font:13px/1.45 var(--fm);
    display:grid; grid-template-rows:auto 1fr auto; height:100vh; overflow:hidden;
  }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  .crumb { color:var(--dim); }
  .spacer { flex:1; }
  /* Colors, keyline, padding and every state live in the theme layer at the
     end of this block. */
  button { border-radius:4px; font:inherit; cursor:pointer; }
  /* Panel widths are variables so the splitters can move them, and the
     stage refits itself to whatever is left. */
  /* EVERY TRACK IS minmax(0, ...). A grid track sized by a plain length still
     refuses to go below the min-content width of what it holds, so dragging
     the library panel narrower than its widest row did not shrink the panel -
     it left the track at its content width and spilled the list over the
     stage. minmax(0, X) lets the track actually reach X. */
  main { display:grid; min-height:0;
         grid-template-columns:minmax(0,var(--left,250px)) 5px minmax(0,1fr)
                               5px minmax(0,var(--right,290px)); }
  .splitter { background:var(--line); cursor:col-resize; position:relative; }
  .splitter::after { content:''; position:absolute; inset:0 -3px; }
  .splitter:hover, .splitter.dragging { background:var(--accent); }
  /* Same as the Studio: chrome does not select, text boxes do. */
  body { user-select: none; }
  input, textarea, select, [contenteditable] { user-select: text; }
  body.resizing { cursor:col-resize; user-select:none; }
  /* min-width:0 for the same reason as the track, and overflow:hidden so a row
     that cannot ellipsis any further is clipped by the panel rather than drawn
     across the preview. */
  aside { border-right:1px solid var(--line); background:var(--panel);
          display:grid; grid-template-rows:auto auto 1fr;
          min-height:0; min-width:0; overflow:hidden; }

  /* THE LIBRARY PANEL'S ROWS ARE ASSIGNED EXPLICITLY, not left to source order.
     It holds more children than the template had rows, so the 1fr landed on
     the SEARCH BOX and the list got an implicit auto row. With a full list the
     1fr collapsed to nothing and it looked right; filter down to one result and
     the input grew to fill the panel while the list vanished behind the log.

     Naming each row also survives hiding: `hidden` removes an element as a grid
     ITEM, so anything relying on source order shifts up a row the moment the
     Order tab hides the search box. #list and #orderPanel deliberately share
     row 4 - exactly one of them is ever visible. */
  #library { grid-template-rows:auto auto auto minmax(0,1fr) auto var(--logh,150px); }
  #library > #tabs { grid-row:1; }
  #library > .ahead { grid-row:2; }
  #library > #searchbar { grid-row:3; }
  #library > #list, #library > #orderPanel { grid-row:4; }
  #library > .hsplit { grid-row:5; }
  #library > #log { grid-row:6; }

  /* The log's own drag handle. Same idea as the vertical splitters, one axis
     over. */
  .hsplit { height:5px; background:var(--line); cursor:row-resize; position:relative; }
  .hsplit::after { content:''; position:absolute; inset:-3px 0; }
  .hsplit:hover, .hsplit.dragging { background:var(--accent); }
  body.vresizing { cursor:row-resize; user-select:none; }
  /* THE RIGHT COLUMN HOLDS TWO STACKED SECTIONS. The slot section sits ABOVE
     properties with its own colored header and its own close, and the two are
     independent: the slot being inspected need not be the character whose
     properties are shown. A drag handle between them splits the height. */
  #rightpane { border-right:0; border-left:1px solid var(--line);
               display:flex; flex-direction:column; }
  /* `hidden` LOSES TO ANY AUTHOR display RULE. The browser's own
     [hidden]{display:none} is a UA rule, so `#slotPane{display:grid}` beat it
     and the pane stayed painted with its close button doing nothing, while the
     splitter - which sets no display of its own - vanished properly. The result
     was a floating title bar that would not close above a divider that did not
     exist. Anything hideable in this column says so explicitly. */
  #slotPane[hidden], #inspector[hidden], .hsplit[hidden] { display:none; }
  /* Shrinkable and capped. With flex-shrink 0 a height stored from a taller
     window squeezed the properties section below it to nothing, and there was
     no way to get it back except by dragging a divider that was now offscreen. */
  #slotPane { flex:0 1 var(--sloth, 210px); min-height:90px; max-height:65%; display:grid;
              grid-template-rows:auto minmax(0,1fr); }
  #slotBody { overflow:auto; padding:6px 8px 8px; }
  /* basis 0, so the properties section takes exactly the space the slot
     section leaves rather than pushing it down: with basis auto its content
     height competed for the column and squeezed the slot to its minimum. */
  #inspector { flex:1 1 0; min-height:0; display:grid;
               grid-template-rows:auto minmax(0,1fr); }
  /* Both section titles are the same object; only the color differs. */
  .ahead { display:flex; align-items:center; }
  /* Scoped by ancestor, NOT by a `slot` modifier: `.slot` is already the grid
     cell class (position:absolute), so a title carrying it flew to the corner
     of the window and sat over the toolbar. */
  #slotPane .ahead { color:var(--warn); font-weight:600; }
  .ahead .x { margin-left:auto; padding:0 4px;
              color:var(--dim); font-size:15px; line-height:1; cursor:pointer; }
  #slotPane .ahead .x:hover { color:var(--warn); }
  .ahead { padding:8px 10px 4px; color:var(--dim); border-bottom:1px solid var(--line); }
  /* An <input> carries an intrinsic size of about 20 characters; without this
     it props the panel open on its own. */
  #search { min-width:0; margin:8px; padding:6px 8px;
            border-radius:4px; font:inherit; }
  #list { overflow:auto; padding:0 8px 8px; }
  .row { display:grid; grid-template-columns:32px 1fr; gap:8px; align-items:center;
         border-radius:4px; cursor:grab; }
  .row img { width:32px; height:32px; object-fit:cover; image-rendering:pixelated;
             background:#0d0d12; border:1px solid var(--line); border-radius:3px; }
  .row .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .sub { color:var(--dim); font-size:11px; overflow:hidden;
              text-overflow:ellipsis; white-space:nowrap; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tab { flex:1; background:none; border:0;
         border-radius:0; padding:7px 4px; font:inherit; cursor:pointer; }
  .seg { display:flex; margin-bottom:8px; }
  .seg button { flex:1; padding:4px; font-size:11px; }
  #orderPanel { overflow:auto; padding:8px; }
  .ordgrp { margin-bottom:10px; border:1px solid transparent; border-radius:4px; }
  .ordgrp h4 { cursor:pointer; user-select:none; display:flex; align-items:center; gap:5px; }
  .ordgrp h4 .tw { display:inline-block; width:9px; color:var(--dim); }
  .ordgrp h4 .del { margin-left:auto; color:var(--dim); font-weight:400; padding:0 3px; }
  .ordgrp h4 .del:hover { color:var(--warn); }
  .ordgrp.shut .ordrow, .ordgrp.shut .ordempty { display:none; }
  .ordrow { cursor:grab; }
  .ordempty { color:var(--dim); font-size:11px; font-style:italic; padding:3px 6px; }
  #addOrder { width:100%; margin:2px 0 10px; font-size:11px; }
  .ordgrp h4 { margin:0 0 4px; font-size:11px; color:var(--accent); font-weight:600;
               border-bottom:1px solid var(--line); padding-bottom:3px; }
  .ordrow { display:flex; gap:6px; align-items:center; padding:2px 4px; font-size:11px; }
  .ordrow img { width:20px; height:20px; object-fit:cover; image-rendering:pixelated;
                border:1px solid var(--line); border-radius:2px; background:#0d0d12; }
  .ordrow .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table.mm { width:100%; border-collapse:collapse; font-size:11px; margin-top:4px; }
  table.mm th { color:var(--dim); font-weight:400; text-align:center; padding:2px; }
  table.mm td { padding:1px; text-align:center; }
  table.mm td.n { color:var(--dim); width:18px; }
  table.mm input { width:100%;
    border-radius:3px; padding:2px; font:inherit;
    text-align:center; }
  /* CENTERED WITH auto MARGINS, not with align/justify-content. A flex
     container that centers an oversized child puts the overflow on BOTH
     sides, and the half above/left of the scroll origin is unreachable -
     scrollTop 0 is already past it. So at any zoom above the fitted one the
     top-left of the screenpack could not be scrolled to at all. Auto margins
     center only while the child FITS and collapse to zero once it does not,
     which keeps the whole thing reachable.

     flex:none keeps the screen at the size drawGrid sets it: a flex child
     shrinks by default, so an oversized screen was squeezed back to the
     panel width and its right-hand side clipped away instead of scrolling. */
  /* THE SCROLLBAR GUTTER IS ALWAYS RESERVED, which is half of the fix for the
     resize flicker. Without it the vertical scrollbar appearing changed
     clientWidth, which changed the fitted zoom, which removed the scrollbar
     again - a loop that repainted the grid every frame at two alternating
     sizes. */
  .stage { overflow:auto; padding:12px; min-height:0; min-width:0; display:flex;
           scrollbar-gutter:stable; }
  #wrap { position:relative; overflow:hidden; margin:auto; flex:none; }
  /* The motif's own background layers. pointer-events off so the cells stay
     clickable through the layer that draws in front of them. */
  .bgpane { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .bgpane.over { z-index:4; }
  .bglayer { position:absolute; image-rendering:pixelated; }
  /* The big portraits are NOT a top layer. The engine's select loop draws
     clear color, background layerno 0, the title, THE PORTRAITS, then the
     cell art, then the menus and cursors (start.lua, the `while not
     selScreenEnd` loop). So they sit between the background and the cells:
     no z-index of their own, appended after the under-pane and before the row
     strips, which paints them in exactly that order. This pane used to carry
     z-index 6, on the belief that portraits were a layer above the lot, which
     drew a character over the entire screen and buried the roster. A motif can
     still ask for that per face with pX.face.layerno = 1; see drawFaces. */
  .bgpane.faces { }
  /* One projected strip per row; everything inside is projected with it. */
  .rowstrip { position:absolute; left:0; top:0; transform-origin:0 0; }
  /* A strip needs no clipping: its box art is exactly its own size. See the
     boxH note in drawGrid for why it once was not, and why clipping looked
     like the fix. */

  /* The editor's OWN cell edges. The motif's rim is a couple of pixels of dark
     art that all but vanishes at a fitted zoom, and an editor has to show
     where the slots are even when the screenpack barely does. Inside the
     projected strip, so each is a true trapezoid, and an inset shadow costs no
     layout. */
  .cell { box-shadow: inset 0 0 0 1px rgba(255,255,255,.20); }
  .cell.occupied { box-shadow: inset 0 0 0 1px rgba(255,255,255,.32); }
  .slot { position:absolute; top:0; }
  .box { position:absolute; left:0; top:0; width:100%; background-size:100% 100%;
         background-repeat:no-repeat; image-rendering:pixelated; pointer-events:none; }
  /* The cursor is NOT cell-sized: the engine draws it at its sprite's own
     size times the cursor element's scale, on the cell's anchor, and a bracket
     that frames the cell has to be bigger than it. Sized explicitly, and hosted
     in the slot rather than the cell because .cell clips. */
  img.cursor { position:absolute; image-rendering:pixelated; pointer-events:none; }
  /* The random-select icon is NOT stretched to fill its cell the way this
     editor draws portraits: the engine draws it at its own size on the
     portrait's anchor, so it is positioned and sized explicitly. */
  img.randicon { position:absolute; image-rendering:pixelated; pointer-events:none; }
  .facewrap { position:absolute; overflow:hidden; }
  img.face { position:absolute; image-rendering:pixelated; }
  /* The cell is the slot's top face: it fills the slot and CLIPS what it
     holds, so the portrait is cut to the trapezoid after projection. */
  .cell { position:absolute; inset:0; overflow:hidden; image-rendering:pixelated; }
  .cell.occupied { cursor:grab; }
  .cell img { position:absolute; inset:0; width:100%; height:100%;
              object-fit:cover; image-rendering:pixelated; pointer-events:none; }
  /* A portrait whose real geometry is known is placed and sized explicitly,
     the way the engine places it, instead of being stretched to the cell. */
  .cell img.exact { inset:auto; object-fit:fill; }
  /* A cell whose sprite is nothing like a portrait. Bright rather than subtle:
     it is reporting a defect in the CHARACTER, and it used to be invisible
     because stretching the sprite to fill hid it. */
  .cell .badpor { position:absolute; right:1px; top:1px; z-index:3;
                  background:#ff8c1a; color:#1a1000; font:700 9px/1.35 ui-monospace,monospace;
                  border-radius:50%; width:13px; height:13px; text-align:center;
                  box-shadow:0 0 0 1px rgba(0,0,0,.55); pointer-events:none; }
  /* ---- a cell whose character is not on disk ----
     The roster records a folder; deleting the folder does not touch the
     roster. The portrait then 404s, and an <img> that removed itself on error
     left an occupied cell drawing NOTHING while its tooltip still read the
     name - so a deleted character was indistinguishable from a broken
     renderer. It cost an evening working out which. Now the cell says so. */
  .cell.missing { box-shadow:inset 0 0 0 1px var(--bad); }
  .cell.missing::after { content:'?'; position:absolute; inset:0; display:flex;
                         align-items:center; justify-content:center; z-index:2;
                         font:700 20px/1 ui-monospace,monospace; color:var(--bad);
                         background:repeating-linear-gradient(45deg,
                           rgba(255,138,138,.10) 0 6px, transparent 6px 12px);
                         text-shadow:0 1px 3px rgba(0,0,0,.9); pointer-events:none; }
  .cell.hot { outline:2px solid var(--accent); outline-offset:-1px; z-index:5; }
  .cell.sel { outline:2px solid var(--good); outline-offset:-1px; z-index:6; }
  .cell.found { animation:findflash .4s ease-in-out 4; z-index:8; }
  @keyframes findflash { 50% { box-shadow:0 0 0 3px var(--warn), 0 0 18px var(--warn); } }
  .cell.drop { outline:2px dashed var(--warn); outline-offset:-1px; z-index:7; }
  .cell.variantdrop { outline:2px dashed var(--good); }
  .badge { position:absolute; right:1px; bottom:1px; background:#000a; color:var(--warn);
           font-size:9px; padding:0 3px; border-radius:2px; pointer-events:none; }
  /* PREFERENCES > HIGHLIGHT TINT on the selected cell's portrait (and on a
     selected random cell's icon, which is that cell's portrait). The filter is
     the one applyTint() keeps current, so moving a slider retints it live. */
  .cell img.tint, img.randicon.tint { filter:url(#eselTint); }
  /* PREFERENCES > SHOW "HIDDEN" INDICATOR: an eye with a slash in the cell's
     top-right corner, on a dark pill so it reads over any portrait. Colored
     per value, as VSelect does: 1 amber, 2 red, 3 violet. It lives in
     .marks, a flat layer over the projected strips (see drawGrid), and never
     takes the pointer: the cell under it keeps every click, drag and drop.
     ITS OWN LEVEL, z-index 5. drawCursors lifts the SELECTED cell's row strip
     to 5 so the cursor's overhang clears the row below, and a strip that high
     painted its portraits and cursor over a layer with no z-index: the badge
     vanished from the one cell being looked at, and from any other in its row
     whose portrait covers the corner. At 5, and after every strip in the DOM,
     no strip paints over a mark. That also puts the marks over the pack's
     front layer (.bgpane.over, 4): they are the editor's marks, not the
     pack's art, and a mark a screenpack can hide is no mark at all. */
  .marks { position:absolute; left:0; top:0; width:0; height:0; pointer-events:none; z-index:5; }
  .hidbadge { position:absolute; padding:1px; background:rgba(0,0,0,.6); line-height:0; }
  .hidbadge svg { width:100%; height:100%; display:block; }
  .hidbadge[data-h="1"] { color:var(--warn); }
  .hidbadge[data-h="2"] { color:var(--bad); }
  .hidbadge[data-h="3"] { color:var(--sz); }
  .hidbadge.dim { opacity:.45; }
  /* PREFERENCES > DRAG & DROP > SHOW LOCK ICON: a padlock on a locked cell's
     top-left corner, in the same flat layer and at the same size as the hidden
     badge. "While dragging" badges are drawn with the grid and shown only
     while #wrap carries .dragging, so starting a drag costs a class, not a
     redraw. */
  .lockbadge { position:absolute; padding:1px; background:rgba(0,0,0,.6); line-height:0;
               color:var(--hi); }
  .lockbadge svg { width:100%; height:100%; display:block; }
  .lockbadge.dim { opacity:.45; }
  .lockbadge.ondrag { display:none; }
  #wrap.dragging .lockbadge.ondrag { display:block; }
  /* A drop the lock will refuse, shown before the button is let go. */
  .cell.lockeddrop { outline-color:var(--bad); }
  /* The portrait-fault mark shares that corner, so it moves to the one no
     other mark uses (a slot's count is bottom-right, a lock top-left). */
  .cell.hid .badpor { right:auto; top:auto; left:1px; bottom:1px; }
  #celltip .tipline[data-h="1"] { color:var(--warn); }
  #celltip .tipline[data-h="2"] { color:var(--bad); }
  #celltip .tipline[data-h="3"] { color:var(--sz); }
  /* PREFERENCES > SHOW OFFSCREEN CELLS. The screen stops clipping; the room
     the cells need beyond it is a transparent border (see drawGrid), and the
     clear color stays inside the screen so the edge reads. Cells whose middle
     lies off the screen are dimmed and dashed: in game they are not there. */
  #wrap.showoff { overflow:visible; border-style:solid; border-color:transparent; }
  #wrap .screenedge { position:absolute; inset:0; pointer-events:none; z-index:10;
                      box-shadow:0 0 0 1px var(--dim); }
  .slot.offscreen > .box, .slot.offscreen > .cell, .slot.offscreen > img.randicon { opacity:.45; }
  .slot.offscreen > .cell.sel, .slot.offscreen > .cell.hot { opacity:.8; }
  .slot > .offmark { position:absolute; inset:0; border:1px dashed var(--ink); opacity:.75;
                     pointer-events:none; z-index:4; }
  /* PREFERENCES > SHOW PORTRAITS IN LISTS off: a row with no picture. */
  .row.noport { grid-template-columns:1fr; }
  #ins { overflow:auto; padding:10px; }
  .fld { display:grid; grid-template-columns:92px 1fr; gap:6px; align-items:center;
         margin-bottom:6px; }
  .fld label { color:var(--dim); font-size:11px; }
  .fld input, .fld select, .mus input, .mus select, .kvrow input, .slotmem input {
    border-radius:3px; padding:3px 5px; font:inherit; width:100%; }
  /* The list a native select drops down is painted by the OS, not by the page,
     unless the option colors are set too. */
  .fld select option, .mus select option { background:#14141a; color:var(--ink); }
  .grp { margin:10px 0 6px; color:var(--accent); font-size:11px;
         border-bottom:1px solid var(--line); padding-bottom:3px; }
  .hint { color:var(--dim); font-size:11px; margin:6px 0; }
  /* Collapsible property blocks, matching the shape VSelect uses: ABOUT,
     SETTINGS COMMON, SETTINGS ADVANCED, CUSTOM. */
  .blk > .grp { cursor:pointer; user-select:none; display:flex; align-items:center; gap:5px; }
  .blk > .grp .tw { width:9px; display:inline-block; color:var(--dim); }
  .blk.shut > .body { display:none; }
  .about { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:11px;
           padding:2px 2px 6px; }
  .about dt { color:var(--dim); }
  .about dd { margin:0; color:var(--ink); overflow:hidden; text-overflow:ellipsis; }
  .fld.chk { display:flex; align-items:center; gap:8px; }
  .fld.chk input { width:auto; }
  .fld .dots { padding:0 6px; }
  .kvrow { display:grid; grid-template-columns:1fr 1fr auto; gap:4px; margin-bottom:4px; }
  /* A finding about the CHARACTER, not about anything the user did. Amber
     rather than red: nothing is broken in the roster, the art is simply not
     what a cell portrait has to be. */
  .diag { display:flex; gap:6px; align-items:flex-start; margin:6px 0 2px;
          padding:6px 8px; border-radius:4px; font-size:11px;
          color:#e8d8b8; cursor:help; }
  .diag .ico { color:var(--warn); font-weight:700; line-height:1.3; }
  .diag b { color:var(--warn); font-weight:600; }
  .diag .more { color:var(--dim); display:block; margin-top:3px; }
  /* A music prefix is a LIST of tracks, each with its own volume and loop
     points, so it needs more than one field. */
  .mus { margin-bottom:6px; }
  .mus > .head { display:flex; align-items:center; gap:4px; }
  .mus > .head label { width:92px; flex:none; color:var(--dim); font-size:11px; }
  .mus > .head input { flex:1; min-width:0; }
  .mus .mbtn { padding:1px 6px; font-size:11px; line-height:1.4; }
  /* Extra tracks are ALWAYS visible - they are the thing you just added, and
     hiding them behind the same fold as the numbers made an added track look
     like nothing had happened. The fold covers the volume and loop numbers
     only, which is what its tooltip says it does. */
  .mus .tracks { padding:3px 0 2px 92px; }
  .mus .trk { border-left:2px solid var(--line); padding:3px 0 3px 6px; margin-bottom:3px; }
  .mus .trk .path { display:flex; gap:4px; align-items:center; }
  .mus .trk .path select { flex:1; min-width:0; }
  .mus .nums { display:none; grid-template-columns:auto 1fr auto 1fr auto 1fr; gap:3px;
               align-items:center; margin-top:3px; font-size:10px; color:var(--dim); }
  .mus.open .nums { display:grid; }
  .mus .nums input { min-width:0; padding:2px 4px; font-size:11px; }
  .mus > .head select { flex:1; min-width:0; }
  .mus .headnums { padding:3px 0 0 92px; }
  .kvrow input { min-width:0; }
  /* THE STATUS BAR MUST NEVER CHANGE HEIGHT.
     The page is `grid-template-rows: auto 1fr auto`, so every line the footer
     gains is a line the STAGE loses - and the stage has a ResizeObserver that
     refits the zoom, so the whole preview lurched whenever the cursor crossed a
     cell whose label was long enough to wrap. Character names carry their
     authors, and a shared slot carries all of them:
     "CVS_Makoto [by KojiroBADNESS edited by varo_hades] (2 variants)" is one
     ordinary cell. So the bar is pinned to one line and the label ellipsizes;
     the full text stays available as the element's own tooltip, and it is on
     the cell's tooltip and in the properties panel besides. */
  footer { display:flex; gap:16px; align-items:center; padding:6px 12px;
           background:var(--panel); border-top:1px solid var(--line); color:var(--dim);
           overflow:hidden; white-space:nowrap; }
  /* min-width:0 is what actually lets a flex item shrink below its content -
     without it the label pushes the bar wider instead of ellipsizing. */
  #hover { color:var(--ink); flex:1 1 auto; min-width:0;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* The grid readout is short and fixed, so it keeps its full width and the
     label is the thing that gives way. */
  #geom { flex:0 0 auto; white-space:nowrap; }
  #geom.editable { cursor:pointer; }
  #geom.editable:hover { color:var(--accent); text-decoration:underline; }
  #geom .over { color:var(--warn); }
  /* A status bar is not a toolbar, so this is sized to sit inside the line
     rather than interrupt it - but it is a real button, because it does
     something irreversible-ish and should look like it can be pressed. */
  #geom button.rescue { font: inherit; font-size: 10px; padding: 1px 7px;
    margin-left: 4px; vertical-align: baseline; cursor: pointer;
    background: var(--face, #1f1a2e); color: var(--warn);
    border: 1px solid var(--warn); border-radius: 0; }
  #geom button.rescue:hover { background: var(--warn); color: var(--bg, #0d0a14); }
  .gridform { display:grid; grid-template-columns:auto 1fr auto 1fr; gap:6px 8px;
              align-items:center; padding:10px; }
  .gridform label { color:var(--dim); font-size:11px; }
  .gridform input { border-radius:3px; padding:3px 5px; font:inherit; width:100%; min-width:0; }
  .gridform .wide { grid-column:1 / -1; }
  /* VSelect labels the cell under the cursor, right at the cursor. A native
     `title` would do it a second late and in the OS font; this matches. */
  /* A SKIPSLOT IS INVISIBLE IN GAME AND MUST NOT BE INVISIBLE HERE. The
     engine draws nothing for it - not even the empty box - and the cursor
     jumps over it, which is exactly right on the select screen and useless in
     an editor: a skipslot and a cell past the end of the roster then look
     identical, and one of them is a thing you placed. The marker is editor
     furniture, deliberately unlike any motif art. */
  /* A SLOT ADVERTISES THAT IT TAKES DROPS, with a moving dotted border. The
     motion is what separates "this cell can accept a character" from any
     static outline the editor already uses for selection and hover. */
  /* A SHARED CELL IS MARKED BY ITS COUNT, NOT BY A PERMANENT ANIMATION.
     The dashed outline used to sit on every slot cell for ever, animating
     outline-offset from -2 to -6 and snapping back - which reads as the border
     shrinking and popping, not as movement. The (2) badge already says what the
     cell is, so the border now appears only while that slot is OPEN in the
     side panel: an indicator of what you are editing rather than decoration. */

  /* Marching ants, done the way they actually work: four dashed edges whose
     gradients slide by exactly one dash period. Top travels right, right down,
     bottom left, left up - which reads as one band turning clockwise. Animating
     background-position moves the dashes; animating outline-offset only moves
     the whole outline in and out, which is what looked wrong. */
  .cell.slotfocus::before {
    content:''; position:absolute; inset:0; pointer-events:none; z-index:4;
    background-image:
      repeating-linear-gradient(90deg, var(--good) 0 4px, transparent 4px 8px),
      repeating-linear-gradient(90deg, var(--good) 0 4px, transparent 4px 8px),
      repeating-linear-gradient(0deg,  var(--good) 0 4px, transparent 4px 8px),
      repeating-linear-gradient(0deg,  var(--good) 0 4px, transparent 4px 8px);
    background-size: 100% 2px, 100% 2px, 2px 100%, 2px 100%;
    background-position: 0 0, 0 100%, 0 0, 100% 0;
    background-repeat: no-repeat;
    animation: slotmarch .6s linear infinite;
  }
  @keyframes slotmarch {
    to { background-position: 8px 0, -8px 100%, 0 -8px, 100% 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cell.slotfocus::before { animation:none; }
  }

  .cell.skipcell { box-shadow:inset 0 0 0 1px rgba(255,140,26,.35); }
  .cell.skipcell::after { content:''; position:absolute; inset:0;
    background:repeating-linear-gradient(45deg, transparent 0 5px,
                                         rgba(255,140,26,.16) 5px 10px); }
  /* Ground the SCREENPACK reserves, drawn even where the roster has no entry.
     Dimmer than a skipslot's orange: a skipslot is a decision in YOUR build,
     this is the pack telling you its artwork sits here. */
  .cell.packreserved::after { content:''; position:absolute; inset:0;
    background:repeating-linear-gradient(45deg, transparent 0 6px,
                                         rgba(150,160,190,.14) 6px 12px); }
  .cell.excluded::after { content:''; position:absolute; inset:0;
    background:repeating-linear-gradient(-45deg, transparent 0 4px,
                                         rgba(255,80,80,.28) 4px 8px); }

  /* RIGHT-CLICK MENU. One renderer for both the cell menus and their
     submenus, so a submenu is just a nested item list. */
  .menu { position:fixed; z-index:120; min-width:190px; padding:4px 0;
          border-radius:5px; font-size:12px; color:var(--ink); }
  .menu .mhead { padding:5px 12px 7px; font-weight:700; color:var(--ink);
                 border-bottom:1px solid #3a3a46; margin-bottom:4px; }
  .menu .msep { height:1px; margin:4px 0; }
  .menu .mi { padding:5px 12px; cursor:default; display:flex; align-items:center;
              gap:8px; white-space:nowrap; }
  .menu .mi.off { color:#5c5c68; }
  .menu .mi.off:hover { background:none; }
  .menu .mi .arrow { margin-left:auto; color:var(--dim); }

  /* The Insert/Replace picker. */
  .picker { position:fixed; z-index:130; left:50%; top:50%;
            transform:translate(-50%,-50%); width:340px; max-height:70vh;
            display:grid; grid-template-rows:auto auto minmax(0,1fr) auto;
            border-radius:6px; overflow:hidden; }
  .picker .phead { padding:8px 10px; font-weight:600; border-bottom:1px solid #3a3a46; }
  .picker input { margin:8px; padding:6px 8px;
                  border-radius:4px; font:inherit; min-width:0; }
  .picker .plist { overflow:auto; padding:0 8px 8px; }
  .picker .prow { display:flex; gap:8px; justify-content:flex-end;
                  padding:8px 10px; border-top:1px solid #3a3a46; }
  .picker .prow .left { margin-right:auto; }
  /* The character picker's line for a refusal, above its buttons. */
  .picker.chars { grid-template-rows:auto auto minmax(0,1fr) auto auto; }
  .picker .pwhy { padding:6px 10px; border-top:1px solid #3a3a46; color:var(--warn);
                  font-size:12px; line-height:1.4; }
  .picker.modal { width:420px; grid-template-rows:auto auto auto auto; }
  .picker .phead.slot { color:var(--warn); display:flex; align-items:center; }
  .picker .phead .x { margin-left:auto; padding:0 6px; }
  .slotmem { border-radius:5px; padding:6px; margin:6px 0; }
  .slotmem .top { display:flex; gap:8px; align-items:center; margin-bottom:5px; }
  .slotmem .top img { width:34px; height:34px; object-fit:cover; image-rendering:pixelated;
                      border:1px solid var(--line); border-radius:3px; }
  .slotmem .top .nm { font-weight:600; color:var(--warn); }
  .slotmem .fld label { width:64px; }
  .backdrop { position:fixed; inset:0; z-index:125; background:#0006; }

  #celltip { position:fixed; z-index:50; pointer-events:none;
             border-radius:4px; padding:3px 7px; font-size:12px; color:var(--ink);
             white-space:nowrap; }
  /* A REAL SECTION OF THE PANEL, not a floating box. It used to be
     position:fixed at a hardcoded 234px wide, so it sat on top of the library
     list, ignored the splitter, and covered whatever was underneath. */
  #log { overflow:auto; min-height:0;
         border-top:1px solid var(--line);
         padding:6px 8px; font-size:11px; color:var(--dim); }
  #log div.act { color:var(--good); }
  .dirty { color:var(--warn); }

  /* ---- dropping a character straight onto the editor ----
     Full-window, because aiming at a panel is a worse experience than aiming
     at the app, and because there is only one thing you can drop here. */
  #dropveil { position: fixed; inset: 0; z-index: 200; display: none;
    align-items: center; justify-content: center; pointer-events: none;
    background: rgba(10,12,18,.72); backdrop-filter: blur(2px); }
  #dropveil.on { display: flex; }
  #dropveil .card { border-radius: 14px; text-align: center; font-size: 15px; }
  #dropveil .card b { display: block; font-size: 18px; margin-bottom: 6px; }
  #dropveil .card span { color: var(--dim, #9aa0b4); font-size: 13px; }


/* ══════════════════════════════════════════════════════════════════════
   BLOCK B — append at the very END of grid.html's <style> block.

   grid.html has its OWN token names: text is --ink, not --text, and --bg
   is the deep ground (#07060c), not the mid value. It has no --sunk, no
   --raise, no --ground and no --fu. Everything below is written in grid's
   own vocabulary; do not paste Block A here.
   ══════════════════════════════════════════════════════════════════════ */

:root{
  --well: #07060c;
  --face: var(--panel2);
  --key: var(--line); --key-lv: var(--line2); --key-hi: var(--accent);
  --rail: 2px; --lead: 2px; --r-art: 6px; --r-thumb: 3px; --hi: #fff;
}

*, *::before, *::after{ border-radius: 0 !important; }
/* Character art. `#ins img` is the inspector's 44px portrait, whose radius
   is an inline style inside a JS string literal in drawInspector — the
   law line's !important is the only thing that reaches it, and this is
   the only thing that gives it back. */
.row img, .ordrow img, .slotmem .top img{ border-radius: var(--r-thumb) !important; }
#ins img{ border-radius: var(--r-art) !important; }
/* A point marker with no corners to soften. */
.cell .badpor{ border-radius: 50% !important; }

/* ---- FOCUS. This file had ZERO focus rules across 4590 lines: ten
   header buttons, four tabs, a search field, a context menu and a modal
   picker with no keyboard state at all. This is the first fix, before
   anything cosmetic. */
:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary:focus-visible{ outline-color: var(--hi); }
.tab:focus-visible, .row:focus-visible, .menu .mi:focus-visible{ outline-offset: -2px; }

/* ---- buttons, same ladder --------------------------------------------
   PRIMARY MOVES FROM GREEN TO ACCENT: one program, one primary. Save at
   rest is `disabled`, so the disabled-primary style is what you see most
   of the time — a dimmed orange outline that says "this exists and has
   nothing to do". One change and it fills solid. */
button{
  background: var(--face); color: var(--ink);
  border: 1px solid var(--key); padding: 4px 10px; box-shadow: none;
  transition: background-color .1s linear, border-color .1s linear, color .1s linear;
}
button:hover{
  background: color-mix(in srgb, var(--ink) 6%, var(--face));
  border-color: var(--key-lv); color: var(--hi);
}
button:active{ background: var(--well); border-color: var(--key-hi); color: var(--accent); }
button:disabled, button:disabled:hover{
  opacity: 1; background: transparent; border-color: var(--key);
  color: var(--mute); cursor: default;
}
button.primary{
  background: var(--accent); border-color: var(--accent);
  color: var(--accent-ink); font-weight: 700;
}
button.primary:hover{
  background: color-mix(in srgb, var(--hi) 14%, var(--accent));
  border-color: color-mix(in srgb, var(--hi) 14%, var(--accent));
  color: var(--accent-ink);
}
button.primary:active{
  background: color-mix(in srgb, #000 22%, var(--accent));
  border-color: color-mix(in srgb, #000 22%, var(--accent));
  color: var(--accent-ink);
}
button.primary:disabled, button.primary:disabled:hover{
  background: transparent;
  border-color: color-mix(in srgb, var(--accent) 45%, var(--key));
  color: color-mix(in srgb, var(--accent) 60%, var(--mute));
}
.ahead .x{ background: none; border: 0; }
.ahead .x:hover{ background: none; color: var(--ink); }

/* ---- tabs: the same track-and-travel, one line ---------------------- */
.tab{ border-bottom: var(--rail) solid var(--key); color: var(--dim); }
.tab:hover{ background: none; color: var(--ink); border-bottom-color: var(--key-lv); }
.tab.on{ color: var(--ink); border-bottom-color: var(--accent); }

/* ---- the segmented bank shares its edges ---------------------------- */
.seg{ gap: 0; }
.seg button + button{ margin-left: -1px; }
.seg button.on{
  position: relative; z-index: 1;
  background: var(--face); border-color: var(--accent); color: var(--ink);
  box-shadow: inset 0 calc(var(--rail) * -1) 0 var(--accent);
}

/* ---- inputs ---------------------------------------------------------- */
#search, .fld input, .fld select, .mus input, .mus select, .kvrow input,
.slotmem input, .gridform input, table.mm input, .picker input{
  background: var(--well); color: var(--ink);
  border: 1px solid var(--key); border-bottom-color: var(--key-lv);
}
#search:focus, .fld input:focus, .fld select:focus, .mus input:focus,
.mus select:focus, .kvrow input:focus, .slotmem input:focus,
.gridform input:focus, table.mm input:focus, .picker input:focus{
  border-color: var(--key-hi);
  box-shadow: inset 0 calc(var(--rail) * -1) 0 var(--key-hi);
}
select option{ background: var(--panel); color: var(--ink); }
input[type=checkbox], input[type=radio]{ accent-color: var(--accent); }

/* ---- library rows: the same lead-edge language --------------------- */
.row{ border-left: var(--lead) solid transparent; padding: 4px 4px 4px 2px; }
.row:hover{ background: var(--panel2); border-left-color: var(--key-lv); }
.row.inbuild{
  opacity: 1;
  background-image: repeating-linear-gradient(45deg,
    var(--key-lv) 0 2px, transparent 2px 5px);
  background-repeat: no-repeat; background-size: 3px 100%;
}
.row.inbuild img{ filter: grayscale(1); }
.row.inbuild .nm{ color: var(--dim); }
/* a hover face standing in for a hidden portrait is a whole body: crop to the head */
img[src*="as=face"]{ object-position: 50% 0; }
.picker .row.on{
  background: color-mix(in srgb, var(--accent) 12%, var(--panel));
  border-left-color: var(--accent);
  outline: 1px solid var(--accent); outline-offset: -1px;
}
.ordgrp.drop{ border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--panel)); }

/* ---- floaters: a hard keyline gutter, not a blur -------------------- */
.menu{
  background: var(--panel2); border: 1px solid var(--key-lv);
  box-shadow: 0 0 0 3px var(--bg);
}
.menu .mhead{ border-bottom-color: var(--key); }
.menu .msep{ background: var(--key); }
.menu .mi:hover{ background: color-mix(in srgb, var(--ink) 8%, var(--panel2)); }
.picker{
  background: var(--panel); border: 1px solid var(--key-lv);
  box-shadow: 0 0 0 3px var(--bg);
}
.picker .phead{ border-bottom-color: var(--key); }
.picker .prow{ border-top-color: var(--key); }
.picker .pwhy{ border-top-color: var(--key); }
#celltip{
  background: var(--well); border: 1px solid var(--key-lv);
  box-shadow: 0 0 0 2px var(--bg);
}
#slotPane{ background: var(--panel); }
#log{ background: var(--well); }
.slotmem{
  background: var(--panel2); border: 1px solid var(--key);
  border-left: 3px solid var(--warn);
}
.diag{
  background: var(--panel2); border: 1px solid var(--key);
  border-left: 3px solid var(--warn);
}

/* ---- the drop veil: the program's second and last set of ticks ------ */
#dropveil .card{
  position: relative; background: var(--panel); color: var(--ink);
  border: 1px solid var(--accent); padding: 28px 40px;
  box-shadow: 0 0 0 3px var(--bg);
}
#dropveil .card::before, #dropveil .card::after{
  content: ''; position: absolute; width: 12px; height: 12px;
  border: var(--rail) solid var(--accent); pointer-events: none;
}
#dropveil .card::before{ left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
#dropveil .card::after{ right: -1px; bottom: -1px; border-left: 0; border-top: 0; }

/* ---- scrollbars: six scrollable panes, none of them styled ---------- */
::-webkit-scrollbar{ width: 9px; height: 9px; }
::-webkit-scrollbar-track{ background: var(--well); }
::-webkit-scrollbar-thumb{
  background: var(--key-lv); border: 2px solid var(--panel); border-radius: 0;
}

/* ---- 17. THE SELECT WAS STILL WEARING THE OPERATING SYSTEM ----------
   Everything above set the select's color, its keyline and its corners,
   and it still did not match the buttons beside it - because a select
   defaults to `appearance: auto`, which tells the engine to paint its
   OWN control on top: a shaded well, a rounded seam and a separator
   pillar for the arrow. That is a bezel drawn by WebView2, and no amount
   of background-color reaches it. `appearance: none` is the whole fix;
   everything after it is putting back the one part that was worth having.

   THE CARET IS DRAWN, NOT SHIPPED. Two 45-degree gradients meeting at a
   point make a chevron with no font, no SVG and no data URI - so it
   inherits the ink color and changes with state like the keyline does,
   instead of being a fixed-color glyph that goes wrong on hover. */
select{
  appearance: none; -webkit-appearance: none; -moz-appearance: none;
  padding: 5px 26px 5px 8px;      /* room for the caret on the right */
  background-image:
    linear-gradient(45deg,  transparent 50%, currentColor 50%),
    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right 13px center, right 9px center;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
  color: var(--ink);
  cursor: pointer;
}
/* The caret is `currentColor`, so it travels with the label. */
select:hover{ border-color: var(--key-lv); color: var(--hi); }
select:focus{ color: var(--hi); }
select:disabled{ color: var(--dim); border-color: var(--key); cursor: default; }
/* The dropped list is painted by the OS and is not ours to style; giving
   the options the panel value is as far as the page reaches. */

/* ══════════════════════════════════════════════════════════════════════
   E-SELECT: the title row, its three menus, Preferences and About.

   Modeled on VSelect 2.0.3 (docs/design-mockups/vselect-2.0.3): its
   structure, order, spacing and sizes, drawn in this program's look
   tokens so all three looks hold. Corners stay square by the law line
   above. Stated last so it outranks the generic button, select and menu
   rules it builds on.
   ══════════════════════════════════════════════════════════════════════ */

/* VSelect's Launch is green, and so is ours: the one button in the row
   that leaves the editor for the game. High contrast keeps it. */
:root{ --launch: #2e9e4f; --launch-ink: #fff;
       --fu: "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; }

/* THE ROW WRAPS instead of squeezing. On a narrow window the toolbar drops
   to a second line as one block; the stage's ResizeObserver refits the
   grid to whatever height is left.
   THE ROW IS SET IN THE UI FACE, as VSelect's is. The panels below keep the
   monospace; in it, VSelect's toolbar at VSelect's sizes was a third wider
   and wrapped onto a second line on an ordinary 1400px window. */
header{ flex-wrap: wrap; gap: 6px 8px; font-family: var(--fu); }
#menuBtn{
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  padding: 4px 10px; font-size: 16px; line-height: 1;
}
#menuBtn:hover{
  background: color-mix(in srgb, var(--hi) 14%, var(--accent));
  border-color: color-mix(in srgb, var(--hi) 14%, var(--accent)); color: var(--accent-ink);
}
#menuBtn:active, #menuBtn[aria-expanded="true"]{
  background: color-mix(in srgb, #000 22%, var(--accent));
  border-color: color-mix(in srgb, #000 22%, var(--accent)); color: var(--accent-ink);
}
.appname{ font: 600 17px/1 var(--fd); color: var(--hi); white-space: nowrap; }
/* THE PATH IS TWO MENUS. Each word opens its own, so each wears VSelect's
   dashed underline: a link-ish affordance that is not a link. */
.crumb{ display: flex; align-items: baseline; gap: 6px; min-width: 0;
        font-size: .85rem; color: var(--dim); }
.crumb .psep{ color: var(--mute); }
.crumb .pword{ cursor: pointer; white-space: nowrap; border-bottom: 1px dashed; }
.crumb .pword:focus-visible{ outline-offset: 1px; }
#engineWord{ color: var(--ink); border-bottom-color: color-mix(in srgb, var(--ink) 40%, transparent); }
#engineWord:hover, #engineWord[aria-expanded="true"]{
  color: var(--hi); border-bottom-color: color-mix(in srgb, var(--hi) 80%, transparent); }
#packWord{ color: var(--accent); max-width: 34ch; overflow: hidden; text-overflow: ellipsis;
           border-bottom-color: color-mix(in srgb, var(--accent) 40%, transparent); }
#packWord:hover, #packWord[aria-expanded="true"]{
  color: color-mix(in srgb, var(--hi) 35%, var(--accent));
  border-bottom-color: color-mix(in srgb, var(--hi) 35%, var(--accent)); }
.crumb .by{ color: var(--dim); white-space: nowrap; }
/* The note takes the room that is left and ellipsizes in it, so a long
   "written as you make them" line never pushes the toolbar onto a second
   row - which would refit the grid every time the note changed. That makes
   it the row's spacer as well, so the empty .spacer before it stands down:
   sharing the room with it cut "unsaved changes" to "unsa...". */
header > .spacer{ display: none; }
#dirty{ flex: 1 1 0; min-width: 0; text-align: right;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* .3rem, not .4: at the default window (1400 wide, 1366 on many laptops) the
   room the tighter gaps give back is what keeps "unsaved changes" whole
   beside the toolbar on one row. */
#toolbar{ display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; margin-left: auto; }
#toolbar[hidden]{ display: none; }
#toolbar button, #toolbar #zoomLbl{ font-size: .8rem; }
#toolbar #zoomLbl{ min-width: 4ch; text-align: center; }
#toolbar .tsep{ width: 1px; height: 20px; background: var(--line2); flex: none; }
/* DISABLED LOOKS DISABLED, in every look. The page-wide ladder gives a
   disabled button only a lighter text, and in High contrast that text is
   near-white - Undo with nothing to undo read exactly like Redo with a step
   to redo. Faded as a whole, it says "not now" in all three. A primary
   (Save at rest) keeps its own outline look, which already reads as off. */
#toolbar button:disabled:not(.primary), .edlg button:disabled:not(.primary),
.picker button:disabled:not(.primary){ opacity: .45; }
button.launch{
  background: var(--launch); border-color: var(--launch); color: var(--launch-ink); font-weight: 600;
}
button.launch:hover{
  background: color-mix(in srgb, #fff 14%, var(--launch));
  border-color: color-mix(in srgb, #fff 14%, var(--launch)); color: var(--launch-ink);
}
button.launch:active{
  background: color-mix(in srgb, #000 22%, var(--launch));
  border-color: color-mix(in srgb, #000 22%, var(--launch)); color: var(--launch-ink);
}

/* ---- the menus -------------------------------------------------------
   One renderer serves the right-click menus and the three header menus.
   The right-click ones keep their density; the header ones (.hdr) take
   VSelect's proportions. The keyboard highlight (.hl) looks like hover,
   because it is the same thing reached another way. */
.menu .mi.hl{ background: color-mix(in srgb, var(--ink) 8%, var(--panel2)); }
.menu .mi .mcheck{ width: 1em; text-align: center; }
.menu .mi .mkey{ margin-left: auto; padding-left: 24px; color: var(--mute); font-size: .8em; }
.menu .mi.state{ opacity: .7; }
.menu.hdr{
  font: 13px/1.35 var(--fu); color: var(--ink);
  background: var(--panel2); border: 1px solid var(--line2);
  box-shadow: 2px 2px 8px rgba(0,0,0,.5); padding: 4px 0;
  max-width: min(720px, calc(100vw - 8px));
}
.menu.hdr.main{ min-width: 220px; }
.menu.hdr.path{ min-width: 260px; }
.menu.hdr.main .mi{ padding: 6px 16px; }
.menu.hdr.path .mi{ padding: 5px 14px; }
.menu.hdr .mi:hover, .menu.hdr .mi.hl{ background: var(--plate); }
.menu.hdr .mi.off{ color: var(--mute); }
/* High contrast's --mute is a near-white, which left a disabled Save or
   Undo looking exactly like the items around it. Its keyline gray still
   reads at better than 5:1 on the panel and does say "not now". */
:root[data-look="contrast"][data-paper="night"] .menu.hdr .mi.off{ color: var(--line); }
.menu.hdr .mi.off:hover{ background: none; }
/* A disabled item's shortcut is as disabled as its label. (In Energy and
   Blue both were --mute already; in High contrast the key stayed bright.) */
.menu.hdr .mi.off .mkey{ color: inherit; }
/* HIGH CONTRAST'S HIGHLIGHT. --line there is a mid gray, and white text on
   it read at 3.4:1, the shortcut at 2.2:1 - the highlighted row was the
   hardest thing on screen to read. A near-black fill with a white keyline
   keeps every color on it above 6:1 and still marks the row. */
:root[data-look="contrast"][data-paper="night"] .menu.hdr .mi:hover,
:root[data-look="contrast"][data-paper="night"] .menu.hdr .mi.hl,
:root[data-look="contrast"][data-paper="night"] .motifs .mrow:hover,
:root[data-look="contrast"][data-paper="night"] .motifs .mrow:focus-visible{
  background: #333; outline: 1px solid var(--ink); outline-offset: -1px;
}
:root[data-look="contrast"][data-paper="night"] .menu.hdr .mi.off:hover{ background: none; outline: none; }
.menu.hdr .mi.state{ color: var(--ink); }
.menu.hdr .msep{ height: 1px; margin: 4px 0; background: var(--line2); }
/* The path line: a fact to read (and copy), not a command. */
.menu.hdr .mhead{
  font: .75em/1.4 var(--fm); font-weight: 400; color: var(--mute);
  padding: 6px 14px 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line2);
  white-space: normal; overflow-wrap: anywhere; user-select: text;
}

/* ---- dialogs ---------------------------------------------------------
   VSelect's frame: a dimmed overlay, a header with a close, a body that
   scrolls on its own and a footer that stays put. */
.edlg-back{ position: fixed; inset: 0; z-index: 135; background: rgba(0,0,0,.55);
            display: flex; align-items: center; justify-content: center; }
.edlg{
  width: min(440px, 90vw); max-height: 85vh; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line2);
  box-shadow: 0 8px 32px rgba(0,0,0,.6);
  font: 14px/1.45 var(--fu);
}
.edlg .ehead{ display: flex; align-items: center; gap: 10px; padding: 10px 14px;
              border-bottom: 1px solid var(--line2); }
.edlg .ehead .t{ flex: 1; font-size: 1rem; font-weight: 600; }
.edlg .ehead .x{ background: none; border: 1px solid transparent; color: var(--dim);
                 font-size: 1.4rem; line-height: 1; padding: 0 6px; }
.edlg .ehead .x:hover{ background: none; border-color: var(--key-lv); color: var(--hi); }
.edlg .ebody{ flex: 1 1 auto; min-height: 0; overflow: auto; padding: 14px 18px; }
.edlg .efoot{ display: flex; align-items: center; justify-content: flex-end; gap: 8px;
              padding: 10px 14px; border-top: 1px solid var(--line2); }
.edlg .efoot .left{ margin-right: auto; }
.edlg button{ padding: 5px 12px; }
.edlg .ehead .x{ padding: 0 6px; }
.edlg button.armed, .edlg button.armed:hover{ border-color: var(--warn); color: var(--warn); }
.edlg .emsg{ margin: 0 0 10px; }
.edlg .emsg:last-child{ margin-bottom: 0; }
.edlg .emsg.bad{ color: var(--warn); }
.edlg a{ color: var(--act, var(--accent)); text-decoration: none; }
.edlg a:hover{ text-decoration: underline; }

/* ---- Preferences ------------------------------------------------------ */
.prefs .psec + .psec{ border-top: 1px solid var(--line2); margin-top: 14px; padding-top: 14px; }
.prefs .ptitle{ font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
                color: var(--mute); margin-bottom: 10px; }
.prefs .prow{ display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.prefs .plabel{ flex: 0 0 180px; font-size: .9rem; }
.prefs .pctl{ display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.prefs .prow.child .plabel{ padding-left: 16px; font-style: italic; color: var(--dim); }
.prefs .prow.off .plabel{ color: var(--mute); }
.prefs .phelp{ margin: -2px 0 10px 190px; font-size: .8rem; color: var(--mute); }
.prefs .phelp.bad{ color: var(--warn); }
.prefs input[type=text], .prefs select{

}
.prefs input[type=text]{ padding: 3px 6px; }
.prefs select{ padding: 3px 26px 3px 6px; }
.prefs input[type=text]:focus-visible, .prefs select:focus-visible{ outline: none; border-color: var(--accent); }
.prefs input[type=text]:disabled, .prefs select:disabled{ color: var(--mute); cursor: default; border-style: dashed; }
/* High contrast's --mute is near-white: a disabled field and its label must
   still read as "not now" next to the white enabled ones. */
:root[data-look="contrast"][data-paper="night"] .prefs input[type=text]:disabled,
:root[data-look="contrast"][data-paper="night"] .prefs select:disabled,
:root[data-look="contrast"][data-paper="night"] .prefs .prow.off .plabel{ color: var(--line); }
.prefs .grow{ flex: 1; }
.prefs .spr{ width: 232px; flex: none; }
.prefs .tintctl{ display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }

.prefs .tintctl .sl .n{ width: 1em; color: var(--dim); }
.prefs .tintctl .sl input{ flex: 1; min-width: 0; accent-color: var(--accent); }
.prefs .tintctl .sl .v{ width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
.prefs .tprev{ display: flex; align-items: center; gap: 10px; margin-top: 4px; font-size: .8rem; color: var(--mute); }
.prefs .tprev img{ height: 64px; width: auto; min-width: 16px; image-rendering: pixelated;
                   filter: url(#eselTint); }

/* ---- About ----------------------------------------------------------- */
.edlg.about .ebody{ padding: 18px 22px 22px; text-align: center; font-size: .9rem; line-height: 1.5; }

/* ---- Open Motif ------------------------------------------------------- */
.motifs .mlist{ display: flex; flex-direction: column; gap: 2px; }

.motifs .mrow.cur{ border-left-color: var(--accent); }
.motifs .mrow .nm{ font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.seldef .deftext{

/* ---- the library panel: VSelect's sidebar proportions ----------------
   The chrome - the tabs, the heading line under them, the search box - is
   set in the UI face at VSelect's sizes (tabs .75rem, 6px 4px; the search
   .8rem); the rows keep their own. Each part ends in a 1px --line2 keyline:
   --line, which the rest of the panel uses, all but vanishes on Energy's
   panel. */
/* EACH TAB AS WIDE AS ITS LABEL, the spare width shared out between them.
   Four equal quarters (VSelect's) need its 300px sidebar: at this panel's
   250px default "Characters" and "Not in build" did not fit a quarter. Sized
   to their labels, all four fit on one line from about 230px. */
.tabs{ display: grid; grid-template-columns: repeat(4, minmax(0, auto));
       border-bottom: 1px solid var(--line2); }
/* Never wrapped: only a panel narrower than the four labels ellipsizes one,
   and the tab's title has it whole. The inactive underline is gone - the
   row's keyline is the track now, and the accent under the open tab is the
   travel. */
.tab{ min-width: 0; padding: 6px 4px; font: 12px/1.35 var(--fu);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      border-bottom-color: transparent; }
#libhead{ display: block; padding: 5px 10px; font: 11px/1.4 var(--fu); color: var(--dim);
          border-bottom: 1px solid var(--line2);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#searchbar{ display: flex; min-width: 0; border-bottom: 1px solid var(--line2); }
#searchbar[hidden]{ display: none; }
#search{ flex: 1 1 auto; margin: 6px 8px; padding: 4px 8px; font: 12px/1.4 var(--fu); }
#search::placeholder{ color: var(--mute); opacity: 1; }
/* The log's handle gets the same keyline along its top edge. */
#splitLog{ border-top: 1px solid var(--line2); }
#splitLog:hover, #splitLog.dragging{ border-top-color: var(--accent); }

/* ---- the Stages tab: the stage tree ------------------------------------
   Modeled on VSelect's: a section header per Included and Excluded, a group
   per stage, the characters under it as Characters-tab rows. Headers are in
   the UI face; the rows are .row and keep the list's own look. */
.sttree{ --stgear: 20px; }
.sttree .sthd, .sttree .sthead{ font: 600 12px/1.4 var(--fu); cursor: pointer; user-select: none; }
/* A stage's name is bold at the rows' own 13px, as VSelect's is bold at its
   list's size, and its count smaller and regular. */
.sttree .sthead{ font: 700 13px/1.4 var(--fu); }
.sthead .stn{ font-size: .85em; }
.stsec{ margin-bottom: 6px; }
.stsec > .sthd{ display: flex; align-items: center; padding: 5px 4px 3px; margin-bottom: 3px;
                font-size: 11px; color: var(--accent); border-bottom: 1px solid var(--line2); }
.stsec.shut > .stbody{ display: none; }
.sttw{ flex: none; width: 18px; text-align: center; font-size: 9px; color: var(--dim); }
.stsec > .sthd .sttw{ width: 14px; text-align: left; }
.stn{ flex: none; margin-left: 4px; color: var(--mute); font-weight: 400; }
.stnote{ padding: 3px 6px 6px; font: italic 11px/1.4 var(--fu); color: var(--mute); }
.stgrp{ margin-bottom: 2px; }
.sthead{ display: flex; align-items: center; min-width: 0; padding: 3px 6px 3px 0;
         color: var(--ink); white-space: nowrap; }
.sthead:hover{ background-color: var(--panel2); }
.stgrp.nostage > .sthead{ color: var(--dim); }
.stnm{ min-width: 0; overflow: hidden; text-overflow: ellipsis; }
/* The ⚙ sits at the header's right end, as VSelect's does. */
.sthead .stgear{ flex: none; width: var(--stgear); margin: 0 0 0 auto; padding: 0; background: none; border: 0;
                 font: 400 12px var(--fu); line-height: inherit; text-align: center; color: var(--dim); }
.sthead .stgear:hover, .sthead .stgear:active{ background: none; color: var(--hi); }
.sthead .stgear:focus-visible{ outline-offset: -2px; }
/* The chip and the marker say two different things: no-random is a choice
   (amber), a missing stage file is a fault (the header goes red). */
.stchip{ flex: none; margin-left: 6px; padding: 0 5px; font: 400 10px/15px var(--fu);
         color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
         background: color-mix(in srgb, var(--warn) 12%, var(--panel)); }
.stwarn{ flex: none; margin-left: 6px; font-weight: 400; color: var(--warn); }
.stgrp.invalid > .sthead{ color: var(--bad); }
.stgrp.shut > .stkids{ display: none; }
/* A GROUP'S ROWS START UNDER ITS NAME, past the caret, as VSelect's sit
   under its header's text: the name begins after the 18px caret, and a row's
   own lead edge and padding are 4px. */
.stkids{ padding-left: 14px; }
/* THE BANNER: VSelect's height, the picture covering the header, the text
   white over it with a dark shadow. VSelect's header is a line of inline
   text at line-height 30px with 9px above and below, and that line box
   grows to 33px around its smaller caret and count: its banner is 51px
   (its own stylesheet, measured in Chromium; 51-52 rows in the owner's
   screenshot). A flex row does not grow that way, so the height is held
   outright. A stage with no picture keeps the height and its own colors.
   THE PICTURE LIES UNDER A DARK SCRIM, as VSelect's does (--stscrim, the
   first layer paintStageBanner sets): a Studio thumbnail is a whole scene,
   often a light sky or floor, and on the bare picture the white name and
   the light count fell to about 3:1. */
.stgrp.banner > .sthead{ line-height: 30px; padding-top: 9px; padding-bottom: 9px; min-height: 51px;
                         background-size: cover; background-position: center; background-repeat: no-repeat;
                         --stscrim: linear-gradient(rgba(20,22,28,.45), rgba(20,22,28,.68)); }
.sthead.pic{ color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.85); }
.sthead.pic .stn{ color: #e0e0e0; }
.sthead.pic .sttw, .sthead.pic .stgear{ color: #e8e8e8; text-shadow: 0 1px 2px rgba(0,0,0,.85); }
.sthead.pic .stgear:hover{ color: #fff; }
/* Selected: an outline round the group and a faint tint on its rows. */
.stgrp.sel{ outline: 1px solid var(--accent); outline-offset: -1px; }
.stgrp.sel > .sthead:not(.pic){ background-color: color-mix(in srgb, var(--accent) 16%, var(--panel)); }
.stgrp.sel > .stkids .row{ background-color: color-mix(in srgb, var(--accent) 8%, transparent); }
.stgrp.sel > .stkids .row:hover{ background-color: var(--panel2); }
/* A drag over a group: tinted and outlined, as the Order tab's groups are,
   the tint laid over a banner's picture too. */
.stgrp.drop{ outline: 1px solid var(--warn); outline-offset: -1px;
             background-color: color-mix(in srgb, var(--warn) 10%, transparent); }
.stgrp.drop > .sthead{ box-shadow: inset 0 0 0 100vmax color-mix(in srgb, var(--warn) 24%, transparent); }

/* ---- the stage details dialog (the ⚙) ---------------------------------- */
.stdlg .stinfo{ display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; margin: 0; }
.stdlg .stinfo dt{ color: var(--dim); }
.stdlg .stinfo dd{ margin: 0; min-width: 0; overflow-wrap: anywhere; }
.stdlg .stinfo dd.mono{ font: 12px/1.6 var(--fm); }
.stdlg .stinfo .names{ margin-top: 2px; }
.stdlg .emsg{ margin: 12px 0 0; font-size: .9rem; }

<script>
const $ = (s) => document.querySelector(s);
// The product and its version: the About box and the title row read these.
const ESELECT_VERSION = '1.0';
let MI = null, LIB = null, zoom = null, order = [], sel = null, dirty = false;
// Folder names on disk (amysorel) and roster mountAs values (AmySorel) differ
// in case. The server compares case-insensitively; the client must too, or
// every character reads as 'library only' while the count says otherwise.
const lc = (s) => String(s).toLowerCase();
const inOrder = (id) => order.some((o) => o.char && lc(o.char) === lc(id));
// IN THE BUILD, OFF THE GRID: characters with exclude = 1. The engine gives
// their cell to the next character (modlib isOffGrid), so they are kept out of
// order[] - every cell walk below stays exactly as it was - and ride along with
// each save instead, which would otherwise drop them from the build.
let offGrid = [];
const isOffGridId = (id) => offGrid.some((o) => lc(o.char) === lc(id));
// EVERY CHARACTER THE LAST LOAD READ FROM THE ROSTER (lowercase mountAs), on
// the grid or off it. A write of the order keeps a character on disk that is
// in neither this set nor the order (withStudioAdds): the Studio added him
// while this page was not looking.
let LOADED = new Set();
// The entry a library character becomes on the grid. One that was off the grid
// leaves that list and carries exclude '' so the save puts it back on. Its
// lock, if it has one, comes along with it (see Locks).
function takeFromLibrary(id) {
  const k = offGrid.findIndex((o) => lc(o.char) === lc(id));
  if (k < 0) return { char: id, slot: '' };
  const was = offGrid.splice(k, 1)[0];
  return Object.assign({ char: id, slot: '', exclude: '' },
    was && isLockOn(was.locked) ? { locked: '1' } : null);
}

// A MOTIF SPRITE'S URL HAS TO NAME ITS MOTIF.
//
// /api/sprite answers with Cache-Control: max-age=300, and every screenpack
// asks for the same char=__motif__&group=150&index=0. So switching packs left
// the browser serving the PREVIOUS pack's cell boxes, cursor and background
// from its own cache for five minutes - ikemen1 came back wearing Big MUGEN1's
// art. Naming the motif keeps the caching and makes the packs distinct.
// PAL_PICK is a PREVIEW, and only that: nothing is written to the roster or
// carried into an export. The game has its own palette selector at the select
// screen; this answers "what does this character look like in pal 7" while you
// are building, and is forgotten when the page reloads.
const PAL_PICK = new Map();

// Every surface that draws a character goes through here, so routing the pick
// through this one helper lights up the cell portrait, the big portrait and the
// animated stance at once.
const sprite = (char, spr, pal) =>
  '/api/sprite?char=' + encodeURIComponent(char) + '&group=' + spr[0] + '&index=' + spr[1]
  + (pal !== undefined && pal !== null && pal !== '' ? '&pal=' + encodeURIComponent(pal) : '')
  + (char === '__motif__' && MI && MI.motif ? '&m=' + encodeURIComponent(MI.motif) : '');
// A character's picture in a list or panel: its cell portrait, or - when the
// pack never shows the cells' portraits (MK II Remix parks them off screen) -
// the hover face the server stands in for it (modlib.portraitStandIn). The
// grid's own cells keep `sprite`, drawn where the engine draws them.
const portraitSrc = (char, pal) => sprite(char, MI.select.portraitSpr, pal) + '&as=face';

// The pick for a character, or undefined. Kept as a function so callers do not
// each have to know PAL_PICK exists.
const palOf = (char) => PAL_PICK.get(String(char || '').toLowerCase());

function log(msg, act) {
  const d = document.createElement('div');
  if (act) d.className = 'act';
  d.textContent = msg;
  $('#log').prepend(d);
  while ($('#log').children.length > 60) $('#log').lastChild.remove();
}
// EVERY CHANGE GOES THROUGH HERE, so Revert can actually undo it.
//
// The editor makes two kinds of change and they used to be undoable to
// different degrees. Grid edits are STAGED - they only move `order[]` until
// Save posts it - so reloading discarded them. But properties, orders and max
// matches POST immediately and write roster.json there and then, so Revert,
// which only reloaded, could not touch them: dragging a character to another
// order and pressing Revert left it in the new order. The button was telling
// the truth about half the actions.
//
// So the session keeps a BASELINE: the whole roster as it was when the session
// began, refreshed after each successful Save because that is the point the
// user has declared to be the new starting state. Revert writes that baseline
// back wholesale and reloads, which undoes both kinds at once and needs no
// per-action inverse. The journal is what the button counts and what the log
// shows; it is a record for the user, not the mechanism.
const Session = {
  baseline: null,
  journal: [],
  // How many STAGED edits (order[] only) are waiting for Save, for the
  // "your N unsaved changes" questions. Cleared whenever order[] is
  // rebuilt from disk, which is exactly when they are gone.
  staged: 0,
  // AN EDIT TYPED INTO THE INSPECTOR AND NOT YET APPLIED. It has written
  // nothing, so it does not belong in the journal - but it is still a change
  // the user made and still something Revert has to be able to clear, because
  // otherwise a half-typed unlock condition sits in the form looking saved with
  // no way back to the original. Revert redraws the inspector from the
  // baseline, which discards it.
  formTouched: null,

  // Called on load and after Save. Cheap: /api/roster reads the file, where
  // /api/studio would rescan every character to answer the same question.
  // THE MOTIF FILE IS PART OF THE BASELINE TOO. The grid's shape - rows,
  // columns, cell size and spacing - lives in the screenpack's system.def, not
  // in the roster, so a baseline of the roster alone could not undo a change to
  // it. Both are captured together and both go back together.
  //
  // EVERY SCREENPACK THE SESSION TOUCHES HAS A BASELINE OF ITS OWN. E-Select
  // can switch packs, and an edit made after a switch writes the NEW pack's
  // system.def - a file the one baseline taken at the start never held. So
  // `packs` keeps, per pack (keyed like /api/motif-select's `motif`), the text
  // it had when this session first saw it: the starting pack here, any other
  // the first time a load shows it (notePack). Revert puts each one back.
  // `packSeen` is the text E-Select last read or wrote for each pack, which
  // is how Revert and Undo tell a file changed OUTSIDE E-Select (Notepad,
  // through Edit system.def) from one they are free to put back.
  packs: new Map(),
  packSeen: new Map(),
  async capture() {
    try {
      this.baseline = await (await fetch('/api/roster')).json();
      this.journal = [];
    } catch (e) {
      this.baseline = null;   // Revert stays honest about what it cannot do
    }
    this.motifBaseline = await readMotif();
    this.packs = new Map();
    this.notePack(this.motifBaseline);
    this.sync();
  },
  notePack(m) {
    if (m && m.rel && !this.packs.has(packKey(m.rel))) this.packs.set(packKey(m.rel), m);
  },

  // Every user-actionable change records itself. `staged` marks the ones that
  // are only in order[] so far, so Save stays the thing that commits them.
  // The same call is where Undo takes its step (historyRecord, below).
  record(label, staged) {
    this.journal.push(label);
    if (staged) { this.staged = (this.staged || 0) + 1; markDirty(true); }
    historyRecord(label, staged);
    this.sync();
  },

  // Typed into a property field but not applied yet.
  touchForm(what) {
    this.formTouched = what || 'property edits';
    this.sync();
  },

  pending() {
    return this.journal.length + (dirty && !this.journal.length ? 1 : 0);
  },

  sync() {
    const btn = $('#revert');
    if (!btn) return;
    const n = this.journal.length;
    const can = (n > 0 || dirty || !!this.formTouched) && !!this.baseline;
    btn.disabled = !can;
    btn.textContent = n > 0 ? 'Revert (' + n + ')' : 'Revert';
    const lines = this.journal.slice(-12);
    if (this.formTouched) lines.push('unapplied: ' + this.formTouched);
    btn.title = !this.baseline
      ? 'No session baseline was captured, so there is nothing to revert to'
      : (can ? 'Undo everything since the session started or was last saved:'
             + String.fromCharCode(10) + lines.join(String.fromCharCode(10))
             : 'Nothing to revert');
    const note = $('#dirty');
    // SCREENPACK EDITS ARE NOT "UNSAVED". The grid size and the empty-cell
    // flags go straight into the pack's system.def when you change them, so
    // Save has nothing to do with them - it saves the cell order and slot
    // properties. They still count in Revert, which restores the pack's file.
    // Saying so here is what stops "Revert (2) but Save is grayed out".
    if (note && !dirty) {
      note.textContent = this.formTouched ? 'unapplied property edits'
        : (n > 0 ? 'screenpack edits are written as you make them · Save is for the cell order' : '');
    }
    syncUndoButtons();
  },

  // Undo and Redo stay off while this runs: one of them writing an older
  // roster between the baseline going back and the reload would leave the
  // page on neither.
  async revert() {
    if (!this.baseline) { log('ERROR nothing to revert to'); return; }
    if (REVERTING) return;
    REVERTING = true;
    syncUndoButtons();
    try {
      await historyMoveDone();
      // Whatever an edit a moment ago is still reading back into the
      // history, so packSeen knows what E-Select itself last wrote.
      await historySettled();
      const n = this.journal.length;
      const r = await (await fetch('/api/roster', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(this.baseline),
      })).json();
      if (r.error) { log('ERROR ' + r.error); return; }
      // EVERY PACK BACK TO ITS OWN TEXT, each named explicitly, so a pack the
      // build switched to and then away from goes back too, and ikemen1's
      // text can never land in Big MUGEN1's file. A pack is written only when
      // it changed, and never over a change made outside E-Select since it
      // last looked (restorePack).
      const left = [];
      for (const first of this.packs.values()) {
        const why = await restorePack(first, 'Revert');
        if (why) left.push(why);
      }
      // The log reads newest first: the reasons go in first, so they sit
      // under the line that points at them.
      for (const why of left) log('WARNING ' + why);
      log('Reverted ' + (n ? n + ' change(s)' : 'unsaved edits') + ' back to the start of the session'
        + (left.length ? ', except ' + plural(left.length, 'screenpack file') + ' left as ' + (left.length === 1 ? 'it is' : 'they are')
          + ' (below)' : ''), true);
      this.journal = [];
      this.formTouched = null;
      PENDING.clear();
      resetHistory();
      await load(true);
    } finally {
      REVERTING = false;
      syncUndoButtons();
    }
  },
};

function markDirty(v) {
  dirty = v;
  $('#save').disabled = !v;
  $('#dirty').textContent = v ? 'unsaved changes' : '';
  if (typeof Session !== 'undefined' && Session.sync) {
    if (!v) Session.staged = 0;
    Session.sync();
  }
}

// LOADS IN FLIGHT, for Undo. An immediate edit writes and then reloads, and
// its undo step has to be taken from what that reload leaves - so the page
// counts its loads, lets the history wait for them to settle, and keeps Undo
// and Redo disabled while one runs. A load nobody claimed (the Studio changed
// the roster with no steps to lose) is handed to historyAfterLoad, which
// brings the current state up to what the page now shows. (A character
// dropped in starts a new history instead: see characterDrop.)
let LOADING = 0;
let LOAD_WAITERS = [];
// THE STUDIO SWITCHED ONE OF THIS PACK'S OWN OPTIONS (a slot count, an
// announcer: the pack-options message below). Same motif, other files - so the
// next load treats it as a new pack: the zoom is released and refitted.
let PACK_SWITCHED = false;
function whenLoadsSettle() {
  return LOADING ? new Promise((r) => LOAD_WAITERS.push(r)) : Promise.resolve();
}
async function load(keepZoom) {
  LOADING++;
  syncUndoButtons();
  try {
    return await loadFromDisk(keepZoom);
  } finally {
    if (--LOADING === 0) {
      const waiting = LOAD_WAITERS;
      LOAD_WAITERS = [];
      for (const r of waiting) r();
      historyAfterLoad();
    }
    syncUndoButtons();
  }
}

async function loadFromDisk(keepZoom) {
  const wasMotif = MI && MI.motif;
  // What the header menus were told about the engine and the pack belongs to
  // the files before this load: a pack switch, an undo or a Studio change
  // would otherwise show the old pack's state for a few seconds.
  ESINFO = null;
  // Neither answer depends on the other, so both are asked at once.
  [MI, LIB] = await Promise.all([fetch('/api/motif-select').then((r) => r.json()),
    fetch('/api/library').then((r) => r.json())]);
  // Both library-derived maps belong to the LIB that has just been replaced.
  AUTHOR_BY_ID = null; ONDISK_IDS = null;
  // maxMatches rides on the same answer. Fetching the whole thing a second
  // time just to read it made every reload slower.
  MM = MI.maxMatches || null;
  if (MI.error) { setCrumb(); $('#wrap').innerHTML = '<div style="color:var(--warn)">' + MI.error + '</div>'; return; }
  // A slot block puts several entries in ONE cell, so render only variant 0
  // and badge the cell - which is what the select screen itself draws.
  // order[] is the flat save list; the grid renders via cellAt(cellIndex).
  // order[] is the flat entry list: characters and placeholders alike, in the
  // sequence the engine consumes them.
  // A slot member's cycle commands ride along, so Save writes back what the
  // roster already holds. They were missing here, and the server read the
  // missing keys as cleared: every Save wiped them (the Makoto cell stopped
  // cycling). The slot pane edits them through /api/char-props and reloads,
  // so this list is rebuilt from the saved values after every such edit.
  // A LOCK RIDES ON ITS ENTRY (see Locks): read here, carried by every edit
  // that moves the entry, and sent back on every entry by Save.
  const lockOf = (c) => (c.props && isLockOn(c.props.locked) ? { locked: '1' } : null);
  order = MI.cells.map((c) => {
    if (c.kind !== 'char') return Object.assign({ kind: c.kind }, lockOf(c));
    const p = c.props || {};
    const e = { char: c.char, slot: p.slot ? p.slot : '' };
    if (p.slot) { e.next = p.next || ''; e.previous = p.previous || ''; }
    return Object.assign(e, lockOf(c));
  });
  offGrid = (MI.offGrid || []).map((c) =>
    Object.assign({ char: c.char, slot: '', exclude: '1' }, lockOf(c)));
  LOADED = new Set(MI.cells.concat(MI.offGrid || []).filter((c) => c.kind === 'char' && c.char).map((c) => lc(c.char)));
  const S = MI.select;
  setCrumb();
  // A DIFFERENT SCREENPACK IS A DIFFERENT SIZE, so a kept zoom is meaningless
  // across one. Packs range from a 320x240 localcoord to 1280x720, and holding
  // the old number after a switch drew the new grid at a fraction of the panel
  // - it only looked right again once a window resize happened to refit it.
  const motifChanged = (wasMotif && MI.motif && wasMotif !== MI.motif) || PACK_SWITCHED;
  PACK_SWITCHED = false;
  // A manual zoom locks out refitting; a new pack releases it, because the
  // number it was holding belonged to the old pack's size. So does every
  // cache taken from the old pack's files - the portrait placement above all,
  // which drew every portrait at the other pack's size after a Revert. And the
  // new pack's screen opens from its start, intro and all (BGLIVE).
  if (motifChanged) { zoomLocked = false; forgetPackCaches(); restartScreenClock(); }
  // The first load opens at the zoom Preferences > On startup asks for.
  if (zoom === null) startupZoom();
  else if (!keepZoom || motifChanged) fitZoom();
  $('#zoomLbl').textContent = Math.round(zoom * 100) + '%';
  rememberZoom();
  markDirty(false);
  // The first load of the session establishes what Revert goes back to. Later
