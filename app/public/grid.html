  // loads (after a Revert, or a Save that re-captures) must not clobber it.
  if (!Session.baseline) await Session.capture();
  // A pack this session had not shown yet: its text now, before any edit of
  // E-Select's reaches it, is what Revert puts back (Session.packs).
  if (MI.motif && !Session.packs.has(packKey(MI.motif))) Session.notePack(await readMotif());
  // Unapplied property edits follow what this load read (PENDING_BASE).
  rebasePending();
  Session.sync();
  render();
  // render() rebuilds the grid and the library but NOT the properties panel,
  // so every reload left it showing values that were no longer true - a field
  // still displaying an edit that Revert had just undone, for instance.
  drawInspector();
}

// FIT THE SCREEN TO THE PANEL IT IS IN, ON BOTH AXES.
//
// The old fit subtracted HARDCODED panel widths from window.innerWidth and
// only considered width, so a narrow pane or a resized panel left the preview
// permanently tiny with no way to grow it. Measuring the stage's own box and
// taking the smaller of the two ratios keeps the screenpack's aspect exactly -
// one scalar applied to both axes cannot distort it - and fills the room there
// actually is.
//
// Snapped to 1/16ths so the label reads as a round percentage and pixel art
// lands on stable boundaries.
let zoomLocked = false;
// The zoom this panel WOULD fit at. Measured from the stage's BORDER BOX
// rather than its client box: the client box shrinks when a scrollbar appears,
// and the scrollbar appears because of the zoom, so measuring it feeds the
// output back into the input.
function computeFit() {
  const L = (MI && MI.localcoord) || [320, 240];
  const st = $('.stage');
  const r = st.getBoundingClientRect();
  const cs = getComputedStyle(st);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  // One gutter's worth of slack, so a fitted screen never needs the bar it
  // reserved space for.
  const bar = Math.max(0, r.width - st.clientWidth) || 15;
  const w = Math.max(120, r.width - padX - bar);
  const h = Math.max(90, r.height - padY - bar);
  const z = Math.min(w / L[0], h / L[1]);
  return Math.max(0.0625, Math.min(4, Math.round(z * 16) / 16));
}

function fitZoom() {
  zoom = computeFit();
  return zoom;
}

// Refit whenever the stage changes size - window resize, splitter drag, or a
// panel appearing. rAF-coalesced: a drag fires dozens of these a second and
// each one redraws 80 cells plus the background.
let refitPending = false;
// The last two zooms this actually applied. If a refit wants to go back to the
// one before last, the layout is oscillating between two sizes rather than
// settling, and applying it would keep the loop running for ever - which is
// what produced a grid flickering between two scales over a black background at
// one particular window size. Refusing the bounce leaves it at whichever of the
// two it reached first, which is correct to within one zoom step.
let zoomTrail = [];
function refit() {
  if (zoomLocked || refitPending || !MI) return;
  refitPending = true;
  requestAnimationFrame(() => {
    refitPending = false;
    if (zoomLocked || !MI) return;
    const before = zoom;
    const next = computeFit();
    if (next === before) return;
    if (zoomTrail.length >= 2 && zoomTrail[zoomTrail.length - 2] === next) return;
    zoomTrail.push(before);
    if (zoomTrail.length > 4) zoomTrail.shift();
    zoom = next;
    $('#zoomLbl').textContent = Math.round(zoom * 100) + '%';
    drawGrid();
  });
}
// A deliberate resize starts the question fresh; only an automatic bounce is
// suppressed.
window.addEventListener('pointerup', () => { zoomTrail = []; });
if (window.ResizeObserver) new ResizeObserver(refit).observe($('.stage'));
// A WINDOW RESIZE IS DELIBERATE TOO, and a frame drag or a snap sends no
// pointerup here: kept, the trail refused the return to a size from two
// changes back (1400 -> 1920 -> 1100 -> 1400 stayed at the 1100 zoom). The
// bounce the guard is for comes from the stage's ResizeObserver, not this.
window.addEventListener('resize', () => { zoomTrail = []; refit(); });

// The slot section's close, and the handle that splits its height against the
// properties below it. Same shape as the log handle, on the same axis.
{
  const close = $('#slotClose');
  if (close) close.onclick = () => closeSlotPane();
  // Properties closes the same way, and comes back from a cell's right-click
  // menu - which is why the button says so.
  const ic = $('#insClose');
  if (ic) ic.onclick = () => {
    $('#inspector').hidden = true;
    PROPS_CELL = null;
    syncRightColumn();
  };
  const el = $('#splitSlot');
  const pane = $('#slotPane');
  if (el && pane) {
    el.onpointerdown = (e) => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* keep dragging */ }
      el.classList.add('dragging');
      document.body.classList.add('vresizing');
      const start = e.clientY;
      const base = pane.getBoundingClientRect().height;
      const move = (ev) => {
        // Bounded so the properties panel below keeps a usable height.
        const host = $('#rightpane').clientHeight;
        const next = Math.max(60, Math.min(host - 140, base + (ev.clientY - start)));
        pane.style.setProperty('--sloth', next + 'px');
        pane.style.flexBasis = next + 'px';
      };
      const up = () => {
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.classList.remove('dragging');
        document.body.classList.remove('vresizing');
        try { localStorage.setItem('grid:--sloth', pane.style.flexBasis); }
        catch (err) { /* private mode */ }
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
    };
    el.ondblclick = () => {
      pane.style.removeProperty('flex-basis');
      try { localStorage.removeItem('grid:--sloth'); } catch (err) {}
    };
    try {
      const saved = localStorage.getItem('grid:--sloth');
      if (saved) pane.style.flexBasis = saved;
    } catch (err) { /* private mode */ }
  }
}

// The log's height, dragged on its own handle. Same shape as the panel edges
// below but on the other axis, and the variable lives on the library panel
// rather than <main>.
{
  const el = $('#splitLog');
  const lib = $('#library');
  el.onpointerdown = (e) => {
    e.preventDefault();
    // Capture is a convenience, not a requirement: if it fails the drag must
    // still work, so it must not throw past this point.
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* keep dragging */ }
    el.classList.add('dragging');
    document.body.classList.add('vresizing');
    const start = e.clientY;
    const base = parseFloat(getComputedStyle(lib).getPropertyValue('--logh')) || 150;
    const move = (ev) => {
      // Dragging DOWN shrinks the log, so the delta is negated. Bounded so the
      // list keeps a usable height and the log can be collapsed to nothing.
      const next = Math.max(0, Math.min(lib.clientHeight - 140, base - (ev.clientY - start)));
      lib.style.setProperty('--logh', next + 'px');
    };
    const up = () => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.classList.remove('dragging');
      document.body.classList.remove('vresizing');
      try { localStorage.setItem('grid:--logh', lib.style.getPropertyValue('--logh')); }
      catch (err) { /* private mode */ }
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
  };
  el.ondblclick = () => {
    lib.style.removeProperty('--logh');
    try { localStorage.removeItem('grid:--logh'); } catch (err) {}
  };
  try {
    const saved = localStorage.getItem('grid:--logh');
    if (saved) lib.style.setProperty('--logh', saved);
  } catch (err) { /* private mode */ }
}

// Draggable panel edges. Widths live on <main> as CSS variables, clamped so a
// panel can be collapsed to a sliver but never past the stage. Double-click an
// edge to restore its default.
for (const spec of [['#splitL', '--left', 1], ['#splitR', '--right', -1]]) {
  const el = $(spec[0]), varName = spec[1], sign = spec[2];
  const main = document.querySelector('main');
  el.onpointerdown = (e) => {
    e.preventDefault();
    // Capture is a convenience, not a requirement: if it fails the drag must
    // still work, so it must not throw past this point.
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* keep dragging */ }
    el.classList.add('dragging');
    document.body.classList.add('resizing');
    const start = e.clientX;
    const base = parseFloat(getComputedStyle(main).getPropertyValue(varName)) || 250;
    const move = (ev) => {
      const next = Math.max(0, Math.min(window.innerWidth - 260,
        base + (ev.clientX - start) * sign));
      main.style.setProperty(varName, next + 'px');
      refit();
    };
    const up = () => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.classList.remove('dragging');
      document.body.classList.remove('resizing');
      try { localStorage.setItem('grid:' + varName, main.style.getPropertyValue(varName)); }
      catch (err) { /* private mode */ }
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
  };
  el.ondblclick = () => {
    main.style.removeProperty(varName);
    try { localStorage.removeItem('grid:' + varName); } catch (err) {}
    refit();
  };
  try {
    const saved = localStorage.getItem('grid:' + varName);
    if (saved) main.style.setProperty(varName, saved);
  } catch (err) { /* private mode */ }
}

function render() {
  if (!MI || MI.error) return;   // the load's note is what the page shows then
  deriveCells(); drawGrid(); drawGeom();
  if (TAB === 'order') drawOrder();
  else if (TAB === 'stages') drawStages();
  else drawList();
}

// IS THE BIG PORTRAIT DRAWN OFF THE SCREEN ENTIRELY?
//
// A face element is placed by its sprite's AXIS on `pX.face.offset`, so where
// it lands depends on the character's art as much as on the pack. LEGACY_2 asks
// for `p1.face.offset = -710,0`: a character with an axis near -710 is pulled
// back onto the left-hand panel, and an ordinary one with axis 0 is drawn at
// x -710..-590 and never appears. That is why only P2's portrait shows there.
//
// Reported PER PACK rather than per character, and only when it misses for
// EVERY character in the build. The fault is the screenpack's expectation about
// artwork, not any one character's, and a per-character badge would put the
// same note on all 25 of them - the every-character noise these warnings exist
// to replace.
function faceOffscreenNote() {
  if (!CELLPORT || !MI) return '';
  const L = MI.localcoord || [320, 240];
  const ids = Object.keys(CELLPORT).filter((id) => CELLPORT[id].face);
  if (!ids.length) return '';
  const out = [];
  for (const side of ['p1', 'p2']) {
    const f = (MI.select.faces[side] || []).find((e) => e.anim == null && e.spr);
    if (!f) continue;
    let missed = 0;
    for (const id of ids) {
      const cp = CELLPORT[id], fc = cp.face;
      const resFix = (cp.portraitscale || 1) * L[0] / (cp.localcoord || 320);
      const sx = (f.scale ? f.scale[0] : 1) * resFix, sy = (f.scale ? f.scale[1] : 1) * resFix;
      const x0 = (f.offset ? f.offset[0] : 0) - (fc.axisX || 0) * sx;
      const y0 = (f.offset ? f.offset[1] : 0) - (fc.axisY || 0) * sy;
      if (x0 + fc.w * sx <= 0 || x0 >= L[0] || y0 + fc.h * sy <= 0 || y0 >= L[1]) missed++;
    }
    if (missed === ids.length) {
      out.push(side.toUpperCase() + '’s big portrait at offset '
        + (f.offset || [0, 0]).join(',') + ' lands off-screen for every character');
    }
  }
  return out.length ? '  ·  <span class="over">' + out.join('; ') + '</span>' : '';
}

function drawGeom() {
  const S = MI.select, total = S.rows * S.columns;
  // CELLS, NOT ENTRIES. A slot block is several entries occupying ONE cell, so
  // `order.length` overcounts by one per extra member - and the footer then
  // reported "1 too many characters" for a roster that fits the grid exactly.
  // CVS_Makoto and makoto share cell 3, which is 73 entries in 72 cells.
  // gridCellCount() walks slot runs the way every other cell mapping does.
  const free = total - gridCellCount();
  const g = $('#geom');
  // A NEGATIVE COUNT IS A REAL STATE, not a display bug: the roster runs past
  // the last cell the screenpack has, and the engine cannot reach what is out
  // there. It said "N too many characters", which is what it counts only when
  // the overflow happens to be characters - shrinking a grid under a roster of
  // mostly empty cells pushed 15 cells past the end of which exactly ONE was a
  // character, and the bar still said "15 too many characters". It counts
  // CELLS, so it now says cells, and the stranded note beside it is what names
  // the characters actually at risk.
  // A GRID CAN BE BIGGER THAN ITS OWN SCREEN, and that is worth saying out
  // loud. LEGACY_2 declares 17 rows of 50px cells at 1 spacing from y=3, which
  // is 869 units of grid in a 720-tall motif: the last three rows are drawn off
  // the bottom edge and no amount of scrolling in game will reach them. It
  // looks like the preview is offset, and it is not - the engine puts them
  // there too. The pack was cut for artwork whose rows interlock.
  const L = MI.localcoord || [320, 240];
  const spanW = S.pos[0] + S.columns * (S.cellSize[0] + S.cellSpacing[0]) - S.cellSpacing[0];
  const spanH = S.pos[1] + S.rows * (S.cellSize[1] + S.cellSpacing[1]) - S.cellSpacing[1];
  const offX = Math.max(0, Math.round(spanW - L[0]));
  const offY = Math.max(0, Math.round(spanH - L[1]));
  // THE RIGHT AND BOTTOM ARE NOT THE ONLY EDGES. The flat estimate above
  // only sees a grid running past those two, from its pos and cell pitch; a
  // pack whose pos or row offsets put cells off the LEFT or TOP drew them
  // clipped with no word here. drawGrid counts every cell whose projected
  // middle is off the screen, any side, and that count says so too.
  const offN = OFFSCREEN_COUNT;
  const overflow = !!(offX || offY || offN);
  const fits = (offX || offY)
    ? '  ·  <span class="over">runs ' + [offX ? offX + ' past the right' : null,
      offY ? offY + ' past the bottom' : null].filter(Boolean).join(' and ')
      + ' of a ' + L[0] + '×' + L[1] + ' screen</span>'
    : offN
      ? '  ·  <span class="over">' + offN + ' cell' + (offN === 1 ? ' lies' : 's lie') + ' off the '
        + L[0] + '×' + L[1] + ' screen</span>'
      : '';
  g.innerHTML = 'Grid: ' + S.rows + '×' + S.columns + ' - ' + total + ' cells ('
    + (free < 0
        ? '<span class="over">' + (-free) + ' cell'
          + (free === -1 ? '' : 's') + ' past the end</span>'
        : free + ' available')
    + ')  ·  portrait.spr ' + S.portraitSpr.join(',') + fits + faceOffscreenNote()
    + strandedNote(strandedCells());
  g.classList.add('editable');
  // The bar itself opens the grid editor, so the rescue must not bubble into it.
  const rb = g.querySelector('button.rescue');
  if (rb) rb.onclick = (e) => { e.stopPropagation(); e.preventDefault(); rescueStranded(); };
  g.title = 'Edit the grid: rows, columns, cell size and spacing'
    + (overflow ? '\nThis screenpack asks for more grid than its own screen holds.'
      + ' The engine draws the overflow off the edge too.'
      + (PREFS.showOffscreen ? '' : ' ☰ › Show Offscreen Cells draws it here.') : '');
  g.onclick = editGrid;
  $('#libhead').textContent = TAB === 'stages'
    ? 'stages — ' + ((MI.stageList || []).length) + ' in [ExtraStages]'
    : TAB === 'order'
    ? 'arcade order — ' + CELLS.filter((c) => c.kind === 'char' && !c.variant).length + ' characters'
    : TAB === 'excluded'
      ? 'not in the build — on disk only'
      // CHARACTERS in the build, to pair with characters on disk. `order.length`
      // counted every entry, so placeholders inflated it - a grid padded out to
      // 72 cells read as "73 in build" next to "25 on disk" - and it also counted
      // each member of a slot block, which is right for characters and wrong for
      // cells. Entries with no `kind` are exactly the characters.
      : 'library — ' + LIB.onDisk + ' on disk, '
        + order.filter((e) => !e.kind).length + ' in build';
  // One line that ellipsizes in a narrow panel; the tooltip has it whole.
  $('#libhead').title = $('#libhead').textContent;
}

// Cell index is DERIVED, never the array index: a slot block of N members
// occupies ONE cell, and skipslot/randomselect each consume one. The server
// does this walk too; the client repeats it so the grid updates live during
// editing instead of only after a save.
let CELLS = [];
function deriveCells() {
  const out = [];
  let cell = 0;
  for (let i = 0; i < order.length;) {
    const e = order[i];
    const group = [];
    if (e.slot && !e.kind) {
      while (i < order.length && order[i].slot === e.slot && !order[i].kind) { group.push(order[i]); i++; }
    } else { group.push(e); i++; }
    for (let k = 0; k < group.length; k++) {
      const g = group[k];
      const meta = g.char ? (MI.cells.find((c) => lc(c.char || '') === lc(g.char))
        || (MI.offGrid || []).find((c) => lc(c.char || '') === lc(g.char))) : null;
      out.push({
        index: cell, row: 0, col: 0, variant: k, variants: group.length,
        kind: g.kind || 'char', char: g.char || null, slot: g.slot || '',
        displayName: (meta && meta.displayName) || g.char
          || (g.kind === 'skip' ? '(skipslot)'
              : g.kind === 'dummy' ? '(empty cell)' : '(random)'),
        props: (meta && meta.props) || {},
        // From the ENTRY, not from disk: a lock is staged like any cell edit.
        locked: isLockOn(g.locked),
      });
    }
    cell++;
  }
  const cols = MI.select.columns || 1;
  for (const c of out) { c.row = Math.floor(c.index / cols); c.col = c.index % cols; }
  CELLS = out;
}
function cellAt(i) { return CELLS.find((c) => c.index === i && c.variant === 0) || null; }
function variantsAt(i) { return CELLS.filter((c) => c.index === i); }
// Array position of the entry that owns cell i (its first member).
function orderIndexOfCell(i) {
  let cell = 0;
  for (let k = 0; k < order.length;) {
    const e = order[k];
    const start = k;
    if (e.slot && !e.kind) {
      while (k < order.length && order[k].slot === e.slot && !order[k].kind) k++;
    } else k++;
    if (cell === i) return { start, end: k };
    cell++;
  }
  return null;
}
// Pad with DUMMYSLOTS so the next entry lands on cell `target`.
//
// This used to pad with skipslots, and that is what made dragging a character
// into a lower row leave dead ground behind it: a skipslot is a cell the cursor
// can NEVER enter (start.lua:996 gates on `skip ~= 1`), so the gap the drag
// opened up became a wall. A dummyslot occupies its cell exactly the same way
// and stays reachable whenever the pack sets moveoveremptyboxes - which `big`,
// `mugen1` and `ikemen1` all do. It is also what the engine pads a short grid
// with itself (main.lua:1690), so this is now the same cell the engine would
// have made.
//
// A pack's RESERVED cells are still skipslots, and deliberately: they are
// reserved because the screenpack's own artwork sits over them, and there the
// point IS to keep the cursor out.
// This is the only way to make a layout sparse: a [Characters] line can never
// name its own cell, so a hole has to be an entry that consumes one.
function padTo(target) {
  let cells = 0;
  for (let k = 0; k < order.length;) {
    const e = order[k];
    if (e.slot && !e.kind) { const s = e.slot; while (k < order.length && order[k].slot === s && !order[k].kind) k++; }
    else k++;
    cells++;
  }
  let added = 0;
  while (cells < target) { order.push({ kind: 'dummy' }); cells++; added++; }
  return added;
}
// A TRAILING SKIPSLOT IS NOT THE SAME AS AN UNUSED CELL, so nothing is
// trimmed any more.
//
// This used to pop trailing skipslots on the grounds that the engine pads the
// grid itself and they could not matter. They do. start.lua:996 lets the cursor
// enter a cell when `char ~= nil OR moveoveremptyboxes` AND `skip ~= 1` - so
// with moveoveremptyboxes on, which is what both packs shipped here set, the
// cursor CAN move onto an unused cell and can NEVER move onto a skipslot.
// Deleting them turned "the cursor stops here" into "the cursor wanders here".
//
// It also made Fill look broken: filling to the end of the grid with skipslots
// wrote them and then immediately dropped every one, so nothing changed on
// screen - while filling a gap BEFORE a character kept them, because those were
// not trailing. Same command, two outcomes, for a reason nothing on screen
// explained.
//
// A trailing DUMMYSLOT is a different thing: an empty usable cell, which the
// engine treats exactly like an unused cell past the end (start.lua:996 lets
// the cursor in on `char ~= nil OR moveoveremptyboxes` either way). Those ARE
// trimmed - a drag one cell past the end pads with a dummy, and dragging back
// onto the hole must leave the list exactly as it was, or the Build ID moves
// for a grid that looks identical (DEVLOG 2026-09-01).
//
// A LOCKED unused cell is the exception, and stays: the lock is somebody's
// deliberate "this cell stays as it is", and trimming the entry would throw
// the lock away with it.
function trimTrailingHoles() {
  while (order.length && order[order.length - 1].kind === 'dummy'
         && !isLockOn(order[order.length - 1].locked)) order.pop();
}

// The screen's BACKGROUND, drawn the way the motif draws it.
//
// TWO COORDINATE ORIGINS, and mixing them up puts everything in the wrong
// place. Background `start` is measured from the TOP-CENTER of the screen -
// ikemen1's sky is a 1280-wide sprite at start = -640 in a 1280 space, which
// only covers the screen if x=0 is the center. `[Select Info] pos`, by
// contrast, is measured from the TOP-LEFT: its grid sits at 525,195, which is
// centered for a left origin and off the right edge for a centered one.
//
// Sprite sizes are not known until the image loads, so each layer sizes itself
// in onload rather than being guessed at.
let bgTimer = null;
// THE SCREEN'S CLOCK RUNS ACROSS REDRAWS. The engine resets the select screen's
// background once, when the screen opens (start.lua f_selectScreen: bgReset),
// and runs it from there, so a pack whose layers wipe in at time 0 plays that
// intro once (CvS Rev 2's action 30, MK II Remix's action 10). drawGrid runs on
// every click, drag and edit, and building the layers afresh each time
// replayed the intro on every click, half a second of it. So the layers live
// across redraws (BGLIVE): at the same zoom the same elements are put back,
// still running; at a new zoom, or after a re-read that changed the layers,
// they are built again at the tick the clock has reached. Only a real
// screenpack change starts it again (restartScreenClock): another pack or one
// of its options (loadFromDisk), a Reload, or layers that read differently.
let BGLIVE = null;   // { sig, zoom, t0, els: [{ el, front }] }
const BGSIGS = new WeakMap();
function restartScreenClock() { if (BGLIVE) BGLIVE.restart = true; }
// Everything the layers are drawn from, once per load.
function bgSig() {
  let s = BGSIGS.get(MI);
  if (s === undefined) {
    const acts = {};
    for (const l of (MI.bg && MI.bg.layers) || []) {
      if (l.actionno != null && MI.actions) acts[l.actionno] = [MI.actions[l.actionno], MI.actionLoops ? MI.actionLoops[l.actionno] : 0];
    }
    s = JSON.stringify([MI.motif, MI.localcoord, MI.bg && MI.bg.layers, acts, MI.bgSprites || null]);
    BGSIGS.set(MI, s);
  }
  return s;
}
// Where a timeline is `at` ticks in: [run on screen, ticks into it].
function seekRun(tl, at) {
  const R = tl.runs;
  let t = Math.max(0, Math.floor(at + 1e-6));   // 29 ticks in ms can read back as 28.999…
  for (let i = 0; i < R.length; i++) { if (t < R[i].ticks) return [i, t]; t -= R[i].ticks; }
  if (tl.hold) return [R.length - 1, 0];
  let cycle = 0;
  for (let i = tl.loopFrom; i < R.length; i++) cycle += R[i].ticks;
  t %= cycle;
  for (let i = tl.loopFrom; i < R.length; i++) { if (t < R[i].ticks) return [i, t]; t -= R[i].ticks; }
  return [tl.loopFrom, 0];
}
function drawBG(under, over) {
  const K = zoom, L = MI.localcoord || [320, 240];
  const sig = bgSig();
  const live = BGLIVE && !BGLIVE.restart && BGLIVE.sig === sig ? BGLIVE : null;
  under.innerHTML = ''; over.innerHTML = '';
  if (live && live.zoom === K) {
    for (const x of live.els) (x.front ? over : under).appendChild(x.el);
    return;
  }
  // Rebuilt: the old layers' frame timers and the scroll loop stop with them.
  if (BGLIVE) for (const x of BGLIVE.els) { clearTimeout(x.el._t); x.el._seq = (x.el._seq || 0) + 1; }
  if (bgTimer) cancelAnimationFrame(bgTimer);
  bgTimer = null;
  const t0 = live ? live.t0 : performance.now();
  const at = (performance.now() - t0) / (1000 / 60);   // ticks since the screen began
  BGLIVE = { sig, zoom: K, t0, els: [] };
  const layers = (MI.bg && MI.bg.layers) || [];
  const moving = [];
  for (const l of layers) {
    if (!l.spriteno && l.actionno == null) continue;
    // type=anim cycles an action's frames; a still layer is just frame 0 of a
    // one-frame action, so both go through the same path.
    const frames = l.actionno != null && MI.actions && MI.actions[l.actionno]
      ? MI.actions[l.actionno]
      : [{ group: l.spriteno[0], index: l.spriteno[1], time: -1 }];
    const host = l.layerno === 1 ? over : under;
    const d = document.createElement('div');
    d.className = 'bglayer';
    d.title = l.name + '  (' + l.type + ', layer ' + l.layerno + ')';
    // add1 is MUGEN's additive blend; `screen` is the closest CSS gets and is
    // right for the glows and gradients these are used for.
    // ...and only as much of it as the layer asks for: `alpha = src,dst` scales
    // the source by src/255 (stage.go). The CvS pack's LCD sheet is
    // `trans = addalpha, alpha = 30,250`, so it is a 12% veil over the screen,
    // and drawing it at full strength grayed out the portraits under it - which
    // is what made them look half transparent. add1 halves the DESTINATION
    // instead, which CSS cannot express; it keeps full strength.
    const srcAlpha = (l) => {
      if (!l.alpha || l.trans === 'add1') return 1;
      const s = Math.max(0, Math.min(255, l.alpha[0] | 0));
      return s / 255;
    };
    if (l.trans === 'add' || l.trans === 'add1' || l.trans === 'addalpha') {
      d.style.mixBlendMode = 'screen';
      const a = srcAlpha(l);
      if (a < 1) d.style.opacity = a.toFixed(3);
    } else if (l.trans === 'sub') {
      // MUGEN's subtractive blend darkens by dst - src. CSS has no subtract;
      // `difference` is |dst - src|, which matches wherever the source is the
      // darker of the two - the shadow and vignette layers these are used for.
      d.style.mixBlendMode = 'difference';
      const a = srcAlpha(l);
      if (a < 1) d.style.opacity = a.toFixed(3);
    }
    // TILE IS A COUNT, NOT A FLAG, for any value but 1.
    //
    // render.go:625 takes `n := tile.yflag` and decrements it while the flag is
    // not 1, breaking at zero - so 0 means draw once, 1 means repeat for ever,
    // and N means exactly N copies. Treating everything non-zero as "for ever"
    // filled the screen with layers meant to cover a band: Big MUGEN1's title
    // backgrounds are `tile = 1,3`, three copies tall, and covering the whole
    // screen with them turned the background into static.
    const tx = l.tile[0] | 0, ty = l.tile[1] | 0;
    const put = (f) => {
      // Only the newest picture may land: a sprite still loading from an
      // earlier run must not paint over a later one, or over a blank.
      const seq = d._seq = (d._seq || 0) + 1;
      const im = new Image();
      im.onload = () => {
        if (seq !== d._seq) return;
        const w = im.naturalWidth * K, h = im.naturalHeight * K;
        // Origin: top-center for backgrounds, and `start` is where the
        // sprite's AXIS lands - not its top-left corner. anim.go:1016 offsets
        // the draw by spr.Offset, so the corner is start - axis.
        //
        // Both packs in the repo happen to author their background sprites
        // with a zero axis, so drawing corner-first agreed with them. CVS2's
        // grid backing panel is 640x196 with axis 320,0 at `start = 0,264`:
        // its corner belongs at -320, the left edge of a 640-wide screen, and
        // ignoring the axis put a black slab across the right half of the grid
        // instead of a backing panel behind all of it. Its "PLAYER SELECT"
        // plate (axis -269,25) sat hard left instead of centered.
        const meta = (MI.bgSprites || {})[f.group + ',' + f.index];
        const ax = (meta && meta.axisX) || 0, ay = (meta && meta.axisY) || 0;
        const x = (L[0] / 2 + l.start[0] + (f.x || 0) - ax) * K;
        const y = (l.start[1] + (f.y || 0) - ay) * K;
        const gapX = ((l.tilespacing && l.tilespacing[0]) || 0) * K;
        const gapY = ((l.tilespacing && l.tilespacing[1]) || 0) * K;
        // An endless axis spans the screen so the repeat has somewhere to go; a
        // counted one is exactly as long as its copies and starts where the
        // layer starts.
        const spanX = tx === 1 ? L[0] * K : (tx > 1 ? tx * (w + gapX) - gapX : w);
        const spanY = ty === 1 ? L[1] * K : (ty > 1 ? ty * (h + gapY) - gapY : h);
        d.style.backgroundImage = 'url(' + im.src + ')';
        d.style.backgroundSize = (w + gapX) + 'px ' + (h + gapY) + 'px';
        d.style.backgroundRepeat = (tx ? 'repeat' : 'no-repeat') + ' '
          + (ty ? 'repeat' : 'no-repeat');
        d.style.left = (tx === 1 ? 0 : x) + 'px';
        d.style.top = (ty === 1 ? 0 : y) + 'px';
        d.style.width = spanX + 'px';
        d.style.height = spanY + 'px';
        // How far the layer has scrolled (_sx, _sy, in motif units) rides on
        // where it starts, so a new picture does not put the scroll back.
        d._bx = tx === 1 ? x : 0;
        d._by = ty === 1 ? y : 0;
        d.dataset.bx = String(d._bx + d._sx * K);
        d.dataset.by = String(d._by + d._sy * K);
        d.style.backgroundPosition = d.dataset.bx + 'px ' + d.dataset.by + 'px';
      };
      // A sprite the pack does not ship draws nothing for its run (MK II
      // Remix ends its intro on -1,-1). The layer stays: removed, a looping
      // one never came back, now that the layers outlive a redraw.
      im.onerror = () => { if (seq === d._seq) d.style.backgroundImage = 'none'; };
      im.src = sprite('__motif__', [f.group, f.index]);
    };
    // Frame cycling on the engine's own timeline (airTimeline), at its 60
    // ticks/s: an element with time 0 is never drawn, a -1 holds only as the
    // last element, and a run with no sprite loaded yet draws nothing.
    // With the action's own Loopstart, which the engine loops back to
    // (anim.go:675-676, 834; MI.actionLoops carries it through the JSON).
    const tl = airTimeline(frames.map((f) => f.time), l.actionno != null && MI.actionLoops ? (MI.actionLoops[l.actionno] | 0) : 0);
    const putRun = (r) => {
      if (r.spr < 0) { d._seq = (d._seq || 0) + 1; d.style.backgroundImage = 'none'; return; }
      const e = frames[r.elem], sp = frames[r.spr];
      put({ group: sp.group, index: sp.index, x: e.x, y: e.y });
    };
    // Started where the screen's clock is, not at the action's first tick.
    d._bx = 0; d._by = 0;
    d._sx = l.velocity[0] * at; d._sy = l.velocity[1] * at;
    let [ri, into] = tl.runs.length ? seekRun(tl, at) : [0, 0];
    if (tl.runs.length) putRun(tl.runs[ri]);
    host.appendChild(d);
    BGLIVE.els.push({ el: d, front: host === over });
    if (l.velocity[0] || l.velocity[1]) moving.push({ el: d, v: l.velocity });
    if (tl.runs.length > 1 && !(tl.hold && ri === tl.runs.length - 1)) {
      const step = () => {
        ri = ri + 1 < tl.runs.length ? ri + 1 : tl.loopFrom;
        putRun(tl.runs[ri]);
        if (tl.hold && ri === tl.runs.length - 1) return;   // the engine holds here
        d._t = setTimeout(step, Math.min(2147483647, tl.runs[ri].ticks * (1000 / 60)));
      };
      d._t = setTimeout(step, Math.min(2147483647, (tl.runs[ri].ticks - into) * (1000 / 60)));
    }
  }
  // One loop for every scrolling layer. Velocity is per TICK, and the engine
  // runs at 60 - so it is scaled by elapsed time, not by frame count, or the
  // clouds move at whatever rate this browser happens to paint at.
  if (moving.length) {
    let last = performance.now();
    const tick = (now) => {
      const ticks = Math.min(5, (now - last) / (1000 / 60));
      last = now;
      for (const m of moving) {
        m.el._sx += m.v[0] * ticks;
        m.el._sy += m.v[1] * ticks;
        m.el.dataset.bx = String(m.el._bx + m.el._sx * K);
        m.el.dataset.by = String(m.el._by + m.el._sy * K);
        m.el.style.backgroundPosition = m.el.dataset.bx + 'px ' + m.el.dataset.by + 'px';
      }
      bgTimer = requestAnimationFrame(tick);
    };
    bgTimer = requestAnimationFrame(tick);
  }
}

// THE BIG PORTRAITS either side of the grid.
//
// These are the other half of what makes a select screen look like itself, and
// they are ANIMATED: ikemen1 sets p1.face.anim = 0, the character's stance.
//
// TWO SCALES MULTIPLY. Character sprites are authored in MUGEN's 320-wide
// space while the motif here is 1280 wide, so the engine scales them by
// localcoord/320 - four times - on top of the motif's own face.scale of 0.75.
// Using face.scale alone draws a 64-pixel-tall character on a 720-pixel screen
// and looks like a bug rather than a portrait.
//
// The sprite's AXIS lands on the offset, not its top-left corner: frames of one
// pose differ in size, and aligning by corner makes the stance jitter.
// THE TWO FACE ELEMENTS EITHER SIDE OF THE GRID.
//
// A generation counter, not a timer list. drawFaces awaits fetches, so a
// re-render can start while an older call is still inside an await; that older
// call would then create elements and timers AFTER the new one had cleared the
// list, and two chains would drive one image - which is what made the stance
// play at double speed with frames drawn at the wrong size.
let faceGen = 0;
// THE PORTRAITS OUTLIVE A REDRAW TOO (BGLIVE above). drawGrid empties #wrap on
// every click and drag, and a face is fetched before it is drawn, so building
// them afresh left the screen without its fighters until the fetches came
// back (MK II Remix: both gone for up to 150 ms after each click). FACES is
// the set on screen. The same fighter at the same size gets the same elements
// back, still running; another fighter at the same size keeps the last one up
// until the new one's first pictures have loaded, then swaps. A set's frames
// run while it is on screen or still being built (faceGen).
let FACES = null;   // { key, at, els: [{ el, front, im }] }
// backPane draws between the background and the cells, where the engine's
// select loop draws portraits; frontPane is the layerno 1 pane, in front of
// them. The engine gives each portrait's animation its element's layerno
// (start.lua animSetLayerno) and only draws it in the pass for that layer, so
// a motif that asks for `p1.face.layerno = 1` gets its portrait over the
// roster - and one that says nothing, like every MUGEN-era pack, gets it
// behind. Same branch the background layers already use.
async function drawFaces(backPane, frontPane) {
  const gen = ++faceGen;
  const S = MI.select, K = zoom, L = MI.localcoord || [320, 240];
  const faces = S.faces || {};
  // Whichever character is selected, falling back to the first in the build so
  // the screen is never empty.
  const pick = (sel !== null && cellAt(sel) && cellAt(sel).kind === 'char')
    ? cellAt(sel).char
    : (CELLS.find((c) => c.kind === 'char') || {}).char;
  if ((!faces.p1 && !faces.p2) || !pick) { FACES = null; return; }
  const shown = FACES;
  const at = JSON.stringify([K, L, faces]);
  const pal = palOf(pick);
  const key = at + '|' + pick + '|' + (pal === undefined || pal === null ? '' : pal);
  const putBack = (set) => { for (const x of set.els) (x.front ? frontPane : backPane).appendChild(x.el); };
  if (shown && shown.key === key) { putBack(shown); return; }
  const cover = shown && shown.at === at ? shown : null;
  if (cover) putBack(cover); else FACES = null;
  const set = { key, at, els: [] };

  // HOW BIG A CHARACTER DRAWS IS PER CHARACTER (start.lua:727-732):
  //   xscale = portraitscale * motif.localcoord.x / char.localcoord
  //   yscale = xscale                       <- the char's localcoord Y is never
  //                                            used, so balrog's 320,480 must
  //                                            not halve his height
  //   if the source is an ANIMATION: xscale *= cns_scale.x, yscale *= cns_scale.y
  // cns_scale is the [Size] scale from the character's own CNS. Hardcoding
  // motif/320 for everyone drew seven hi-res characters 2x-4x too large.
  let SC = { localcoord: 320, portraitscale: 1, cnsScale: [1, 1] };
  try {
    const r = await fetch('/api/char-scale?char=' + encodeURIComponent(pick));
    if (r.ok) SC = await r.json();
  } catch (e) { /* defaults are the engine's defaults */ }
  if (gen !== faceGen) return;
  const base = (SC.portraitscale || 1) * L[0] / (SC.localcoord || 320);

  // The engine's projection is a pinhole camera whose distance is focallength
  // expressed in the animation's local scale (anim.go SetLocalcoord), i.e.
  // min(motifW, motifH*4/3)/320 - which is 3 for a 1280x720 motif. Reproducing
  // it at focallength alone put the camera three times too close and collapsed
  // the panel into a sliver.
  const localScale = Math.min(L[0], L[1] * 4 / 3) / 320;

  const jobs = [];
  for (const side of ['p1', 'p2']) for (const f of (faces[side] || [])) jobs.push(f);
  for (const f of jobs) {
    let frames = null, loopStart = 0;
    if (f.anim != null) {
      try {
        const r = await fetch('/api/char-anim?char=' + encodeURIComponent(pick) + '&action=' + f.anim);
        if (r.ok) { const j = await r.json(); frames = j.frames; loopStart = Number(j.loopStart) || 0; }
      } catch (e) { frames = null; }
    } else if (f.spr) {
      // A still face still needs its sprite's AXIS - that is the point the
      // engine puts on the offset and rotates about. Hardcoding 0,0 and no
      // size is why the big portrait was positioned and scaled by guesswork.
      try {
        const r = await fetch('/api/sprite-geom?char=' + encodeURIComponent(pick)
          + '&group=' + f.spr[0] + '&index=' + f.spr[1]);
        if (r.ok) {
          const g = await r.json();
          frames = [{ group: f.spr[0], index: f.spr[1], x: 0, y: 0, time: -1,
            w: g.w, h: g.h, axisX: g.axisX, axisY: g.axisY }];
        }
      } catch (e) { frames = null; }
    }
    if (gen !== faceGen) return;          // superseded while fetching
    if (!frames || !frames.length) continue;

    // cns_scale applies ONLY to an animation source (start.lua:715, v[2] == -1).
    const coordX = base * (f.anim != null ? (SC.cnsScale[0] || 1) : 1);
    const coordY = base * (f.anim != null ? (SC.cnsScale[1] || 1) : 1);
    const sx = (f.scale[0] || 1) * coordX * K;
    const sy = (f.scale[1] || 1) * coordY * K;

    // window is a screen-space scissor rectangle in motif units, applied after
    // projection. Normalized so a motif may declare it either way round.
    const clip = document.createElement('div');
    clip.className = 'facewrap';
    let originX = 0, originY = 0;
    if (f.window) {
      const x1 = Math.min(f.window[0], f.window[2]), x2 = Math.max(f.window[0], f.window[2]);
      const y1 = Math.min(f.window[1], f.window[3]), y2 = Math.max(f.window[1], f.window[3]);
      originX = x1 * K; originY = y1 * K;
      clip.style.left = originX + 'px';
      clip.style.top = originY + 'px';
      clip.style.width = ((x2 - x1) * K) + 'px';
      clip.style.height = ((y2 - y1) * K) + 'px';
    } else {
      clip.style.inset = '0';
    }
    const im = document.createElement('img');
    im.className = 'face';
    clip.appendChild(im);
    if (cover) clip.style.visibility = 'hidden';   // shown once its picture is in
    ((f.layerno || 0) >= 1 ? frontPane : backPane).appendChild(clip);
    set.els.push({ el: clip, front: (f.layerno || 0) >= 1, im });

    const tilted = f.projection === 'perspective' && (f.yangle || f.xangle);
    // The engine's timeline (airTimeline): each run is the element on screen
    // wearing the sprite last loaded - its own, bar the corners that function
    // describes - and a run with none loaded draws nothing.
    // The select portrait keeps the action's loop (start.lua:701/724 pass
    // keepLoop, script.go:1176-1179): its own Loopstart, as the engine plays it.
    const tl = airTimeline(frames.map((x) => x.time), loopStart);
    if (!tl.runs.length) continue;
    let i = 0;
    const show = () => {
      if (FACES !== set && gen !== faceGen) return;   // off screen, or a newer render is building
      const run = tl.runs[i];
      const el0 = frames[run.elem], sp = run.spr >= 0 ? frames[run.spr] : null;
      const advance = () => {
        if (tl.runs.length > 1 && !(tl.hold && i === tl.runs.length - 1)) {
          const ticks = run.ticks;
          i = i + 1 < tl.runs.length ? i + 1 : tl.loopFrom;
          setTimeout(show, Math.min(2147483647, ticks * (1000 / 60)));
        }
      };
      if (!sp) { im.style.visibility = 'hidden'; advance(); return; }
      im.style.visibility = '';
      const fr = { group: sp.group, index: sp.index, w: sp.w, h: sp.h, axisX: sp.axisX, axisY: sp.axisY, x: el0.x, y: el0.y };
      im.src = sprite(pick, [fr.group, fr.index], palOf(pick));
      const w = fr.w || 0, h = fr.h || 0;
      if (w && h) {
        im.style.width = (w * sx) + 'px';
        im.style.height = (h * sy) + 'px';
      } else {
        im.style.width = '';
        im.style.height = '';
      }
      // The sprite's AXIS lands on the declared offset, plus the .air frame's
      // own offset. Frames within one stance differ in size, so aligning by
      // corner instead would make the pose jitter.
      const ax = (fr.axisX || 0) * sx, ay = (fr.axisY || 0) * sy;
      const anchorX = f.offset[0] * K + (fr.x || 0) * sx;
      const anchorY = f.offset[1] * K + (fr.y || 0) * sy;
      im.style.left = (anchorX - ax - originX) + 'px';
      im.style.top = (anchorY - ay - originY) + 'px';

      const parts = [];
      if (tilted) {
        // THE VANISHING POINT IS THE SCREEN CENTER, NOT THE PANEL'S EDGE.
        //
        // render.go:370-376 builds one frustum for the whole screen: every
        // vertex maps to C + fL*(v - C)/(fL - z) with C the screen center.
        // Rotating about the sprite's axis but projecting toward the screen
        // center is the whole trick - a per-element CSS perspective vanishes
        // toward the element instead, which foreshortens to cos(yangle) and
        // needed a 1/cos pre-stretch and a distance clamp to look sane. Both
        // of those hacks are gone; this is the engine's own projection.
        //
        // CX/CY are the screen center expressed relative to the transform
        // origin. The clip box's own offset cancels, which is why originX/Y
        // do not appear here.
        const cx = L[0] / 2 * K - anchorX;
        const cy = L[1] / 2 * K - anchorY;
        const d = Math.max(1, (f.focallength || 400) * localScale * K);
        parts.push('translate(' + cx + 'px,' + cy + 'px)');
        parts.push('perspective(' + d + 'px)');
        parts.push('translate(' + (-cx) + 'px,' + (-cy) + 'px)');
        if (f.yangle) parts.push('rotateY(' + f.yangle + 'deg)');
        // The engine rotates by Rotate3DX(-xangle), so CSS needs the negation.
        if (f.xangle) parts.push('rotateX(' + (-f.xangle) + 'deg)');
      }
      // Rightmost is applied first: the engine mirrors the quad before
      // rotating it (render.go:658-682).
      if (f.facing < 0) parts.push('scaleX(-1)');
      if (!(w && h) && (sx !== 1 || sy !== 1)) parts.push('scale(' + sx + ',' + sy + ')');
      im.style.transformOrigin = ax + 'px ' + ay + 'px';
      im.style.transform = parts.join(' ');
      advance();
    };
    show();
  }
  if (cover) {
    // The swap waits for the first pictures, never longer than a second.
    const loaded = (im) => (!im.getAttribute('src') || im.complete ? null
      : new Promise((res) => { im.addEventListener('load', res, { once: true }); im.addEventListener('error', res, { once: true }); }));
    await Promise.race([Promise.all(set.els.map((x) => loaded(x.im))), new Promise((res) => setTimeout(res, 1000))]);
    if (gen !== faceGen) return;
    for (const x of cover.els) x.el.remove();
    for (const x of set.els) x.el.style.visibility = '';
  }
  FACES = set;
}

// THE CURSOR - ONE OF THEM, on the cell you have selected.
//
// The motif animates it (ikemen1: p1.cursor.active.anim = 160), so it is drawn
// from the MOTIF's own sprites rather than as a colored outline.
//
// It used to draw BOTH sides: P1 on the selected cell, falling back to its
// start cell, and P2 on its own start cell. Both start cells are 0,0 in every
// pack shipped here, so with nothing selected two cursors sat on top of each
// other in the first box and stayed there - and the mouse, which highlights
// whatever it is over, read as a third. This is an editor: there is one
// selection, so there is one cursor, and no cursor at all until something is
// selected. P1's art is used because that is the one a player sees first; a
// pack that only defines P2 falls back to it.
//
// It lives INSIDE the cell it marks. The cell sits in a projected row strip,
// so anything placed inside it is projected with it - a cursor drawn in a
// separate flat pane would be an axis-aligned rectangle floating over a
// trapezoid.
let cursorGen = 0;
function drawCursors(cellEls) {
  const gen = ++cursorGen;
  if (sel === null) return;
  const cur = MI.select.cursors || {};
  const acts = MI.motifActions || {};
  const c = cur.p1 || cur.p2;
  if (!c) return;
  // Hosted in the SLOT, not the cell: a cursor wider than its cell is normal
  // and `.cell` has overflow:hidden, which would crop the bracket.
  const cellEl = cellEls[sel];
  if (!cellEl) return;
  const host = cellEl.parentElement || cellEl;
  const frames = (c.anim != null && acts[c.anim] && acts[c.anim].length)
    ? acts[c.anim]
    : (c.spr ? [{ group: c.spr[0], index: c.spr[1], time: -1 }] : null);
  if (!frames) return;
  const d = document.createElement('img');
  d.className = 'cursor';
  d.title = 'Selected cell';
  // ABOVE THE CELLS AROUND IT. Slots are absolutely positioned siblings with
  // no z-index, so paint order is DOM order and every cell after this one drew
  // over the cursor - which is most of the row. The strip is lifted too,
  // because a row is its own stacking context (it carries the homography) and
  // the row below would otherwise cover the overhang.
  // ABOVE EVERY CELL STATE, not just the plain ones. The cells carry their own
  // z-indexes for selection and search - .cell.sel is 6, .drop 7, .found 8 -
  // and the cursor sits on the SELECTED cell by definition, so a 5 put it
  // underneath the very cell it is marking and the art inside it.
  d.style.zIndex = '9';
  const strip = host.parentElement;
  if (strip && strip.classList.contains('rowstrip')) strip.style.zIndex = '5';
  // The box occupies P px for `g.w` x `g.h` motif units (see drawGrid), so a
  // motif unit is P/g.w across and P/g.h down - the conversion the cursor needs
  // to be drawn at its true size.
  //
  // Every pack in the repo hid this by declaring a cursor scale that lands on
  // its own cell: ikemen1 .25 against a 106-unit box, Big MUGEN1 .5, LEGACY 1
  // against a 50. CVS2 declares no scale at all and ships a 59x70 bracket for a
  // 36x36 cell, so stretching it to the cell shrank it by a third.
  const row = Math.floor(sel / MI.select.columns);
  const gRow = rowGeometry(MI.select)[row];
  // THE CURSOR TAKES THE ROW'S SCALE OVERRIDE, not its own declared one.
  // start.lua:1308 is `getCellTransform(x, y, "scale", params.scale)` - the
  // same call the cell box and the portrait go through, so a per-row
  // `cell.*-N.scale` REPLACES what the cursor asked for. ikemen1 declares
  // .25 and overrides row 0 to .3: at .25 its 108-wide bracket draws 27 units
  // inside a 31.8 box and sits shrunken within the cell instead of framing it.
  const ov = (MI.select.rows_ || {})[row];
  const cScale = (ov && ov.scale) || ((c.scale && c.scale[0]) ? c.scale : [1, 1]);
  const boxAx = (MI.cellBg && MI.cellBg.axisX) || 0;
  const boxAy = (MI.cellBg && MI.cellBg.axisY) || 0;
  // The slot's own width IS the box's pixel size - drawGrid sets both to P -
  // and reading it from the inline style rather than a bounding rect keeps the
  // strip's matrix3d out of the number.
  const P0 = parseFloat(host.style.width) || 0;
  const sizeTo = (fr) => {
    const g = (MI.bgSprites || {})[fr.group + ',' + fr.index];
    if (!g || !gRow || !gRow.w || !gRow.h || !P0) return;   // unmeasured: leave it
    const ux = P0 / gRow.w, uy = P0 / gRow.h;
    d.style.width = (g.w * cScale[0] * ux) + 'px';
    d.style.height = (g.h * cScale[1] * uy) + 'px';
    // The sprite's axis lands where the cell box's does.
    d.style.left = ((boxAx * gRow.sc[0] - g.axisX * cScale[0]) * ux) + 'px';
    d.style.top = ((boxAy * gRow.sc[1] - g.axisY * cScale[1]) * uy) + 'px';
  };
  // A motif that names a sprite it does not ship must not leave a broken-image
  // icon sitting in the middle of the grid - but it must not kill the cursor
  // either. Hiding leaves the element in place to be given the next frame;
  // removing it ended the animation permanently on the first bad sprite.
  d.onerror = () => { d.style.visibility = 'hidden'; };
  host.appendChild(d);
  // PLAYED BY THE ENGINE'S TIMELINE (airTimeline), not element by element: an
  // element with time 0 is never drawn, a -1 holds only as the LAST element -
  // the cursor used to loop straight past it - and a middle -1 or a last -2
  // changes how long the cycle runs. A run is the element on screen wearing
  // the sprite the engine last loaded; with none loaded yet it draws nothing.
  const tl = airTimeline(frames.map((f) => f.time), c.anim != null && acts[c.anim] && MI.actionLoops ? (MI.actionLoops[c.anim] | 0) : 0);
  if (!tl.runs.length) return;
  let i = 0;
  const show = () => {
    // A newer render has replaced this cursor; let this chain die rather
    // than keep swapping frames on a detached element.
    if (gen !== cursorGen) return;
    const run = tl.runs[i];
    const f = run.spr >= 0 ? frames[run.spr] : null;
    // A NEGATIVE SPRITE NUMBER IS A DELIBERATE BLANK FRAME, which is how a
    // motif makes its cursor blink - CVS2's ten-frame cursor spends frame 6 on
    // -1,-1. Asking the server for sprite -1,-1 fails, and failing used to
    // remove the element, so the cursor ran for half a second and vanished for
    // good. Nothing to fetch: just show nothing for those ticks.
    if (!f || f.group < 0 || f.index < 0) {
      d.style.visibility = 'hidden';
    } else {
      d.style.visibility = '';
      d.src = sprite('__motif__', [f.group, f.index]);
      sizeTo(f);
    }
    if (tl.runs.length > 1 && !(tl.hold && i === tl.runs.length - 1)) {
      const ticks = run.ticks;
      i = i + 1 < tl.runs.length ? i + 1 : tl.loopFrom;
      setTimeout(show, Math.min(2147483647, ticks * (1000 / 60)));
    }
  };
  show();
}

// PER-ROW CELL GEOMETRY. A motif may override scale, spacing and offset for
// each row (`cell.*-N.*`), which is how IKEMEN1 draws its grid in perspective:
// ten rows whose scale climbs 0.30 -> 0.46 and whose spacing widens 7.5 -> 23.
//
// The layout formula is the engine's own, from external/script/start.lua:1594:
//
//   x = col * (cell.size.x + spacing.x) + offset.x
//   y = row * (cell.size.y + spacing.y) + offset.y
//
// Both use the GLOBAL cell.size with that ROW's spacing and offset. Row Y is
// NOT accumulated from row heights - getting that wrong stacks the rows on top
// of each other instead of spreading them evenly down the trapezoid.
//
// The per-row `scale` is a SPRITE scale (start.lua:2570, "apply cell scale
// override while preserving portrait resolution factor"), so it changes how big
// each cell's box DRAWS without moving where it sits.
function rowGeometry(S) {
  const ov = S.rows_ || {};
  const baseScale = (S.cellBgScale && S.cellBgScale[0]) ? S.cellBgScale : [1, 1];
  const out = [];
  for (let r = 0; r < S.rows; r++) {
    const o = ov[r] || null;
    const sc = (o && o.scale) || baseScale;
    // A CELL BOX AND THE PORTRAIT IN IT ARE SCALED BY DIFFERENT KEYS. The box
    // takes `cell.bg.scale` and the portrait takes `portrait.scale`
    // (start.lua:2541 vs 2556 - getTransforms is handed cell.bg for one and
    // select_info.portrait for the other). A per-row `cell.*-N.scale` overrides
    // BOTH, because getCellTransform is consulted with the same key either way.
    //
    // Using the box's scale for the portrait looked right for a long time only
    // because every pack in the repo sets the two to the same number - ikemen1
    // .25/.25, Big MUGEN1 .5/.5. A pack that does not is drawn wrong and, worse,
    // ACCUSED: CVS2 declares no cell.bg.scale (so 1) and portrait.scale 0.72, so
    // every character's portrait was computed at 2x its real size and every one
    // of them earned a "not a portrait" badge for a sprite that fills its cell
    // exactly (25 x 0.72 x 640/320 = 36, in a 36x36 cell).
    const psc = (o && o.scale)
      || ((S.portraitScale && S.portraitScale[0]) ? S.portraitScale : [1, 1]);
    const sp = (o && o.spacing) || S.cellSpacing;
    const off = (o && o.offset) || [0, 0];
    // DRAWN size is the cell-box SPRITE times this row's scale, not cell.size
    // times a scale ratio. ikemen1's box is 106x106 for a nominal 24x24 cell,
    // so at row scale it is slightly LARGER than the pitch and neighboring
    // boxes overlap by a pixel or two - which is why the real grid is
    // seamless. Sizing from cell.size leaves a gap in every seam, the artifact
    // VSelect has.
    const box = MI.cellBg || { w: S.cellSize[0] / (baseScale[0] || 1),
                               h: S.cellSize[1] / (baseScale[1] || 1), axisX: 0, axisY: 0 };
    const w = box.w * sc[0];
    const h = box.h * sc[1];
    out.push({
      w, h, sc, psc,
      stepX: S.cellSize[0] + sp[0],
      // The box is drawn with its own AXIS on the slot position.
      x0: S.pos[0] + off[0] - box.axisX * sc[0],
      y: S.pos[1] + r * (S.cellSize[1] + sp[1]) + off[1] - box.axisY * sc[1],
      // The row's PIVOT line - the anchor Y before the box's axis is taken
      // off. Every column in a row shares it, which is why one homography per
      // row is exact rather than an approximation.
      pivotY: S.pos[1] + r * (S.cellSize[1] + sp[1]) + off[1],
      // The motif's own projection for this row.
      xangle: (o && o.projection === 'perspective') ? (o.xangle || 0) : 0,
      focal: (o && o.focallength) || 0,
    });
  }
  return out;
}

// Projective map from the flat rectangle (0,0)-(w,h) onto an arbitrary quad
// [top-left, top-right, bottom-right, bottom-left], as a CSS matrix3d.
//
// This is what turns a row of flat squares into the trapezoid the game draws.
// The unit-square homography is the standard one (Heckbert, "Fundamentals of
// Texture Mapping"); it is then pre-scaled from the strip's pixel size, and
// packed column-major with the projective terms in the fourth row, which is
// where CSS keeps the w coordinate. transform-origin must be 0 0.
function quadMatrix(w, h, q) {
  const x0 = q[0][0], y0 = q[0][1], x1 = q[1][0], y1 = q[1][1];
  const x2 = q[2][0], y2 = q[2][1], x3 = q[3][0], y3 = q[3][1];
  const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3;
  const dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
  let a, b, c, d, e, f, g, hh;
  if (Math.abs(dx3) < 1e-9 && Math.abs(dy3) < 1e-9) {
    // Parallelogram: affine is exact and the projective terms are zero.
    a = x1 - x0; b = x3 - x0; c = x0;
    d = y1 - y0; e = y3 - y0; f = y0;
    g = 0; hh = 0;
  } else {
    const det = dx1 * dy2 - dx2 * dy1;
    g = (dx3 * dy2 - dx2 * dy3) / det;
    hh = (dx1 * dy3 - dx3 * dy1) / det;
    a = x1 - x0 + g * x1;
    b = x3 - x0 + hh * x3;
    c = x0;
    d = y1 - y0 + g * y1;
    e = y3 - y0 + hh * y3;
    f = y0;
  }
  // Unit square -> strip pixels: the u and v columns absorb 1/w and 1/h.
  a /= w; d /= w; g /= w;
  b /= h; e /= h; hh /= h;
  return 'matrix3d(' + [a, d, 0, g, b, e, 0, hh, 0, 0, 1, 0, c, f, 0, 1]
    .map((n) => +n.toFixed(8)).join(',') + ')';
}

// THE ROSTER'S CELL-PORTRAIT GEOMETRY, fetched once and cached.
//
// drawGrid is synchronous and runs on every zoom, drag and resize, so it
// cannot await anything. The first call draws with the stretch-to-fill
// fallback, the answer arrives, and one redraw puts every portrait at its true
// size. One request covers the whole roster: a lookup per character would
// re-open and re-parse a .sff each time.
//
// KEPT FOR THE SPRITES IT WAS ASKED FOR. The placement is per pack - which
// sprite is the cell portrait, which the big one - so the answer carries the
// question: a pack that asks for other sprites drops it and asks again, and an
// answer that arrives after the pack changed is thrown away instead of drawing
// every portrait at the other pack's size.
let CELLPORT = null, cellPortPending = false, cellPortFor = '', cellPortGen = 0;
function ensureCellPortraits() {
  const spr = MI && MI.select && MI.select.portraitSpr;
  if (!spr) return;
  // The BIG portrait comes down in the same request. Only a still one can be
  // measured: a pack whose face element is an animation (ikemen1's
  // p1.face.anim = 0 is the character's stance) has no single sprite, so the
  // parameters are simply left off and the server skips it.
  const fspr = faceSprite();
  const q = 'group=' + spr[0] + '&index=' + spr[1]
    + (fspr ? '&faceGroup=' + fspr[0] + '&faceIndex=' + fspr[1] : '');
  // The generation moves with every forgetPackCaches (a reload, an edit of
  // the pack), so an answer to a question asked before one is not taken.
  const key = cellPortGen + ':' + (MI.motif || '') + '?' + q;
  if (cellPortFor !== key) { CELLPORT = null; cellPortPending = false; cellPortFor = key; }
  if (CELLPORT || cellPortPending) return;
  cellPortPending = true;
  fetch('/api/cell-portraits?' + q)
    .then((r) => (r.ok ? r.json() : null))
    .then((j) => {
      if (cellPortFor !== key) return;      // asked for another pack's
      cellPortPending = false;
      if (j && Object.keys(j).length) { CELLPORT = j; drawGrid(); }
    })
    .catch(() => { if (cellPortFor === key) cellPortPending = false; });
}

// PREFERENCES > EMPTY CELL DISPLAY, which is VIEW ONLY: it changes how this
// editor draws an empty cell's box, never the screenpack. The pack's own
// showemptyboxes stays what the inspector's EMPTY CELLS checkboxes write and
// what the game follows.
function emptyBoxesShown(S) {
  if (PREFS.showEmpty === '1') return true;
  if (PREFS.showEmpty === '2') return false;
  return !!(S && S.showEmptyBoxes);
}

// `hidden` on the character a cell SHOWS - for a slot, its first member, the
// one the grid draws - as 1, 2 or 3; anything else is 0. The meanings are the
// engine's (docs/ENGINE.md, the select.def params).
function hiddenLevel(info) {
  if (!info || info.kind !== 'char') return 0;
  const n = parseInt(String((info.props && info.props.hidden) || '').trim(), 10);
  return n >= 1 && n <= 3 ? n : 0;
}
const HIDDEN_MEANING = {
  1: 'hidden cell, still in the random pool',
  2: 'cannot be selected, the cursor skips it',
  3: 'shown as a random-select cell',
};
// An eye with a slash through it, drawn in currentColor. A constant: nothing
// from a file goes through this innerHTML.
const EYE_SLASH = '<svg viewBox="0 0 16 16" aria-hidden="true">'
  + '<path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.6"/>'
  + '<circle cx="8" cy="8" r="2.1" fill="currentColor"/>'
  + '<path d="M2.6 13.4 13.4 2.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';

// How many cells the last drawGrid found with their middle off the screen, on
// any side - the same test the offscreen marks use. The footer reads it.
let OFFSCREEN_COUNT = 0;
function drawGrid() {
  const S = MI.select, K = zoom;
  ensureCellPortraits();
  ensureThemeLayout();
  const RG = rowGeometry(S);
  const wrap = $('#wrap');
  const L = MI.localcoord || [320, 240];
  // The stage is the whole SCREEN, not just the grid: that is what lets the
  // motif's own background sit behind the cells and makes this a preview rather
  // than a diagram.
  wrap.style.width = (L[0] * K) + 'px';
  wrap.style.height = (L[1] * K) + 'px';
  const cc = (MI.bg && MI.bg.bgClearColor) || [0, 0, 0];
  wrap.style.background = 'rgb(' + cc[0] + ',' + cc[1] + ',' + cc[2] + ')';
  // Painted inside the border only: with offscreen cells shown, the border is
  // the room beyond the screen, and the clear color belongs to the screen.
  wrap.style.backgroundClip = 'padding-box';
  const showOff = !!PREFS.showOffscreen;
  wrap.classList.toggle('showoff', showOff);
  wrap.style.borderWidth = '';
  wrap.innerHTML = '';
  const under = document.createElement('div');
  under.className = 'bgpane';
  const over = document.createElement('div');
  over.className = 'bgpane over';
  wrap.appendChild(under);
  // Behind the cells, in front of the background: the engine's own order (see
  // .bgpane.faces). Appended here, filled asynchronously.
  const faces = document.createElement('div');
  faces.className = 'bgpane faces';
  wrap.appendChild(faces);
  drawBG(under, over);
  const bg = S.cellBgSpr ? sprite('__motif__', S.cellBgSpr) : null;
  const randSrc = S.randomSpr ? sprite('__motif__', S.randomSpr) : null;
  const cols = S.columns;

  // THE GRID IS ONE SURFACE, NOT A PILE OF BRICKS.
  //
  // Each row is laid out FLAT - equal squares, edge to edge, portraits inside
  // them - and the whole strip is then projected onto the trapezoid the motif's
  // per-row geometry describes. Row r's bottom edge IS row r+1's top edge, so
  // the column lines run straight and continuous from the far row to the near
  // one and every cell is a true trapezoid. Tilting cells one at a time, which
  // is what this replaced, put each cell on its own little plane: the column
  // lines stepped outward at every row, the rows did not meet, and the
  // portraits sat on top as axis-aligned rectangles instead of being cut to
  // the shape of the slot they belong to. Everything inside the strip -
  // portrait, box art, cursor, badge - is projected with it, which is the
  // "clipping mask" behavior: the trapezoid IS the mask.
  //
  // The per-row xangle/focallength are deliberately not applied on top of
  // this. The per-row scale, spacing and offset are already the RESULT of the
  // engine's projection; applying a second one doubles it.
  //
  // Flat pitch is chosen near the average rendered cell width, so pixel art is
  // neither upscaled into blur nor decimated before being projected.
  // THE ENGINE'S OWN PER-ROW PROJECTION (render.go:370-376 via script.go
  // batchDraw). Each row is rotated by xangle about its pivot line and then
  // projected through a pinhole at the SCREEN CENTER:
  //
  //   w    = 1 + (Yp - Y) * sin(th) / F
  //   Yr   = Yp + (Y - Yp) * cos(th)
  //   Xout = CX + (X - CX) / w
  //   Yout = CY + (Yr - CY) / w
  //
  // These keys are NOT inert - they visibly squash row 0 and stretch row 9.
  // The previous code borrowed the NEXT row's rectangle as this row's bottom
  // edge, which matched to about a unit on rows 0-8 only because the motif
  // author hand-tuned the per-row values so the projected rows tile. On the
  // last row there is no next row, so it fell back to an axis-aligned
  // rectangle - and that is the straight untapered band across the bottom.
  // Computing the quad from the transform makes the last row correct with no
  // special case at all.
  //
  // F is focallength in the row's local scale, the same conversion the faces
  // need: min(motifW, motifH*4/3)/320, which is 3 for a 1280x720 motif.
  const localScale = Math.min(L[0], L[1] * 4 / 3) / 320;
  const CX = L[0] / 2, CY = L[1] / 2;
  const project = (g) => {
    if (!g.xangle) return (X, Y) => [X, Y];
    const th = g.xangle * Math.PI / 180;
    const F = (g.focal || 50) * localScale;
    const sin = Math.sin(th), cos = Math.cos(th);
    return (X, Y) => {
      const w = 1 + (g.pivotY - Y) * sin / F;
      const Yr = g.pivotY + (Y - g.pivotY) * cos;
      if (!(w > 0.01)) return [X, Yr];        // behind the camera: leave it flat
      return [CX + (X - CX) / w, CY + (Yr - CY) / w];
    };
  };

  const span = (r) => (cols - 1) * RG[r].stepX + RG[r].w;
  const avgW = RG.reduce((t, g) => t + g.w, 0) / (RG.length || 1);
  const P = Math.max(16, Math.round(avgW * K));
  const cellEls = [];
  const quads = [];
  const emptyBox = emptyBoxesShown(S);
  // Screen-space marks over the cells (the hidden and lock badges). Appended
  // after the strips and raised to the selected row's level (.marks in the
  // style sheet), so no strip paints over them - the selected one included.
  const marks = document.createElement('div');
  marks.className = 'marks';
  // Locked cells get a badge only while Lock cells is on (off, a lock means
  // nothing) and Show lock icon is not Never.
  const lockMarks = !!PREFS.checkLocks && PREFS.showLocks !== '0';
  const lockedAt = new Set(lockMarks ? CELLS.filter((x) => x.locked).map((x) => x.index) : []);
  let offCount = 0;

  for (let r = 0; r < S.rows; r++) {
    const g = RG[r];
    // The strip's flat rectangle comes from THIS row only - never the next -
    // and its four corners are then projected. The last row is no longer a
    // special case, which is what removes the straight band.
    const L0 = g.x0, T0 = g.y, R0 = g.x0 + span(r), B0 = g.y + g.h;
    const pr = project(g);
    const quad = [pr(L0, T0), pr(R0, T0), pr(R0, B0), pr(L0, B0)]
      .map((p) => [p[0] * K, p[1] * K]);
    // THE BOX FILLS ITS STRIP EXACTLY, and this is the whole of the dark-band
    // fix. The strip's flat rectangle is mapped onto a quad running from g.y
    // to g.y + g.h - the box's OWN height - so one strip-height of flat space
    // already means one box. Scaling the box by the ratio of its height to the
    // row PITCH, as this did, drew it a third too tall: it overflowed the
    // strip, projected below its own quad, and its dark bottom edge showed
    // through as a band between every pair of rows.
    //
    // Clipping the overflow away hid the band, which is why it read as the
    // fix, but it was treating a symptom: the art was still stretched by up to
    // 1.33x and its bottom quarter still cut off. Measured here at 125% zoom,
    // row 0 was drawing a 65.0px box into a 49px band.
    //
    // Adjacent quads do overlap in MOTIF space - the box is 31.8 units for a
    // 24.0 pitch - but the projection compresses the far rows, so on screen
    // the overlap is 0.6px, not a quarter of a row. Nothing needs clipping and
    // nothing steals a neighbor's clicks: a 5x5 probe inside all 24 occupied
    // cells resolves 600/600 points to their own cell with no clipping at all.
    const boxH = P;

    const strip = document.createElement('div');
    strip.className = 'rowstrip';
    strip.style.width = (cols * P) + 'px';
    strip.style.height = P + 'px';
    strip.style.transform = quadMatrix(cols * P, P, quad);
    quads.push(quad);

    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      const info = cellAt(i);
      // A skipslot cell draws NOTHING - not even the empty box. showemptyboxes
      // cannot reach it, because the engine's whole per-cell emission block is
      // gated on skip ~= 1. Rendering it as a normal empty cell would misreport
      // the layout.
      // Only a SKIPSLOT suppresses the box. A dummyslot is an ordinary empty
      // cell to the engine, so it draws whatever the pack draws for one.
      const isSkip = info && info.kind === 'skip';
      const isDummy = info && info.kind === 'dummy';
      const id = info && info.kind === 'char' ? info.char : null;

      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.style.left = (c * P) + 'px';
      slot.style.width = P + 'px';
      slot.style.height = P + 'px';
      if (bg && !isSkip && (info && !isDummy || isDummy && emptyBox || !info && emptyBox)) {
        const box = document.createElement('div');
        box.className = 'box';
        box.style.height = boxH + 'px';
        box.style.backgroundImage = 'url(' + bg + ')';
        slot.appendChild(box);
      }

      // THE RANDOM-SELECT ICON (start.lua:2547-2553). Drawn INSTEAD of a
      // portrait - the portrait branch excludes randomselect - and anchored on
      // `portrait.offset`, not the cell's own origin, with the sprite's AXIS on
      // that point. Its size is its own, not the cell's.
      //
      // Its scale is `getCellTransform(c, r, "scale", cell.random.scale)`, and
      // a per-row override REPLACES cell.random.scale rather than multiplying
      // it (start.lua:1207-1221). So on a motif like ikemen1, whose rows all
      // carry a scale, the .25 written next to cell.random.spr never applies -
      // the icon takes the same per-row scale the box does, which is `g.sc`.
      if (info && info.kind === 'random' && randSrc && MI.randomIcon) {
        const ic = MI.randomIcon;
        const box = MI.cellBg || { axisX: 0, axisY: 0 };
        const pOff = S.portraitOffset || [0, 0];
        // Flat px per motif unit. X comes from the row's full span, Y from the
        // strip's own height, because that is exactly what the homography maps.
        const ux = (cols * P) / span(r);
        const uy = P / g.h;
        // The box's axis is already subtracted into g.x0/g.y, so adding it back
        // turns an icon position into one relative to the strip's origin.
        const relX = (c * g.stepX + pOff[0] - ic.axisX * g.sc[0] + box.axisX * g.sc[0]) * ux;
        const relY = (pOff[1] - ic.axisY * g.sc[1] + box.axisY * g.sc[1]) * uy;
        const ri = new Image();
        ri.className = 'randicon';
        ri.src = randSrc;
        ri.style.left = (relX - c * P) + 'px';
        ri.style.top = relY + 'px';
        ri.style.width = (ic.w * g.sc[0] * ux) + 'px';
        ri.style.height = (ic.h * g.sc[1] * uy) + 'px';
        ri.onerror = () => ri.remove();
        if (sel === i) ri.classList.add('tint');
        slot.appendChild(ri);
      }

      const d = document.createElement('div');
      const excluded = !!(info && info.props && String(info.props.exclude || '') !== '');
      const hidLv = PREFS.showHiddenIcons ? hiddenLevel(info) : 0;
      let hidBadge = null;   // set below, once the cell's corner is known
      // THE PACK RESERVES MORE THAN THE ROSTER RECORDS. The imported layout
      // stops at the last character placed, so an empty cell under a portrait
      // panel carries no skipslot and looked like ordinary free ground -
      // LEGACY reserves 6 columns by 7 rows on each side, 84 cells, and a
      // 24-character roster only writes out the 18 that precede its last
      // character. The rest are still off limits, so they are hatched from the
      // pack's own layout rather than from the roster.
      const packReserved = !info && THEMELAYOUT && THEMELAYOUT.cells
        && THEMELAYOUT.cells[i] === 'hole';
      d.className = 'cell' + (id ? ' occupied' : '')
        + (packReserved ? ' packreserved' : '')
        + (info && info.kind === 'random' ? ' randomcell' : '')
        + (isSkip ? ' skipcell' : '')
        + (isDummy ? ' dummycell' : '')
        + (info && info.slot ? ' slotcell' : '')
        + (info && info.slot && SLOT_OPEN === i ? ' slotfocus' : '')
        + (excluded ? ' excluded' : '')
        + (sel === i ? ' sel' : '');
      d.dataset.i = i;
      if (id) {
        // Asked BEFORE the portrait is requested, so the cell is right even if
        // the request never fails the way we expect it to.
        if (missingFromDisk(id)) d.classList.add('missing');
        const im = new Image();
        im.src = sprite(id, S.portraitSpr, palOf(id));
        // THE ENGINE DOES NOT STRETCH A PORTRAIT TO FILL ITS CELL. It draws the
        // sprite at its own size, scaled by the row's cell scale times a
        // per-character resolution fix, with the sprite's AXIS on the cell
        // position plus portrait.offset (start.lua:2555-2582):
        //
        //   resFix = portraitscale * motif.localcoord.x / char.localcoord
        //
        // A classic 320-wide character ships a 25x25 sprite at 9000,0, and
        // resFix of 1280/320 = 4 lands it at 100 units in a 106-unit cell -
        // which is why filling the cell looked right for most of the roster.
        // It is not right for a character whose 9000,0 is something else:
        // three here store a 15x31 sprite, and stretching that to a square
        // cell drew a green smear instead of the small sprite the game shows.
        // The old guard only removed an image that FAILED to load, and these
        // load perfectly well.
        const cp = CELLPORT && CELLPORT[id];
        if (cp && cp.w && cp.h) {
          const box = MI.cellBg || { axisX: 0, axisY: 0 };
          const pOff = S.portraitOffset || [0, 0];
          const ux = (cols * P) / span(r);
          const uy = P / g.h;
          const resFix = (cp.portraitscale || 1) * L[0] / (cp.localcoord || 320);
          const sx = g.psc[0] * resFix, sy = g.psc[1] * resFix;
          im.className = 'exact';
          im.style.left = ((c * g.stepX + pOff[0] - cp.axisX * sx
                            + box.axisX * g.sc[0]) * ux - c * P) + 'px';
          im.style.top = ((pOff[1] - cp.axisY * sy + box.axisY * g.sc[1]) * uy) + 'px';
          im.style.width = (cp.w * sx * ux) + 'px';
          im.style.height = (cp.h * sy * uy) + 'px';
          // THIS SPRITE IS NOT A PORTRAIT. Three characters in this build hold
          // a 15x31 at 9000,0 - the same 15x31 and the same 424x455 at 9000,1,
          // so it is one author's template, not a decode fault - and the
          // engine duly draws a 60x124 sliver in a 106-unit cell. Stretching
          // it to fill used to hide that; now it shows, so it needs saying
          // that the character is at fault rather than the preview.
          const v = portraitVerdict(id, r);
          if (v) {
            const warn = document.createElement('div');
            warn.className = 'badpor';
            warn.textContent = '!';
            warn.title = portraitAdvice(v);
            d.appendChild(warn);
          }
        }
        // A portrait that will not load is still worth showing as a fault: the
        // character may be on disk and simply have no sprite at the group the
        // pack asks for. Removing the image alone is what made this silent.
        im.onerror = () => { im.remove(); d.classList.add('missing'); };
        // The selected cell's portrait takes the highlight tint - the portrait
        // alone, so the box, the cursor and the cell's edges keep their colors.
        if (sel === i) im.classList.add('tint');
        d.appendChild(im);
        // VSelect writes (2/2) on a slot and (4) once it is past two, so the
        // badge counts MEMBERS rather than labeling the cell a variant pile.
        if (info.variants > 1) {
          const b = document.createElement('div');
          b.className = 'badge'; b.textContent = '(' + info.variants + ')';
          d.appendChild(b);
        }
        d.draggable = true;
        d.ondragstart = (e) => {
          // A locked cell does not leave its place, and says so rather than
          // starting a drag that can only go nowhere.
          if (cellLocked(i)) { e.preventDefault(); log(lockedWhy(i, 'moved')); return; }
          e.dataTransfer.setData('text/plain', 'cell:' + i);
          dragState(true);
        };
      }
      // Selectable whether or not it holds a character: an empty cell is a
      // real thing to inspect and to turn into a skipslot, and this handler
      // used to live inside the `if (id)` above.
      d.onclick = () => { sel = i; drawGrid(); drawInspector(); };
      d.ondragover = (e) => {
        e.preventDefault();
        // Shift means "join this cell as a variant" rather than swap; show it.
        d.classList.add('drop');
        d.classList.toggle('variantdrop', !!e.shiftKey && !!(cellAt(i) && cellAt(i).kind === 'char'));
        // Still a drop target, so letting go here logs why nothing happened.
        d.classList.toggle('lockeddrop', cellLocked(i));
      };
      d.ondragleave = () => d.classList.remove('drop', 'variantdrop', 'lockeddrop');
      d.ondrop = (e) => {
        e.preventDefault(); d.classList.remove('drop', 'variantdrop', 'lockeddrop');
        onDrop(e.dataTransfer.getData('text/plain'), i, e.shiftKey);
      };
      d.onmouseenter = (e) => {
        d.classList.add('hot');
        const label = cellLabel(info, i);
        // ROW AND COLUMN ARE REPORTED 1-BASED, which is both what VSelect
        // shows and what the engine's own grid table uses: start.lua:1586-1590
        // starts row at 1 and takes col as #t_grid[row] + 1.
        //
        // The 0-based indices are NOT wrong internally and must stay - the
        // same lines call getCellSpacing(col - 1, row - 1), and
        // getCellOverride builds the motif's `cell.<col>-<row>` key from
        // those, so `cell.*-0` really is row 0's override. Both conventions
        // are the engine's; only the one shown to a person changes here.
        const hv = $('#hover');
        hv.textContent = 'Row ' + (r + 1) + ', Col ' + (c + 1) + ' - ' + label;
        // Ellipsized in the bar, complete on hover.
        hv.title = hv.textContent;
        // THE SELECT SLOT AT THE CURSOR (the booklet, 2026-10-18): the tooltip
        // prints the cell's slot numeral ahead of its label, the number the
        // Properties title and the folio print for a picked cell (printSlot).
        // A data attribute the stylesheet draws, so the label stays the
        // tooltip's own first text node. A cell past the last entry has none.
        const tipEl = $('#celltip'), tipOf = CELLS.length ? CELLS[CELLS.length - 1].index + 1 : 0;
        if (i < tipOf) tipEl.dataset.no = 'No.' + slotPad(i + 1); else delete tipEl.dataset.no;
        // PREFERENCES > TOOLTIPS. The character tooltip can be switched off
        // (the footer line above stays), and the hidden state rides on it as a
        // second line while both are on. With only the hidden-state tooltip
        // on, the badge shows it by itself (see onmousemove).
        if (PREFS.tooltipCharacter) {
          const hl = PREFS.tooltipHidden ? hiddenLevel(info) : 0;
          cellTip.show(label, e, hl ? { text: 'Hidden: ' + HIDDEN_MEANING[hl], level: hl } : null);
        }
      };
      d.onmousemove = (e) => {
        // The hidden-state tooltip on its own, over the badge only - VSelect's
        // behavior with the character tooltip off. A hit test against the
        // badge's box: it is flat on the screen, so its box is exact.
