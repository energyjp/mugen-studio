// Studio made since is fetched afresh.
function forgetStagePictures() {
  for (const v of STAGE_PIC_DONE.values()) if (v) URL.revokeObjectURL(v.url);
  STAGE_PIC.clear();
  STAGE_PIC_DONE.clear();
}
function paintStageBanner(h, pic, spr) {
  h.dataset.pic = pic ? pic.from : 'none';
  const lines = [h.dataset.tip];
  if (pic) {
    h.classList.add('pic');
    h.style.backgroundImage = 'var(--stscrim), url("' + pic.url + '")';
    lines.push(pic.from === 'thumb' ? 'Picture: the Studio’s stage thumbnail'
      : 'Picture: stage.portrait.spr ' + spr.g + ',' + spr.i + (pic.from === 'pack'
        ? ', from ' + (MI.name || 'the screenpack')
        : ', from Preferences (' + (MI.name || 'the screenpack') + ' sets none)'));
  }
  h.title = lines.join(String.fromCharCode(10));
}

// A tree row's portrait: the list's own sprite URL and size, with the address
// held back until the row scrolls into view.
function treePortrait(id) {
  if (!PREFS.listPortraits) return null;
  const im = new Image();
  im.alt = '';
  im.dataset.src = portraitSrc(id, palOf(id));
  im.onerror = () => { im.style.visibility = 'hidden'; };
  return im;
}

let STAGE_SEL = null;       // the selected stage group's key
let STAGE_SCROLL = 0;       // the tree's scroll position, across re-renders
let STAGE_IO = null;        // what loads the tree's pictures as they come into view

function drawStages() {
  if (!MI || MI.error) return;   // a tab clicked before the first load
  const panel = $('#orderPanel');
  if (STAGE_IO) { STAGE_IO.disconnect(); STAGE_IO = null; }
  const top = STAGE_SCROLL;
  panel.innerHTML = '';
  const q = $('#search').value.trim().toLowerCase();
  // A search opens everything it shows but what was shut during it
  // (STAGE_SEARCH_SHUT). The kept state is untouched, so clearing the search
  // puts the tree back as it was.
  if (!q) STAGE_SEARCH_SHUT.clear();
  const shut = q ? STAGE_SEARCH_SHUT : stageShut();
  const isShut = (k) => shut.has(k);
  const portraits = !!PREFS.listPortraits;
  const spr = portraits ? stagePortraitSprite() : null;
  const T = stageTreeModel();
  const libById = new Map();
  for (const l of ((LIB && LIB.chars) || [])) if (l && l.id) libById.set(lc(l.id), l);
  // The fields a Characters-tab row searches and shows, for a cell.
  const who = (c) => {
    const l = libById.get(lc(c.char));
    return { displayName: c.displayName, author: (l && l.author) || '',
      folder: l ? (l.folder || l.id) : c.char, def: (l && l.def) || '' };
  };

  // Pictures load when they come into view: a banner through stagePicture, a
  // row portrait by getting its address.
  const wake = (el) => {
    if (el.tagName === 'IMG') {
      if (el.dataset.src) { el.src = el.dataset.src; delete el.dataset.src; }
      return;
    }
    stagePicture(el._stage, spr).then((pic) => { if (el.isConnected) paintStageBanner(el, pic, spr); });
  };
  const io = portraits && window.IntersectionObserver
    ? new IntersectionObserver((entries, obs) => {
      for (const en of entries) {
        if (!en.isIntersecting) continue;
        obs.unobserve(en.target);
        wake(en.target);
      }
    }, { root: panel, rootMargin: '120px 0px' })
    : null;
  STAGE_IO = io;
  const later = (el) => { if (io) io.observe(el); else wake(el); };

  const row = (c) => {
    const r = $new('div', 'row strow');
    r.draggable = true;
    r.dataset.i = String(c.index);
    r.dataset.v = String(c.variant);
    const im = treePortrait(c.char);
    if (im) { r.appendChild(im); later(im); } else r.classList.add('noport');
    const w = who(c);
    const t = $new('div');
    t.style.minWidth = '0';
    const nm = $new('div', 'nm', c.displayName);
    nm.title = 'cell ' + c.index + (c.variants > 1 ? ' · slot member ' + (c.variant + 1) + ' of ' + c.variants : '');
    t.append(nm, $new('div', 'sub', (w.author ? w.author + ' · ' : '') + w.folder));
    r.appendChild(t);
    r.onclick = () => selectFromTree(c);
    r.ondragstart = (e) => {
      e.dataTransfer.setData('text/plain', 'stg:' + c.index + ':' + c.variant);
      dragState(true);
    };
    r.oncontextmenu = (e) => {
      e.preventDefault();
      const has = !!stageKey(c.props && c.props.stage);
      Menu.open(e.clientX, e.clientY, [
        { header: c.displayName },
        { label: 'Find on select screen', run: () => selectFromTree(c, true) },
        { sep: true },
        { label: 'Open containing folder', run: () => openFolderById(w.folder) },
        { sep: true },
        { label: 'Clear stage (random each match)', off: !has, run: () => setCharStage(c, null) },
      ]);
    };
    return r;
  };

  // A drop of a character from this tree, the Characters list or the grid
  // gives it the group's stage; (no stage) takes it away.
  const dropOn = (el, g) => {
    el.ondragover = (e) => { e.preventDefault(); el.classList.add('drop'); };
    el.ondragleave = (e) => { if (!el.contains(e.relatedTarget)) el.classList.remove('drop'); };
    el.ondrop = (e) => {
      e.preventDefault();
      el.classList.remove('drop');
      stageDrop(e.dataTransfer.getData('text/plain') || '', g);
    };
  };

  // Its rows, or null when a search leaves nothing of it. A stage matches by
  // its name and, as path:, its file - the file alone: every stage lives in
  // stages/, and with that in its path "stage" or "st" matched them all.
  const shown = (g, name, isStage) => {
    if (!q) return g.rows;
    if (isStage && matchesQuery({ displayName: name, author: '', folder: '', id: '', def: g.file }, q)) return g.rows;
    const hit = g.rows.filter((c) => matchesQuery(who(c), q));
    return hit.length ? hit : null;
  };

  const tree = $new('div', 'sttree');

  if (T.noStage.length) {
    const g = { key: 'nostage', rows: T.noStage };
    const rows = shown(g, '(no stage)', false);
    if (rows) {
      const el = $new('div', 'stgrp nostage' + (isShut('nostage') ? ' shut' : ''));
      el.dataset.key = 'nostage';
      const h = $new('div', 'sthead');
      h.title = 'these characters get a random stage each match';
      h.append($new('span', 'sttw', isShut('nostage') ? '▶' : '▼'),
        $new('span', 'stnm', '(no stage)'), $new('span', 'stn', '(' + g.rows.length + ')'));
      // A double-click toggles it once, as it does a stage: the second click
      // of the pair is not another toggle.
      h.onclick = (e) => { if (e.detail < 2) toggleStageKey('nostage', el); };
      h.oncontextmenu = (e) => {
        e.preventDefault();
        Menu.open(e.clientX, e.clientY, [
          { label: 'Collapse all stages', run: () => stageTreeAll(true) },
          { label: 'Expand all stages', run: () => stageTreeAll(false) },
        ]);
      };
      const kids = $new('div', 'stkids');
      for (const c of rows) kids.appendChild(row(c));
      el.append(h, kids);
      dropOn(el, null);
      tree.appendChild(el);
    }
  }

  const stageGroup = (g) => {
    const rows = shown(g, g.name, true);
    if (!rows) return null;
    const key = 'stage:' + g.key;
    const empty = !g.rows.length;
    const el = $new('div', 'stgrp' + (isShut(key) ? ' shut' : '') + (empty ? ' empty' : '')
      + (portraits ? ' banner' : '') + (g.missing ? ' invalid' : '') + (STAGE_SEL === g.key ? ' sel' : ''));
    el.dataset.key = key;
    const h = $new('div', 'sthead');
    h.dataset.tip = 'stages/' + g.file
      + (g.missing ? String.fromCharCode(10) + 'stage file not found - would not load in the game' : '');
    h.title = h.dataset.tip;
    const gear = eBtn('⚙', (e) => { e.stopPropagation(); stageDetails(g); }, 'stgear');
    gear.title = 'Stage details';
    gear.setAttribute('aria-label', 'Stage details: ' + g.name);
    gear.ondblclick = (e) => e.stopPropagation();
    const tw = $new('span', 'sttw', isShut(key) || empty ? '▶' : '▼');
    h.append(tw, $new('span', 'stnm', g.name), $new('span', 'stn', '(' + g.rows.length + ')'));
    if (g.noRandom) {
      const chip = $new('span', 'stchip', 'no-random');
      chip.title = 'selectable from the stage list but never picked at random';
      h.appendChild(chip);
    }
    if (g.missing) {
      const warn = $new('span', 'stwarn', '⚠');
      warn.title = 'stage file not found - would not load in the game';
      h.appendChild(warn);
    }
    // The ⚙ goes last, after the chips, so margin-left:auto puts it at the
    // right end (VSelect's place for it).
    h.appendChild(gear);
    // THE CARET ZONE is the header's first 18px: a click there opens or
    // shuts the group, anywhere else selects the stage. A double-click
    // anywhere else opens or shuts it too.
    const inCaret = (e) => {
      if (e.target.closest('.sttw')) return true;
      return e.clientX - h.getBoundingClientRect().left < 18;
    };
    h.onclick = (e) => {
      if (inCaret(e)) { toggleStageKey(key, el); return; }
      selectStage(g, el);
    };
    h.ondblclick = (e) => { if (!inCaret(e)) toggleStageKey(key, el); };
    h.oncontextmenu = (e) => {
      e.preventDefault();
      selectStage(g, el);
      const info = sel === null ? null : cellAt(sel);
      const ch = info && info.kind === 'char' ? info : null;
      Menu.open(e.clientX, e.clientY, [
        { header: g.name },
        { label: ch ? 'Use for ' + ch.displayName : 'Use for the selected character', off: !ch,
          title: ch ? '' : 'Select a character’s cell first', run: () => setCharStage(ch, g) },
        { sep: true },
        { label: 'Collapse all stages', run: () => stageTreeAll(true) },
        { label: 'Expand all stages', run: () => stageTreeAll(false) },
      ]);
    };
    if (portraits) {
      h._stage = g;
      const known = STAGE_PIC_DONE.get(stagePicKey(g, spr));
      if (known !== undefined) paintStageBanner(h, known, spr);
      else later(h);
    }
    const kids = $new('div', 'stkids');
    for (const c of rows) kids.appendChild(row(c));
    el.append(h, kids);
    dropOn(el, g);
    return el;
  };

  const section = (key, label, groups, emptyNote) => {
    const els = groups.map(stageGroup).filter(Boolean);
    const s = $new('div', 'stsec' + (isShut(key) ? ' shut' : ''));
    s.dataset.key = key;
    const h = $new('div', 'sthd');
    h.append($new('span', 'sttw', isShut(key) ? '▶' : '▼'), $new('span', '', label),
      $new('span', 'stn', '(' + els.length + ')'));
    h.onclick = (e) => { if (e.detail < 2) toggleStageKey(key, s); };
    const body = $new('div', 'stbody');
    if (!els.length) body.appendChild($new('div', 'stnote', q ? 'No stages match.' : emptyNote));
    for (const el of els) body.appendChild(el);
    s.append(h, body);
    return s;
  };
  tree.appendChild(section('section:included', 'Included', T.included,
    (MI.stageList || []).length ? 'No stages here.' : 'No stages in [ExtraStages] yet. Add them from the main Studio page.'));
  tree.appendChild(section('section:excluded', 'Excluded', T.excluded, 'No stages here.'));

  panel.appendChild(tree);
  panel.scrollTop = top;
  panel.onscroll = () => { if (TAB === 'stages') STAGE_SCROLL = panel.scrollTop; };
}

// Selecting a stage: an outline on its group, a tint on its rows, and what it
// is on the status line. Classes only, no redraw (see toggleStageKey).
function selectStage(g, el) {
  STAGE_SEL = g.key;
  for (const e of $('#orderPanel').querySelectorAll('.stgrp.sel')) e.classList.remove('sel');
  el.classList.add('sel');
  const hv = $('#hover');
  hv.textContent = 'Stage: ' + g.name + ' · stages/' + g.file + ' · ' + stageMusicSummary(g);
  hv.title = hv.textContent;
}

// A tree row selects its character's cell the way a click on the grid does,
// and shows it the way Find on select screen does.
function selectFromTree(c, say) {
  sel = c.index;
  drawGrid(); drawInspector();
  if (flashCell(c.index) && say) log('Found ' + c.displayName + ' at row ' + (c.row + 1) + ', col ' + (c.col + 1));
}

// ONE CHARACTER'S ARCADE STAGE, set or cleared (g null): a drop, Use for and
// Clear stage all come here. An immediate edit, as Apply in Properties is -
// written now, one Undo step, and Revert takes it back.
async function setCharStage(c, g) {
  if (!c) return;
  const was = stageKey(c.props && c.props.stage);
  if (was === (g ? g.key : '')) {
    log(c.displayName + (g ? ' already fights on ' + g.name : ' already gets a random stage'));
    return;
  }
  const r = await (await fetch('/api/char-props', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mountAs: c.char, props: { stage: g ? 'stages/' + g.file : '' } }),
  })).json();
  if (r.error) { log('ERROR ' + r.error); return; }
  // The newest word on the stage: it replaces one typed into the form and
  // not applied, which Apply would otherwise write back over it.
  const pend = PENDING.get(c.char);
  if (pend) pend.stage = g ? 'stages/' + g.file : '';
  const to = g ? g.name : 'random stage';
  log(c.displayName + ' → ' + to, true);
  Session.record('stage of ' + c.displayName + ' → ' + to);
  await load(true);
}

// WHAT WAS DROPPED ON A STAGE. A tree row names its cell and slot member
// (`stg:`), a grid cell its cell (`cell:`, the member the grid shows), a
// Characters row a character (`lib:`), which has to be on the grid to have a
// stage at all.
function stageDropChar(p) {
  let m = /^stg:(\d+):(\d+)$/.exec(p);
  if (m) return CELLS.find((x) => x.kind === 'char' && x.index === +m[1] && x.variant === +m[2]) || null;
  m = /^cell:(\d+)$/.exec(p);
  if (m) {
    const c = cellAt(+m[1]);
    if (c && c.kind === 'char') return c;
    if (c) log('Only a character can have a stage');
    return null;
  }
  m = /^lib:(.+)$/.exec(p);
  if (m) {
    const c = CELLS.find((x) => x.kind === 'char' && lc(x.char) === lc(m[1]));
    if (c) return c;
    const l = ((LIB && LIB.chars) || []).find((x) => lc(x.id) === lc(m[1]));
    const name = (l && l.displayName) || m[1];
    log(isOffGridId(m[1]) ? name + ' is off the grid: put it back on the grid first, then give it a stage'
      : 'Place ' + name + ' on the grid first, then drag it onto a stage');
  }
  return null;
}
// A stage is a property, not a move, but a locked cell is one the owner has
// said not to touch: while Lock cells is on, its character's stage stays.
function stageDrop(payload, g) {
  const c = stageDropChar(payload);
  if (!c) return;
  if (lockRefuses(c.index, g ? 'given another stage' : 'set to a random stage', c.displayName)) return;
  setCharStage(c, g);
}

// THE ⚙ DIALOG: everything the Stages tab used to list under each stage -
// its name, its file, its music, who uses it - and Use for.
function stageDetails(g) {
  const d = eDialog('Stage details', { width: 440, cls: 'stdlg' });
  const dl = $new('dl', 'stinfo');
  const add = (label, dd) => { dl.append($new('dt', '', label), dd); };
  add('Name', $new('dd', '', g.name));
  add('File', $new('dd', 'mono', 'stages/' + g.file));
  const mus = $new('dd', 'mono');
  if (g.st && (g.st.music || []).length) for (const t of g.st.music) mus.appendChild($new('div', '', t));
  else mus.textContent = g.st ? 'no music of its own' : 'not in [ExtraStages]: the stage’s own music plays';
  add('Music', mus);
  const users = $new('dd', 'users');
  users.appendChild($new('div', '', !g.rows.length ? 'No character uses this stage'
    : g.rows.length === 1 ? '1 character uses this stage' : g.rows.length + ' characters use this stage'));
  if (g.rows.length) {
    const names = $new('div', 'names');
    g.rows.forEach((c, k) => {
      if (k) names.appendChild(document.createTextNode(', '));
      const a = $new('a', '', c.displayName);
      a.href = '#';
      a.title = 'Select cell ' + c.index + ' on the grid';
      a.onclick = (e) => { e.preventDefault(); d.close(); selectFromTree(c); };
      names.appendChild(a);
    });
    users.appendChild(names);
  }
  add('Used by', users);
  d.body.appendChild(dl);
  if (g.missing) d.body.appendChild($new('p', 'emsg bad', '⚠ stage file not found - would not load in the game'));
  if (g.noRandom) {
    d.body.appendChild($new('p', 'emsg', 'No-random: its first user has includestage = -1, so it is selectable from the stage list but never picked at random.'));
  }
  const info = sel === null ? null : cellAt(sel);
  const ch = info && info.kind === 'char' ? info : null;
  const use = eBtn(ch ? 'Use for ' + ch.displayName : 'Use for the selected character',
    () => { d.close(); setCharStage(ch, g); }, 'left');
  use.disabled = !ch;
  if (!ch) use.title = 'Select a character’s cell first';
  d.foot.append(use, eBtn('Close', () => d.close(), 'primary'));
  d.focus(d.foot.lastChild);
}

// The engine's own meanings (docs/ENGINE.md, the select.def params): 1 keeps
// the character in the random pool, 2 makes the cursor skip the cell, 3 draws
// the cell as a random-select cell. Without 3 listed, a character set to it
// opened showing "Visible" and Apply cleared it.
const HIDDEN_OPTS = [['', 'Visible (default)'], ['1', 'Hidden, selectable'], ['2', 'Hidden, not selectable'],
  ['3', 'Shown as a random-select cell']];

// THE SELECT SLOT, PRINTED (the booklet, 2026-10-18). The Studio numbers a
// character by the cell the select screen gives it - the same walk as
// deriveCells, a slot group being one cell and a placeholder a cell
// (studio.html charSlots) - and prints "No.03 of 7" on its page and in the
// folio. E-Select prints the picked cell's number the same way, from the grid
// as it stands on this page (unsaved moves included): beside the Properties
// title for a character, and in the running foot's folio for any cell that
// holds an entry. A cell past the last entry has no slot.
const slotPad = (n) => String(n).padStart(2, '0');
function printSlot(info) {
  const of = CELLS.length ? CELLS[CELLS.length - 1].index + 1 : 0;
  const has = sel !== null && sel < of && !!info;
  const no = $('#insNo'), fno = $('#esFolioNo'), fof = $('#esFolioOf');
  if (no) {
    no.hidden = !(has && info.kind === 'char');
    no.textContent = '';
    if (!no.hidden) no.textContent = 'No.' + slotPad(sel + 1);
  }
  if (fno) fno.textContent = has ? 'No.' + slotPad(sel + 1) : 'No. –';
  // "of 32 cells", as the Studio's folio counts (studio.html charSlots: the
  // number is a CELL, so the count says what it counts).
  if (fof) fof.textContent = has ? 'of ' + of + ' cells' : '';
}
// THE BAND'S MASCOT in the head (Booklet.mascot): it deals E-Select's own tips
// first ('eselect' in the Studio's TIP_PAGES), then the general ones, from the
// Studio's deck through the opener, as a slip laid over the page - never a box
// in it. A window the Studio did not open (the same-window E-Select, a page
// opened by hand) has no deck and no mascot.
(function esMascot() {
  const b = document.getElementById('esMascot');
  if (b && window.Booklet && typeof Booklet.mascot === 'function') Booklet.mascot(b, { page: 'eselect' });
})();

function drawInspector() {
  const ins = $('#ins');
  // sel is a CELL index, not an order index.
  const info = sel === null ? null : cellAt(sel);
  printSlot(info);
  // A cell that holds no character is still a real thing to edit: it is either
  // a skipslot, a randomselect, or past the end of the roster. Returning early
  // for all three left randomselect unreachable from the editor.
  if (!info || info.kind !== 'char') {
    if (sel === null) {
      $('#inshead').textContent = 'no cell selected';
      ins.innerHTML = '<div class="hint">Click a cell to edit its select.def properties.</div>';
      CURRENT_TOUCH = null;
      return;
    }
    // THREE KINDS, and the panel names the one this cell IS and offers the two
    // it is not. It used to describe every empty cell as a skipslot, which was
    // the only empty kind the editor could make - and is now the one it makes
    // least often.
    const kind = (info && info.kind) || 'dummy';   // no entry at all reads as unused
    const NAME = { dummy: 'Empty cell', skip: 'Skipslot', random: 'Random select' };
    // WHAT THIS PACK DOES WITH AN EMPTY CELL is read from the motif, not
    // assumed: the stock Default pack jumps the cursor over empty cells and
    // draws no box (both flags 0, the engine's defaults); ikemen1, big and
    // mugen1 let the cursor rest and draw the box.
    const S0 = MI.select || {};
    const rests = !!S0.moveOverEmptyBoxes, drawn = !!S0.showEmptyBoxes;
    const WHAT = {
      dummy: 'An <b>empty cell</b> is a <b>dummyslot</b>: nothing is in it. On <b id="insPack"></b> the cursor '
        + (rests ? '<b>can rest on it</b>' : '<b>jumps over it</b>')
        + ' (moveoveremptyboxes = ' + (rests ? 1 : 0) + ') and the empty box is '
        + (drawn ? 'drawn' : '<b>not drawn</b>') + ' (showemptyboxes = ' + (drawn ? 1 : 0)
        + '). An unused cell past the last entry behaves the same way. This is what the engine pads a short grid with.',
      skip: 'A <b>skipslot</b> draws nothing at all and the cursor can <b>never</b> '
        + 'enter it, on any screenpack. Use it for ground a pack keeps clear - '
        + 'behind a portrait panel, say - not for a gap you just want empty.',
      random: 'A <b>randomselect</b> cell. The cursor can land on it and picking it '
        + 'gives a random character. The motif draws <b>cell.random.spr</b> here '
        + 'instead of a portrait, cycling every <b>cell.random.switchtime</b> ticks.',
    };
    const BTN = {
      dummy: ['mkhole2', 'Make this an empty cell'],
      skip: ['mkskip2', 'Make this a skipslot'],
      random: ['mkrandom2', 'Make this a random-select cell'],
    };
    $('#inshead').textContent = NAME[kind] + ' \u00b7 cell ' + sel;
    ins.innerHTML = '<div class="grp">CELL ' + sel + '</div>'
      + '<div class="hint">' + WHAT[kind] + '</div>'
      + ['dummy', 'skip', 'random'].filter((k) => k !== kind)
          .map((k, n) => '<button id="' + BTN[k][0] + '" style="width:100%'
            + (n ? ';margin-top:6px' : '') + '">' + BTN[k][1] + '</button>').join('')
      + '<div class="hint" style="margin-top:8px">Drag a character here to fill it.</div>'
      // NO RAW LINE TO TYPE, said here because this is where the editor once
      // offered one ("Edit cell line") and nothing saved it. select.def is
      // generated from the roster, and every shape a typed line can take is
      // either placed here already (these three, a character, a slot) or
      // breaks the grid: a [section] line ends [Characters], a comment-only
      // line and `exclude = 1` take no cell, `slot = {` opens a block, and a
      // path the build does not ship loads as an empty cell (GRAIL 4.12).
      + '<div class="hint" style="margin-top:6px;opacity:.75">There is no select.def line to type here: the file is written from these cells. A character\'s other select.def settings go under CUSTOM in its Properties.</div>'
      // The pack's two empty-cell flags, settable here because an empty cell
      // is where the question comes up. Written into the screenpack's own
      // system.def ([Select Info], a .orig kept beside it), for every empty
      // cell at once - the same file the grid size goes to.
      + '<div class="grp" style="margin-top:10px" id="insEmptyHead"></div>'
      + '<label class="hint" style="display:block"><input type="checkbox" id="emptyRest"' + (rests ? ' checked' : '') + '> cursor can rest on empty cells <span style="opacity:.7">(moveoveremptyboxes)</span></label>'
      + '<label class="hint" style="display:block"><input type="checkbox" id="emptyDraw"' + (drawn ? ' checked' : '') + '> draw the empty box <span style="opacity:.7">(showemptyboxes)</span></label>'
      + '<div class="hint" style="opacity:.75">Written into the screenpack\'s system.def; applies to every empty cell.</div>'
      // Preferences > Empty cell display overrides only what is DRAWN here.
      + (PREFS.showEmpty !== '0'
        ? '<div class="hint" style="opacity:.75">E-Select is set to ' + (PREFS.showEmpty === '1' ? 'always show' : 'always hide')
          + ' the empty box (Preferences › Empty cell display), so the grid here does not follow this setting. The game does.</div>'
        : '');
    // The pack's name is its system.def's text: filled in as text (C-21).
    if ($('#insPack')) $('#insPack').textContent = MI.name || 'this screenpack';
    $('#insEmptyHead').textContent = 'EMPTY CELLS ON ' + (MI.name || 'THIS SCREENPACK').toUpperCase();
    for (const [id, key] of [['emptyRest', 'moveOverEmptyBoxes'], ['emptyDraw', 'showEmptyBoxes']]) {
      const cb = $('#' + id);
      if (!cb) continue;
      cb.onchange = async () => {
        const body = {}; body[key] = cb.checked;
        const r = await (await fetch('/api/motif-grid', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();
        if (r.error) { log('ERROR ' + r.error); cb.checked = !cb.checked; return; }
        // The file has it now; so does the page, before the full reload lands
        // - a redraw in between must not show the old value.
        if (MI && MI.select) MI.select[key] = cb.checked;
        log((key === 'moveOverEmptyBoxes' ? 'Cursor ' + (cb.checked ? 'can rest on' : 'jumps over') + ' empty cells' : 'Empty boxes ' + (cb.checked ? 'drawn' : 'not drawn')) + ' on ' + (MI.name || 'this screenpack') + ' — written to its system.def now; Revert undoes it', true);
        Session.record((key === 'moveOverEmptyBoxes' ? 'moveoveremptyboxes' : 'showemptyboxes') + ' = ' + (cb.checked ? 1 : 0) + ' on ' + MI.name);
        await load(true);
      };
    }
    const toKind = (k) => {
      if (lockRefuses(sel, 'turned into another kind')) return;
      const span = orderIndexOfCell(sel);
      if (span) order.splice(span.start, span.end - span.start, { kind: k });
      else { padTo(sel); order.push({ kind: k }); }
      trimTrailingHoles();
      const said = { random: 'random-select', dummy: 'an empty cell',
                     skip: 'a skipslot (the cursor jumps over it)' }[k];
      log('Cell ' + sel + ' is now ' + said, true);
      Session.record('cell ' + sel + ' -> ' + said, true);
      markDirty(true); render(); drawInspector();
    };
    for (const [id2, k] of [['mkrandom2', 'random'], ['mkhole2', 'dummy'], ['mkskip2', 'skip']]) {
      const b = $('#' + id2);
      if (b) b.onclick = () => toKind(k);
    }
    return;
  }
  const S = MI.select, id = info.char;
  // What is on disk, and what the user has typed but not applied. The form is
  // built from the pending payload when there is one, so switching cells and
  // coming back shows the edit rather than losing it.
  const saved = Object.assign({}, info.props || {});
  saved.params = (info.props && info.props.params) || {};
  const p = PENDING.get(id) || saved;
  $('#inshead').textContent = 'Properties · ' + info.displayName;
  const fld = (label, key, value, opts) => {
    if (opts) {
      return '<div class="fld"><label>' + label + '</label><select data-k="' + key + '">'
        + opts.map(([v, t]) => '<option value="' + v + '"' + (String(value) === v ? ' selected' : '') + '>' + t + '</option>').join('')
        + '</select></div>';
    }
    return '<div class="fld"><label>' + label + '</label>'
      + '<input data-k="' + key + '" value="' + String(value == null ? '' : value).replace(/"/g, '&quot;') + '"></div>';
  };
  // THE STAGE AS SAVED, WHATEVER ITS SPELLING. The list offers the
  // [ExtraStages] files bare, while Use for and a drop in the Stages tree
  // write `stages/<file>`. Matched on the file alone, no option was selected,
  // the box fell to "(random from ExtraStages)", and merely opening the
  // character read as an unapplied edit - one Apply away from clearing the
  // stage. The option for the character's own stage carries its own spelling
  // (stageKey), and a stage the list does not have stays a choice.
  const curStage = String(p.stage == null ? '' : p.stage);
  let stageHit = !curStage;
  const stageOpts = [['', '(random from ExtraStages)']].concat((MI.stages || []).map((s) => {
    if (curStage && stageKey(s) === stageKey(curStage)) { stageHit = true; return [curStage, s]; }
    return [s, s];
  }));
  if (!stageHit && !/[<>"&]/.test(curStage)) stageOpts.push([curStage, stageBare(curStage) + ' (not in [ExtraStages])']);
  const musicOpts = [['', '(stage default)']].concat((MI.music || []).map((m) => [m, m]));
  // Everything the editor does not give its own field lives in `params`, and
  // the ADVANCED block is a set of named views onto it.
  const px = (p.params && typeof p.params === 'object') ? p.params : {};
  const SAVED_PRINT = printOf(saved);
  const pv = (k) => (px[k] === undefined ? '' : String(px[k]));
  // A param field writes into params.<key> rather than a top-level prop.
  const pfld = (label, key, opts) => fld(label, 'p:' + key, pv(key), opts);
  const pchk = (label, key, onWhenAbsent) => {
    // vsscreen and victoryscreen default to TRUE in the engine
    // (newSelectCharParams), so an absent key means ticked, and unticking must
    // write the 0 rather than clearing the key.
    const cur = pv(key);
    const on = cur === '' ? !!onWhenAbsent : !/^(0|false|no)$/i.test(cur);
    return '<div class="fld chk"><label>' + label + '</label>'
      + '<input type="checkbox" data-k="c:' + key + '"' + (on ? ' checked' : '') + '></div>';
  };
  ins.innerHTML =
    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">'
    + '<img src="' + portraitSrc(id, palOf(id)) + '" style="width:44px;height:44px;object-fit:cover;image-rendering:pixelated;border:1px solid var(--line);border-radius:3px">'
    // The name and id are filled in as text below (C-21), never as markup.
    + '<div><div style="font-weight:600" id="insName"></div><div class="sub" id="insSub" style="color:var(--dim);font-size:11px"></div></div></div>'
    + (() => {
      const v = portraitVerdict(id, info.row);
      if (!v) return '';
      const esc = (x) => String(x).replace(/"/g, '&quot;');
      return '<div class="diag" title="' + esc(portraitAdvice(v)) + '">'
        + '<span class="ico">!</span><span>'
        + '<b>Its cell portrait is not a portrait.</b> Sprite ' + v.spr + ' is '
        + v.w + '\u00d7' + v.h + ', which the engine draws at '
        + v.drawnW + '\u00d7' + v.drawnH + ' in a ' + v.cellW + '\u00d7' + v.cellH + ' cell.'
        + '<span class="more">A sprite of about ' + v.wantW + '\u00d7' + v.wantH
        + ' would fill it. Hover for the full explanation.</span>'
        + '</span></div>';
    })()
    + (() => {
      const v = bigPortraitVerdict(id);
      if (!v) return '';
      const esc = (x) => String(x).replace(/"/g, '&quot;');
      return '<div class="diag" title="' + esc(bigPortraitAdvice(v)) + '">'
        + '<span class="ico">!</span><span>'
        + (v.kind === 'over'
          ? '<b>Its big portrait overflows ' + v.against + '.</b> '
          : '<b>Its big portrait is far too small for ' + v.against + '.</b> ')
        + 'Sprite ' + v.spr + ' is ' + v.w + '\u00d7' + v.h
        + (v.kind === 'over'
          ? ', which the engine draws at ' + v.drawnW + '\u00d7' + v.drawnH
            + ' against ' + v.fitW + '\u00d7' + v.fitH + '.'
            + '<span class="more">A sprite of about ' + v.wantW + '\u00d7' + v.wantH
            + ' would fit. Hover for the full explanation.</span>'
          : ' \u2014 an ordinary size \u2014 but its .def declares localcoord '
            + v.localcoord + ', so the engine scales it by ' + v.resFix
            + ' instead of ' + Math.round((v.resFix * v.localcoord / 320) * 100) / 100
            + ' and it lands at ' + v.drawnW + '\u00d7' + v.drawnH + '.'
            + '<span class="more">At a 320 localcoord the same sprite would draw at '
            + v.asIf320W + '\u00d7' + v.asIf320H
            + ', like the rest of the roster. Hover for the full explanation.</span>')
        + '</span></div>';
    })()
    + '<div class="blk" id="blkAbout"><div class="grp"><span class="tw">\u25be</span>ABOUT</div>'
    + '<div class="body"><dl class="about" id="aboutBody">'
    + '<dt>reading\u2026</dt><dd></dd></dl></div></div>'
    + '<div class="blk" id="blkCommon"><div class="grp"><span class="tw">\u25be</span>SETTINGS \u00b7 COMMON</div>'
    + '<div class="body">'
    + fld('Stage', 'stage', p.stage, stageOpts)
    + fld('Music', 'music', p.music, musicOpts)
    + fld('Order', 'order', p.order)
    + fld('Order (surv)', 'ordersurvival', p.ordersurvival)
    + fld('AI', 'ai', p.ai)
    + fld('Hidden', 'hidden', p.hidden, HIDDEN_OPTS)
    + fld('Include stage', 'includestage', p.includestage, [['', 'yes (default)'], ['-1', 'not random, still pickable'], ['0', 'neither']])
    + '</div></div>'
    // THE ADVANCED BLOCK. Every field here writes a real select.def param that
    // the engine reads; the ones with no field of their own end up in CUSTOM.
    + '<div class="blk shut" id="blkAdv"><div class="grp"><span class="tw">\u25b8</span>SETTINGS \u00b7 ADVANCED</div>'
    + '<div class="body">'
    // Music prefixes, from src/music.go:100-105. At round start the engine
    // tries "final", then round<match>, then round<round>, then the plain
    // track; "life" plays when the team leader drops below the stage's
    // bgmratio; "victory" on a decisive win with the winner alive.
    + musicField('Final music', 'final.music', px)
    + musicField('Life music', 'life.music', px)
    + musicField('Victory music', 'victory.music', px)
    + musicField('Round 1 music', 'round1.music', px)
    + musicField('Round 2 music', 'round2.music', px)
    + pfld('Rounds', 'rounds')
    + pfld('Time (s)', 'time')
    // arcadepath really is a LUA FILE - start.lua:1797 calls it "lua file with
    // custom arcade path detection" and swaps it in for main.luaPath.
    + pfld('Arcade path (.lua)', 'arcadepath')
    + pfld('Unlock (Lua condition)', 'unlock')
    + '<div class="hint">Unlock is a Lua expression and is always written LAST on the '
    + 'line: the engine reads it to end-of-line, so anything after it would be '
    + 'swallowed. It may contain commas for that reason.</div>'
    + pchk('VS screen', 'vsscreen', true)
    + pchk('Victory screen', 'victoryscreen', true)
    + pchk('Single', 'single', false)
    + pchk('Bonus', 'bonus', false)
    + '</div></div>'
    + '<div class="blk shut" id="blkCustom"><div class="grp"><span class="tw">\u25b8</span>CUSTOM</div>'
    + '<div class="body"><div class="hint">Any other select.def parameter, written as '
    + 'written. This is the escape hatch for keys this editor does not model.</div>'
    + '<div id="kvlist"></div>'
    + '<button id="addParam" style="width:100%">+ Add param</button></div></div>'
    // NO SLOT SECTION HERE. A cell that holds one character has no variants to
    // configure, and the fields were the tallest thing in the panel for the
    // 24 cells out of 25 that never need them. Slots get their own window,
    // opened when one is made or asked for - which is where VSelect puts them.
    + (info.slot || info.variants > 1
        ? '<div class="hint">This cell is a <b>slot</b>. '
          + '<a href="#" id="openSlot">View its ' + info.variants + ' character(s)\u2026</a></div>'
        : '')
    + '<button id="applyProps" style="margin-top:8px;width:100%">Apply to ' + id + '</button>'
    + (info.variants > 1
        ? '<button id="ungroup" style="margin-top:6px;width:100%">Split this cell apart</button>' : '')
    + '<div class="grp">CELL</div>'
    + '<button id="mkhole" style="width:100%">Replace with an empty cell</button>'
    + '<button id="mkrandom" style="margin-top:6px;width:100%">Replace with a random-select cell</button>'
    + '<div class="hint">The empty cell is an <b>unused cell</b>: nothing is placed there, '
    + 'the screenpack draws its empty box when it shows empty boxes, and the cursor can '
    + 'rest on it when the pack lets it move over empty boxes. A random-select cell shows '
    + 'the motif\'s own random icon and gives a random character when picked. Either way '
    + 'the character returns to the library, not deleted from disk.</div>';
  $('#insName').textContent = info.displayName;
  $('#insSub').textContent = id + ' · cell ' + sel;
  const ug = $('#ungroup');
  if (ug) ug.onclick = () => {
    // Members must be CONSECUTIVE to form a block, so clearing the slot id on
    // every member is enough - they become N ordinary cells in place.
    if (lockRefuses(sel, 'split apart')) return;
    const span = orderIndexOfCell(sel);
    if (!span) return;
    const n = span.end - span.start;
    // The members become cells of their own, which pushes every cell after
    // them on - except a locked one (pinLocks).
    const pins = pinLocks();
    for (let k = span.start; k < span.end; k++) order[k].slot = '';
    unpinLocks(pins);
    log('Split cell ' + sel + ' into ' + n + ' separate cells', true);
    Session.record('split cell ' + sel + ' into ' + n + ' cells', true);
    sel = null; markDirty(true); render(); drawInspector();
  };
  const replaceCellWith = (kind) => {
    if (lockRefuses(sel, 'replaced')) return;
    const span = orderIndexOfCell(sel);
    if (!span) return;
    const gone = order.slice(span.start, span.end).map((e) => e.char).filter(Boolean);
    order.splice(span.start, span.end - span.start, { kind });
    trimTrailingHoles();
    log('Cell ' + sel + ' is now ' + (kind === 'random' ? 'random-select' : 'empty')
        + ' (' + gone.join(', ') + ' back in the library)', true);
    Session.record('cell ' + sel + ' -> ' + (kind === 'random' ? 'random-select'
      : kind === 'dummy' ? 'unused cell' : 'skipslot'), true);
    // The cell stays selected when it becomes a randomselect, because that is
    // a thing you go on to inspect; an emptied cell has nothing to look at.
    if (kind === 'skip' || kind === 'dummy') sel = null;
    markDirty(true); render(); drawInspector();
  };
  // The button says "Replace with an empty cell" and now makes one.
  $('#mkhole').onclick = () => replaceCellWith('dummy');
  $('#mkrandom').onclick = () => replaceCellWith('random');
  // --- blocks fold, and remember it for the session ---------------------
  for (const b of ins.querySelectorAll('.blk')) {
    const head = b.querySelector('.grp');
    if (BLK_SHUT.has(b.id)) b.classList.add('shut'); else b.classList.remove('shut');
    head.querySelector('.tw').textContent = b.classList.contains('shut') ? '\u25b8' : '\u25be';
    head.onclick = () => {
      const shut = b.classList.toggle('shut');
      if (shut) BLK_SHUT.add(b.id); else BLK_SHUT.delete(b.id);
      head.querySelector('.tw').textContent = shut ? '\u25b8' : '\u25be';
    };
  }

  // --- ABOUT, read from the character's own files -----------------------
  (async () => {
    let a = null;
    try { a = await (await fetch('/api/char-about?char=' + encodeURIComponent(id))).json(); }
    catch (e) { a = null; }
    const dl = $('#aboutBody');
    if (!dl) return;
    if (!a || a.error) { dl.innerHTML = '<dt>unreadable</dt><dd></dd>'; return; }
    const rows = [
      ['Display name', a.displayName], ['Internal name', a.name], ['Author', a.author],
      ['Version date', a.versionDate], ['Mugen version', a.mugenVersion],
      ['SFF version', a.sffVersion], ['Palette count', a.paletteCount],
      ['Sprites', a.sprites], ['localcoord', a.localcoord], ['Folder', a.folder + '/' + a.def],
    ];
    // AS TEXT: a .def is a third party's file, and its name or author can
    // hold '<' or '&' ("Ryu <Evil>"), which markup would swallow or parse.
    dl.textContent = '';
    for (const r of rows.filter((x) => x[1] !== '' && x[1] !== undefined && x[1] !== null)) {
      const dt = document.createElement('dt');
      dt.textContent = r[0];
      const dd = document.createElement('dd');
      dd.textContent = String(r[1]);
      dd.title = String(r[1]);
      dl.append(dt, dd);
    }
  })();


  // --- CUSTOM: every param with no field of its own ----------------------
  // A key that one of the named fields already covers must not appear twice,
  // or the two would fight on save.
  const NAMED = new Set(['final.music', 'life.music', 'victory.music', 'round1.music',
    'round2.music', 'rounds', 'time', 'arcadepath', 'unlock', 'vsscreen',
    'victoryscreen', 'single', 'bonus']);
  const kvHost = $('#kvlist');
  const kvAdd = (k, v) => {
    const row = document.createElement('div');
    row.className = 'kvrow';
    const ki = document.createElement('input');
    ki.placeholder = 'key'; ki.value = k || ''; ki.dataset.kv = 'k';
    const vi = document.createElement('input');
    vi.placeholder = 'value'; vi.value = v || ''; vi.dataset.kv = 'v';
    const rm = document.createElement('button');
    rm.textContent = '\u00d7'; rm.title = 'Remove this param';
    rm.onclick = () => row.remove();
    row.appendChild(ki); row.appendChild(vi); row.appendChild(rm);
    kvHost.appendChild(row);
  };
  for (const k of Object.keys(px)) if (!NAMED.has(k)) kvAdd(k, px[k]);
  $('#addParam').onclick = () => kvAdd('', '');

  // --- Arcade path browses for a real file -------------------------------
  // arcadepath names a LUA FILE - start.lua:1797 calls it "lua file with
  // custom arcade path detection" and swaps it in for main.luaPath - so the
  // picker filters for .lua. A browser file input cannot give a path, so the
  // dialog is opened by the OS on the server side and only the path returns.
  const arcField = ins.querySelector('[data-k="p:arcadepath"]');
  if (arcField) {
    const b = document.createElement('button');
    b.textContent = '…';
    b.className = 'dots';
    b.title = 'Browse for a .lua script';
    b.onclick = async () => {
      const r = await (await fetch('/api/pick-file', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind: 'lua' }),
      })).json();
      if (r.error) { log('ERROR ' + r.error); return; }
      if (r.canceled) return;
      // A path inside the build is more use to select.def than an absolute one.
      arcField.value = r.relative || r.path;
      arcField.dispatchEvent(new Event('input', { bubbles: true }));
    };
    arcField.parentNode.appendChild(b);
  }

  // --- Unlock gets a bigger window, because a Lua condition is not a field --
  const unlockField = ins.querySelector('[data-k="p:unlock"]');
  if (unlockField) {
    const dots = document.createElement('button');
    dots.textContent = '\u2026';
    dots.className = 'dots';
    dots.title = 'Edit in a larger window';
    dots.onclick = () => {
      bigEdit('Unlock \u2014 Lua condition', unlockField.value, (val) => {
        unlockField.value = val;
      });
    };
    unlockField.parentNode.appendChild(dots);
  }

  const openSlotLink = $('#openSlot');
  if (openSlotLink) openSlotLink.onclick = (e) => { e.preventDefault(); showSlotMembers(sel); };

  // --- music prefixes: expand, add an alternate, drop one ----------------
  for (const box of ins.querySelectorAll('.mus')) {
    const key = box.dataset.key;
    const tracks = box.querySelector('.tracks');
    // The fold covers the volume and loop numbers only. An added track is
    // always visible: it is the thing that just happened.
    box.querySelector('.tog').onclick = () => box.classList.toggle('open');
    const wireRemove = (row) => {
      row.querySelector('.rm').onclick = () => { row.remove(); touch(); };
    };
    box.querySelector('.add').onclick = () => {
      const d = document.createElement('div');
      d.innerHTML = musicTrackRow(key, { path: '', vol: '', start: '', end: '' });
      const row = d.firstChild;
      wireRemove(row);
      tracks.appendChild(row);
      touch();
    };
    for (const row of tracks.querySelectorAll('.trk')) wireRemove(row);
  }

  // WHAT THE FORM CURRENTLY SAYS, as the payload Apply would send.
  //
  // The change watcher compares THIS rather than raw DOM state, because the two
  // are not the same question: adding an empty custom row, or typing a 3 into
  // AI and deleting it again, both change the DOM and neither changes what
  // would be written. Comparing the payload means "unapplied property edits"
  // disappears the moment the form is back where it started, which is what a
  // person expects after undoing their own typo.
  const gather = () => {
    const props = {};
    const params = {};
    ins.querySelectorAll('[data-k]').forEach((el) => {
      const k = el.dataset.k;
      if (k.startsWith('p:')) { params[k.slice(2)] = el.value; return; }
      if (k.startsWith('c:')) {
        // DEFAULTS DECIDE WHICH STATE IS WRITTEN. vsscreen and victoryscreen
        // default to true in newSelectCharParams, so ticked is absence and
        // unticked writes the 0; single and bonus default to false, so ticked
        // writes the 1 and unticked is absence. Either way the file only
        // carries what departs from the engine's own default.
        const key = k.slice(2);
        const defOn = key === 'vsscreen' || key === 'victoryscreen';
        params[key] = el.checked === defOn ? '' : (el.checked ? '1' : '0');
        return;
      }
      props[k] = el.value;
    });
    // Music prefixes are gathered per box, as an array of track strings. The
    // header input is skipped: it mirrors the first track row.
    for (const box of ins.querySelectorAll('.mus')) {
      const key = box.dataset.key;
      const out = [];
      // Track 0 is the header row plus the numbers directly under it; the rest
      // are the .trk rows below.
      const headSel = box.querySelector('.head [data-f="path"]');
      const headNums = box.querySelector('.headnums');
      const hv = (f) => (headNums.querySelector('[data-f="' + f + '"]') || {}).value || '';
      const first = joinTrack({ path: headSel.value, vol: hv('vol'),
                                start: hv('start'), end: hv('end') });
      if (first) out.push(first);
      for (const trk of box.querySelectorAll('.tracks .trk')) {
        const g = (f) => (trk.querySelector('[data-f="' + f + '"]') || {}).value || '';
        const v = joinTrack({ path: g('path'), vol: g('vol'), start: g('start'), end: g('end') });
        if (v) out.push(v);
      }
      if (out.length > 1) params[key] = out;
      else if (out.length === 1) params[key] = out[0];
      else params[key] = '';
    }
    for (const row of ins.querySelectorAll('.kvrow')) {
      const k = row.querySelector('[data-kv="k"]').value.trim().toLowerCase();
      const v = row.querySelector('[data-kv="v"]').value.trim();
      if (k) params[k] = v;
    }
    // Empty values are dropped by cleanChar and by the line writer, so the
    // roster never accumulates keys that say nothing.
    for (const k of Object.keys(params)) if (params[k] === '') delete params[k];
    props.params = params;
    return props;
  };

  // Compared against what is ON DISK, not against what was drawn: the form may
  // have been drawn from a pending edit, and that is still an edit.
  const touch = () => {
    const now = gather();
    if (printOf(now) === SAVED_PRINT) PENDING.delete(id);
    else { PENDING.set(id, now); PENDING_BASE.set(now, saved); }
    Session.formTouched = PENDING.size
      ? (PENDING.size === 1 ? 'properties of ' + info.displayName
         : PENDING.size + ' characters with property edits')
      : null;
    Session.sync();
  };
  // The one binding above calls whatever this points at.
  CURRENT_TOUCH = touch;
  // Redrawing this panel must not lose the fact that an edit is outstanding.
  touch();
  $('#applyProps').onclick = async () => {
    const props = gather();
    const r = await (await fetch('/api/char-props', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mountAs: id, props }),
    })).json();
    if (r.error) { log('ERROR ' + r.error); return; }
    log('Saved properties for ' + id, true);
    PENDING.delete(id);
    Session.formTouched = PENDING.size ? PENDING.size + ' character(s) with property edits' : null;
    Session.record('properties of ' + id);
    await load(true);
    const back = MI.cells.find((c) => lc(c.char || '') === lc(id));
  sel = back ? back.index : null; drawGrid(); drawInspector();
  };
}

// The box searches whichever tab is open; the Stages tree matches the same

};
// A TAB OPENS UNDER A DRAG held over it for a moment. The Characters list and
// the Stages tree share the panel and are never on screen together, so this is
// how a character is carried from one to a stage in the other. The page's own
// drags only: a file from Explorer brings up the drop veil instead.
// ONLY BETWEEN THOSE TWO. Order and Not in build take nothing from either
// (a Characters row dropped on an order group was told to place a character
// that was already on the grid), and Order redrew the panel holding the
// dragged tree row.
const TAB_SPRING_PAIR = { chars: 'stages', stages: 'chars' };
let TAB_SPRING = 0, TAB_SPRING_ON = null;
for (const b of document.querySelectorAll('.tab')) {
  b.onclick = () => {
    TAB = b.dataset.tab;
    for (const o of document.querySelectorAll('.tab')) o.classList.toggle('on', o === b);
    // Order and Stages are different VIEWS, not filtered lists: they swap
    // the panel. The search box stays for Stages, which it filters, and goes
    // for Order, which has nothing to search.
    const panelTab = TAB === 'order' || TAB === 'stages';
    $('#list').hidden = panelTab;
    $('#searchbar').hidden = TAB === 'order';
    $('#orderPanel').hidden = !panelTab;
    if (TAB === 'order') drawOrder();
    else if (TAB === 'stages') drawStages();
    else drawList();
    drawGeom();
  };
  b.ondragenter = (e) => {
    const ty = [...((e.dataTransfer && e.dataTransfer.types) || [])];
    if (!ty.includes('text/plain') || ty.includes('Files') || TAB_SPRING_PAIR[TAB] !== b.dataset.tab) return;
    clearTimeout(TAB_SPRING);
    TAB_SPRING_ON = b;
    TAB_SPRING = setTimeout(() => b.click(), 450);
  };
  // A drag enters the next tab BEFORE it leaves this one (the browser's
  // order), so leaving stops only a timer this tab started: stopping any
  // canceled the tab just entered, and a drag moved along the tab row from
  // Characters to Stages never opened it.
  b.ondragleave = () => { if (TAB_SPRING_ON === b) clearTimeout(TAB_SPRING); };
}
document.addEventListener('dragend', () => clearTimeout(TAB_SPRING), true);
document.addEventListener('drop', () => clearTimeout(TAB_SPRING), true);
$('#zoomIn').onclick = () => { zoomLocked = true; zoom = Math.min(4, zoom + 0.125); $('#zoomLbl').textContent = Math.round(zoom*100) + '%'; drawGrid(); rememberZoom(); };
$('#zoomOut').onclick = () => { zoomLocked = true; zoom = Math.max(0.0625, zoom - 0.125); $('#zoomLbl').textContent = Math.round(zoom*100) + '%'; drawGrid(); rememberZoom(); };

// =============================================================================
// E-SELECT: the title row's menus, Preferences, About, and the keyboard.
//
// Modeled on VSelect 2.0.3 (docs/design-mockups/vselect-2.0.3/REFERENCE.md).
// Where VSelect does something this Studio cannot do literally, the mapping in
// ESELECT-1.0-SPEC.md beside it says what happens instead: select.def is
// generated, so it is viewed rather than edited; mugen.cfg is the Studio's
// Settings tab; Launch starts the desktop export or a program you choose.
// =============================================================================

const $new = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
function eBtn(label, onclick, cls) {
  const b = $new('button', cls || '', label);
  b.type = 'button';
  if (onclick) b.onclick = onclick;
  return b;
}
// JSON in, JSON out, and a thrown Error carrying the server's own message -
// every route here answers {error} on failure, and that text is what the
// person needs to read.
async function esApi(url, body) {
  const res = await fetch(url, body === undefined ? undefined : {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  let j = null;
  try { j = await res.json(); } catch (e) { j = null; }
  if (!res.ok || !j || j.error) throw new Error((j && j.error) || (res.status + ' ' + res.statusText));
  return j;
}
const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');

// ---- what is unsaved ----------------------------------------------------------
//
// Two kinds, and they are lost differently. STAGED edits live only in order[]
// until Save: any reload drops them. UNAPPLIED edits are typed into the
// Properties panel and not applied: PENDING keeps them across a redraw, and only
// a Reload or leaving the page loses them.
function stagedCount() { return dirty ? Math.max(1, Session.staged || 0) : 0; }
function unsavedCount() { return stagedCount() + PENDING.size; }

// ---- where this page is -------------------------------------------------------
//
// Popped out, E-Select is its own window with the Studio as its opener. In the
// desktop app that window is a tool window with no native bindings, and
// opener.focus() alone does not bring the Studio forward - the shell does that
// when asked through its web message. In a plain browser there is no webview
// and focus() is the whole of it.
function poppedOut() {
  try { return !!(window.opener && !window.opener.closed); } catch (e) { return false; }
}
function raiseStudio() {
  try {
    if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
      window.chrome.webview.postMessage('studio:raise-main');
    }
  } catch (e) { /* not in the app */ }
  try { if (window.opener) window.opener.focus(); } catch (e) { /* gone, or not ours */ }
}

// ---- dialogs ------------------------------------------------------------------
//
// One frame for every E-Select dialog: header with a close, a body that scrolls
// by itself, a footer. Escape, the ×, and a press on the dim backdrop all
// close it (the backdrop on MOUSEDOWN, the way the older pickers here close: a
// slider dragged past the dialog's edge must not count as a click outside).
const EDLG = [];
function eDialog(title, opts) {
  const o = opts || {};
  const back = $new('div', 'edlg-back');
  const box = $new('div', 'edlg' + (o.cls ? ' ' + o.cls : ''));
  box.setAttribute('role', 'dialog');
  box.setAttribute('aria-modal', 'true');
  box.setAttribute('aria-label', title);
  if (o.width) box.style.width = 'min(' + o.width + 'px, ' + (o.vw || 90) + 'vw)';
  const head = $new('div', 'ehead');
  const t = $new('div', 't', title);
  const x = eBtn('×', null, 'x');
  x.title = 'Close';
  x.setAttribute('aria-label', 'Close');
  head.append(t, x);
  const body = $new('div', 'ebody');
  const foot = $new('div', 'efoot');
  box.append(head, body, foot);
  back.appendChild(box);
  const before = document.activeElement;
  const dlg = {
    back, box, body, foot, closed: false,
    close() {
      if (this.closed) return;
      if (o.beforeClose) { try { o.beforeClose(); } catch (e) { /* closing wins */ } }
      this.closed = true;
      back.remove();
      const k = EDLG.indexOf(this);
      if (k >= 0) EDLG.splice(k, 1);
      if (o.onClose) { try { o.onClose(); } catch (e) { /* closing wins */ } }
      if (before && before.focus && document.contains(before)) {
        try { before.focus(); } catch (e) { /* nothing to return to */ }
      }
    },
    focus(el) { try { (el || x).focus(); } catch (e) { /* detached */ } },
  };
  x.onclick = () => dlg.close();
  // A DOUBLE-CLICK'S SECOND PRESS IS NOT A CLICK ON THE BACKDROP: the first
  // press opened the dialog (the ⚙ of a stage, any button), and the second,
  // landing on the new backdrop, shut it again at once. The first press of a
  // click on the backdrop itself always has detail 1.
  back.addEventListener('mousedown', (e) => { if (e.target === back && e.detail < 2) dlg.close(); });
  // Tab stays inside, so a keyboard user cannot wander into the editor behind.
  back.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const f = Array.from(box.querySelectorAll('button, [href], input, select, textarea, [tabindex]'))
      .filter((n) => !n.disabled && n.tabIndex >= 0 && n.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  document.body.appendChild(back);
  EDLG.push(dlg);
  return dlg;
}
// Any dialog, E-Select's or one of the older pickers (Grid…, Insert…, the raw
// editors), which all sit on a .backdrop.
function anyDialogOpen() {
  return EDLG.length > 0 || !!document.querySelector('.backdrop');
}
// A question with buttons, answered with the chosen button's value; Escape,
// the × and the backdrop answer null. `focus` names the value whose button
// starts focused, so Enter on a warning cannot default to the destructive
// choice.
function choose(title, message, buttons, focus) {
  return new Promise((resolve) => {
    let answer = null;
    const d = eDialog(title, { width: 460, onClose: () => resolve(answer) });
    for (const para of [].concat(message)) if (para) d.body.appendChild($new('p', 'emsg', para));
    let start = null;
    for (const b of buttons) {
      const el = eBtn(b.label, () => { answer = b.value; d.close(); }, b.primary ? 'primary' : '');
      d.foot.appendChild(el);

// each channel of every pixel, clamped to 0-255 - which no CSS filter function

// ---- Undo / Redo ------------------------------------------------------------

// Session.record, so that is where a step is taken, and what a step keeps is
// the whole state the edit left: the cell order and the off-grid list as the
// page holds them, whether they were saved, and the two files an edit can
// write - roster.json, and the screenpack's system.def, which holds the grid's
// shape. Undo moves to the previous state and Redo to the next. Neither needs
// to know what the edit was, the same way Revert needs no per-action inverse.
//
// The two kinds of edit are captured differently. A STAGED edit only moved
// order[], so nothing on disk changed and it shares the previous state's
// files. An IMMEDIATE edit has already written and called load(true), so its
// files are read back only once that reload has settled: taken any earlier,
// the step would hold the page as it was before the edit.
//
// Records made in one task are one step: a drop that places a character and
// then trims the holes behind it is one thing the person did.

// Going back writes roster.json FIRST and the screenpack text second, because
// the roster names which screenpack file the text belongs to - undoing a
// screenpack switch has to put the old pack back before its file can even be
// found. Each file is written only when it differs. The page is then reloaded
// and given the state's own order, which may hold staged edits the files never
// had, and the journal behind Revert (n) gives back or takes back the step's
// labels so the count stays true.

// itself a step Undo can take back while nothing before it is.

// made in the Studio window while E-Select was open is rolled back with it -
// the same trade Revert makes. The screenpack file is guarded one step
// further: Undo, Redo and Revert never write over a system.def that changed
// outside E-Select since E-Select last read it (Edit system.def opens it in
// Notepad) - they leave it and say so, and Reload (F5) or Save takes the edit

// lands in one.
function historyRecord(label, staged) {

      snap.label = '';
      snap.labels = [];
      H.states = [snap];
      H.at = 0;
    });
    return;
  }
  if (H.moving || H.claims > 0 || H.at < 0) return;
  historyEnqueue(async () => {
    const snap = pageState();
    snap.disk = await readDisk();
    if (gen !== H.gen || !H.states[H.at]) return;
    Object.assign(H.states[H.at], snap);
    H.states.length = H.at + 1;
  });
}

// Put the files of state `to` back over those of state `from`: the roster
// first, then the screenpack's text. Returns null when the roster could not be
// written (nothing changed, the move is abandoned), else what was touched.
async function restoreDisk(from, to, who) {
  const done = { roster: false, pack: false, motif: false };
  if (to.roster && to.roster !== from.roster) {
    let res = null, j = null;
    try {
      res = await fetch('/api/roster', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: to.roster,
      });
      j = await res.json();
    } catch (e) { /* reported below */ }
    if (!res || !res.ok || !j || j.error) {
      log('ERROR could not put the roster back: '
        + ((j && j.error) || (res ? res.status + ' ' + res.statusText : 'no answer')));
      return null;
    }
    done.roster = true;
  }
  if (to.motif) {
    // The same screenpack: the state being left says what its file holds.
    // Another one: the roster has just named it, so ask what its file holds.
    let now = from.motif;
    if (!now || now.motif !== to.motif.motif) {
      done.pack = true;
      now = await readMotif(true);
    }
    if (!now || now.motif !== to.motif.motif) {
      log('ERROR could not put the screenpack file back: the build names '
        + (now ? (now.motif || 'the default screenpack') : 'no readable screenpack')
        + ', not ' + (to.motif.motif || 'the default screenpack'));
    } else if (now.text !== to.motif.text) {
      // Only over what E-Select itself left there. The recorded text is what
      // it expects; the file is looked at once more before it is replaced.
      const live = done.pack ? now : await readMotif(true);
      if (live && changedOutside(live, now.text)) {
        done.outside = true;
        log('WARNING ' + outsideNote(live.rel || to.motif.rel || '?', who || 'Undo'));
        return done;
      }
      let j = null;
      try {
        j = await (await fetch('/api/motif-def', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: to.motif.text }),
        })).json();
      } catch (e) { j = { error: e.message }; }
      if (!j || j.error) log('ERROR could not put the screenpack file back: ' + ((j && j.error) || 'no answer'));
      else {
        done.motif = true;
        if (to.motif.rel) Session.packSeen.set(packKey(to.motif.rel), to.motif.text);
      }
    }
  }
  return done;
}

function historyMove(to) {
  const H = HIST;
  if (historyBusy() || to < 0 || to >= H.states.length || to === H.at) return Promise.resolve(false);
  const p = historyMoveRun(to)
    .catch((e) => { log('ERROR ' + ((e && e.message) || e)); return false; })
    .finally(() => { if (H.moving === p) H.moving = null; syncUndoButtons(); });
  H.moving = p;
  syncUndoButtons();
  return p;
}

async function historyMoveRun(to) {
  const H = HIST, gen = H.gen;
  const from = H.at, cur = H.states[from], dst = H.states[to];
  const back = to < from;
  const step = back ? cur : dst;
  const wrote = await restoreDisk(cur.disk, dst.disk, back ? 'Undo' : 'Redo');
  if (!wrote || gen !== H.gen) return false;
  // The portrait placement and the pack's own slot layout were read from the
  // screenpack as it was; the reload below reads them again.
  if (wrote.pack || wrote.motif) forgetPackCaches();
  await load(true);
  if (gen !== H.gen) return false;
  order = cloneList(dst.order);
  offGrid = cloneList(dst.offGrid);
  H.at = to;
  const J = Session.journal;
  if (back) J.splice(Math.max(0, J.length - step.labels.length), step.labels.length);
  else J.push(...step.labels);
  Session.staged = dst.staged || 0;
  markDirty(dst.dirty);   // redraws Revert (n) and these buttons as well
  // A state whose screenpack is not on disk (the build named a missing pack
  // and was switched away from it) has no grid to draw: the page keeps the
  // load's "motif not found" note, and the move itself is still made.
  if (MI && !MI.error) {
    render();
    drawInspector();
  }
  log((back ? 'Undo: ' : 'Redo: ') + step.label, true);
  return true;
}

// ---- Save, Reload -------------------------------------------------------------
let SAVING = false;
async function saveNow() {
  if (SAVING) return false;
  SAVING = true;
  syncUndoButtons();
  try {
    // An undo still writing would land between this save and its reload.
    await historyMoveDone();
    // The backup copy and the lock label are the viewer's preferences, so they
    // travel with the request; the server keeps the label in the roster, where
    // the select.def writer can find it.
    const { list, kept } = await withStudioAdds();
    const body = { order: list, lockLabel: PREFS.lockLabel };
    if (PREFS.saveBackup) body.backup = true;
    const r = await (await fetch('/api/build-order', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })).json();
    if (r.error) { log('ERROR ' + r.error); return false; }
    log('Saved — ' + r.inBuild + ' characters across ' + r.cells + ' cells', true);
    logStudioAdds(kept);
    if (r.backup) log('Backed up the previous roster to ' + r.backup);
    // Saving declares a new starting point, so the baseline moves with it.
    resetHistory();
    await Session.capture();
    await load(true);
    return true;
  } finally {
    SAVING = false;
    syncUndoButtons();
  }
}
// Save everything, for "Save and exit": the property edits typed and not
// applied as well as the staged cell order. Properties first - they are
// written into the roster entry, and the order save that follows carries each
// entry's props along from the roster.
async function saveAll() {
  for (const [id, props] of Array.from(PENDING)) {
    try {
      await esApi('/api/char-props', { mountAs: id, props });
    } catch (e) {
      log('ERROR saving the properties of ' + id + ': ' + e.message);
      return false;
    }
    PENDING.delete(id);
    log('Saved properties for ' + id, true);
  }
  Session.formTouched = null;
  if (dirty) return saveNow();
  return true;
}

// Everything a screenpack or a reload makes stale: the per-character portrait
// placement (CELLPORT) and the pack's own slot layout (THEMELAYOUT). Both are
// fetched once and kept, which is right until the files under them change.
// The big portraits on screen (FACES) are drawn again from the files too.
function forgetPackCaches() {
  FACES = null;
  CELLPORT = null;
  cellPortPending = false;
  cellPortFor = '';
  cellPortGen++;
  THEMELAYOUT = null;
  themeLayoutFor = null;
}

// RELOAD RE-READS EVERYTHING FROM DISK, without the page reloading: the zoom
// stays, the session starts again from what is on disk now. F5 and Ctrl+R come
// here too, because WebView2's own reload would drop the unsaved work without
// asking.
let RELOADING = false;
async function reloadFromDisk() {
  if (RELOADING) return;
  const n = unsavedCount();
  if (n) {
    const ok = await choose('Reload', 'Reload from disk? Your ' + plural(n, 'unsaved change') + ' will be lost.',
      [{ label: 'Reload', value: true, primary: true }, { label: 'Cancel', value: false }], false);
    if (!ok) return;
  }
  RELOADING = true;
  syncUndoButtons();
  try {
    await historyMoveDone();
    PENDING.clear();
    Session.formTouched = null;
    forgetPackCaches();
    forgetStagePictures();
    restartScreenClock();
    resetHistory();
    await Session.capture();
    await load(true);
    log('Reloaded from disk', true);
  } finally {
    RELOADING = false;
    syncUndoButtons();
  }
}

// ---- switching screenpack ------------------------------------------------------
//
// The server's /api/theme, the same route the Studio's Theme tab uses. A switch
// can move the roster (it drops the old pack's reserved cells and takes the new
// pack's), and the portrait placement, the pack layout and the fit all belong
// to one pack, so the page is reloaded as if opened on the new one. It counts
// as an edit: Revert (and Undo) can take it back.
async function switchPack(motif, name) {
  // ALREADY THE BUILD'S PACK: nothing to switch. Asked of the roster itself,
  // not of what a menu last showed - a second "Open default motif" made
  // right after the first used to post the same switch again and record it
  // as a step, which pushed the real switch out of the history.
  let cur = null;
  try { cur = await esApi('/api/roster'); } catch (e) { cur = null; }
  if (cur && String(cur.motif || '').toLowerCase() === String(motif || '').toLowerCase()) {
    log(name.charAt(0).toUpperCase() + name.slice(1) + ' is already this build’s screenpack');
    return false;
  }
  const n = stagedCount();
  if (n) {
    const ok = await choose('Switch screenpack',
      'Switch to ' + name + '? Your ' + plural(n, 'unsaved change') + ' will be lost.',
      [{ label: 'Switch', value: true, primary: true }, { label: 'Cancel', value: false }], false);
    if (!ok) return false;
  }
  let r;
  try { r = await esApi('/api/theme', { motif }); }
  catch (e) { log('ERROR ' + e.message); return false; }
  const res = r.result || {};
  log('Screenpack is now ' + name
    + (res.layout ? ', and the build took its slot layout' : '')
    + (res.layoutCleared ? ' (the previous pack’s reserved cells were cleared)' : ''), true);
  // A NEW HISTORY, whose first state is the one being left: the switch is
  // then a step Undo can take back, and nothing before it is (see Undo / Redo).
  resetHistory(true);
  Session.record('screenpack → ' + name);
  forgetPackCaches();
  zoomLocked = false;
  await load(false);
  return true;
}

// OPEN MOTIF: the screenpacks this build can use, from /api/themes (the list
// the Studio's Theme tab offers, without the character rescan /api/studio
// does). Unusable ones are listed too, disabled, with what they are missing -
// a pack that vanished from the list with no reason is worse than one that
// says why.
async function openMotifDialog() {
  const d = eDialog('Open Motif', { width: 560, cls: 'motifs' });
  const list = $new('div', 'mlist');
  list.appendChild($new('p', 'emsg', 'Reading the installed screenpacks…'));
  d.body.appendChild(list);
  d.foot.append(
    eBtn('Open new motif…', () => { d.close(); openNewMotif(); }, 'left'),
    eBtn('Cancel', () => d.close()));
  d.focus();
  let j;
  try { j = await esApi('/api/themes'); }
  catch (e) {
    if (d.closed) return;
    list.textContent = '';
    list.appendChild($new('p', 'emsg bad', 'Could not list the screenpacks: ' + e.message));
    return;
  }
  if (d.closed) return;
  list.textContent = '';
  const cur = String(j.current || '').toLowerCase();
  let firstRow = null, curRow = null;
  for (const t of j.themes || []) {
    const isCur = String(t.path || '').toLowerCase() === cur;
    const row = $new('div', 'mrow' + (isCur ? ' cur' : ''));
    row.tabIndex = 0;
    row.setAttribute('role', 'button');
    row.appendChild($new('span', 'nm', t.name || t.folder || t.path));
    row.appendChild($new('span', 'fd', t.folder ? t.folder + '/' : 'data/'));
    const tags = $new('span', 'tags');
    if (isCur) tags.appendChild($new('span', 'on', 'current' + (j.isDefault ? ' (default) · ' : ' · ')));
    tags.appendChild(document.createTextNode(t.custom ? 'installed' : 'built-in'));
    row.appendChild(tags);
    const miss = (t.missingAnims || []).map((a) => 'animation ' + a.anim + ' (' + a.key + ')');
    if (miss.length) {
      row.appendChild($new('span', 'why', 'Incomplete: asks for ' + miss.join(', ')
        + ', which its system.def never defines. Those parts draw nothing.'));
    }
    row.title = t.path;
    const pick = async () => {
      d.close();
      if (isCur) return;
      await switchPack(t.path, t.name || t.folder || t.path);
    };
    row.onclick = pick;
    row.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
    list.appendChild(row);
    if (!firstRow) firstRow = row;
    if (isCur) curRow = row;
  }
  const bad = j.unusable || [];
  if (bad.length) {
    list.appendChild($new('div', 'mcap', 'Cannot be used'));
    for (const t of bad) {
      const row = $new('div', 'mrow off');
      row.setAttribute('aria-disabled', 'true');
      row.appendChild($new('span', 'nm', t.name || t.folder || t.path || '?'));
      row.appendChild($new('span', 'fd', t.folder ? t.folder + '/' : 'data/'));
      row.appendChild($new('span', 'tags', t.custom ? 'installed' : 'built-in'));
      // The server's reason for each file (modlib.themeBootWhy), as the
      // Studio's Theme tab shows it.
      const whys = (t.missing || []).map((m) => m && typeof m === 'object' && m.why).filter(Boolean);
      const what = (t.missing || []).map((m) => (m && typeof m === 'object')
        ? (m.key ? m.key + ' = ' : '') + (m.path || '') : String(m)).join(', ');
      row.appendChild($new('span', 'why', whys.length
        ? whys.map((s) => s.charAt(0).toUpperCase() + s.slice(1)).join('. ') + '.'
        : 'Missing ' + (what || 'files it needs') + '. The engine stops with an error on a pack like this, so it is not offered.'));
      list.appendChild(row);
    }
  }
  if (!(j.themes || []).length && !bad.length) list.appendChild($new('p', 'emsg', 'No screenpacks were found.'));
  if (curRow || firstRow) d.focus(curRow || firstRow);
}

// OPEN NEW MOTIF: install a pack from a folder or a .zip, then use it. The file
// dialogs are the SERVER's (it is on this machine), because a popped-out
// E-Select is a tool window with no native bindings of its own.
function openNewMotif() {
  const d = eDialog('Open new motif', { width: 460 });
  d.body.appendChild($new('p', 'emsg', 'Install a screenpack from its folder or a .zip.'));
  const status = $new('p', 'emsg');
  status.hidden = true;
  d.body.appendChild(status);
  const say = (text, bad) => {
    status.hidden = !text;
    status.textContent = text || '';
    status.className = 'emsg' + (bad ? ' bad' : '');
  };
  const fb = eBtn('Choose folder…');
  const zb = eBtn('Choose .zip…');
  const busy = (on) => { fb.disabled = on; zb.disabled = on; };
  const go = async (kind) => {
    busy(true);
    say('Waiting for the ' + (kind === 'zip' ? 'file' : 'folder') + ' dialog…');
    let pick;
    try { pick = await esApi('/api/pick-file', { kind }); }
    catch (e) { if (!d.closed) { busy(false); say(e.message, true); } return; }
    if (d.closed) return;
    if (!pick || pick.canceled || !pick.path) { busy(false); say(''); return; }
    say('Installing ' + pick.path + '…');
    let r;
    try { r = await esApi('/api/add-local', { kind: 'theme', path: pick.path }); }
    catch (e) { if (!d.closed) { busy(false); say(e.message, true); } return; }
    if (d.closed) return;
    const res = r.result || {};
    if (res.asLifebar) {
      busy(false);
      say('That is a lifebar pack, not a screenpack. It was added to the lifebar library'
        + ' (the Studio’s Theme tab).', true);
      return;
    }
    const motif = res.motif || res.path;
    const name = res.name || res.folder || motif;
    if (!motif) {
      busy(false);
      say('Installed, but the server did not say which screenpack it became. Pick it from Open Motif….', true);
      return;
    }
    d.close();
    log('Installed the screenpack ' + name + (res.folder ? ' (themes/' + res.folder + ')' : ''), true);
    await switchPack(motif, name);
  };
  fb.onclick = () => go('folder');
  zb.onclick = () => go('zip');
  d.foot.append(fb, zb, eBtn('Cancel', () => d.close()));
  d.focus(fb);
}

async function openDefaultMotif() {
  await switchPack('', 'the default screenpack');
}

// ---- Launch -----------------------------------------------------------------
//
// The engine starts with no arguments in its own folder, so it opens on its
// title screen with whatever the build last EXPORTED - not what is on this
// page. Saying so before it starts is the whole point of asking the server
// first: a stale build looks exactly like a bug in the editor.
let LAUNCHING = false;
async function launchEngine() {
  if (LAUNCHING) return;
  LAUNCHING = true;
  try {
    const exe = String(PREFS.engineExe || '').trim();
    const info = await eselectInfo(true);
    if (!info) {
      await tell('Launch Ikemen GO', 'The Studio server did not say where the engine is. Is it still running?');
      return;
    }
    const badExe = exe && info.custom && !info.custom.ok
      ? 'The Engine executable in Preferences cannot be used: ' + (info.custom.reason || 'it is not an Ikemen GO program') + '.'
      : '';
    const t = engineTarget(info);
    if (!t) {
      const looked = (info.engine && (info.engine.exportExe || info.engine.exportDir)) || 'the desktop export folder';
      await tell('Launch Ikemen GO', [
        'No Ikemen GO install was found. E-Select looked for ' + looked + '.',
        badExe,
        'Export Desktop from the Studio to make one, or set Preferences › Engine executable to an'
          + ' Ikemen GO program (Select engine… in the Ikemen GO menu does the same).',
      ]);
      return;
    }
    const rosterAt = info.roster && info.roster.mtimeMs;
    const stale = t.selectMtimeMs === null || t.selectMtimeMs === undefined
      || (rosterAt && t.selectMtimeMs < rosterAt);
    const n = unsavedCount();
    if (stale || n) {
      // WHERE THE FIX IS. Export Desktop writes the Studio's desktop export
      // folder and nothing else; a chosen engine anywhere else was made with
      // Export to folder…, and only that, into its own folder, brings it up
      // to date.
      const norm = (p) => String(p || '').replace(/[\\/]+$/, '').replace(/\//g, '\\').toLowerCase();
      const elsewhere = t.custom && norm(t.dir) !== norm(info.engine && info.engine.exportDir);
      const how = elsewhere
        ? 'Export into that folder from the Studio (Export to folder…) to include them.'
        : 'Export Desktop from the Studio to include them.';
      const lines = stale
        ? [(elsewhere ? 'This build (' + t.dir + ')' : 'This build') + ' was exported before your latest changes,'
            + ' so it will start without them. ' + how,
          n ? 'You also have ' + plural(n, 'unsaved change') + '.' : '']
        : ['You have ' + plural(n, 'unsaved change') + ', so the build will start without them.'
            + ' Save, then ' + (elsewhere ? 'export' + how.slice('Export'.length) : how)];
      const go = await choose('Launch Ikemen GO', lines,
        [{ label: 'Launch anyway', value: true, primary: true }, { label: 'Cancel', value: false }]);
      if (!go) return;
    }
    let r;
    try { r = await esApi('/api/launch-build', t.custom ? { exe: t.exe } : {}); }
    catch (e) {
      log('ERROR ' + e.message);
      await tell('Launch Ikemen GO', 'Ikemen GO did not start: ' + e.message);
      return;
    }
    if (badExe) log(badExe + ' The desktop export was started instead.');
    log('Started Ikemen GO: ' + (r.exe || t.exe), true);
  } finally {
    LAUNCHING = false;
  }
}

// SELECT ENGINE: pick the program, have the server check it, keep it only when
// it is one Launch can start.
async function selectEngine() {
  let pick;
  try { pick = await esApi('/api/pick-file', { kind: 'exe' }); }
  catch (e) { log('ERROR ' + e.message); return; }
  if (!pick || pick.canceled || !pick.path) return;
  const c = await exeCheck(pick.path);
  if (c && c.ok) {
    setPref('engineExe', c.exe || pick.path);
    log('Launch now starts ' + (c.exe || pick.path), true);
    return;
  }
  await tell('Select engine', [
    pick.path + ' cannot be used: ' + (c ? (c.reason || 'it is not an Ikemen GO program') : 'the Studio server could not check it') + '.',
    'Pick the Ikemen GO program itself, in the folder that holds its data folder.',
  ]);
}
