// VIEW select.def. It is GENERATED from the build every time the build is
// written, so an edit to it would be thrown away - it is shown, not opened.
// This is the live generated file: what an export would write right now.
async function viewSelectDef() {
  const d = eDialog('select.def', { width: 760, cls: 'seldef' });
  const n = stagedCount();
  if (n) d.body.appendChild($new('p', 'emsg note', 'As last saved. Save to include your ' + plural(n, 'unsaved change') + '.'));
  d.body.appendChild($new('p', 'emsg hint',
    'Written from the cells every time the build is exported, so it is read here rather than edited: change the cells, then Save.'));
  const pre = $new('pre', 'deftext', 'Loading…');
  d.body.appendChild(pre);
  let text = '';
  const copy = eBtn('Copy', async () => {
    if (!text) return;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }
    if (!ok) {
      // No clipboard permission: select the text and use the old command.
      const r = document.createRange();
      r.selectNodeContents(pre);
      const s = window.getSelection();
      s.removeAllRanges(); s.addRange(r);
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    }
    copy.textContent = ok ? 'Copied' : 'Select and copy';
    setTimeout(() => { copy.textContent = 'Copy'; }, 1500);
  }, 'left');
  copy.disabled = true;
  d.foot.append(copy, eBtn('Close', () => d.close(), 'primary'));
  d.focus(d.foot.lastChild);
  try {
    // The DESKTOP build's select.def (lock labels included); the web build's
    // is the same file without them (vfslib buildSelectDef).
    const res = await fetch('/api/select-def', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    const buf = await res.arrayBuffer();
    // The engine reads these files as bytes; names with accents are Latin-1
    // more often than UTF-8. Decode as UTF-8 unless that produces garbage.
    text = new TextDecoder('utf-8').decode(buf);
    if (text.indexOf('�') >= 0) text = new TextDecoder('windows-1252').decode(buf);
    if (d.closed) return;
    pre.textContent = text;
    copy.disabled = false;

// ---- Exit ---------------------------------------------------------------------
//
// ← Studio and ☰ › Exit are one routine. Unsaved work is asked about first.
// Then, popped out, the Studio is brought forward and this window closes; taking
// the Studio's own window, it goes back to the Studio page - window.close()
// there would be closing the whole program. `beforeLeave` runs only once the
// leaving is certain.
//
// `closing`: the window's own close (its X, Alt+F4) asked, through the shell
// (see "The native close" below). The answer is then always this window
// closing - whatever the opener is doing - or, when the person stays, the
// guard armed again so the next close asks again.
// A close that arrives while the question is already up (☰ Exit, then the
// X) waits on that answer; staying then arms the guard again as well.
let EXITING = false, EXIT_REARM = false;
async function exitEditor(beforeLeave, closing) {
  if (EXITING) { if (closing) EXIT_REARM = true; return; }   // the question is already up
  EXITING = true;
  EXIT_REARM = !!closing;
  try {
    if (unsavedCount()) {
      const c = await choose('Exit', 'You have unsaved changes.', [
        { label: 'Save and exit', value: 'save', primary: true },
        { label: 'Exit without saving', value: 'discard' },
        { label: 'Cancel', value: null },
      ]);
      if (!c || (c === 'save' && !(await saveAll()))) {
        if (EXIT_REARM) guardNativeClose();
        return;
      }
    }
    if (beforeLeave) beforeLeave();
    if (closing || poppedOut()) {
      raiseStudio();
      window.close();
      return;
    }
    location.href = '/studio.html';
  } finally {
    EXITING = false;
    EXIT_REARM = false;
  }
}

// ---- the native close ---------------------------------------------------------
//
// A POPPED-OUT E-SELECT CLOSED BY ITS WINDOW - the X, Alt+F4 - used to go
// without asking, taking unsaved work with it: the desktop shell owns that
// window, and a page cannot stop it closing. So the page asks the shell to
// ask it first. 'studio:guard-close' arms the shell's guard for this window
// (sent on every load: a navigation clears it); a close then reaches the page
// as 'studio:close-request' instead of closing, and the page answers with the
// Exit routine - the unsaved-changes question when there is unsaved work,
// window.close() otherwise, which the shell honors as ever. Staying (Cancel)
// arms the guard again. A second close while the page has not answered closes
// at once, so a stuck page can never hold its window open.
//
// The shell echoes every web message back to the page that sent it, so the
// page's own 'studio:guard-close' and 'studio:raise-main' come back here too:
// only the one message the shell sends means anything.
const MSG_GUARD_CLOSE = 'studio:guard-close';
const MSG_CLOSE_REQUEST = 'studio:close-request';

  const w = window.chrome && window.chrome.webview;
  return w && typeof w.postMessage === 'function' ? w : null;
}
function guardNativeClose() {
  const w = nativeView();
  if (!w || !poppedOut()) return false;
  try { w.postMessage(MSG_GUARD_CLOSE); return true; } catch (e) { return false; }
}

function wireNativeClose() {
  const w = nativeView();
  if (!w || !poppedOut()) return false;
  if (NATIVE_CLOSE_WIRED !== w && typeof w.addEventListener === 'function') {
    NATIVE_CLOSE_WIRED = w;
    w.addEventListener('message', (e) => {
      if (!e || e.data !== MSG_CLOSE_REQUEST) return;
      exitEditor(null, true);
    });
  }
  return guardNativeClose();
}
wireNativeClose();

// ---- a bundle switch asks first -----------------------------------------------
//
// In the desktop app a bundle switch restarts the Studio's server and closes
// every tool window, this one included. The Studio cannot always reach this
// window (a reload of its own page loses the handle), so it asks over a
// channel whether anything open holds unsaved work, and waits while it does.
try {
  const ch = new BroadcastChannel('studio-restart');
  ch.onmessage = (e) => {
    if (e.data === 'unsaved?') ch.postMessage({ page: 'E-Select', unsaved: unsavedCount() });
  };
} catch (e) { /* no BroadcastChannel: nothing to answer with */ }

if (window.MutationObserver && $('#dirty')) {
  new MutationObserver(() => { const d = $('#dirty'); d.title = d.textContent; })
    .observe($('#dirty'), { childList: true, characterData: true, subtree: true });
}

load();

// ---- getting back, and staying in step ---------------------------------------
//
// GETTING BACK. This page is reached two ways - popped out into its own window,
// or by taking the Studio's window over - and the way back differs, so it works
// out which rather than being told.
(function wireBack() {
  const b = document.getElementById('backBtn');
  if (!b) return;
  // The same routine as ☰ > Exit (exitEditor): unsaved work is asked about
  // first. Opened FROM the Studio, it brings the Studio forward and closes,
  // so there is one Studio rather than two; opened in the Studio's own
  // window, it navigates back.
  b.onclick = () => exitEditor();
})();

// The other view reloads when this one writes the roster, and this one reloads
// when it does. Without it two views of one file sit disagreeing until
// something happens to refresh them.
const gridBus = (typeof BroadcastChannel === 'function') ? new BroadcastChannel('ikemen-studio') : null;
if (gridBus) {
  gridBus.onmessage = (e) => {
    if (!e.data || e.data.from === 'grid') return;
    if (e.data.type === 'roster-changed') {
      // Never over the top of unsaved work: reloading would throw it away
      // without asking, which is a worse failure than a stale view. Nor under
      // the undo history: its states hold the roster as this page left it,
      // and a reload beneath them would have Undo put back a file the other
      // window has changed since.
      //
      // With NOTHING LEFT TO UNDO - the history at its first state, only Redo
      // possible - the page shows exactly what it opened on, so it follows
      // the Studio again: the reload starts a new history, dropping the redo
      // steps, whose files were written before the Studio's change.
      if (typeof Session !== 'undefined' && Session && Session.journal && Session.journal.length) return;
      if (HIST.moving || HIST.at > 0) return;
      if (historyHasSteps()) resetHistory();
      load(true).catch(() => {});
    }
  };
}
// A SCREENPACK OPTION SWITCHED IN THE STUDIO (Theme tab: a slot count, an
// announcer). The pack's own files changed under this page, so before the
// switch the Studio asks what would be lost (eselect-state?), and after it
// says so (pack-options). With nothing unsaved the switch is a new starting
// point, like Save or Reload: the history and Revert's baseline start again
// from the new files - Undo or Revert would otherwise put a roster laid out
// for one slot count back over another's grid. Unsaved work is never thrown
// away; the page says to reload first. E-Select's own grid edits never send
// pack-options, so they keep the zoom as always.
if (gridBus) {
  gridBus.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.from === 'grid') return;
    if (d.type === 'eselect-state?') {
      gridBus.postMessage({ type: 'eselect-state', from: 'grid', id: d.id, unsaved: unsavedCount(), history: historyHasSteps() });
      return;
    }
    if (d.type !== 'pack-options') return;
    forgetPackCaches();
    PACK_SWITCHED = true;
    if (unsavedCount() > 0) {
      log('This screenpack’s options changed in the Studio. Reload (F5) before you save: Save would put your order back over it.');
      return;
    }
    resetHistory();
    Session.baseline = null;
    load(true).catch(() => {});
  });
}
function announceRosterChange() {
  if (gridBus) gridBus.postMessage({ type: 'roster-changed', from: 'grid' });
}

// EVERY MUTATION ANNOUNCES, AT THE TRANSPORT.
//
// The same rule as the Studio's, for the same reason: annotating each call
// site meant the next one added was silently unannounced.
//
// A mutation is a non-GET to /api/ that succeeded. That is the definition, so
// there is nothing left to remember to annotate - including whatever gets added
// after this.
//
// Coalesced, because a folder upload posts one request per file and the other
// view does not need to reload two hundred times.
(function announceOnMutation() {
  const inner = window.fetch;
  let pending = null;
  // ROUTES THAT CHANGE NOTHING IN THE BUILD. Opening a folder or a file,
  // starting the game and showing a file dialog are POSTs because they DO
  // something, but none of it is the roster - and every announcement makes
  // the Studio rescan every character.
  const QUIET = new Set(['/api/open-path', '/api/open-folder', '/api/launch-build',
    '/api/launch-pair', '/api/pick-file']);
  const routeOf = (u) => { try { return new URL(u, location.href).pathname; } catch (e) { return u; } };
  window.fetch = async function (input, init) {
    const res = await inner.apply(this, arguments);
    try {
      const method = String((init && init.method) || 'GET').toUpperCase();
      const url = String(typeof input === 'string' ? input : (input && input.url) || '');
      if (method !== 'GET' && res.ok && url.indexOf('/api/') >= 0 && !QUIET.has(routeOf(url))) {
        clearTimeout(pending);
        pending = setTimeout(announceRosterChange, 250);
      }
    } catch (e) { /* announcing is never worth failing a request over */ }
    return res;
  };
})();


// ---- dropping a character onto the editor ------------------------------------
//
// CHARACTERS ONLY, whichever tab is showing. The editor's tabs choose what you
// are LOOKING at, not what a drop means: there is exactly one thing worth
// dropping onto a select screen, and asking "did you mean a stage?" of someone
// who just dragged a character folder is a question with one answer.
//
// The upload itself is the Studio's: a folder cannot hand a browser its path,
// so its files go up under a shared token and the server reassembles it before
// running the same add a pasted path would.
(function characterDrop() {
  // Built here rather than in the markup: this file has no body tag to append
  // to, and an overlay is behavior anyway. Note the wording - a literal
  // script end tag inside a comment still ends the script, which is exactly
  // the mistake this line used to make.
  const veil = document.createElement('div');
  veil.id = 'dropveil';
  veil.innerHTML = '<div class="card"><b>Drop to add a character</b>'
    + '<span>a folder or a .zip · characters only, even on the Stages tab</span></div>';
  document.body.appendChild(veil);
  let depth = 0;

  const isFileDrag = (e) => {
    const t = e.dataTransfer && e.dataTransfer.types;
    return !!t && Array.prototype.indexOf.call(t, 'Files') >= 0;
  };

  addEventListener('dragenter', (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    depth++;
    veil.classList.add('on');
  });
  addEventListener('dragover', (e) => { if (isFileDrag(e)) e.preventDefault(); });
  addEventListener('dragleave', (e) => {
    if (!isFileDrag(e)) return;
    // dragleave fires for every element crossed, so it is counted rather than
    // trusted - otherwise the veil flickers off the moment the pointer moves
    // over anything inside the page.
    if (--depth <= 0) { depth = 0; veil.classList.remove('on'); }
  });

  addEventListener('drop', async (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    depth = 0;
    veil.classList.remove('on');

    // Directories first: a folder also appears in dataTransfer.files, as a
    // zero-byte entry with no type, so reading files alone both misses the
    // folder and tries to add nonsense. Both are taken now, before the
    // question below: the drop's data is only readable during the event.
    const items = e.dataTransfer.items ? Array.prototype.slice.call(e.dataTransfer.items) : [];
    const dirs = items.map((it) => (it.webkitGetAsEntry ? it.webkitGetAsEntry() : null))
      .filter((en) => en && en.isDirectory);
    const files = dirs.length ? [] : Array.prototype.slice.call(e.dataTransfer.files);
    const first = dirs.length ? dirs[0].name : files.length ? files[0].name : '';
    if (!(await stagedWorkFirst(dirs.length + files.length === 1 ? first : 'these characters'))) return;
    if (dirs.length) { for (const d of dirs) await addCharFolder(d); return; }
    for (const f of files) await addCharFile(f);
  });

  // STAGED WORK IS ASKED ABOUT FIRST. An add reloads the cells from disk
  // (added(), below), which drops every staged edit, as Reload and a pack
  // switch do - and both of those ask. Unapplied property edits (PENDING)
  // survive a reload (rebasePending), so only the staged ones are counted.
  // Answers whether to go on: Save first (and stop if the Save fails), add
  // and lose them, or Cancel (Escape, the ×).
  async function stagedWorkFirst(what) {
    const n = stagedCount();
    if (!n) return true;
    const c = await choose('Add a character',
      'Add ' + what + '? Adding reloads the grid from disk, and your ' + plural(n, 'unsaved change') + ' will be lost unless you save first.',
      [{ label: 'Save, then add', value: 'save', primary: true },
        { label: 'Add and discard my changes', value: 'discard' },
        { label: 'Cancel', value: null }], 'save');
    if (!c) return false;
    if (c === 'save') return !!(await saveNow());
    return true;
  }

  function walk(entry, prefix, out) {
    return new Promise((resolve) => {
      const reader = entry.createReader();
      const all = [];
      const batch = () => reader.readEntries(async (ents) => {
        if (!ents.length) {
          for (const en of all) {
            const p = prefix + '/' + en.name;
            if (en.isDirectory) await walk(en, p, out);
            else await new Promise((r) => en.file((f) => { out.push({ path: p, file: f }); r(); }));
          }
          resolve();
        } else { all.push.apply(all, ents); batch(); }
      }, resolve);
      batch();
    });
  }

  // PREFERENCES > REPLACE RANDOMSELECT CELLS, for a character dropped in. The
  // server places him (modlib placeInRoster): the first free cell - an
  // unlocked unused cell, or room past the end of the list - and, with this
  // flag, the first unlocked RandomSelect cell when there is none. The page
  // sends the flag only when the grid on disk has no free cell either, so the
  // request says exactly what the person asked for; the server's own check is
  // the one that decides. Asked of MI.cells, the roster as last read from
  // disk: that is what the server places into.
  function diskHasFreeCell() {
    if (!MI || !MI.select || !MI.cells) return true;
    const total = MI.select.rows * MI.select.columns;
    let count = 0;
    for (const c of MI.cells) {
      if (c.variant) continue;
      count = Math.max(count, c.index + 1);
      if (c.kind === 'dummy' && c.index < total && !isLockOn(c.props && c.props.locked)) return true;
    }
    return count < total;
  }
  const replaceRandom = () => !!PREFS.dropReplaceRandom && !diskHasFreeCell();

  async function post(url, body, headers) {
    const res = await fetch(url, { method: 'POST', body, headers });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || res.statusText);
    return data;
  }

  async function addCharFile(file) {
    log('Adding ' + file.name + '...');
    try {
      const { result } = await post('/api/upload', file, Object.assign({
        'x-kind': 'char', 'x-filename': encodeURIComponent(file.name),
      }, replaceRandom() ? { 'x-replace-random': '1' } : null));
      await added(result, file.name);
    } catch (err) { log('ERROR ' + err.message); }
  }

  async function addCharFolder(dirEntry) {
    const files = [];
    await walk(dirEntry, dirEntry.name, files);
    if (!files.length) { log('ERROR ' + dirEntry.name + ' is empty'); return; }
    log('Adding ' + dirEntry.name + ' (' + files.length + ' files)...');
    const token = Math.random().toString(36).slice(2) + Date.now().toString(36);
    try {
      for (const f of files) {
        await post('/api/upload-part', f.file, {
          'x-token': token, 'x-relpath': encodeURIComponent(f.path),
        });
      }
      const { result } = await post('/api/upload-folder',
        JSON.stringify(Object.assign({ token, kind: 'char' }, replaceRandom() ? { replaceRandom: 1 } : null)),
        { 'Content-Type': 'application/json' });
      await added(result, dirEntry.name);
    } catch (err) { log('ERROR ' + err.message); }
  }

  // A dropped character goes INTO THE BUILD, in the first free cell (modlib
  // placeInRoster) - or past the end of the grid when there is none - and the
  // log says which, as the footer will.
  async function added(result, what) {
    const name = (result && (result.name || result.folder)) || what;
    const p = result && result.placed;
    log('Added ' + name + (!p ? ' to the library'
      : p.replacedRandom ? ' to the build, in the RandomSelect cell ' + p.cell
      : p.beyondGrid ? ' to the build, past the last cell of the grid (every cell is taken)'
      : ' to the build, in cell ' + p.cell), true);
    if (result && result.missing && result.missing.length) {
      log('WARNING ' + name + ' is missing ' + result.missing.length + ' referenced file(s)');
    }
    // NOT AN UNDO STEP, AND WHERE A NEW HISTORY STARTS. The server has
    // written the character into roster.json, and every state before this
    // moment holds a roster without him: kept, the first Undo would have put
    // one of those back and quietly taken him out of the build again, and the
    // reload below also rebuilds the cells from disk, so the staged states
    // no longer describe the page either. So the history restarts here, with
    // the page as this reload leaves it as its first state - as it does when
    // the Studio changes the roster. Revert still goes back to the session's
    // start, the drop included, as it does for every change.
    await historyMoveDone();
    resetHistory();
    await load(true);
  }
})();
</script>
