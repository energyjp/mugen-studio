<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/themes.css">
<script src="/theme.js"></script>
<script src="/i18n.js"></script>
<link rel="stylesheet" href="/booklet.css">
<script src="/booklet.js"></script>
<title>Moves</title>
<style>
  /* THE MOVES WINDOW, printed as the booklet's command-list page (GRAIL 3.10;
     the booklet: $X/rd-foundation/CONTRACT.md). One window per character.

     TWO PRINTINGS OF ONE PAGE. Edit off (the default) is the printed command
     list: every attack state with its name and input when the Command List
     reader names it, its frame data, the action frame by frame with the frame
     bar under the sprites, and the opened move on the right page with a 2x
     plate of its first active frame. Edit on (the band's switch, or ?edit=1)
     is the editing UI: the three value tiers, Revert, added values, Edit
     timing. Both are built from the same /api/char-moves read every time, and
     the edit parts are simply not shown while Edit is off (body.editing), so
     a hidden input is never reachable. Every number is the server's
     (framedata.js); the page never counts a frame itself.

     Colors come only from the printing tokens (themes.css), except the
     engine's own box colors below, which are content. */
  :root {
    /* The engine's own debug colors, system.go:4000-4007 at 96413d2. The
       uint32s there are 0xAABBGGRR (Pal32ToBytes lays them out little-endian
       as R,G,B,A, image.go:588-595): Clsn1 HitDef 0xff0000ff, ReversalDef
       0xff0040c0, Inactive 0xff000080, Clsn2 0xffff0000. */
    --c1hit: rgb(255,0,0); --c1rev: rgb(192,64,0); --c1not: rgb(128,0,0); --c2: rgb(0,0,255);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* Nothing selects, nothing drags - the Studio's rule (GRAIL 3.1), restated
     because a window shares no stylesheet. Inputs keep their text. */
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 var(--t-13)/1.45 var(--f-body);
    display: flex; flex-direction: column; user-select: none; cursor: default; overflow: hidden; }
  img { -webkit-user-drag: none; user-drag: none; }
  input, select { user-select: text; }
  code, .data { font-family: var(--f-data); font-size: var(--t-12); }

  /* The edit parts print only with Edit on; the printed parts only with it off. */
  body:not(.editing) .ed { display: none !important; }
  body.editing .pr { display: none !important; }

  /* ---- the band ---- */
  #band .src { color: var(--ink2); }
  #band .src code { color: var(--ink); }
  #band .bk-secband-t .t { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  /* the band's mascot (Booklet.mascot), standing on the band's rule after the title plate */
  #band > #bandMascot { align-self: flex-end; margin-left: -6px; padding: 3px 6px 0; }
  #band > #bandMascot .bk-sprite { height: calc(var(--secband-h) - 10px); }

  #edited { display: flex; gap: 10px 12px; align-items: center; flex-wrap: wrap; margin: 14px 0 0; padding: 8px 10px; background: var(--plate); font-size: var(--t-12); }
  /* The display above beats the UA's [hidden], which left an empty band
     whenever nothing was edited. */
  #edited[hidden] { display: none !important; }
  #edited b { font: 800 var(--t-12)/1 var(--f-disp); text-transform: uppercase; letter-spacing: .03em; color: var(--warn); }
  #edited .f { font-family: var(--f-data); font-size: var(--t-12); color: var(--ink); }
  #msg { flex: 0 0 auto; padding: 6px var(--m); font-size: var(--t-12); border-bottom: 2px solid var(--ink); }
  #msg:empty { display: none; }
  #msg.err { color: var(--bad); } #msg.ok { color: var(--good); }

  #spread { --l: 7fr; --r: 5fr; }
  .bk-pg { padding-top: 16px; padding-bottom: 28px; }

  /* the page's own buttons and selects, drawn like the booklet's */
  button, select { font: 700 var(--t-12)/1 var(--f-disp); color: var(--ink); }
  #left button, #right button { height: 24px; padding: 0 8px; border: 1.5px solid var(--ink); background: var(--paper); cursor: pointer; box-shadow: none; }
  #left button:hover, #right button:hover { background: var(--plate); }
  #left button[aria-pressed="true"], #right button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  #left button[disabled], #right button[disabled] { border-color: var(--line); color: var(--ink2); background: var(--paper); cursor: default; }
  #right select { height: 24px; padding: 0 6px; border: 1.5px solid var(--line); background: var(--well); color: var(--ink); font: 400 var(--t-12)/1 var(--f-data); max-width: 100%; }
  #right select:hover { border-color: var(--ink); }
  button.warn { border-color: var(--flag) !important; }
  button.warn:hover { background: var(--flag) !important; color: var(--onflag) !important; }

  /* ---- THE COMMAND LIST (#states): one row per attack state ----
     A row's first child is its state number (code and the suites read it
     there); the grid places every cell in its printed column. The Hit column
     holds the cancel stamps (100px), so the Command column takes the larger
     share of what is left (1.1fr to the name's 1fr): at 1400 wide that is
     181px, the widest input on Main (a MAX super's charge + X + Y, 179px)
     whole; 1.5fr / 1.4fr cut its last chip once Hit grew (measured, merge). */
  #states { --cols: minmax(110px, 1fr) minmax(96px, 1.1fr) 50px 40px 36px 38px 44px 100px 50px 66px; min-width: 620px; font-size: var(--t-13); }
  #states.nonames { --cols: minmax(150px, 2.6fr) 0 50px 40px 36px 38px 44px 100px 50px 66px; }
  #states.nonames .cm, #states.nonames .clh > span:nth-child(2) { display: none; }
  .clh, .clg, #states .st, #states .nohit { display: grid; grid-template-columns: var(--cols); align-items: center; column-gap: 0; }
  .clh { height: var(--bk-row); background: var(--band); color: var(--onband); font: 800 var(--t-12)/1 var(--f-disp); font-stretch: 104%; letter-spacing: .02em; position: sticky; top: -16px; z-index: 2; }
  .clh > span { padding: 0 5px; white-space: nowrap; height: 100%; display: flex; align-items: center; }
  .clh > span + span { border-left: 2px solid var(--paper); }
  .clh > .r { justify-content: flex-end; }
  .clh > span { grid-row: 1; }
  .clh > :nth-child(1) { grid-column: 1; padding-left: 8px; } .clh > :nth-child(2) { grid-column: 2; } .clh > :nth-child(3) { grid-column: 3; }
  .clh > :nth-child(4) { grid-column: 4; } .clh > :nth-child(5) { grid-column: 5; } .clh > :nth-child(6) { grid-column: 6; }
  .clh > :nth-child(7) { grid-column: 7; } .clh > :nth-child(8) { grid-column: 8; } .clh > :nth-child(9) { grid-column: 9; } .clh > :nth-child(10) { grid-column: 10; }
  /* In another language (GRAIL 3.1c rule 10; this page's markup says lang="en",
     so a translated-only rule names the other languages) a head longer than
     its narrow column is cut with an ellipsis instead of running over the
     next head; the number heads' titles say what they count. */
  :root[lang]:not([lang="en"]) .clh > span { display: block; overflow: hidden; text-overflow: ellipsis; line-height: var(--bk-row); }
  :root[lang]:not([lang="en"]) .clh > .r { text-align: right; }
  /* Before the ellipsis, the head is set in Saira's semi-condensed width with
     3px sides: that is what Estado, Inicio and Bloqueo (Defesa) need to show
     whole in the 40-50px number columns at 1400 wide (measured; the narrow
     window's columns go condensed below). The Move head keeps its 8px. */
  :root[lang]:not([lang="en"]) .clh > span { font-stretch: 87.5%; letter-spacing: 0; padding: 0 3px; }
  :root[lang]:not([lang="en"]) .clh > :nth-child(1) { padding-left: 8px; }
  #states.nonames .clh > :nth-child(3) { border-left: 0; }
  .clg { padding: 12px 8px 4px; border-bottom: 2px solid var(--ink); font: 800 var(--t-12)/1 var(--f-disp); text-transform: uppercase; letter-spacing: .02em; }
  .clg > * { grid-column: 1 / -1; }
  .clg .k { font: 700 var(--t-11)/1 var(--f-jp); margin-left: 8px; text-transform: none; color: var(--ink2); }
  #states .st, #states .nohit { min-height: var(--bk-row); border-bottom: 1px solid var(--rule); }
  #states .st { cursor: pointer; }
  #states .zb { background: var(--plate); }
  #states .st:hover { box-shadow: inset 0 -2px 0 var(--ink); }
  #states .st:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  #states .st > *, #states .nohit > * { grid-row: 1; padding: 2px 6px; min-width: 0; }
  #states .no { grid-column: 3; font: 400 var(--t-12)/1 var(--f-data); }
  #states .mv { grid-column: 1; padding-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #states .mv b { font-weight: 700; }
  #states .mv .desc { color: var(--ink2); }
  #states .mv small { margin-left: 6px; font: 400 var(--t-11)/1 var(--f-data); color: var(--ink2); }
  #states .cm { grid-column: 2; overflow: hidden; }
  #states .cm .bk-cmd .ar { width: 15px; height: 15px; }
  #states .cm .bk-cmd .b { min-width: 15px; height: 15px; font-size: 10px; }
  #states .n { text-align: right; font: 400 var(--t-12)/1 var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #states .su { grid-column: 4; } #states .ac { grid-column: 5; font-weight: 700; } #states .rc { grid-column: 6; } #states .tt { grid-column: 7; }
  #states .oh { grid-column: 8; } #states .ob { grid-column: 9; } #states .dm { grid-column: 10; }
  #states .nohit .why { grid-column: 4 / -1; font-size: var(--t-12); color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #states .kd { font: 800 var(--t-11)/1 var(--f-disp); letter-spacing: .03em; }
  /* CANCELS (cmdlist.js THE CANCELS): SP / SU / CH printed beside the on-hit number,
     the band's mark ink on paper (4.5:1 on paper and plate); a dashed box = through
     a variable the state sets itself (approximate). PROXIMITY: far / close after the input. */
  #states .n.oh { display: flex; justify-content: flex-end; align-items: center; gap: 3px; }
  .cx { display: inline-flex; gap: 2px; margin-right: 1px; }
  .cxm { font: 800 10px/1 var(--f-disp); font-stretch: 87.5%; letter-spacing: .02em; color: var(--mark); box-shadow: inset 0 0 0 1px var(--mark); padding: 2px 3px 1px; cursor: help; }
  .cxm.apx { box-shadow: none; outline: 1px dashed var(--mark); outline-offset: -1px; }
  .rng { margin-left: 6px; font: 700 var(--t-11)/1 var(--f-disp); font-stretch: 104%; color: var(--ink2); white-space: nowrap; cursor: help; }
  .rng.close { color: var(--mark); }
  #states .cm { display: flex; align-items: center; }
  #states .st[aria-selected="true"] .cxm, #states .st[aria-selected="true"] .rng { color: var(--paper); box-shadow: inset 0 0 0 1px var(--paper); }
  #states .st[aria-selected="true"] .cxm.apx { box-shadow: none; outline-color: var(--paper); }
  #states .st[aria-selected="true"] .rng { box-shadow: none; }
  .cxbox { margin-top: 14px; }
  .cxbox .cxrow { display: grid; grid-template-columns: 28px 112px 1fr; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--rule); font-size: var(--t-13); }
  .cxbox .cxrow .cxm { justify-self: start; }
  .cxbox .cxto .sn { font: 400 var(--t-11)/1 var(--f-data); color: var(--ink2); }
  .cxbox .cxto small { font: 400 var(--t-11)/1 var(--f-data); color: var(--ink2); }
  .mvhead .rngline b { color: var(--ink); }
  #states .n.plus, #states .fdsum .p { color: var(--good); } #states .n.minus, #states .fdsum .m { color: var(--bad); }
  /* Edit on: the state's own line under the printed one */
  #states .st .eline { grid-row: 2; grid-column: 1 / -1; display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: baseline; padding: 0 8px 4px; font: 400 var(--t-11)/1.4 var(--f-data); color: var(--ink2); }
  #states .st .eline .fdsum { color: var(--ink); }
  .mt { display: inline-block; width: 16px; text-align: center; font: 700 var(--t-11)/14px var(--f-data); margin-right: 4px; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink2); }
  .mt.a { box-shadow: inset 0 0 0 1.5px var(--flag); color: var(--ink); } .mt.h { box-shadow: inset 0 0 0 1.5px var(--clsn2); color: var(--ink); }
  /* the selected row prints in reverse */
  #states .st[aria-selected="true"] { background: var(--ink) !important; color: var(--paper); }
  #states .st[aria-selected="true"] .mv .desc, #states .st[aria-selected="true"] small, #states .st[aria-selected="true"] .eline,
  #states .st[aria-selected="true"] .eline .fdsum, #states .st[aria-selected="true"] .n.plus, #states .st[aria-selected="true"] .n.minus, #states .st[aria-selected="true"] .fdsum .p, #states .st[aria-selected="true"] .fdsum .m,
  #states .st[aria-selected="true"] .mt { color: var(--paper); }
  #states .st[aria-selected="true"] .mt { box-shadow: inset 0 0 0 1.5px var(--paper); }
  #states .st[aria-selected="true"] .bk-cmd .b.s { background: var(--ink); color: var(--paper); box-shadow: inset 0 0 0 1.5px var(--paper); }
  #states .st[aria-selected="true"] .bk-cmd .txt { color: var(--paper); }
  .dead { padding: 5px 8px; border-bottom: 1px solid var(--rule); font-size: var(--t-12); color: var(--ink2); }
  .dead .no { font-family: var(--f-data); color: var(--ink); }
  .deadh { margin-top: 18px; }
  .none { padding: 10px 8px; color: var(--ink2); font-size: var(--t-13); }
  .listfoot { margin: 8px 0 0; font-size: var(--t-12); color: var(--ink2); line-height: 1.5; max-width: 96ch; }
  .listfoot b { color: var(--ink); }

  /* ---- #frames: the action, frame by frame ---- */
  #frames { margin-top: 20px; }
  #plate:empty { display: none; }
  .title { font: 800 var(--t-13)/1.3 var(--f-disp); color: var(--ink); }
  .title .ty { color: var(--mark); }
  .facts { color: var(--ink2); font-size: var(--t-12); margin-top: 4px; line-height: 1.55; }
  .facts code { color: var(--ink); }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 10px 0 6px; }
  .fire { margin: 6px 0; font-size: var(--t-12); }
  .fire code { color: var(--ink); }
  .fire .k { display: inline-block; font: 800 var(--t-11)/16px var(--f-disp); text-transform: uppercase; letter-spacing: .03em; padding: 0 5px; margin-right: 6px; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .fire .k.static { background: var(--warn); color: var(--onwarn); box-shadow: none; }
  .fire .k.cond { color: var(--ink2); box-shadow: inset 0 0 0 1.5px var(--line); }
  .legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: var(--t-12); color: var(--ink2); margin: 8px 0 10px; align-items: center; }
  .legend i { display: inline-block; width: 14px; height: 12px; margin-right: 6px; vertical-align: -2px; border: 1.5px solid; }
  .legend i.fb { height: 8px; border: 0; }
  .legend .warnline { color: var(--warn); }
  .sub { margin-top: 14px; font-size: var(--t-12); color: var(--ink2); }
  .sub .h { font: 800 var(--t-12)/1.2 var(--f-disp); text-transform: uppercase; letter-spacing: .02em; color: var(--ink); margin-bottom: 4px; }
  .sub li { margin: 2px 0; }
  .sub ul { margin: 0; padding-left: 16px; }
  .sub code { color: var(--ink); }

  /* the frames: in Edit on, a card per element with its caption and badges */
  .strip { display: flex; flex-wrap: wrap; gap: 8px; }
  .fr { position: relative; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--rule); width: var(--cw, 170px); }
  .fr.active { box-shadow: inset 0 0 0 1.5px var(--clsn1); }
  .fr.firing { box-shadow: inset 0 0 0 3px var(--warn); }
  .fr.hidden { opacity: .6; }
  .fr .stage { position: relative; height: var(--chh, 170px); overflow: hidden; background: var(--plate); }
  .fr .stin { position: absolute; left: 0; top: 0; width: var(--cw, 170px); height: var(--chh, 170px); }
  .fr .stage img { position: absolute; image-rendering: pixelated; transform-origin: 0 0; }
  .fr .box, .plate2 .box { position: absolute; pointer-events: none; border: 1px solid; }
  .box.c2 { border-color: var(--c2); background: rgba(0,0,255,.10); }
  .box.c1hit { border-color: var(--c1hit); background: rgba(255,0,0,.12); }
  .box.c1rev { border-color: var(--c1rev); background: rgba(192,64,0,.14); }
  .box.c1not { border-color: var(--c1not); background: rgba(128,0,0,.18); }
  .fr .ax { position: absolute; width: 0; height: 0; pointer-events: none; }
  .fr .ax::before, .fr .ax::after { content: ""; position: absolute; background: var(--ink); }
  .fr .ax::before { left: -4px; top: 0; width: 9px; height: 1px; }
  .fr .ax::after { left: 0; top: -4px; width: 1px; height: 9px; }
  .fr .cap { padding: 4px 6px 6px; font: 400 var(--t-11)/1.4 var(--f-data); color: var(--ink2); }
  .fr .cap b { color: var(--ink); font-weight: 700; }
  .fr .badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
  .badge { display: inline-flex; align-items: center; height: 16px; padding: 0 5px; font: 700 var(--t-11)/1 var(--f-disp); text-transform: uppercase; letter-spacing: .02em; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink2); }
  .badge.act { box-shadow: inset 0 0 0 1.5px var(--flag); color: var(--ink); }
  .badge.fires { background: var(--warn); color: var(--onwarn); box-shadow: none; }
  .badge.dim { color: var(--ink2); }
  .fr .fn, .fr .tk { display: none; }

  /* Edit off: every element on one ground line, the frame bar under the
     sprites (one cell per tick, colored by the server's frame meter), the
     first active element underlined in the mark ink. */
  body:not(.editing) .strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(46px, 1fr); gap: 0; overflow-x: auto; overflow-y: hidden; padding-top: 4px; }
  body:not(.editing) .fr { width: auto; box-shadow: none; background: none; min-width: 0; }
  body:not(.editing) .fr.hidden { opacity: .45; }
  body:not(.editing) .fr .stage { overflow: visible; background: none; border-bottom: 2px solid var(--ink); height: var(--ph, 170px); }
  body:not(.editing) .fr .stin, body:not(.editing) .fr .xin { left: calc(50% - var(--cw, 170px) / 2); top: calc(var(--ph, 170px) - var(--chh, 170px)); }
  body:not(.editing) .fr .ax { display: none; }
  body:not(.editing) .fr .box { background: none; }
  body:not(.editing) .fr .cap { display: none; }
  body:not(.editing) .fr .tk { display: flex; gap: 1px; height: 12px; margin: 4px 2px 0 0; }
  body:not(.editing) .fr .fn { display: flex; gap: 5px; align-items: baseline; padding-right: 4px; margin-top: 4px; font: 400 var(--t-11)/1 var(--f-data); color: var(--ink2); white-space: nowrap; }
  .fr .tk i { flex: 1 1 0; min-width: 1px; background: var(--rule); }
  .fr .fn b { font: italic 800 var(--t-12)/1 var(--f-disp); color: var(--ink); }
  body:not(.editing) .fr.kf .stage { box-shadow: inset 0 -4px 0 var(--mark); }
  body:not(.editing) .fr.kf .fn b { color: var(--mark); }
  /* startup is printed open (an outline), active in the hit-box red, recovery solid ink:
     three marks that stay apart in every printing */
  .tk i.s, .meter i.s, .legend i.s, .mkey i.s { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink2); }
  .tk i.a, .meter i.a, .legend i.a, .mkey i.a { background: var(--clsn1); }
  .tk i.r, .meter i.r, .legend i.r, .mkey i.r { background: var(--ink); }

  /* ---- the opened move (right page) ---- */
  .mvhead .where { font: 700 var(--t-13)/1.3 var(--f-disp); color: var(--ink); }
  .mvhead .where .sn { font: italic 800 var(--t-16)/1 var(--f-disp); color: var(--mark); margin-right: 6px; }
  .mvhead .bk-title { margin-top: 6px; overflow-wrap: anywhere; }
  .mvhead .inp { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: var(--t-12); color: var(--ink2); }
  .mvhead .from { font-size: var(--t-12); line-height: 1.45; color: var(--ink2); margin-top: 6px; }
  .mvhead .from code { color: var(--ink); }

  /* THE TRAINING-MODE READOUT: the numbers a fighting-game player looks for
     first, printed large over the frame meter (startup, active, recovery). */
  .fd { margin-top: 14px; }
  .fd .fdh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .fd .fdh .t { font: 800 var(--t-12)/1 var(--f-disp); text-transform: uppercase; letter-spacing: .03em; color: var(--ink); }
  .fd .fdh .tag { font-size: var(--t-12); color: var(--ink2); }
  .fd .fdh button { margin-left: auto; }
  .fdrow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
  .fdn { display: flex; flex-direction: column; padding: 6px 8px 7px; min-width: 0; }
  .fdn + .fdn { border-left: 1px solid var(--rule); }
  .fdn.sep { border-left: 2px solid var(--ink); }
  .fdn .k { font: 700 var(--t-11)/1.2 var(--f-disp); color: var(--ink2); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  /* the same for a readout label longer than its sixth of the row (the cell's title explains it) */
  :root[lang]:not([lang="en"]) .fdn .k { overflow: hidden; text-overflow: ellipsis; font-stretch: 87.5%; letter-spacing: 0; }
  .fdn b { margin-top: 2px; font: italic 800 26px/1 var(--f-disp); font-stretch: 108%; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
  .fdn.plus b { color: var(--good); } .fdn.minus b { color: var(--bad); } .fdn.even b { color: var(--ink); }
  .fdn.kd b { color: var(--warn); font-size: var(--t-20); }
  .meter { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(2px, 1fr); gap: 1px; height: 12px; margin: 8px 0 4px; }

  /* ---- Edit on: the block, its triggers and every value (#block) ---- */
  #block { margin-top: 18px; }

  .tierkey { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: 12px 0 4px; font-size: var(--t-12); color: var(--ink2); }
  table.params { width: 100%; border-collapse: collapse; margin-top: 6px; }
  table.params td { border-top: 1px solid var(--rule); padding: 5px 4px; vertical-align: top; }
  table.params td.nm { font: 400 var(--t-11)/1.35 var(--f-data); color: var(--ink); width: 38%; word-break: break-all; }
  table.params td.nm .ln { display: block; color: var(--ink2); font-size: var(--t-11); }
  table.params td.nm .fgc { display: block; font: 700 var(--t-12)/1.3 var(--f-body); color: var(--ink); word-break: normal; }
  table.params td.nm .mg { display: block; font: 400 var(--t-11)/1.35 var(--f-data); color: var(--ink2); }
  table.params td.nm .ex { display: block; font: 400 var(--t-11)/1.35 var(--f-body); color: var(--ink2); word-break: normal; }
  tr.grp td { padding-top: 14px; border-top: 0; border-bottom: 2px solid var(--ink); font: 800 var(--t-12)/1 var(--f-disp); text-transform: uppercase; letter-spacing: .02em; color: var(--ink); }
  .risk { display: inline-block; font: 700 var(--t-11)/14px var(--f-disp); text-transform: uppercase; letter-spacing: .02em; margin-left: 4px; padding: 0 4px; white-space: nowrap; }
  .risk.careful { background: var(--warn); color: var(--onwarn); }
  .risk.dangerous { background: var(--flag); color: var(--onflag); }
  .vals { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
  .v input { width: 72px; height: 24px; background: var(--well); color: var(--ink); border: 1.5px solid var(--ok); padding: 0 5px; font: 400 var(--t-12)/1 var(--f-data); text-align: right; }
  .v input:focus-visible, .fds input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .v input.busy { opacity: .5; }

  .rt { display: inline-flex; align-items: center; height: 16px; font: 700 var(--t-11)/1 var(--f-disp); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--flag); padding: 0 5px; margin-left: 4px; white-space: nowrap; }

  /* ---- PROJECTILES (movelib THE PROJECTILES): one row per thing a move throws,

  #states .pjh { position: static; margin-top: 0; }
  #states .pj { display: grid; grid-template-columns: var(--cols); align-items: center; column-gap: 0; min-height: var(--bk-row); border-bottom: 1px solid var(--rule); cursor: pointer; }
  #states .pj > * { grid-row: 1; padding: 2px 6px; min-width: 0; }

  #states .pj[aria-selected="true"] .mv .desc, #states .pj[aria-selected="true"] small, #states .pj[aria-selected="true"] .n.plus, #states .pj[aria-selected="true"] .n.minus { color: var(--paper); }

  .fdx { margin-top: 10px; font-size: var(--t-12); color: var(--ink2); line-height: 1.5; }
  .fdx .h { font: 700 var(--t-12)/1.3 var(--f-disp); color: var(--ink); }
  .fdx .h .aside { font: 400 var(--t-12)/1.3 var(--f-body); color: var(--ink2); margin-left: 8px; }
  .fdx ul { margin: 4px 0 0; padding-left: 18px; }
  .fdx li b { color: var(--ink); }
  .fdx code { color: var(--ink); overflow-wrap: anywhere; }
  .fdx .xwhy { color: var(--ink2); }
  img.xpl { position: absolute; image-rendering: pixelated; transform-origin: 0 0; }
  /* A strip cell's Explod art sits in its own clip layer: cut at the cell's

  .fr .xcl { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; }
  .fr .xin { position: absolute; left: 0; top: 0; width: var(--cw, 170px); height: var(--chh, 170px); }
  .pjdeps code { color: var(--ink); overflow-wrap: anywhere; }
  .pjpath { position: relative; width: 520px; max-width: 100%; height: 190px; overflow: hidden; margin-top: 10px; }
  .pjpath .gnd { position: absolute; left: 0; right: 0; height: 2px; background: var(--ink); }
  .pjpath .axv { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .pjpath .scr { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px dashed var(--line); }
  .pjpath .dot, .pjpath .mk { z-index: 1; }
  .pjpath .dot { position: absolute; width: 3px; height: 3px; margin: -1px 0 0 -1px; background: var(--ink2); }
  .pjpath .dot.h { background: var(--clsn1); }
  .pjpath .dot.t10 { width: 5px; height: 5px; margin: -2px 0 0 -2px; }
  .pjpath .mk { position: absolute; width: 11px; height: 11px; margin: -5px 0 0 -5px; border: 2px solid var(--mark); transform: rotate(45deg); }
  .pjpath .mk.end { transform: none; border-color: var(--ink); }
  .pjpath .lab { position: absolute; font: 400 var(--t-11)/1.2 var(--f-data); color: var(--ink2); white-space: nowrap; }
  .pjpath .lab b { color: var(--ink); font-weight: 700; }
  .pjpath img { position: absolute; image-rendering: pixelated; transform-origin: 0 0; }
  .pjpath .box { position: absolute; pointer-events: none; border: 1px solid; background: none; }
  .pjpath .thr { opacity: .55; }
  .pjpath .tag { position: absolute; left: 8px; top: 6px; font: 400 var(--t-11)/1 var(--f-data); color: var(--ink2); }
  /* A helper followed through its states: one heading per state over its own
     strip (every strip at one scale, on one ground line), numbered state marks
     on the path and their key under it. */
  .pjst { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; margin: 12px 0 4px; font: 400 var(--t-12)/1.4 var(--f-data); color: var(--ink2); }
  .pjst:first-of-type { margin-top: 4px; }
  body:not(.editing) .strip.pjch { grid-auto-columns: minmax(var(--colw, 46px), 1fr); }
  .pjst .sn { font-weight: 700; color: var(--ink); }
  .pjst .sbn, .pjkey .sbn { display: inline-block; min-width: 15px; height: 15px; padding: 0 3px; box-sizing: border-box; border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); font: 700 var(--t-11)/12px var(--f-data); text-align: center; }
  .pjst .hd { color: var(--clsn1); font-weight: 700; }
  .pjpath .sb { position: absolute; z-index: 3; }
  .pjpath .sb .sbn { display: inline-block; min-width: 15px; height: 15px; padding: 0 3px; box-sizing: border-box; border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); font: 700 var(--t-11)/12px var(--f-data); text-align: center; }
  .pjkey { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font: 400 var(--t-11)/1.4 var(--f-data); color: var(--ink2); }
  .pjkey > span { display: inline-flex; gap: 5px; align-items: baseline; }
  .meter i.a.sb { box-shadow: inset 2px 0 0 var(--ink); }
  .meter i.s.sb, .mkey i.s.sb { box-shadow: inset 2px 0 0 var(--ink), inset 0 0 0 1.5px var(--ink2); }

  /* ---- the Command List section (Ikemen's pause menu) ---- */
  #cmdl { margin-top: 28px; }
  #cmdl p { margin: 0 0 8px; font-size: var(--t-12); color: var(--ink2); line-height: 1.5; max-width: 72ch; }
  #cmdl p b, #cmdl p code { color: var(--ink); }
  #cmdl .bk-tbl td { font-size: var(--t-12); }
  /* the glyphs keep one line (.bk-cmd.nowrap); a long name wraps under them instead of running into the Name column */
  #cmdl .tok { white-space: normal; overflow-wrap: anywhere; }
  #cmdl .src { color: var(--ink2); }
  /* the build's button style (paintButtons): the game's own pictures, at the chips' height */
  #cmdl .bk-cmd img.bpic { width: auto; height: 19px; vertical-align: middle; margin: 0 1px; }
  #cmdl .src .bk-flag { height: 18px; margin: 2px 4px 0 0; vertical-align: middle; }
  #cmdl tr.off td:first-child { text-decoration: line-through; }
  #cmdl .bk-inp { width: 100%; }
  #cmdl .acts { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .ikfile { margin: 10px 0 0; padding: 8px 10px; background: var(--plate); font: 400 var(--t-12)/1.6 var(--f-data); white-space: pre; overflow-x: auto; color: var(--ink); user-select: text; }


  @media (max-width: 1100px), (max-height: 760px) {
    .fdn b { font-size: var(--t-20); }
    .fdn.kd b { font-size: var(--t-16); }
    .plate2 { width: 210px; height: 260px; }
    .platerow { gap: 12px; }
    #states .mv small { display: none; }
  }
  /* A narrow window: two even pages, the list's columns set closer. */
  @media (max-width: 1180px) {
    #spread { --l: 1fr; --r: 1fr; }
    #states { min-width: 0; font-size: var(--t-12); --cols: minmax(80px, 1fr) minmax(70px, .9fr) 40px 32px 28px 30px 36px 74px 40px 46px; }
    :root[lang]:not([lang="en"]) .clh > span, :root[lang]:not([lang="en"]) .fdn .k { font-stretch: 75%; }
    #states.nonames { --cols: minmax(90px, 1fr) 0 40px 32px 28px 30px 36px 74px 40px 46px; }
    .cxm { font-size: 9px; padding: 2px 2px 1px; letter-spacing: 0; } .cx { gap: 1px; } #states .n.oh { gap: 2px; padding-left: 1px; }
    .clh > span { padding: 0 3px; font-size: var(--t-11); }
    #states .st > *, #states .nohit > * { padding: 2px 3px; }
    .platerow { grid-template-columns: minmax(0, 1fr); }
    .fdn { padding: 5px 5px 6px; }
  }

<body>
  <header class="bk-secband" id="band">
    <h1 class="bk-secband-t"><span class="no" id="slotNo" hidden></span><span class="t bk-nocaps" id="who" translate="no">&hellip;</span><span class="k" lang="ja">コマンド表</span></h1>
    <!-- The band's mascot (Booklet.mascot): a click deals the Moves window's tips
         ('moves' in the Studio's tip table) through the opener's deck, as a slip
         over the page. No opener, no mascot. -->
    <button id="bandMascot" class="bk-bandmascot" type="button" hidden></button>
    <div class="bk-secband-meta">
      <span class="src" id="src"></span>
      <span class="bk-seg sm" role="group" aria-label="Edit mode" id="editSeg">
        <button type="button" data-edit="off" aria-pressed="true" title="The printed command list">Edit off</button>
        <button type="button" data-edit="on" aria-pressed="false" title="Edit this character's values and timing: edits write its own files, the original is kept for Revert">Edit on</button>
      </span>
    </div>
  </header>
  <div id="msg" role="status"></div>
  <main class="bk-spread" id="spread">
    <section class="bk-pg l" id="left" aria-label="Command list">
      <h2 class="bk-sh">Command list <span class="k" lang="ja">コマンド表</span><span class="aside" id="listAside"></span></h2>
      <div id="states"><div class="none">Reading&hellip;</div></div>
      <p class="listfoot" id="listFoot"></p>
    </section>
    <div class="bk-fold"></div>
    <section class="bk-pg r" id="right" aria-label="The opened move">
      <div id="opened"></div>
      <div id="frames"></div>
      <div id="plate" class="pr"></div>
      <div id="edited" class="ed" hidden></div>
      <div id="block" class="ed"></div>
      <section id="cmdl" aria-label="The game's Command List"></section>
    </section>
  </main>
<script>
  // HOW THIS PAGE READS AN ATTACK (§1, §2, §8). There is no "attack" in the
  // engine: a state holds controllers, and five controller types share the
  // HitDef parser. The page lists each state that holds any of them, shows one
  // ATTACK BLOCK at a time addressed as (file, state, ordinal), draws every
  // element of the animation(s) the state may play with the boxes the engine
  // binds to it, and marks where the block fires when that is knowable from
  // the trigger text alone. Everything shown comes from GET /api/char-moves;
  // every edit is one POST of one value with the raw text it replaces. Move
  // NAMES and INPUTS come from GET /api/movelist (the Command List reader)
  // when the Studio has it; without it, a state is listed by its number.
  const q = new URLSearchParams(location.search);
  const char = q.get('char') || '';
  const name = q.get('name') || char;
  const $ = (id) => document.getElementById(id);
  // The suites drive this script with a stand-in document and no window, so
  // everything that needs the real browser is reached through W.
  const W = typeof window !== 'undefined' ? window : null;
  const BK = typeof Booklet !== 'undefined' ? Booklet : null;
  // THE STUDIO'S LANGUAGE (public/i18n.js, GRAIL 3.1c). English is the key,
  // and every sentence this page puts together is ONE t() call with {named}
  // placeholders, so a pack can move its words; a word or phrase that stands
  // on its own (a label, a list part joined with " · ") is its own key. Text
  // the server sends (an error, a `why`, a note) stays English on the wire:
  // inside a sentence of the page it goes in under a message name ({why},
  // {error}, {reason}...), which i18n.js looks up in the pack before filling
  // it in; changed or joined by the page (capitalized, listed) it goes
  // through I18n.server() first. Data - names, files, states, expressions,
  // controller and parameter names - is a plain placeholder, never
  // translated, and an element that shows it is translate="no". The suites
  // run this script on a stand-in document with no window: there t() fills
  // in the English itself.
  const I18n = (W && W.I18n) || {
    t: (en, vars) => String(en).replace(/\{([A-Za-z_$][\w$]*)\}/g, (m, k) => (vars && Object.prototype.hasOwnProperty.call(vars, k) && vars[k] != null ? String(vars[k]) : m)),
    server: (s) => s,
  };
  // A value the files leave null or undefined prints as that word, as the
  // page's sentences always printed it (i18n.js's fill would keep {name}).
  const packT = I18n.t;
  const t = (en, vars) => packT(en, vars && Object.fromEntries(Object.entries(vars).map(([k, v]) => [k, v === null || v === undefined ? String(v) : v])));
  // A SENTENCE WITH ELEMENTS IN IT stays one key: a word it prints in bold
  // or as code is written in the key as <b>...</b> or <code>...</code> (a
  // pack keeps the same tags), and an element made elsewhere (a glyph, a
  // file name in <code>, a bold name) is passed as a {placeholder} through
  // nodes(), which stands a marker in for it:
  //   el('p', {}, tn(t('read from {file}', nodes({ file: el('code', ...) }))))
  // tn() hands back the pieces of the translated sentence - text runs and
  // elements, in the order the language puts them - for el() or append().
  // Those two plain tags are the only markup ever read out of a string, and
  // only into textContent. A marker is a private-use character and an index
  // into `held`, which tn() empties.
  let held = [];
  function nodes(vars) {
    const out = {};
    for (const k of Object.keys(vars)) {
      const v = vars[k];
      if (v !== null && typeof v === 'object') { out[k] = '\uE000' + held.length + '\uE001'; held.push(v); } else out[k] = v;
    }
    return out;
  }
  function tn(s) {

  // THE PROJECTILES SECTION, at the foot of the list: one row per projectile,

      if (r.partOf) {

  // ---- an opened PROJECTILES entry ------------------------------------------
  // Its head (what throws it, how it is made), the readout (the frame it appears

  function renderProjectile(e) {

    const hitTip = 'frames you are ahead after the hit connects on its first active frame (+ you act first): hitstun + 2 + the hitstop difference - your frames after contact. One frame is the opponent getting control back mid-frame, the other the frame the engine adds for a MUGEN-made opponent. Worked out from the files; the formula matches the engine measured with the training frame meter.';
    // A throw: its projectile's own numbers where this block has none, labeled
    // point blank (PB) - the projectile entry has the rest.
    const pj = f.proj && projById(f.proj.id) ? f.proj : null;
    if (pj && (f.onHit === null || f.onHit === undefined) && (f.onBlock === null || f.onBlock === undefined)) {
      const pje = projById(pj.id), act = pjActive(pje), pt = pj.approx ? '≈' : '';
      card.append(el('div', { class: 'fdrow' },
        n(t('Appears'), f.startup, 'the frame the projectile appears on (frame 1 is the first frame of the move)'),
        n(t('Active'), act.text, t('the projectile\'s hit box: {tip}', { tip: act.tip })),
        n(t('Recovery'), pj.recovery, 'your frames after it appears until you can act'),
        n(t('Total'), f.total, 'frames you cannot act'),
        n('PB hit', pj.onHit === null || pj.onHit === undefined ? null : pt + signed(pj.onHit), PB_TIP, 'sep ' + advCls(pj.onHit)),
        n('PB block', pj.onBlock === null || pj.onBlock === undefined ? null : pt + signed(pj.onBlock), PB_TIP, advCls(pj.onBlock))));
      card.append(el('div', { class: 'fdnote' }, 'A throw: the numbers after Appears are its projectile\'s (PB = point blank, if it connects on the first frame it can). ',
        pj.by !== undefined ? (pj.by !== null ? t('This state is a helper\'s: Appears and Total count the helper\'s frames, Recovery and PB count state {state}\'s, the move that makes the helper.', { state: pj.by }) + ' ' : 'This state is a helper\'s, and the frames of the move that makes it are not settled. ') : null,
        el('button', { class: 'pjlink', type: 'button', onclick: () => openProj(pj.id) }, 'Open the projectile →')));
    }
    const row = pj && (f.onHit === null || f.onHit === undefined) && (f.onBlock === null || f.onBlock === undefined) ? el('div', { hidden: true }) : el('div', { class: 'fdrow' },
      n(t('Startup'), f.startup, 'the first frame the attack can hit (frame 1 is the first frame of the move)'),
      n(t('Active'), f.active, 'frames the hit box stays out'),
      n(t('Recovery'), f.recovery, 'frames after the active frames until you can act again'),
      n(t('Total'), f.total, f.endHow === 'animtime' ? t('frames you cannot act: the state hands control back when its animation ends, and you act the frame after')
        : f.endHow === 'time' ? t('frames you cannot act: the state hands control back at a set time') : f.endHow === 'assumed' ? t('frames you cannot act: assumed to end with its animation (no end trigger found)') : t('frames you cannot act')),
      f.knockdown ? n('On hit', 'KD', 'knockdown: the opponent falls, so frame advantage depends on their wake-up', 'sep kd')
        : n('On hit', f.onHit === undefined || f.onHit === null ? null : tilde + signed(f.onHit), hitTip, 'sep ' + advCls(f.onHit)),
      n('On block', f.onBlock === undefined || f.onBlock === null ? null : tilde + signed(f.onBlock), 'frames you are ahead after the opponent blocks on the first active frame: blockstun + 1 + the blockstop difference - your frames after contact (the 1 is the opponent getting control back mid-frame).', advCls(f.onBlock)));
    card.append(row);

    if (f.meter && f.meter.length) {
      const meter = el('div', { class: 'meter', title: 'one cell per frame' });
      // (the server's meter holds s, a and r only)
      f.meter.forEach((c, i) => meter.append(el('i', { class: c + ((i + 1) % 5 === 0 ? ' n5' : ''), title: c === 'a' ? t('frame {n}: active', { n: i + 1 }) : c === 'r' ? t('frame {n}: recovery', { n: i + 1 }) : t('frame {n}: startup', { n: i + 1 }) })));
      card.append(meter, el('div', { class: 'mkey' },
        el('span', {}, el('i', { class: 's' }), 'startup'),
        el('span', {}, el('i', { class: 'a' }), 'active'),
        el('span', {}, el('i', { class: 'r' }), 'recovery'),
        el('span', { text: 'each cell is one frame (1/60 s); every 5th is marked' })));
    }

    // THE NUMBERS BEHIND THE ADVANTAGE, editable. A plain number is written in
    // place; a value the block leaves out is added as a new line (it then
    // stops following what the engine would derive); a formula is shown as
    // what it reads and edited in the table below, so a scaling formula is
    // never flattened by accident.
    const v = f.values || {};
    const stats = el('div', { class: 'fdstats ed' });
    const stat = (label, x, param, index, tip) => {
      if (!x) return;
      const box = el('div', { class: 'fds', title: tip });
      box.append(el('div', { class: 'k' }, label, el('small', { translate: 'no', text: param + (index ? '[' + (index + 1) + ']' : '') })));
      const line = el('div', { class: 'in' });
      const err = el('div');
      if (x.how === 'computed' || x.how === 'unknown') {
        line.append(el('span', { class: 'ro calc', text: x.value === null ? '?' : '≈' + x.value, title: t('a formula: {formula}. Read as a fresh first hit (variables at 0, float variables at 1). Edit it in the table.', { formula: x.text }) }));
        box.append(line, el('div', { class: 'how', text: 'formula' }));
      } else if (!b.editable && x.how === 'file') {
        line.append(el('span', { class: 'ro', text: String(x.value) }));
        box.append(line);
      } else {
        const pinned = x.how === 'derived' || x.how === 'default';
        const input = el('input', { type: 'text', inputmode: 'numeric', spellcheck: 'false', value: x.value === null ? '' : String(x.value), class: pinned ? 'pinned' : '', 'aria-label': label });
        const shown = input.value;
        input.onkeydown = (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); } else if (ev.key === 'Escape') { input.value = shown; input.blur(); } };
        input.onblur = () => {
          const val = input.value.trim();
          if (val === shown) return;
          editValue(b, param, index, val, err, () => { input.value = shown; });
        };
        line.append(input);
        box.append(line, el('div', { class: 'how', text: pinned ? (x.how === 'derived' ? t('from {param}: typing a number sets it', { param: x.from }) : 'engine default: typing a number sets it') : 'from the file' }));
      }
      box.append(err);
      stats.append(box);
    };
    stat(t('Hitstun'), v.hitstun, 'ground.hittime', 0, 'frames the grounded opponent stays stunned after the hitstop');
    stat(t('Blockstun'), v.blockstun, 'guard.hittime', 0, 'frames the opponent stays stuck blocking after the blockstop');
    stat('Hitstop (you)', v.hitstop, 'pausetime', 0, 'frames you freeze when the hit connects');
    stat('Hitstop (them)', v.hitstopP2, 'pausetime', 1, 'frames the opponent shakes when the hit connects');
    stat(t('Damage'), v.damage, 'damage', 0, 'damage on hit');
    stat(t('Chip'), v.chip, 'damage', 1, 'damage on block');
    card.append(stats);

    // Its properties, a label each (a t() word) and a value in words; the
    // server's own words (guard, hitflag) go through I18n.server. hitflag's
    // is a list (framedata.js hitflagText): each entry is a key, and so is
    // the combo clause after " - ".
    const props = el('div', { class: 'fdprops' });
    const prop = (k, val) => { if (val !== null && val !== undefined && val !== '') props.append(el('div', { translate: 'no' }, el('b', { text: k + ': ' }), String(val))); };
    const hitsWords = (s) => { if (!s) return s; const [list, ...only] = String(s).split(' - '); return [list.split(', ').map((w) => I18n.server(w)).join(', '), ...only.map((w) => I18n.server(w))].join(' - '); };
    if (f.guard) prop(t('Blocked'), I18n.server(f.guard.text));
    prop(t('Hits'), hitsWords(f.hits));
    prop(t('Knockdown'), f.knockdown === true ? t('yes') : f.knockdown === false ? t('no') : t('depends on a formula'));
    if (f.juggle !== null && f.juggle !== undefined) prop(t('Juggle cost'), f.juggle);
    if (f.armFrame > 1 || f.armHow !== 'file') prop(t('Armed'), f.armHow === 'conditional' ? t('from frame {n} (when its condition holds)', { n: f.armFrame }) : f.armHow === 'assumed' ? t('from frame {n} (assumed)', { n: f.armFrame }) : t('from frame {n}', { n: f.armFrame }));
    card.append(props);
    for (const x of (f.notes || [])) card.append(el('div', { class: 'fdnote', text: x }));
    if (f.assumed && f.assumed.length) card.append(el('div', { class: 'fdnote', text: t('≈ assumes: {list}', { list: f.assumed.map((a) => I18n.server(a)).join('; ') }) }));
    renderExplodList(card, s);
    host.append(card);
  }

  // ---- the 2x plate: the frame the move first hits on ----------------------
  // The element on screen at the startup frame the server found (frame N is
  // tick N - 1 of the animation), else the first element with a Clsn1 box.
  function startupElement(a, f) {
    if (!a || !a.frames || !a.frames.length) return null;
    if (f && f.startup && f.anim === a.action) {
      const t = f.startup - 1;
      const hit = a.frames.find((x) => x.time > 0 && t >= x.start && t < x.start + x.time);
      if (hit) return hit;
    }
    return a.frames.find((x) => x.clsn1 && x.clsn1.length) || null;
  }
  function renderPlate(host, s, b) {
    const a = (s.anims || []).find((x) => x.action === sel.action) || null;
    const f = b.frame || {};
    const e = a && a.exists ? startupElement(a, f) : null;
    if (!e) return;
    let W2 = 250, H2 = 300;
    const rects = [frameRect(e), ...(e.clsn1 || []), ...(e.clsn2 || [])];
    let box = unionOf(rects);
    if (!box) return;
    // The tick this plate shows (frame N = tick N - 1), for its Explod art.
    // THE PLATE IS WHERE THE ART SHOWS WHOLE UNDER ITS BOXES (the strip cuts
    // it at each cell's edge): when art is drawn, it joins the fit (four
    // times the area at most), and the fit uses the plate's real size - the
    // narrow-window rule (@media max-width 1100px / max-height 760px) prints
    // it 210 x 260, so a 250 x 300 fit would cut the art and its long boxes
    // at 1024 x 700. No art drawn (switch off, or none alive here) = master's
    // plate exactly.
    const tk = f.startup && f.anim === a.action && f.startup - 1 >= e.start && f.startup - 1 < e.start + Math.max(1, e.time) ? f.startup - 1 : e.start;
    const xr = explodArt && hasDrawnExplods(s) ? explodRects(s, a.action, tk) : [];
    if (xr.length) {
      try { if (W && W.matchMedia && W.matchMedia('(max-width: 1100px), (max-height: 760px)').matches) { W2 = 210; H2 = 260; } } catch (err) { /* the wide plate */ }
      const u = unionOf([...rects, ...xr]);
      if (u && u.w * u.h <= box.w * box.h * 4) box = u;
    }
    const fit = Math.min((W2 - 24) / box.w, (H2 - 40) / box.h);
    const z = fit >= 2 ? 2 : fit >= 1 ? 1 : fit;
    const ox = Math.round((W2 - box.w * z) / 2 - box.l * z);
    const oy = Math.round(H2 - 14 - (box.t + box.h) * z);
    const plate = el('div', { class: 'plate2 bk-plate', role: 'img', 'aria-label': t('element {elem} of action {action} with its boxes', { elem: e.elem, action: a.action }) });
    plate.append(el('div', { class: 'axv', style: 'left:' + ox + 'px' }), el('div', { class: 'gnd', style: 'top:' + oy + 'px' }));
    drawExplods(plate, s, a.action, tk, ox, oy, z, false);
    if (e.w && e.h) {
      const img = el('img', { alt: '', src: '/api/sprite?char=' + encodeURIComponent(char) + '&group=' + e.group + '&index=' + e.number });
      img.onerror = () => { img.style.visibility = 'hidden'; };
      const [fx, fy] = axisAt(e);
      img.style.width = Math.max(1, Math.round(e.w * z)) + 'px';
      img.style.height = Math.max(1, Math.round(e.h * z)) + 'px';
      img.style.left = Math.round(ox + fx * z - e.axisX * z) + 'px';
      img.style.top = Math.round(oy + fy * z - e.axisY * z) + 'px';
      if (hFlip(e) || vFlip(e)) { img.style.transformOrigin = (e.axisX * z) + 'px ' + (e.axisY * z) + 'px'; img.style.transform = 'scale(' + (hFlip(e) ? -1 : 1) + ',' + (vFlip(e) ? -1 : 1) + ')'; }
      plate.append(img);
    }
    drawExplods(plate, s, a.action, tk, ox, oy, z, true);
    const c1 = clsn1Class(s, b);
    const addBox = (r, cls) => plate.append(el('div', { class: 'box ' + cls, style: 'left:' + Math.round(ox + r[0] * z) + 'px;top:' + Math.round(oy + r[1] * z) + 'px;width:' + Math.max(1, Math.round((r[2] - r[0]) * z)) + 'px;height:' + Math.max(1, Math.round((r[3] - r[1]) * z)) + 'px' }));
    for (const r of e.clsn2 || []) addBox(r, 'c2');
    for (const r of e.clsn1 || []) addBox(r, c1.cls);
    plate.append(el('span', { class: 'tag', text: t('element {elem}, {zoom}', { elem: e.elem, zoom: z === 2 || z === 1 ? z + 'x' : Math.round(z * 100) + '%' }) }));

    // A label each (a t() word) and a value in words or numbers; the
    // server's own words (guard) go through I18n.server.
    const dl = el('dl', { class: 'bk-prof platedl' });
    const row = (k, ...v) => dl.append(el('dt', { text: k }), el('dd', { translate: 'no' }, ...v));
    row(t('Sprite'), e.group + ',' + e.number + (e.w ? '  ' + e.w + ' × ' + e.h : '  ' + t('(no sprite)')) + (e.flip ? '  ' + e.flip : ''));
    row(t('Time'), e.holds ? t('holds') : e.time === 1 ? t('1 tick, from tick {start}', { start: e.start }) : t('{n} ticks, from tick {start}', { n: e.time, start: e.start }));
    const rc = (r) => r[0] + ',' + r[1] + ' → ' + r[2] + ',' + r[3];
    (e.clsn1 || []).forEach((r, i) => row(i ? '' : t('Clsn1'), el('span', { class: 'sw c1' }), rc(r)));
    (e.clsn2 || []).forEach((r, i) => row(i ? '' : t('Clsn2'), el('span', { class: 'sw c2' }), rc(r)));
    row(t('Axis'), e.axisX + ',' + e.axisY + (e.x || e.y ? '  ' + t('offset {x},{y}', { x: e.x, y: e.y }) : ''));
    if (explodArt) for (const { e: x, pt } of explodsAt(s, a.action, tk)) {
      const xv = { action: x.anim.action, elem: pt[0] + 1 };
      row(t('Explod'), x.layer.front ? t('action {action}, element {elem}, over the character', xv) : t('action {action}, element {elem}, under the character', xv));
    }
    dl.append(el('div', { class: 'gap' }));
    const v = f.values || {};
    const val = (x) => (!x || x.value === null || x.value === undefined ? '—' : (x.how === 'computed' ? '≈' : '') + x.value);
    if (v.damage || v.chip) row(t('Damage'), v.chip ? t('{damage}, chip {chip}', { damage: val(v.damage), chip: val(v.chip) }) : val(v.damage));
    if (v.hitstun) row(t('Hitstun'), val(v.hitstun));
    if (v.blockstun) row(t('Blockstun'), val(v.blockstun));
    if (v.hitstop) row(t('Hitstop'), val(v.hitstop) + (v.hitstopP2 ? ' / ' + val(v.hitstopP2) : ''));
    if (f.guard) row(t('Blocked'), I18n.server(f.guard.text));
    row(t('Knockdown'), f.knockdown === true ? t('yes') : f.knockdown === false ? t('no') : t('depends on a formula'));
    host.append(el('div', { class: 'platerow pr' }, plate, dl));
  }

  // ONE EDIT, from the readout or the table: an existing value is replaced,
  // a missing parameter is added. The server checks everything; a "confirm"
  // answer (a dangerous parameter, an expression it cannot check) asks here.
  async function editValue(b, param, index, value, errBox, undo, confirmed) {
    errBox.textContent = '';
    const p = b.params.find((x) => x.name === param);
    const sha1 = fileSha(b.file);
    if (!sha1) { errBox.append(el('div', { class: 'fderr', text: 'This file has no checksum in the loaded view - reload the window.' })); undo(); return; }
    let route, body;
    if (p && p.values[index] && p.values[index].tier !== 'absent') {
      route = '/api/char-move-edit';
      body = { char, file: b.file, state: b.state, ordinal: b.ordinal, param, index, value, expect: p.raw, sha1, confirm: confirmed === true || undefined };
    } else if (!p) {
      // pausetime and damage come in pairs: an added hitstop sets both sides
      // to the value typed, an added chip keeps hit damage at the engine's 0.
      const values = param === 'pausetime' ? [value, value] : [value];
      route = '/api/char-move-add';
      body = { char, file: b.file, state: b.state, ordinal: b.ordinal, param, values, sha1, confirm: confirmed === true || undefined };
    } else {
      errBox.append(el('div', { class: 'fderr', text: t('{param} is written without this value; set it in the table below.', { param }) })); undo(); return;
    }
    try {
      const r = await postJson(route, body);
      say(t('{param} in state {state} → {value}', { param: param + (index ? '[' + (index + 1) + ']' : ''), state: b.state, value: r.written !== undefined ? r.written : value })
        + (r.backupCreated ? ' · ' + t('original kept as {file}', { file: r.backup }) : ''), 'ok');
      await load(true);
    } catch (e) {
      if (e.code === 'confirm') {
        const box = el('div', { class: 'confirm' }, el('div', { text: e.message }));
        const yes = el('button', { class: 'warn', text: 'Write it anyway' });
        const no = el('button', { text: 'Cancel' });
        yes.onclick = () => { errBox.textContent = ''; editValue(b, param, index, value, errBox, undo, true); };
        no.onclick = () => { errBox.textContent = ''; undo(); };
        box.append(el('div', { class: 'btns' }, yes, no));
        errBox.append(box);
        return;
      }
      if (e.code === 'stale') { say(e.message, 'err'); await load(true); return; }
      errBox.append(el('div', { class: 'fderr', text: e.message }));
      undo();
    }
  }

    // (LifeAdd, TargetLifeAdd...), od.via the parameter that sends there.
    if (s.outsideDamage && s.outsideDamage.length) {
      const ul = el('ul');
      for (const od of s.outsideDamage) {
        const ov = { type: od.type, state: od.state, via: od.via === 'same state' ? t('same state') : od.via, value: od.value !== null ? el('code', { text: od.value }) : null };
        ul.append(el('li', {}, el('code', { text: od.file + ':' + od.line }), ' ', ...(od.value !== null ? tn(t('{type} in state {state} ({via}) value = {value}', nodes(ov))) : tn(t('{type} in state {state} ({via})', nodes(ov)))),
          od.note ? ' - ' + I18n.server(od.note) : ''));
      }
      host.append(el('div', { class: 'sub' }, el('div', { class: 'h', text: 'Damage outside the HitDef' }), ul));
    }
  }

  // ---- Edit on: the block, its triggers and its values ---------------------

  function renderBlock(host, s, b) {
    host.append(el('h2', { class: 'bk-sh' }, 'Values', el('span', { class: 'k', lang: 'ja', text: '数値' }), el('span', { class: 'aside', text: t('{type}, {n} parameters', { type: b.type, n: b.params.length }) })));
    const bsel = el('div', { class: 'bsel' });
    const prev = el('button', { text: '‹', title: 'Previous block', 'aria-label': 'Previous block', disabled: sel.ordinal === 0 });
    const next = el('button', { text: '›', title: 'Next block', 'aria-label': 'Next block', disabled: sel.ordinal >= s.blocks.length - 1 });
    const pick = el('select', { 'aria-label': 'Attack block' });
    // x.type: the controller; x.label: its [State N, label] as written
    s.blocks.forEach((x, i) => {
      const ov = { n: i + 1, of: s.blocks.length, type: x.type, line: x.line, label: x.label };
      pick.append(el('option', { value: i, text: x.label ? t('block {n} of {of} · {type} · line {line} · {label}', ov) : t('block {n} of {of} · {type} · line {line}', ov) }));
    });
    pick.value = String(sel.ordinal);
    pick.onchange = () => { sel.ordinal = Number(pick.value); renderSelection(); };
    prev.onclick = () => { sel.ordinal--; renderSelection(); };
    next.onclick = () => { sel.ordinal++; renderSelection(); };
    bsel.append(prev, pick, next);
    host.append(bsel);

    // the trigger lines as written (code)
    const tr = el('div', { class: 'trig', translate: 'no' });
    for (const tg of b.triggers) tr.append(el('div', {}, el('span', { class: 'ln', text: tg.line }), tg.text));
    if (!b.triggers.length) tr.append(el('div', { text: t('(no triggers)') }));
    host.append(tr);
    host.append(el('div', { class: 'tierkey' },
      el('span', {}, el('span', { class: 'bk-tier plain', text: '18' }), ' a plain number, written as typed'),
      el('span', {}, el('span', { class: 'bk-tier tmpl', text: '69' }), ' the CvS damage template: the base, written in both places'),
      el('span', {}, el('span', { class: 'bk-tier verb', text: 'S, NA' }), ' red: a formula is edited as text; anything else is never written, and the badge says why')));
    if (!b.editable) host.append(el('div', { class: 'notes', text: 'This block is not editable.' }));
    for (const n of (b.notes || [])) host.append(el('div', { class: 'notes', text: n }));
    for (const d of (b.duplicates || [])) host.append(el('div', { class: 'notes', text: t('{param} is written twice (lines {first} and {line}): {why}', { param: d.name, first: d.firstLine, line: d.line, why: d.note }) }));

    const table = el('table', { class: 'params' });
    // Grouped the way a frame data page reads, each group in the order the
    // file writes it.
    const order = GROUPS.map(([g]) => g).concat(t('Other'));
    const byGroup = new Map(order.map((g) => [g, []]));
    for (const p of b.params) byGroup.get(groupOf(p.name)).push(p);
    for (const [g, ps] of byGroup) {
      if (!ps.length) continue;
      table.append(el('tr', { class: 'grp' }, el('td', { colspan: '2', text: g })));
      for (const p of ps) table.append(paramRow(s, b, p));
    }
    // DERIVED VALUES (§4): what the engine computes for the parameters this
    // block leaves out. Read only - writing one pins it.
    if (b.derived && b.derived.applies) {
      for (const [name, vals] of Object.entries(b.derived.values || {})) {
        if (b.params.some((p) => p.name === name)) continue;
        const dl = fgcOf(name);
        table.append(el('tr', { class: 'derived' },
          el('td', { class: 'nm' }, dl ? el('span', { class: 'fgc', text: dl[0] }) : null, el('span', { class: 'mg', translate: 'no', text: name }), el('span', { class: 'ln', text: 'derived, not written' })),
          el('td', {}, el('div', { class: 'vals' }, vals.map((v) => el('span', { class: 'dv', title: v.formula, text: '(' + v.value + ')' }))),
            el('div', { class: 'notes' }, vals.map((v) => el('div', { text: v.formula }))))));
      }
      for (const u of (b.derived.unknown || [])) {
        table.append(el('tr', { class: 'derived' }, el('td', { class: 'nm', translate: 'no', text: u.name }), el('td', {}, el('div', { class: 'notes', text: t('not known statically: {why}', { why: u.why }) }))));
      }
      if (b.derived.note) host.append(el('div', { class: 'notes', text: b.derived.note }));
    } else if (b.derived && b.derived.reason) {
      host.append(el('div', { class: 'notes', text: t('Derived values: {reason}', { reason: b.derived.reason }) }));
    }
    host.append(table);
  }

  const fileSha = (file) => { const f = model.files.find((x) => x.rel === file); return f ? f.sha1 : undefined; };

  function paramRow(s, b, p) {
    const lab = fgcOf(p.name);
    const nm = el('td', { class: 'nm' },
      lab ? el('span', { class: 'fgc', text: lab[0] }) : null,
      el('span', { class: 'mg', translate: 'no' }, p.name, p.risk && p.risk.level !== 'safe' ? el('span', { class: 'risk ' + p.risk.level, text: RISK[p.risk.level] || p.risk.level }) : null),
      lab && lab[1] ? el('span', { class: 'ex', text: lab[1] }) : null,
      el('span', { class: 'ln', text: t('line {line}', { line: p.line }) }));
    const vals = el('div', { class: 'vals' });
    const extra = el('div');
    for (const v of p.values) vals.append(valueCell(s, b, p, v, extra));
    const td = el('td', {}, vals);
    const notes = el('div', { class: 'notes' });
    if (p.note) notes.append(el('div', { text: p.note }));
    if (p.risk && p.risk.level !== 'safe') for (const n of p.risk.notes) notes.append(el('div', { text: n }));
    if (!p.known) notes.append(el('div', { text: t('not a parameter the engine reads for {type}', { type: b.type }) }));
    td.append(notes, extra);
    return el('tr', {}, nm, td);
  }
  // the server's risk levels, printed on the parameter's badge
  const RISK = { careful: t('careful'), dangerous: t('dangerous') };

  function valueCell(s, b, p, v, extra) {
    const wrap = el('span', { class: 'v ' + v.tier });
    if (v.tier === 'absent') { wrap.append(el('span', { class: 'absent', text: '—', title: t('component {n} not written', { n: v.index + 1 }) })); return wrap; }
    // A FORMULA is edited as text: what it reads as a fresh first hit is shown
    // beside it. The server checks it; one it cannot read asks first.
    if (v.tier === 'red' && v.expr && b.editable) return formulaCell(s, b, p, v, extra);
    if (v.tier === 'red' || !b.editable) {
      wrap.append(el('span', { class: 'red', translate: 'no', text: v.raw }));
      if (v.tier === 'red') {
        const RED_LABEL = { string: t('text'), prefix: t('table prefix'), letter: t('letter'), unknown: t('ignored'), extra: t('extra value'), expression: t('computed at runtime') };
        wrap.append(el('span', { class: 'rt', text: RED_LABEL[v.red] || (v.kind === 'string' ? t('text') : t('read only')), title: v.note || '' }));
      }
      return wrap;
    }
    // Green: the literal itself. Amber: the base literal of the CvS template,
    // written in both places it appears; the full expression is shown under
    // it. A text field rather than type=number: a number input reads `-.8`
    // (the author's own style, kept on write) back as empty.
    const shown = v.tier === 'amber' ? v.base : v.raw;
    // v.kind: the value's type as the engine reads it (int, float...), printed as is
    const input = el('input', { type: 'text', inputmode: 'decimal', spellcheck: 'false', value: shown, title: t('{param} component {n} ({kind})', { param: p.name, n: v.index + 1, kind: v.kind }) });
    let sent = shown;
    const commit = async (confirmed) => {
      const val = input.value.trim();
      if (val === sent && !confirmed) return;
      extra.textContent = '';
      // A plain number, or a formula typed in its place - the server decides.
      if (!val) { input.value = shown; return; }
      // The server refuses an edit without the file's sha1 as read: the
      // offsets are only valid for exactly those bytes.
      if (!fileSha(b.file)) {
        extra.append(el('div', { class: 'rowerr', text: 'This file has no checksum in the loaded view - reload the window.' }));
        input.value = shown; return;
      }
      input.classList.add('busy');
      const prevSent = sent;
      sent = val;
      try {
        const r = await postJson('/api/char-move-edit', {
          char, file: b.file, state: b.state, ordinal: b.ordinal, param: p.name, index: v.index,
          value: val, expect: p.raw, sha1: fileSha(b.file), confirm: confirmed === true || undefined,
        });
        say(t('{param} in state {state}: {before} → {after}', { param: p.name + (p.values.length > 1 ? '[' + (v.index + 1) + ']' : ''), state: b.state, before: p.raw, after: r.raw })
          + (r.backupCreated ? ' · ' + t('original kept as {file}', { file: r.backup }) : ''), 'ok');
        await load(true);
      } catch (e) {
        input.classList.remove('busy');
        sent = prevSent;
        if (e.code === 'confirm') {
          const box = el('div', { class: 'confirm' }, el('div', { text: e.message }));
          const yes = el('button', { class: 'warn', text: t('Write {value} anyway', { value: val }) });
          const no = el('button', { text: 'Cancel' });
          yes.onclick = () => { extra.textContent = ''; commit(true); };
          no.onclick = () => { extra.textContent = ''; input.value = shown; sent = shown; };
          box.append(el('div', { class: 'btns' }, yes, no));
          extra.append(box);
          return;
        }
        if (e.code === 'stale') { say(e.message, 'err'); await load(true); return; }
        extra.append(el('div', { class: 'rowerr', text: e.message }));
        input.value = shown; sent = shown;
      }
    };
    input.onkeydown = (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); commit(false); }
      else if (ev.key === 'Escape') { input.value = shown; input.blur(); }
    };
    input.onblur = () => commit(false);
    wrap.append(input);
    if (v.tier === 'amber') wrap.append(el('div', { class: 'expr', translate: 'no', text: v.raw, title: t('the base literal is written in both places it appears') }));
    return wrap;
  }

  function formulaCell(s, b, p, v, extra) {
    const wrap = el('span', { class: 'v xp' });
    const input = el('input', { type: 'text', spellcheck: 'false', value: v.raw, title: t('{param} component {n}: a formula, computed at runtime', { param: p.name, n: v.index + 1 }) });
    const shown = v.raw;
    input.onkeydown = (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); } else if (ev.key === 'Escape') { input.value = shown; input.blur(); } };
    input.onblur = () => {
      const val = input.value.trim();
      if (!val || val === shown) { input.value = shown; return; }
      editValue(b, p.name, v.index, val, extra, () => { input.value = shown; });
    };
    wrap.append(input);
    if (v.reads !== undefined) wrap.append(el('span', { class: 'reads', text: t('reads {value}', { value: v.reads }), title: t('as a fresh first hit: {vars}', { vars: v.assumed && v.assumed.length ? v.assumed.map((a) => a + ' = ' + (/^(sys)?fvar/.test(a) ? 1 : 0)).join(', ') : t('no variables') }) }));
    return wrap;
  }

  // ---- THE COMMAND LIST: what Ikemen's pause menu would print --------------
  //
  // GET /api/movelist (the Command List writer) names each move, says where
  // the name came from and gives the exact file the export would write. With
  // Edit on, a name can be changed or a move hidden from the game's list; the
  // choice is saved per bundle (POST /api/movelist) and never touches the
  // character's own folder. Without the route, the section says so.
  // "state 1000", or a line that stands for a move's strengths: "states 1000, 1010, 1020 (one line for 3 strengths)"
  const statesOf = (r) => (Array.isArray(r.merged) && r.merged.length > 1 ? t('states {states} (one line for {n} strengths)', { states: r.merged.map((m) => m.state).join(', '), n: r.merged.length }) : t('state {state}', { state: r.state }));
  const FROM_SHORT = { owner: t('your name'), label: t('[State -1] label'), command: t('command name'), comment: t('comment'), readme: t('readme') };
  function renderCmdList() {
    const host = $('cmdl');
    if (!host) return;
    host.textContent = '';
    host.append(el('h2', { class: 'bk-sh' }, 'The game\'s Command List', el('span', { class: 'k', lang: 'ja', text: 'コマンドリスト' }), el('span', { class: 'aside', text: 'Ikemen\'s pause menu' })));
    if (!cl) {
      host.append(el('p', {}, clWhy && clWhy.startsWith('error:')
        ? t('The Command List could not be read: {error}', { error: clWhy.slice(6) })
        : 'Not available in this build. This Studio has no Command List writer: move names are not read here, and an export writes no Command List for this character.'));
      return;
    }
    if (cl.own) {
      const ov = { name: el('b', { translate: 'no', text: name }), file: cl.own.file ? el('code', { text: cl.own.file }) : null };
      host.append(el('p', {}, ov.file ? tn(t('{name} ships its own Command List ({file}). The export leaves it as it is; nothing is generated or written for this character.', nodes(ov)))
        : tn(t('{name} ships its own Command List. The export leaves it as it is; nothing is generated or written for this character.', nodes(ov)))));
    } else {
      host.append(el('p', {}, cl.enabled
        ? 'The export writes this list into the exported copy of the character and names it in that copy\'s .def. The character\'s own folder is never written.'
        : 'Off: the export writes no Command List. The list below is what it would write.'));
      // The switch (POST { char, enabled }): per character, kept for this build.
      if (editing) {
        const sw = el('input', { type: 'checkbox', id: 'clOn' });
        sw.checked = !!cl.enabled;
        sw.onchange = async () => {
          sw.disabled = true;
          try {
            const j = await postJson('/api/movelist', { char, enabled: sw.checked });
            if (j && Array.isArray(j.rows)) cl = j;
            say(sw.checked ? 'The export writes this Command List.' : 'The export writes no Command List for this character.', 'ok');
          } catch (e) { say(t('Not changed: {error}', { error: e.message }), 'err'); sw.checked = !sw.checked; sw.disabled = false; return; }
          renderCmdList();
        };
        host.append(el('p', {}, el('label', { class: 'bk-chk' }, sw, el('i'), el('span', { text: 'Write this list into exported copies' }))));
      }
    }
    const rows = (cl.rows || []).slice();
    // What the reader flags: no name that reads like one, and a name the stock
    // pause menu's font cannot draw (it prints blank there).
    const flags = (r) => [
      r.weak ? el('span', { class: 'bk-flag', title: 'No label, command name or comment that reads like a name', text: 'No name' }) : null,
      r.drawable === false ? el('span', { class: 'bk-flag warn', title: 'The pause menu draws this name blank: a build ships a Japanese font (DotGothic16) for kana and kanji, but it has no Hangul or simplified Chinese. Rename it to show it.', text: 'Won\'t print' }) : null,
    ].filter(Boolean);
    if (!rows.length) { host.append(el('p', { text: 'No move to list: the files name no special or super.' })); return; }
    const tbl = el('table', { class: 'bk-tbl flat' });
    tbl.append(el('thead', {}, el('tr', {}, el('th', { text: 'In the pause menu' }), el('th', { text: editing && !cl.own ? 'Name' : 'Name, and where it came from' }), editing && !cl.own ? el('th', { text: 'Hide' }) : null)));
    const body = el('tbody');
    const edits = new Map();
    for (const r of rows) {
      const tr = el('tr', { class: r.hidden ? 'off' : '' });
      tr.append(el('td', { class: 'tok' }, r.glyphs ? glyph(r.glyphs, false, true) : null, ' ', el('span', { translate: 'no', text: r.name || '' })));
      if (editing && !cl.own) {
        const inp = el('input', { class: 'bk-inp sm', type: 'text', spellcheck: 'false', value: r.name || '', 'aria-label': t('Name of state {state}', { state: r.state }), maxlength: '60' });
        const hid = el('input', { type: 'checkbox', 'aria-label': t('Hide state {state} from the game\'s list', { state: r.state }) });
        hid.checked = !!r.hidden;
        const note = () => {
          const ch = {};
          if (inp.value.trim() !== (r.name || '')) ch.name = inp.value.trim();
          if (hid.checked !== !!r.hidden) ch.hidden = hid.checked;
          if (Object.keys(ch).length) edits.set(r.state, Object.assign({ state: r.state }, ch)); else edits.delete(r.state);
          save.disabled = !edits.size;
        };
        inp.oninput = note; hid.onchange = note;
        tr.append(el('td', {}, inp, el('div', { class: 'src' }, t('from {source}, {states}', { source: FROM_SHORT[r.nameFrom] || r.nameFrom || '?', states: statesOf(r) }), flags(r).length ? ' ' : null, flags(r))),
          el('td', {}, el('label', { class: 'bk-chk' }, hid, el('i'), el('span', { class: 'bk-sr', text: 'Hide' }))));
      } else {
        const raw = r.raw || {};
        // where its name came from, its state(s), its label and whether it is hidden: phrases joined with ", " and "; "
        const where = [(FROM_SHORT[r.nameFrom] || r.nameFrom || '?') + ', ' + statesOf(r)];
        if (raw.label && r.nameFrom !== 'label') where.push(t('label "{label}"', { label: raw.label }));
        if (r.hidden) where.push(t('hidden'));
        tr.append(el('td', { class: 'src' }, where.join('; '), flags(r).length ? ' ' : null, flags(r)));
      }
      body.append(tr);
    }
    tbl.append(body);
    host.append(tbl);
    let save = null;
    if (editing && !cl.own) {
      save = el('button', { class: 'bk-btn sm primary', text: 'Save names', disabled: true });
      save.onclick = async () => {
        save.disabled = true;
        try {
          const j = await postJson('/api/movelist', { char, rows: [...edits.values()] });
          if (j && Array.isArray(j.rows)) cl = j;
          say('Command List names saved for this build.', 'ok');
        } catch (e) { say(t('The names were not saved: {error}', { error: e.message }), 'err'); save.disabled = false; return; }
        renderStates(); renderSelection(); renderCmdList();
      };
      host.append(el('div', { class: 'acts' }, save, el('span', { class: 'bk-caption', text: 'An empty name goes back to the one read from the files. Saved for this build only; the character\'s files are not written.' })));
    }
    if (cl.own && cl.own.text) host.append(el('pre', { class: 'ikfile', 'aria-label': 'The Command List this character ships', text: cl.own.text }));
    else if (cl.text) host.append(el('pre', { class: 'ikfile', 'aria-label': 'The file the export writes', text: cl.text }));
    drawGlyphs(host);
    paintButtons(host, tbl);
  }

  // THE BUILD'S BUTTON STYLE (Settings > Controls, GET /api/button-style): in a
  // style other than the default, the "In the pause menu" column shows the
  // pictures the game draws for x y z a b c d w, any punch (p), any kick (k)
  // and Start (s) in place of the booklet's chips, so the list reads as it
  // will in the game (any punch in a pad style is one picture of its three
  // buttons, wider than tall: its width follows). Asked once per window.
  let BTN_PICS;
  async function buttonPics() {
    if (BTN_PICS !== undefined) return BTN_PICS;
    try {
      const j = await getJson('/api/button-style');
      const st = j && j.styles && j.styles.find((s) => s.id === j.style);
      BTN_PICS = st && j.style !== j.def ? { label: st.label, by: Object.fromEntries(st.buttons.filter((b) => b.src).map((b) => [b.button, b])) } : null;
    } catch (e) { BTN_PICS = null; }
    return BTN_PICS;
  }
  async function paintButtons(host, tbl) {
    const P = await buttonPics();
    if (!P || !tbl.isConnected) return;
    for (const b of tbl.querySelectorAll('td.tok .bk-cmd .b[data-btn]')) {
      const k = b.dataset.btn, pic = P.by[k];
      if (!pic) continue;
      const name = pic.word || k;
      const img = el('img', { class: 'bpic', src: pic.src, width: String(Math.round(19 * (pic.w || 64) / (pic.h || 64))), height: '19', alt: name + ' (' + pic.label + ')', title: t('{button}: {picture} ({style} style)', { button: name, picture: pic.label, style: P.label }) });
      b.replaceWith(img);
    }
    tbl.before(el('p', { class: 'bpicnote' }, ...tn(t('Buttons as this build draws them: the {style} style (Settings › Controls).', nodes({ style: el('b', { translate: 'no', text: P.label }) })))));
  }

  if (!char) {
    $('states').textContent = '';
    $('states').append(el('div', { class: 'none', text: 'No character was passed to this window.' }));
  } else {
    load(false);
  }
</script>
</body>
</html>
