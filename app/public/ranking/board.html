    // ---- the board's own choreography (classic) --------------------------
    // 1. the bottom five slide in from the right, one after another
    // 2. the board climbs, the top three sliding in the same way as they
    //    scroll into view
    // 3. 1st place expands in place: its detail grows downward, pushing 2nd
    //    and 3rd to the bottom of the frame, with the win pose playing
    // Returns how long the scene wants to hold.
    function runBoard() {
        var top = ctx.players.slice(0, TOP_N);

        listEl.innerHTML = '';
        listEl.style.transition = 'none';
        var rows = top.map(function (p, i) {
            var r = rowNode(p, i);
            listEl.appendChild(r);
            // The detail panel lives right after 1st place, so opening it
            // pushes everything below it down the board.
            if (i === 0) {
                detailEl = detailNode(p);
                listEl.appendChild(detailEl);
            }
            return r;
        });
        if (!rows.length) return 2000;
        rows.forEach(function (r) { scrollIfLong(r.querySelector('.pname')); });

        var overflow = Math.max(0, top.length - VISIBLE_ROWS);
        var startY = -overflow * ROW_H;
        listEl.style.transform = 'translateY(' + startY + 'px)';
        // Force the starting offset to apply before any transition is armed.
        void listEl.offsetHeight;

        var firstVisible = overflow;      // topmost row visible at the start
        var STAGGER = 300;
        var t = 350;

        // 1. the bottom five, last place first so the eye reads up the table
        for (var i = rows.length - 1; i >= firstVisible; i--) {
            (function (row, delay) { later(function () { row.classList.add('in'); }, delay); })(rows[i], t);
            t += STAGGER;
        }
        var scrollStart = t + 450;

        // 2. the climb: CONSTANT SPEED, linear timing. Duration follows the
        // distance rather than the other way round, so the board never eases
        // in or out to land the top three on cue - it just travels at
        // SCROLL_SPEED until it reaches the top.
        var SCROLL_SPEED = 78;                       // design units per second
        var distance = Math.abs(startY);
        var SCROLL = Math.max(600, Math.round(distance / SCROLL_SPEED * 1000));
        later(function () {
            listEl.style.transition = 'transform ' + SCROLL + 'ms linear';
            listEl.style.transform = 'translateY(0px)';
        }, scrollStart);

        // Each of the top three slides in as it actually crosses into view.
        // Row j sits at j*ROW_H, and the list travels linearly from startY to
        // 0, so it enters when translateY >= -j*ROW_H, i.e. at fraction
        // 1 - j/overflow of the climb. A small lead starts the slide just
        // before the row would otherwise pop into the frame.
        var LEAD = 0.07;
        for (var j = firstVisible - 1; j >= 0; j--) {
            var frac = Math.max(0, 1 - (j / Math.max(1, overflow)) - LEAD);
            (function (row, delay) { later(function () { row.classList.add('in'); }, delay); })(
                rows[j], scrollStart + SCROLL * frac);
        }
        // A beat to read the finished top 8 before 1st place opens up.
        var settled = scrollStart + SCROLL + 1800;

        if (STILL) return settled + 100000;
        // Never spotlight a vacant slot (only possible if the whole board is
        // empty, which the empty-state message already covers - belt and
        // braces).
        if (top[0] && top[0].vacant) return settled + 3000;

        // 3. 1st place expands in place. Sized so 1st + the panel + 2nd + 3rd
        // exactly fill the frame (62 + 168 + 62 + 62 = 354 of 356), which
        // pushes 4th and below out of view instead of leaving one peeking.
        var EXPAND_H = 168;
        later(function () {
            rows[0].classList.add('expanded');
            detailEl.style.height = EXPAND_H + 'px';
            detailEl.classList.add('open');
            if (ctx.champArt && ctx.champArt.win) {
                playWin(ctx.champArt.win, document.getElementById('detailPose'), 200, 186);
            }
        }, settled);

        var HOLD = 6400;
        // Collapse before handing over so the next pass starts clean.
        later(function () {
            stopAnim();
            rows[0].classList.remove('expanded');
            detailEl.classList.remove('open');
            detailEl.style.height = '0px';
        }, settled + HOLD);

        return settled + HOLD + 700;
    }

    // ---- the other formats -------------------------------------------------
    // Each builder fills #flow from ctx.players and returns how long it holds.
    // Their own steps run on flowTimers, so a resize can draw the format again
    // (new sizes, new pose scales) without disturbing the rotation.
    var flowTimers = [];
    var root = flow;               // the composition the builders fill (runFlow)
    function flowLater(fn, ms) { flowTimers.push(setTimeout(fn, ms)); }
    function clearFlow() { flowTimers.forEach(clearTimeout); flowTimers = []; stopPoses(); flow.innerHTML = ''; }

    function el(tag, cls, text) { var d = document.createElement(tag); if (cls) d.className = cls; if (text != null) d.textContent = text; return d; }
    function flowTitle() {
        var t = el('div', 'title'), pl = el('span', 'plate'), tx = accentText(el('span', 'txt'), TEXT.title);
        pl.appendChild(tx); t.appendChild(pl); return t;
    }
    // A real player's name, for the ticker (it skips the vacant slots; every
    // other name goes in with nameInto).
    function nameOf(p) { return (p.name || '???').toUpperCase(); }
    function placeEl(i, p) {
        var d = el('div', 'pl' + (i < 3 && !p.vacant ? ' m' + (i + 1) : ''));
        d.appendChild(document.createTextNode(String(i + 1)));
        d.appendChild(el('sup', null, SUFFIX[i] || 'th'));

    }
    function faceEl(p) {
        var a = !p.vacant && artFor(p.character), im = el('img');

        return im;
    }
    function badgeEl(p) { var b = el('span', 'badge'); if (!p.vacant) b.appendChild(rankIcon(tierLabel(p))); return b; }

    var FLOW = {
        // A character-select screen: the cursor walks the real players and
        // whoever it is on stands big beside the grid.
        select: function () {
            root.appendChild(flowTitle());
            var main = el('div', 'sel'), feat = el('div', 'feature'), room = el('div', 'room'), plate = el('div', 'nameplate'), grid = el('div', 'grid');
            feat.appendChild(room); feat.appendChild(plate); main.appendChild(feat); main.appendChild(grid); root.appendChild(main);
            var ps = ctx.players;
            var cells = ps.map(function (p, i) {
                var c = el('div', 'cell' + (p.vacant ? ' vac' : '')); c.style.setProperty('--tc', p.vacant ? 'transparent' : tierColor(p));
                c.appendChild(faceEl(p)); c.appendChild(placeEl(i, p));
                var cn = el('div', 'cn'); cn.appendChild(nameInto(el('span', 'cnn mqable'), p)); if (!p.vacant) cn.appendChild(el('i', 'mono', String(p.rating))); c.appendChild(cn);
                c.appendChild(el('div', 'tierbar'));

            });
            // `stay`: how long this stop is up before the cursor moves on.
            function show(i, stay) {
                var p = ps[i];
                cells.forEach(function (c, j) { c.classList.toggle('on', j === i); });
                stopPoses(); room.innerHTML = ''; plate.innerHTML = '';
                plate.appendChild(placeEl(i, p));
                plate.appendChild(nameInto(el('div', 'nm mqable'), p));
                plate.appendChild(el('div', 'rt mono', String(p.rating)));

                sub.appendChild(badgeEl(p)); sub.appendChild(el('span', 'tn', tierLabel(p)));

                // names: it gets its own check (it never scrolled before),

        // beside them.
        podium: function () {

            main.appendChild(st); main.appendChild(rest); root.appendChild(main);
            var rooms = [];
            [1, 0, 2].forEach(function (i) {
                var p = ctx.players[i] || { vacant: true };

                b.appendChild(placeEl(i, p)); b.appendChild(nameInto(el('div', 'nm mqable'), p));

            });

                r.appendChild(placeEl(j + 3, p)); r.appendChild(faceEl(p));
                var nm = el('div', 'nm'); nm.appendChild(nameInto(el('span', 'nmt mqable'), p)); if (!p.vacant) nm.appendChild(el('small', null, tierLabel(p))); r.appendChild(nm);

        // A TV overlay: the champion on a slanted card in the accent color,

            var main = el('div', 'bc'), ch = el('div', 'champ'), lad = el('div', 'ladder');
            main.appendChild(ch); main.appendChild(lad); root.appendChild(main);
            var p = ctx.players[0];
            ch.appendChild(el('div', 'card'));
            var room = el('div', 'room'); ch.appendChild(room);
            var info = el('div', 'info');
            info.appendChild(accentText(el('div', 'tag'), TEXT.champion));
            info.appendChild(nameInto(el('div', 'nm mqable'), p));
            var rt = el('div', 'rt mono', String(p.rating)); rt.appendChild(el('small', null, 'PTS')); info.appendChild(rt);
            var rec = el('div', 'rec');
            rec.appendChild(el('span', null, p.wins + ' W  ' + p.losses + ' L'));
            rec.appendChild(el('span', null, p.winRate + '%'));
            if (p.bestStreak > 1) rec.appendChild(el('span', null, 'BEST RUN ' + p.bestStreak));
            info.appendChild(rec);
            ch.appendChild(info);
            ctx.players.slice(1).forEach(function (q, j) {
                var b = el('div', 'lbar' + (q.vacant ? ' vac' : '')); b.style.setProperty('--tc', q.vacant ? 'var(--line)' : tierColor(q));

                if (q.streak >= 3) items.push(n + q.streak + ' STRAIGHT WINS');
                else if (q.placement > 0) items.push(n + q.placement + ' PLACEMENT ' + (q.placement === 1 ? 'GAME' : 'GAMES') + ' TO GO');
                else items.push(n + q.wins + ' W ' + q.losses + ' L AT ' + q.winRate + '%');
            });
            if (p.bestStreak > 1) items.push('BEST RUN <b>' + esc(nameOf(p)) + '</b> ' + p.bestStreak);
            if (p.peakRating && p.peakRating > p.rating) items.push('PEAK RATING <b>' + p.peakRating + '</b>');
            var tk = el('div', 'tk'); tk.innerHTML = items.join('<i></i>');
            var tick = el('div', 'ticker'); tick.appendChild(tk); root.appendChild(tick);
            poseIn(room, p);
            // The champion's name is shown whole wherever it can be: it ends a
            // unit short of the pose's room (a pose is never wider than that),
            // or with no pose at the card's own limit, and shrinks to fit
            // there, to half its size at most (still above the ladder's
            // names), before it scrolls. It used to run on under the pose and
            // end in an ellipsis.
            var nmEl = info.querySelector('.nm'), u = parseFloat(getComputedStyle(flow).getPropertyValue('--u')) || 0;
            fitName(nmEl, room.querySelector('.pose') ? room.getBoundingClientRect().left - nmEl.getBoundingClientRect().left - u : nmEl.clientWidth, 0.5);
            return 14000;
        }
    };

    // Each format's two compositions, [width, height] in --u: wide, and tall
    // (stacked) for a window that shows it bigger that way.
    var BOXES = {
        select:    { wide: [100, 52], tall: [48, 76] },
        podium:    { wide: [100, 52], tall: [48, 84] },
        hiscore:   { wide: [100, 52], tall: [48, 60] },
        broadcast: { wide: [100, 52], tall: [48, 90] }
    };
    function fitFlow() {
        var b = BOXES[FORMAT] || BOXES.podium;
        var vw = document.documentElement.clientWidth || innerWidth, vh = document.documentElement.clientHeight || innerHeight;
        var uw = Math.min(vw / b.wide[0], vh / b.wide[1]);
        var ut = Math.min(vw / b.tall[0], vh / b.tall[1]);
        // The wide one unless the stacked one is clearly bigger: a square-ish
        // window that could go either way keeps the format as designed.
        var tall = ut > uw * 1.08, box = tall ? b.tall : b.wide;
        flow.setAttribute('data-layout', tall ? 'tall' : 'wide');
        flow.style.setProperty('--u', ((tall ? ut : uw) * 0.98).toFixed(3) + 'px');
        flow.style.setProperty('--W', box[0]);
        flow.style.setProperty('--H', box[1]);
    }
    function runFlow() {
        clearFlow();
        fitFlow();
        root = el('div', 'comp');
        flow.appendChild(root);
        var hold = (FLOW[FORMAT] || FLOW.podium)();
        fitTitle(root.querySelector('.title'), 'title');
        // One argument only: forEach's index would arrive as scrollIfLong's
        // time limit (`within`) and give every name after the first a 0 s
        // scroll that never moves.
        Array.prototype.forEach.call(flow.querySelectorAll('.mqable'), function (n) { scrollIfLong(n); });
        return hold;
    }
    var resizeTimer = null;
    window.addEventListener('resize', function () {
        if (FORMAT === 'classic' || !flow.classList.contains('on')) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(runFlow, 200);
    });

    // ---- the attract rotation --------------------------------------------
    var seqPos = 0;
    function runSequence() {
        clearTimers();
        stopAnim();
        clearFlow();
        if (!SEQUENCE.length) return;
        var key = SEQUENCE[seqPos % SEQUENCE.length];
        seqPos++;
        showScene(key);
        var hold = SCENES[key].enter() || 5000;
        later(runSequence, hold);
    }

    function startShow(players) {
        ctx.players = players;
        ctx.champArt = players[0] ? artFor(players[0].character) : null;
        if (ctx.champArt && ctx.champArt.portrait) ghostImg.src = ART + ctx.champArt.portrait + ARTV;
        else ghostImg.removeAttribute('src');
        if (ctx.champArt && ctx.champArt.win) preload(ctx.champArt.win.frames);

        if (ONLY && SCENES[ONLY]) {
            clearTimers();
            clearFlow();
            showScene(ONLY);
            SCENES[ONLY].enter();
            return;
        }
        seqPos = 0;
        runSequence();
    }

    // Messages always show on the classic board, whatever the format: a line
    // and a smaller one under it, the host's words put up as text.
    function showMessage(title, sub) {
        clearTimers(); stopAnim(); clearFlow();
        var board = document.getElementById('scene-board');
        ALL_SCENES.forEach(function (s) { s.classList.toggle('on', s === board); });
        listEl.innerHTML = '';
        var m = document.getElementById('msg');
        if (!m) { m = document.createElement('div'); m.id = 'msg'; board.appendChild(m); }
        m.textContent = '';
        m.appendChild(accentText(document.createElement('span'), title));
        m.appendChild(document.createElement('br'));
        m.appendChild(accentText(document.createElement('small'), sub));
    }
    function hideMessage() { var m = document.getElementById('msg'); if (m) m.remove(); }

    // ---- boot ------------------------------------------------------------
    var DEMO_PLAYERS = [
        { place: 1, name: 'champion', rating: 1299, tier: 'GRANDMASTER', peakRating: 1310, main: 'kfm', wins: 110, losses: 17, games: 127, winRate: 86.6, streak: 6, bestStreak: 14, character: 'kfm' },
        { place: 2, name: 'rival',   rating: 1141, tier: 'DIAMOND',  main: 'ryu', wins: 88, losses: 47, games: 135, winRate: 65.2, streak: 2, bestStreak: 9, character: 'ryu' },
        { place: 3, name: 'mikel',   rating: 1088, tier: 'PLATINUM', main: '', wins: 40, losses: 30, games: 70, winRate: 57.1, streak: 1, bestStreak: 6, character: 'ken' },
        { place: 4, name: 'chun',    rating: 1012, tier: 'GOLD',     wins: 25, losses: 24, games: 49, winRate: 51, streak: -1, bestStreak: 4, character: 'chun-li' },
        { place: 5, name: 'combo',   rating: 988,  tier: 'GOLD',     wins: 18, losses: 20, games: 38, winRate: 47.4, streak: 1, bestStreak: 3, character: 'terry' },
        { place: 6, name: 'newbie',  rating: 950,  tier: 'SILVER',   wins: 9, losses: 14, games: 23, winRate: 39.1, streak: -2, bestStreak: 2, character: 'kula' },
        { place: 7, name: 'buttons', rating: 914,  tier: 'BRONZE',   wins: 5, losses: 16, games: 21, winRate: 23.8, streak: -3, bestStreak: 1, character: 'kfm' },
        { place: 8, name: 'rookie',  rating: 1000, tier: 'UNRANKED', placement: 2, wins: 1, losses: 0, games: 1, winRate: 100, streak: 1, bestStreak: 1, character: 'kfm' }
    ];
    // The sample players fight with this site's own characters when there is
    // art for them (those with a win pose first), so a preview shows the
    // build's roster rather than names it has no pictures for.
    function demoPlayers() {
        var keys = Object.keys(art.chars || {});
        var posed = keys.filter(function (k) { var w = art.chars[k].win; return w && w.frames && w.frames.length; });
        var order = posed.concat(keys.filter(function (k) { return posed.indexOf(k) < 0; }));
        return demoRanks(DEMO_PLAYERS.map(function (p, i) {
            var q = {}; for (var k in p) q[k] = p[k];
            if (order.length) { q.character = order[i % order.length]; q.main = p.main ? q.character : ''; }
            return q;
        }));
    }
    // With the host's own ranks (?ranks=, the Studio's preview) the sample's
    // ranked players spread over them, top to bottom, each rated inside its
    // rank, so the preview shows the badges the host made. With the original
    // seven the sample stays as it always was.
    var SAMPLE_RANKS = null;
    try { SAMPLE_RANKS = rankList(JSON.parse(QS.get('ranks') || 'null')); } catch (e) { SAMPLE_RANKS = null; }
    function demoRanks(players) {
        if (!SAMPLE_RANKS || JSON.stringify(SAMPLE_RANKS) === JSON.stringify(DEFAULT_RANKS)) return players;
        RANKS = SAMPLE_RANKS;
        var ranked = players.filter(function (p) { return !(p.placement > 0); });
        var n = RANKS.length, k = ranked.length;
        var at = ranked.map(function (p, i) { return k > 1 ? Math.round(i * (n - 1) / (k - 1)) : 0; });
        ranked.forEach(function (p, i) {
            var j = at[i];
            // Inside the rank: under the next one up (or 150 over the top
            // rank's floor), at most 150 down from there.
            var hi = j > 0 ? RANKS[j - 1].min - 1 : RANKS[j].min + 150;
            var lo = Math.max(RANKS[j].min, hi - 150);
            var same = at.filter(function (x) { return x === j; }).length;
            var q = at.slice(0, i).filter(function (x) { return x === j; }).length;
            var lift = p.peakRating ? p.peakRating - p.rating : 0;
            p.tier = RANKS[j].name;
            p.rating = Math.round(hi - (hi - lo) * (q + 0.5) / same);
            if (lift) p.peakRating = p.rating + lift;
        });
        return players;
    }

    function start() {
        // The chosen fonts are in by now: measure a host's titles with them.
        fit();
        if (!DEMO && !SERVER) {
            showMessage('NO LEADERBOARD ADDRESS SET', 'SET ONE IN THE STUDIO: SETTINGS > ONLINE > LEADERBOARD');
            return;
        }
        var artReq = fetch(ART + 'manifest.json', { cache: 'no-cache' })
            .then(function (r) { return r.ok ? r.json() : { chars: {} }; })
            .catch(function () { return { chars: {} }; });

        var boardReq = DEMO
            ? Promise.resolve({ demo: true })
            : fetch(SERVER + '/mugen/leaderboard?limit=' + TOP_N, { cache: 'no-store' })
                .then(function (r) { return r.json(); })
                .catch(function () { return null; });

        Promise.all([artReq, boardReq]).then(function (res) {
            art = res[0] || { chars: {} };
            ARTV = art.stamp ? '?v=' + art.stamp : '';
            var board = res[1];
            // The server's ranks, for the colors of any it named itself; an
            // older server sends none and has only the original seven.
            RANKS = (board && rankList(board.ranks)) || DEFAULT_RANKS;
            if (board && board.demo) board = { players: demoPlayers() };
            if (!board) {
                showMessage(TEXT.offlineTitle, TEXT.offlineSub);
                return;
            }
            if (!board.players || !board.players.length) {
                showMessage(TEXT.emptyTitle, TEXT.emptySub);
                return;
            }
            // Fill the remaining places with vacant slots so the board always
            // shows the full ladder (and the full reveal/scroll choreography)
            // even while the community is small. Real players entering simply
            // occupy them: the server only ever returns real entries, so the
            // padding shrinks by itself.
            var roster = board.players.slice(0, TOP_N);
            while (roster.length < TOP_N) {
                roster.push({ vacant: true, rating: 0, wins: 0, losses: 0, games: 0, winRate: 0, streak: 0 });
            }
            hideMessage();
            startShow(roster);
        });
    }

    // Wait for the chosen fonts, so the formats measure their boxes, poses
    // and names with the letters they will show. document.fonts.ready alone
    // is not that: a face no text has used yet has not started loading, so
    // it resolved at once and a name was measured in the system font, fitted,
    // and then ran out of its box in the real one with nothing to scroll it.
    // Each declared face (only the chosen ones are) is asked for by name, for
    // 3 s at most: a font that never comes leaves the system font, as before.
    function chosenFonts() {
        if (!document.fonts || !document.fonts.forEach) return Promise.resolve();
        var loads = [];
        document.fonts.forEach(function (f) { loads.push(f.load().catch(function () {})); });
        return Promise.race([Promise.all(loads), new Promise(function (r) { setTimeout(r, 3000); })]);
    }
    // A face still loading when the board starts (past those 3 s: a slow
    // connection) changes every name's width when it lands, so the board
    // measures again then: a format draws itself again, as on a resize, and
    // the classic rows check their names. Only those faces: one that loaded
    // in time never redraws anything.
    var lateFaces = null;
    function boot() {
        lateFaces = [];
        if (document.fonts && document.fonts.forEach) document.fonts.forEach(function (f) { if (f.status !== 'loaded') lateFaces.push(f); });
        start();
    }
    if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', function (e) {
        if (!lateFaces || !(e.fontfaces || []).some(function (f) { return lateFaces.indexOf(f) >= 0; })) return;
        fit();
        if (FORMAT !== 'classic') { if (flow.classList.contains('on')) { clearTimeout(resizeTimer); resizeTimer = setTimeout(runFlow, 200); } }
        else Array.prototype.forEach.call(document.querySelectorAll('#list .pname, #champInfo .cname'), rescroll);
    });
    chosenFonts().then(boot, boot);

    // Refresh only while someone is actually looking at the page.
    //
    // This used to be an unconditional setInterval, so ANY tab left open here -
    // a forgotten background tab, a phone in a pocket, a second monitor - kept
    // fetching every five minutes forever. That is not merely wasted requests:
    // the ranking server is configured to sleep when idle and is billed by
    // uptime, so one abandoned tab pins it awake around the clock and turns a
    // near-zero bill into a full one. The page was the single largest source of
    // load on a service that otherwise sees a few requests a day.
    //
    // Hidden: skip the fetch entirely - nobody is reading it. Visible again:
    // refresh straight away if what is on screen has gone stale, so coming back
    // to the tab never shows old standings while it waits for the next tick.
    var REFRESH_MS = 5 * 60 * 1000;
    var lastRefresh = Date.now();

    function refresh() {
        if (DEMO) return;
        lastRefresh = Date.now();
        start();
    }

    setInterval(function () {
        if (document.hidden) return;
        refresh();
    }, REFRESH_MS);

    document.addEventListener('visibilitychange', function () {
        if (document.hidden) return;
        if (Date.now() - lastRefresh >= REFRESH_MS) refresh();
    });
})();
</script>
</body>
</html>
