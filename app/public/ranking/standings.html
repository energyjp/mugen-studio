<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rankings</title>
<!--
    THE PLAIN STANDINGS PAGE: a leaderboard server's ranking as a table. The
    default of the two leaderboard pages the Studio offers (Settings > Online);
    the other is the Score Ranking board beside it. The Website export writes
    the chosen one next to the game as leaderboard.html and fills in RANKING.

    One fetch: <server>/mugen/leaderboard?limit=N. No libraries, system fonts.

    Its heading and messages are the Score Ranking board's words (the look's
    text: standingsTitle, emptyTitle/Sub, offlineTitle/Sub), its rank colors
    the board's (the look's ranks: a rank's c1 colors its chip). RANKING may
    carry both as text and ranks, the same shapes as the board's.

    URL flags (they override RANKING, for previews): ?server=<url>,
    ?title=<name>, ?look=<json> ({ text, ranks }), ?demo=1 (sample data).
-->
<script>window.RANKING = window.RANKING || {};</script>
<style>
  :root {
    --bg: #0b0912; --panel: #15111f; --panel2: #1d1829; --line: #2a2440; --line2: #3a3550;
    --ink: #dcdaea; --dim: #8b84a8; --mute: #5b5478;
    --accent: #ff8800; --score: #46e07a;
    --gold: #ffd447; --silver: #e6edf8; --bronze: #ef9f52;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 16px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { margin: 0; font: 700 26px/1.2 "Bahnschrift", "Segoe UI", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  .site { color: var(--accent); font: 600 13px/1 "Bahnschrift", "Segoe UI", sans-serif; letter-spacing: .14em; text-transform: uppercase; }
  .meta { margin-left: auto; color: var(--mute); font-size: 12.5px; }
  .meta button { margin-left: 8px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line2);
    font: inherit; padding: 2px 10px; cursor: pointer; }
  .meta button:hover { border-color: var(--accent); color: var(--accent); }
  .wrap { overflow-x: auto; border: 1px solid var(--line); background: var(--panel); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 12px; text-align: left; white-space: nowrap; }
  th { font: 600 11px/1 "Bahnschrift", "Segoe UI", sans-serif; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); background: var(--panel2); border-bottom: 1px solid var(--line); }
  td { border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  .num { text-align: right; }
  .place { width: 1%; font: 700 17px/1 "Bahnschrift", "Segoe UI", sans-serif; color: var(--dim); }
  tr.p1 .place { color: var(--gold); font-size: 21px; }
  tr.p2 .place { color: var(--silver); font-size: 19px; }
  tr.p3 .place { color: var(--bronze); font-size: 18px; }
  .name { font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .name small { display: block; font-weight: 400; color: var(--mute); font-size: 12px; }
  .tier { display: inline-block; padding: 2px 8px; font: 600 11px/1.4 "Bahnschrift", "Segoe UI", sans-serif;
    letter-spacing: .1em; border: 1px solid; }
  .rating { color: var(--score); font-weight: 700; font-size: 16px; }
  .note { color: var(--dim); text-align: center; padding: 40px 16px; line-height: 1.8; }
  .note > span { font: 600 15px/1.8 "Bahnschrift", "Segoe UI", sans-serif; letter-spacing: .08em; color: var(--ink); }
  .note small { font-size: 13px; letter-spacing: .04em; }
  .note b { color: var(--accent); font-weight: 600; }
  h1 b { color: var(--accent); font-weight: inherit; }
  @media (max-width: 560px) { .opt { display: none; } h1 { font-size: 22px; } .meta { margin-left: 0; width: 100%; } }
  /* The host's background (look.background): the picture or video over the
     whole window, a layer of the page's color at --bg-dim over it. The table
     keeps its own panel, so it stays readable whatever is behind it. */
  #bgmedia, #bgdim { position: fixed; inset: 0; pointer-events: none; }
  #bgmedia { z-index: -2; background-position: center; background-size: cover; background-repeat: no-repeat; }
  [data-bg="contain"] #bgmedia { background-size: contain; }
  [data-bg="tile"] #bgmedia { background-size: auto; background-repeat: repeat; }
  video#bgmedia { width: 100%; height: 100%; object-fit: cover; }
  [data-bg="contain"] video#bgmedia { object-fit: contain; }
  #bgdim { z-index: -1; background: var(--bg); opacity: var(--bg-dim, .4); }
</style>
</head>
<body>
<main>
  <header>
    <span class="site" id="site"></span>
    <h1 id="heading">Rankings</h1>
    <span class="meta"><span id="when"></span><button type="button" id="again">Refresh</button></span>
  </header>
  <div class="wrap"><div id="out" class="note">Loading&hellip;</div></div>
</main>
<script>
(function () {
  'use strict';
  var QS = new URLSearchParams(location.search);
  var CFG = window.RANKING || {};
  var SERVER = String(QS.get('server') || CFG.server || '').replace(/\/+$/, '');
  var TITLE = String(QS.get('title') || CFG.title || '');
  var DEMO = QS.has('demo');
  var LIMIT = 100;
  // The look's text and ranks (the board's): from ?look= (a preview) or RANKING.
  var LOOK = null;
  try { LOOK = JSON.parse(QS.get('look') || 'null'); } catch (e) { LOOK = null; }
  LOOK = LOOK && typeof LOOK === 'object' ? LOOK : {};
  function pick(k) { return LOOK[k] !== undefined ? LOOK[k] : CFG[k]; }

  // ---- the page's words -----------------------------------------------------
  // The Score Ranking board's (leaderboardlook.js TEXT_KEYS), the ones this
  // page shows: those the host set (trimmed, at most 80 characters, no angle
  // brackets), the board's English for the rest. A pair of '*' marks words in
  // the accent color; put up as text, never markup.
  var TEXT_KEYS = {
    standingsTitle: 'RANKINGS',
    emptyTitle: 'NO RANKED MATCHES YET', emptySub: 'PLAY A *RANKED MATCH* ONLINE TO PUT YOUR NAME HERE',
    offlineTitle: 'COULD NOT REACH THE RANKING SERVER', offlineSub: 'IT MAY BE WAKING UP - TRY AGAIN IN A MOMENT'
  };
  var given = pick('text');
  given = given && typeof given === 'object' && !Array.isArray(given) ? given : {};
  var TEXT = {}, OWN = {};
  Object.keys(TEXT_KEYS).forEach(function (key) {
    var s = typeof given[key] === 'string' ? given[key].replace(/[<>]/g, '').trim().slice(0, 80).trim() : '';
    TEXT[key] = s || TEXT_KEYS[key];
    if (s && s !== TEXT_KEYS[key]) OWN[key] = s;
  });
  // ---- the background ---------------------------------------------------------
  // The host's picture, animated picture or short video behind the page
  // (look.background), as on the board: a name checked to be one file in
  // leaderboard-bg/, under a layer of the page's own color (dim, in percent).
  // A video is muted and loops, and stays on its first frame for anyone who
  // asked for less motion.
  (function () {
    var b = pick('background');
    if (!b || typeof b !== 'object' || typeof b.file !== 'string' || !/^bg-[0-9a-f]{12}\.(png|jpg|webp|gif|mp4|webm)$/.test(b.file)) return;
    var fit = ['cover', 'contain', 'tile'].indexOf(b.fit) >= 0 ? b.fit : 'cover';
    var dim = typeof b.dim === 'string' && b.dim.trim() !== '' ? Number(b.dim) : b.dim;
    if (!(dim === Math.floor(dim) && dim >= 0 && dim <= 90)) dim = 40;
    var root = document.documentElement;
    root.setAttribute('data-bg', fit);
    root.style.setProperty('--bg-dim', String(dim / 100));
    var url = 'leaderboard-bg/' + b.file;
    var video = /\.(mp4|webm)$/.test(b.file);
    var media = document.createElement(video ? 'video' : 'div');
    media.id = 'bgmedia';
    if (video) {
      media.muted = true; media.loop = true; media.playsInline = true; media.preload = 'auto';
      media.setAttribute('muted', ''); media.setAttribute('playsinline', '');
      if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) media.autoplay = true;
      media.src = url;
    } else {
      media.style.backgroundImage = 'url("' + url + '")';
    }
    var shade = document.createElement('div');
    shade.id = 'bgdim';
    document.body.insertBefore(shade, document.body.firstChild);
    document.body.insertBefore(media, document.body.firstChild);
    if (video && media.autoplay) { var playing = media.play(); if (playing && playing.catch) playing.catch(function () {}); }
  })();

  function accentText(node, s) {
    node.textContent = '';
    var parts = String(s == null ? '' : s).split('*');
    // A '*' without its pair is just a star.
    if (parts.length % 2 === 0) parts.splice(-2, 2, parts[parts.length - 2] + '*' + parts[parts.length - 1]);
    parts.forEach(function (part, i) {
      // A run of spaces keeps its width, as on the board.
      part = part.replace(/ {2,}/g, function (m) { return m.replace(/ /g, '\u00a0'); });
      if (!part) return;
      if (i % 2) { var b = document.createElement('b'); b.textContent = part; node.appendChild(b); }
      else node.appendChild(document.createTextNode(part));
    });
    return node;
  }

  // ---- ranks ----------------------------------------------------------------
  // The same colors as the in-game YOUR RANK and the Score Ranking board: the
  // original seven ranks and UNRANKED their own, any other name the color its
  // place in the server's list gives it (spread down the seven, top red to
  // bottom bronze, as the board does), and over either the color the look
  // gives the rank (its shield's top, c1).
  var TIER = { UNRANKED: '#8b84a8', BRONZE: '#d08b4a', SILVER: '#dfe6f0', GOLD: '#ffe07a', PLATINUM: '#9df3e6',
    DIAMOND: '#b3d4ff', MASTER: '#e0b0ff', GRANDMASTER: '#ffb3b3' };
  var LADDER = ['GRANDMASTER', 'MASTER', 'DIAMOND', 'PLATINUM', 'GOLD', 'SILVER', 'BRONZE'];
  var RANKS = [];                  // the reply's list, high to low (load)
  var RANK_LOOK = {};
  (function () {
    var rk = pick('ranks');
    rk = rk && typeof rk === 'object' && !Array.isArray(rk) ? rk : {};
    // As the board reads them: a name spelled another way is the same rank,
    // the first one wins.
    Object.keys(rk).forEach(function (key) {
      var name = key.trim().toUpperCase(), o = rk[key];
      if (!/^[A-Z0-9 ._-]{1,16}$/.test(name) || has(RANK_LOOK, name) || !o || typeof o !== 'object') return;
      if (typeof o.c1 === 'string' && /^#[0-9a-f]{6}$/i.test(o.c1)) RANK_LOOK[name] = o.c1.toLowerCase();
    });
  })();
  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  // The server's list, or none when it sends none (an older server, which
  // has only the original seven) or something else.
  function rankList(v) {
    if (!Array.isArray(v) || !v.length || v.length > 12) return [];
    var out = [];
    for (var i = 0; i < v.length; i++) {
      var r = v[i] || {};
      if (typeof r.name !== 'string' || !/^[A-Z0-9 ._-]{1,16}$/.test(r.name) || typeof r.min !== 'number' || !isFinite(r.min)) return [];
      out.push({ name: r.name, min: r.min });
    }
    return out.sort(function (a, b) { return b.min - a.min; });
  }
  function mixHex(a, b, t) {
    var x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16), out = 0;
    [16, 8, 0].forEach(function (s) {
      var u = (x >> s) & 255, v = (y >> s) & 255;
      out |= Math.round(u + (v - u) * t) << s;
    });
    return '#' + ('00000' + out.toString(16)).slice(-6);
  }
  function tierColor(name) {
    if (has(RANK_LOOK, name)) return RANK_LOOK[name];
    if (has(TIER, name)) return TIER[name];
    for (var i = 0; i < RANKS.length; i++) {
      if (RANKS[i].name !== name) continue;
      var n = RANKS.length, f = n > 1 ? i * (LADDER.length - 1) / (n - 1) : 0, lo = Math.floor(f);
      return mixHex(TIER[LADDER[lo]], TIER[LADDER[Math.min(lo + 1, LADDER.length - 1)]], f - lo);
    }
    return TIER.UNRANKED;
  }

  // ---- the table ------------------------------------------------------------
  document.getElementById('site').textContent = TITLE;
  accentText(document.getElementById('heading'), TEXT.standingsTitle);
  document.title = (TITLE ? TITLE + ' - ' : '') + (OWN.standingsTitle ? OWN.standingsTitle.replace(/\*/g, '') : 'Rankings');
  var SAMPLE = [
    { name: 'champion', rating: 1299, tier: 'GRANDMASTER', wins: 110, losses: 17, winRate: 86.6, streak: 6, main: 'kfm' },
    { name: 'rival', rating: 1141, tier: 'DIAMOND', wins: 88, losses: 47, winRate: 65.2, streak: 2, main: 'ryu' },
    { name: 'mikel', rating: 1088, tier: 'PLATINUM', wins: 40, losses: 30, winRate: 57.1, streak: 1, character: 'ken' },
    { name: 'chun', rating: 1012, tier: 'GOLD', wins: 25, losses: 24, winRate: 51, streak: -1, character: 'chun-li' },
    { name: 'combo', rating: 988, tier: 'GOLD', wins: 18, losses: 20, winRate: 47.4, streak: 1, character: 'terry' },
    { name: 'newbie', rating: 950, tier: 'SILVER', wins: 9, losses: 14, winRate: 39.1, streak: -2, character: 'kula' },
    { name: 'rookie', rating: 1000, tier: 'UNRANKED', placement: 2, wins: 1, losses: 0, winRate: 100, streak: 1, character: 'kfm' }
  ];
  var out = document.getElementById('out');

  // A message in place of the table: a line and a smaller one under it.
  function note(title, sub) {
    out.className = 'note';
    out.textContent = '';
    out.appendChild(accentText(document.createElement('span'), title));
    out.appendChild(document.createElement('br'));
    out.appendChild(accentText(document.createElement('small'), sub));
  }
  function cell(tr, text, cls) { var td = document.createElement('td'); if (cls) td.className = cls; td.textContent = text; tr.appendChild(td); return td; }
  function render(players) {
    if (!players.length) { note(TEXT.emptyTitle, TEXT.emptySub); return; }
    out.className = '';
    out.innerHTML = '<table><thead><tr><th>#</th><th>Player</th><th>Tier</th><th class="num">Rating</th>'
      + '<th class="num">W&ndash;L</th><th class="num opt">Win %</th><th class="num opt">Streak</th></tr></thead><tbody></tbody></table>';
    var body = out.querySelector('tbody');
    players.forEach(function (p, i) {
      var tr = document.createElement('tr');
      if (i < 3) tr.className = 'p' + (i + 1);
      cell(tr, String(i + 1), 'place');
      // Names are user-supplied: text only, never markup.
      var nm = cell(tr, String(p.name || '???'), 'name');
      var ch = p.main || p.character;
      if (ch) { var s = document.createElement('small'); s.textContent = (p.main ? 'main ' : 'last ') + ch; nm.appendChild(s); }
      var tierName = p.placement > 0 ? 'UNRANKED' : String(p.tier || 'UNRANKED').toUpperCase();
      var t = document.createElement('span'); t.className = 'tier';
      t.style.color = t.style.borderColor = tierColor(tierName);
      t.textContent = tierName; var td = document.createElement('td'); td.appendChild(t); tr.appendChild(td);
      cell(tr, String(p.rating == null ? '' : p.rating), 'num rating');
      cell(tr, (p.wins || 0) + '–' + (p.losses || 0), 'num');
      cell(tr, (p.winRate == null ? '' : p.winRate + '%'), 'num opt');
      cell(tr, p.streak >= 2 ? 'W' + p.streak : p.streak <= -2 ? 'L' + (-p.streak) : '', 'num opt');
      body.appendChild(tr);
    });
  }
  var lastRefresh = 0;
  function load() {
    lastRefresh = Date.now();
    document.getElementById('when').textContent = '';
    if (DEMO) { render(SAMPLE); document.getElementById('when').textContent = 'sample data'; return; }
    if (!SERVER) { note('No leaderboard address is set.', 'Set one in the Studio: Settings > Online > Leaderboard.'); return; }
    fetch(SERVER + '/mugen/leaderboard?limit=' + LIMIT, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (b) {
        RANKS = rankList(b && b.ranks);
        render((b && b.players) || []);
        document.getElementById('when').textContent = 'updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      })
      .catch(function () { note(TEXT.offlineTitle, TEXT.offlineSub); });
  }
  document.getElementById('again').onclick = load;
  load();
  // Refresh only while someone is looking: a ranking server that sleeps when
  // idle and is billed by uptime would otherwise be kept awake by one
  // forgotten tab. Coming back to a stale page refreshes it at once.
  var REFRESH_MS = 5 * 60 * 1000;
  setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && Date.now() - lastRefresh >= REFRESH_MS) load();
  });
})();
</script>
</body>
</html>
